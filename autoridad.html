<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autoridad / FHWA — QC PR-52</title>
<link rel="stylesheet" href="assets/qc.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230b3d91'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='white'>★</text></svg>">
<style>
/* Authority / FHWA — executive oversight. */
body { background: var(--bg); }
.wgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 16px; }
.wgrid > * { min-width: 0; }
@media (max-width: 720px) { .wgrid { grid-template-columns: 1fr; } }
.auth-hero {
  background: linear-gradient(115deg, #0b2545 0%, #0b3d91 55%, #1565c0 100%);
  color: #fff; border-radius: 16px; padding: 26px 30px; margin-bottom: 20px;
  box-shadow: 0 10px 34px rgba(11,37,69,.35);
  position: relative; overflow: hidden;
}
.auth-hero::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 260px; height: 260px;
  border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 70%);
}
.auth-hero .eyebrow { font-size: 12px; letter-spacing: .28em; color: #9fc0ea; font-weight: 800; text-transform: uppercase; }
.auth-hero h1 { margin: 6px 0 4px; font-size: 26px; }
.auth-hero .sub { color: #c4d8f0; font-size: 14px; }
.auth-hero .hero-kpis { display: flex; gap: 34px; margin-top: 18px; flex-wrap: wrap; }
.auth-hero .hk .v { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
.auth-hero .hk .k { font-size: 11.5px; letter-spacing: .14em; color: #9fc0ea; font-weight: 700; text-transform: uppercase; }
.auth-hero .hk .v .u { font-size: 14px; color: #9fc0ea; font-weight: 600; }
.compliance-ring { display: flex; align-items: center; gap: 14px; }
.sec-nav {
  position: sticky; top: 0; z-index: 40;
  display: flex; gap: 6px; flex-wrap: wrap;
  background: var(--bg); backdrop-filter: blur(6px);
  padding: 8px 0; margin-bottom: 14px;
}
.sec-nav a {
  text-decoration: none; color: var(--ink-soft); font-size: 13px; font-weight: 700;
  padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
}
.sec-nav a:hover { color: var(--info); border-color: #b9d2ec; }
h2.sec-title { font-size: 18px; margin: 26px 0 12px; }
.badge.big { font-size: 13px; padding: 6px 14px; }
</style>
<script src="assets/auth.js"></script>
</head>
<body>

<header class="qc-header">
  <div class="brand">
    <a href="control-center.html" style="text-decoration:none"><svg class="mark" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" aria-label="QCheck">
      <defs>
        <mask id="qcm-q1"><rect width="1000" height="1000" fill="#fff"/><path fill="#000" d="M 139 531 H 558 V 802 H 139 Z"/></mask>
        <mask id="qcm-c1"><rect width="1000" height="1000" fill="#fff"/><circle cx="346" cy="720" r="103" fill="#000"/></mask>
      </defs>
      <path fill="var(--logo-blue,#0f46b5)" fill-rule="evenodd" mask="url(#qcm-q1)" d="M 509 63 A 337 337 0 1 1 508.9 63 Z M 509 174 A 226 226 0 1 0 509.1 174 Z"/>
      <path fill="var(--logo-blue,#0f46b5)" d="M 656 615 L 822 781 L 724 879 L 558 713 Z"/>
      <g mask="url(#qcm-c1)">
        <path fill="var(--logo-green,#39a935)" d="M 132 514 L 346 608 L 564 506 L 564 571 L 346 682 L 132 589 Z"/>
        <path fill="var(--logo-g1,#68727f)" d="M 132 642 L 346 736 L 564 620 L 564 681 L 346 804 L 132 704 Z"/>
        <path fill="var(--logo-g2,#4f5a66)" d="M 132 755 L 346 852 L 564 730 L 564 795 L 346 918 L 132 816 Z"/>
      </g>
      <path fill="var(--logo-blue,#0f46b5)" d="M 412 665 A 86 86 0 1 0 412 775 L 368 739 A 31 31 0 1 1 368 701 Z"/>
    </svg></a>
    <div>
      <div class="title">Autoridad de Carreteras / FHWA — Fiscalización</div>
      <div class="subtitle">Calidad del hormigón PR-52 — vista de cumplimiento, solo lectura</div>
    </div>
  </div>
  <nav class="tabs">
    <button class="btn small" style="margin:10px 0" onclick="exportCSV()">⬇ Datos completos (CSV)</button>
  </nav>
</header>

<main>
  <div class="auth-hero">
    <div class="eyebrow">Autoridad de Carreteras y Transportación de Puerto Rico · FHWA</div>
    <h1 id="hero-title">—</h1>
    <div class="sub" id="hero-sub">—</div>
    <div class="hero-kpis" id="hero-kpis"></div>
  </div>

  <div class="sec-nav">
    <a href="#compliance">Cumplimiento</a>
    <a href="#strength">Resistencia y media móvil</a>
    <a href="#spc">Cartas de control</a>
    <a href="#lots">Resumen por lote</a>
    <a href="#rejects">Camiones rechazados</a>
  </div>

  <div id="content"></div>
</main>

<div id="toast"></div>
<div id="modal-root"></div>

<script src="shared/conduce-contract.js"></script>
<script src="assets/seed.js"></script>
<script src="assets/core.js"></script>
<script src="assets/demo.js"></script>
<script>
"use strict";
const state = { chartRange: "all" };

function donut(pct, color, size = 86) {
  const r = 34, c = 2 * Math.PI * r;
  const off = c * (1 - Math.min(1, Math.max(0, pct / 100)));
  return `<svg width="${size}" height="${size}" viewBox="0 0 86 86">
    <circle cx="43" cy="43" r="${r}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="9"/>
    <circle cx="43" cy="43" r="${r}" fill="none" stroke="${color}" stroke-width="9"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 43 43)"/>
    <text x="43" y="49" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">${Math.round(pct)}%</text>
  </svg>`;
}

function render() {
  const tests = sortedTests();
  const sets = strengthSets();
  const days = testDates();
  const totalCY = tests.reduce((a, t) => a + (num(t.vol) || 0), 0);
  const rejected = tests.filter((t) => t.rejected);
  const evaluated = tests.filter((t) => worstZone(t) != null);
  const inAction = evaluated.filter((t) => !t.rejected && worstZone(t) === "ok").length;
  const compliancePct = evaluated.length ? inAction / evaluated.length * 100 : 0;
  const cs5sets = sets.filter((s) => s.cs5 != null);
  const passing = cs5sets.filter((s) => s.cs5 >= db.plan.cs.target).length;
  const strengthPct = cs5sets.length ? passing / cs5sets.length * 100 : 0;
  const lastMA = [...sets].reverse().find((s) => s._ma5 != null);
  const minMA = Math.min(...sets.filter((s) => s._ma5 != null).map((s) => s._ma5));

  document.getElementById("hero-title").textContent = db.project.name;
  document.getElementById("hero-sub").textContent =
    `${db.project.mixId} · Contratista: ${db.project.contractor || "—"} · QC: ${db.project.qcFirm || "—"} · ${fmtDate(days[days.length - 1])} – ${fmtDate(days[0])}`;

  document.getElementById("hero-kpis").innerHTML = `
    <div class="hk"><div class="v">${tests.length}</div><div class="k">Ensayos de QC</div></div>
    <div class="hk"><div class="v">${fmt(totalCY, 0)}<span class="u"> CY</span></div><div class="k">Hormigón colocado</div></div>
    <div class="hk"><div class="v">${days.length}</div><div class="k">Días de vaciado</div></div>
    <div class="hk"><div class="v">${lastMA ? fmt(lastMA._ma5, 0) : "—"}<span class="u"> psi</span></div><div class="k">Media móvil actual (objetivo ${fmt(db.plan.cs.target, 0)})</div></div>
    <div class="hk compliance-ring">${donut(compliancePct, "#4fe085")}<div><div class="k" style="margin-bottom:2px">Ensayos en fresco<br>dentro de límites de acción</div></div></div>
    <div class="hk compliance-ring">${donut(strengthPct, strengthPct >= 95 ? "#4fe085" : "#ffc93d")}<div><div class="k" style="margin-bottom:2px">Resistencia a 5 días<br>≥ objetivo f\'c</div></div></div>`;

  // ---- lots ----
  const lots = {};
  for (const t of tests) {
    const k = t.lot || "—";
    (lots[k] = lots[k] || { tests: [], dates: new Set() }).tests.push(t);
    lots[k].dates.add(t.date);
  }
  const lotRows = Object.entries(lots).map(([lot, o]) => {
    const cs5 = o.tests.filter((t) => t.cs5 != null).map((t) => t.cs5);
    const avg5 = cs5.length ? cs5.reduce((a, b) => a + b, 0) / cs5.length : null;
    const min5 = cs5.length ? Math.min(...cs5) : null;
    const cy = o.tests.reduce((a, t) => a + (num(t.vol) || 0), 0);
    const rej = o.tests.filter((t) => t.rejected).length;
    let status = `<span class="badge neutral">Pendiente</span>`;
    if (avg5 != null) {
      status = min5 < db.plan.cs.action ? `<span class="badge susp">Revisar</span>`
        : avg5 >= db.plan.cs.target ? `<span class="badge ok">Conforme</span>`
        : `<span class="badge act">Vigilar</span>`;
    }
    return { lot, dates: [...o.dates].sort(), n: o.tests.length, cy, rej, avg5, min5, status };
  }).sort((a, b) => (Number(a.lot) || 999) - (Number(b.lot) || 999));

  const r = state.chartRange;
  document.getElementById("content").innerHTML = `
    <h2 class="sec-title" id="compliance">Resumen de cumplimiento</h2>
    <div class="wgrid">
      <div class="stat ${compliancePct >= 90 ? "good" : ""}"><div class="label">Dentro de límites de acción</div>
        <div class="value">${fmt(compliancePct, 1)}%</div><div class="sub">${inAction} de ${evaluated.length} ensayos evaluados</div></div>
      <div class="stat ${rejected.length ? "alert" : "good"}"><div class="label">Camiones rechazados</div>
        <div class="value">${rejected.length}</div><div class="sub">${fmt(rejected.reduce((a, t) => a + (num(t.vol) || 0), 0), 0)} CY devueltos</div></div>
      <div class="stat ${strengthPct >= 95 ? "good" : ""}"><div class="label">Conformidad de resistencia</div>
        <div class="value">${fmt(strengthPct, 1)}%</div><div class="sub">${passing}/${cs5sets.length} sets ≥ ${fmt(db.plan.cs.target, 0)} psi a ${db.plan.cs.age} días</div></div>
      <div class="stat ${minMA >= db.plan.cs.target ? "good" : "alert"}"><div class="label">Media móvil mínima</div>
        <div class="value">${Number.isFinite(minMA) ? fmt(minMA, 0) : "—"}</div><div class="sub">MA de 6 sets, todo el proyecto</div></div>
    </div>

    <h2 class="sec-title" id="strength">Resistencia y media móvil — f'c ${fmt(db.plan.cs.target, 0)} psi a ${db.plan.cs.age} días</h2>
    <div class="panel"><div class="panel-body">
      <div class="chart-legend">
        <span><span class="sw" style="background:var(--chart-ok)"></span>≥ objetivo</span>
        <span><span class="sw" style="background:var(--chart-act)"></span>acción (&lt; ${fmt(db.plan.cs.target, 0)})</span>
        <span><span class="sw" style="background:var(--chart-susp)"></span>suspensión (&lt; ${fmt(db.plan.cs.action, 0)})</span>
        <span>▪▪ punteado oscuro = media móvil de ${db.plan.maWindow} sets</span>
      </div>
      <div class="chart-scroll">${chartCS5(sets, "all")}</div>
    </div></div>

    <h2 class="sec-title" id="spc">Cartas de control estadístico — hormigón fresco</h2>
    <div class="toolbar">
      <select onchange="state.chartRange=this.value==='all'?'all':Number(this.value); render()">
        <option value="all" ${r === "all" ? "selected" : ""}>Todo el proyecto</option>
        ${[150, 80].map((n) => `<option value="${n}" ${r === n ? "selected" : ""}>Últimos ${n} ensayos</option>`).join("")}
      </select>
      <span class="muted" style="font-size:12.5px">Verde = dentro de acción · amarillo = zona de acción · rojo = suspensión · ✕ = camión rechazado</span>
    </div>
    ${CHART_DEFS.map((d) => `
      <div class="panel chart-block">
        <div class="panel-head"><h2>${esc(d.label)}</h2></div>
        <div class="panel-body"><div class="chart-scroll">${chartFor(d, r)}</div></div>
      </div>`).join("")}

    <h2 class="sec-title" id="lots">Resumen por lote</h2>
    <div class="panel"><div class="panel-body flush"><div class="table-wrap"><table class="data">
      <tr><th>Lote</th><th>Fechas</th><th class="num">Ensayos</th><th class="num">CY</th>
          <th class="num">Media 5 días (psi)</th><th class="num">Mín. 5 días</th><th class="num">Rechazados</th><th>Estado</th></tr>
      ${lotRows.map((l) => `<tr>
        <td><b>${esc(l.lot)}</b></td>
        <td style="font-size:12px">${l.dates.map(fmtDate).join(", ")}</td>
        <td class="num mono">${l.n}</td>
        <td class="num mono">${fmt(l.cy, 0)}</td>
        <td class="num mono">${fmt(l.avg5, 0)}</td>
        <td class="num mono">${fmt(l.min5, 0)}</td>
        <td class="num mono" style="${l.rej ? "color:var(--susp); font-weight:700" : ""}">${l.rej}</td>
        <td>${l.status}</td>
      </tr>`).join("")}
    </table></div></div></div>

    <h2 class="sec-title" id="rejects">Camiones rechazados — registro completo</h2>
    <div class="panel"><div class="panel-body flush">
      ${rejected.length ? `<div class="table-wrap"><table class="data">
        <tr><th>#</th><th>Fecha</th><th>Conduce</th><th>Camión</th><th>Ubicación</th>
            <th class="num">Slump</th><th class="num">UW</th><th class="num">Temp</th><th>Motivo</th></tr>
        ${rejected.map((t) => {
          const reasons = [];
          if (zoneSlump(t) === "susp") reasons.push("Revenimiento fuera de límites de suspensión");
          if (zoneUW(t) === "susp") reasons.push("Peso unitario fuera de tolerancia");
          if (zoneAir(t) === "susp") reasons.push("Contenido de aire fuera de límites");
          if (zoneTemp(t) === "susp") reasons.push("Temperatura sobre el máximo");
          return `<tr class="rejected">
            <td class="mono">${t.n}</td><td class="mono">${esc(t.date)}</td>
            <td class="mono"><b>${esc(t.ticket || "—")}</b></td><td class="mono">${esc(t.truck || "—")}</td>
            <td style="white-space:normal">${esc(shortIdent(t.ident))}</td>
            <td${zClass(zoneSlump(t))}>${fmt(t.slump, 2)}</td>
            <td${zClass(zoneUW(t))}>${fmt(t.uw, 2)}</td>
            <td${zClass(zoneTemp(t))}>${fmt(t.temp, 0)}</td>
            <td style="white-space:normal; font-size:12px">${esc(reasons.join("; ") || t.comments || "Rechazo en campo — ver expediente")}</td>
          </tr>`;
        }).join("")}
      </table></div>` : `<div class="empty">Ningún camión rechazado.</div>`}
    </div></div>

    <p class="muted" style="font-size:12px; margin-top:18px">
      Plan de control: revenimiento ${db.plan.slump.target}" (acción ${db.plan.slump.actLo}–${db.plan.slump.actHi}", suspensión ${db.plan.slump.suspLo}–${db.plan.slump.suspHi}") ·
      aire ${db.plan.air.target}% (${db.plan.air.actLo}–${db.plan.air.actHi} / ${db.plan.air.suspLo}–${db.plan.air.suspHi}) ·
      peso unitario ±${db.plan.uw.act}/±${db.plan.uw.susp} pcf del objetivo de planta ·
      resistencia ${fmt(db.plan.cs.target, 0)} psi a ${db.plan.cs.age} días (suspensión &lt; ${fmt(db.plan.cs.action, 0)}) ·
      apertura al tráfico ${fmt(db.plan.cs.openTarget, 0)} psi (mín. ${fmt(db.plan.cs.openLow, 0)}).
      Datos entrados en vivo en el campo por ${esc(db.project.qcFirm || "QC")} — esta vista es de solo lectura.
    </p>`;
}

loadDB();
initTheme();
mountThemeToggle();
mountStatusBar();
enableLiveSync(render);
render();
</script>
</body>
</html>
