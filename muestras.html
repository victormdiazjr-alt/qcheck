<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- Aplicación en la pantalla de inicio (iOS y Android). Sin estas etiquetas
     y sin el manifest, el icono guardado abre como un MARCADOR de Safari, con
     una franja arriba enseñando el dominio en vez de la aplicación limpia. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QCheck">
<link rel="apple-touch-icon" href="assets/icono-180.png">
<meta name="theme-color" content="#0a0d12">
<title>Muestras — QCheck</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a0d12'/><circle cx='50' cy='50' r='26' fill='none' stroke='%2396c93d' stroke-width='8'/></svg>">
<style>
/* ============================================================
   MUESTRAS — entrada de resultados en iPad.
   Mismo lenguaje del Field Display. Se opera de pie, junto al
   camión, con las manos sucias: nada de campos pequeños ni
   teclado del sistema. Todo botón gordo.
   ============================================================ */
:root {
  --bg: #0a0d12;
  --logo-blue:#4a7ef0; --logo-green:#57c94f; --logo-g1:#8a95a3; --logo-g2:#6b7683;
  --qcs-e: 1.25;
  --surface: #12171f;
  --surface-2: #1a2029;
  --text: #eef2f6;
  --muted: #77848f;
  --hairline: rgba(255,255,255,.10);
  --ok: #34d27b;
  --act: #f5b83d;
  --susp: #ff5a52;
  --idle: #5b8dbf;
  --logo-navy: #4a63d8;
}
:root[data-theme="light"] {
  --bg: #eef1f5;
  --logo-blue:#0f46b5; --logo-green:#39a935; --logo-g1:#68727f; --logo-g2:#4f5a66;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --text: #16222e;
  --muted: #76838f;
  --hairline: rgba(15,30,45,.12);
  --ok: #0e9d55;
  --act: #c8880a;
  --susp: #e0362d;
  --idle: #3d76ab;
  --logo-navy: #2b3a8c;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  height: 100vh; height: 100dvh; padding-top: var(--qcs-h, 42px); display: flex; flex-direction: column;
  user-select: none; -webkit-user-select: none;
}

/* ---------- header ---------- */
header {
  display: flex; align-items: center; gap: 1.4vw;
  padding: 2vh 6vw 1.6vh 2.4vw;
  border-bottom: 1px solid var(--hairline);
  flex: none;
}
.logo { height: 5.6vh; width: auto; flex: none; }
.htitle { font-size: 2.6vh; font-weight: 750; letter-spacing: .01em; }
.hsub { font-size: 1.5vh; color: var(--muted); letter-spacing: .2em; text-transform: uppercase; font-weight: 700; }
header .spacer { flex: 1; }
.truck-pick {
  background: var(--surface); border: 2px solid var(--hairline); color: var(--text);
  border-radius: 14px; padding: 1.4vh 1.6vw; font-size: 2vh; font-weight: 700;
  font-family: inherit; min-width: 26vw;
}
/* ---------- la rejilla de camiones (Q-33) ----------
   Todo se toca con guante mojado: nada por debajo de 44 px de alto, que es el
   mínimo de Apple para un objetivo táctil, y las casillas son botones enteros
   y no textos con un enlace dentro. */
.ver-rejilla {
  background: var(--surface); border: 2px solid var(--hairline); color: var(--text);
  border-radius: 14px; padding: 1.4vh 1.4vw; font-size: 1.9vh; font-weight: 800;
  font-family: inherit; margin-right: 1vw; cursor: pointer; white-space: nowrap;
}
.ver-rejilla:hover { border-color: var(--logo-navy); box-shadow: 0 0 18px -6px var(--logo-navy); }
#rejilla {
  position: fixed; inset: 0; z-index: 60; display: none;
  background: rgba(0,0,0,.62); padding: max(2vh, env(safe-area-inset-top)) 2vw 2vh;
}
#rejilla.show { display: flex; align-items: flex-start; justify-content: center; }
.rbox {
  background: var(--surface); border: 1px solid var(--hairline); border-radius: 18px;
  width: 100%; max-width: 1100px; max-height: 92dvh; display: flex; flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,.55);
}
.rhead { display: flex; align-items: center; gap: 1.4vw; padding: 1.6vh 2vw; border-bottom: 1px solid var(--hairline); font-size: 2.1vh; }
.rhead .spacer { flex: 1; }
.rbody { overflow: auto; padding: 1vh 1vw 2vh; }
table.rej { width: 100%; border-collapse: separate; border-spacing: 6px 6px; }
table.rej th {
  font-size: 1.35vh; text-transform: uppercase; letter-spacing: .16em; color: var(--muted);
  font-weight: 800; text-align: center; padding-bottom: .4vh;
}
table.rej th.izq, table.rej td.izq { text-align: left; }
.r-camion { font-size: 2.6vh; font-weight: 900; line-height: 1.1; }
.r-ticket { font-size: 1.5vh; color: var(--muted); }
/* Una casilla es un botón. Con dato: el valor. Sin dato: un hueco que se ve
   que se puede tocar — el color entra por el borde y el resplandor, nunca por
   el relleno (AGENTS §10). */
.celda {
  width: 100%; min-height: 52px; border-radius: 12px; cursor: pointer;
  background: var(--surface-2, rgba(255,255,255,.03)); border: 1.5px solid var(--hairline);
  color: var(--text); font-family: inherit; font-size: 2.2vh; font-weight: 800;
}
.celda:hover { border-color: var(--logo-navy); }
.celda.vacia { color: var(--muted); font-weight: 600; border-style: dashed; }
.celda.vacia:hover { border-color: var(--act); box-shadow: 0 0 0 3px rgba(245,184,61,.13), 0 0 18px -6px var(--act); }
.celda.aqui { border-color: var(--logo-navy); box-shadow: 0 0 0 3px rgba(74,99,216,.22); }
tr.hecho .celda { opacity: .5; }
tr.hecho:hover .celda { opacity: 1; }
/* Cerrar el tiro: chico, discreto y lejos del teclado. El color entra por el
   resplandor, nunca por el relleno (AGENTS.md §10). */
/* El paso a Recepción (Q-33). Recepción y Muestras son las dos pantallas que
   el técnico usa todo el día, y hasta aquí no había forma de ir de una a otra:
   la única salida era la ✕, que se va a casa. Mismo aspecto discreto que
   «cerrar tiro» — es navegación, no una acción del trabajo. */
.a-recepcion {
  margin-left: 1.2vw; flex: none; text-decoration: none; display: inline-block;
  background: var(--surface); border: 1px solid var(--hairline); color: var(--muted);
  border-radius: 10px; padding: 1vh 1.1vw; font-size: 1.4vh; font-weight: 800;
  letter-spacing: .14em; text-transform: uppercase; font-family: inherit;
  transition: border-color .16s, color .16s, box-shadow .18s;
}
.a-recepcion:hover { color: var(--text); border-color: var(--logo-navy); box-shadow: 0 0 16px -6px var(--logo-navy); }
.cerrar-tiro {
  margin-left: 1.2vw; flex: none;
  background: var(--surface); border: 1px solid var(--hairline); color: var(--muted);
  border-radius: 10px; padding: 1vh 1.1vw; font-size: 1.4vh; font-weight: 800;
  letter-spacing: .14em; text-transform: uppercase; font-family: inherit; cursor: pointer;
  transition: border-color .16s, color .16s, box-shadow .18s;
}
.cerrar-tiro:hover { color: var(--text); border-color: rgba(255,255,255,.28); }
.cerrar-tiro:active { transform: scale(.97); }
/* Ya cerrado: verde apagado, que es un estado, no una alarma */
.cerrar-tiro.hecho { color: var(--ok); border-color: rgba(52,210,123,.45);
  box-shadow: 0 0 0 2px rgba(52,210,123,.08); }
/* Con camiones pendientes no se puede cerrar desde aquí: apagado y sin cursor,
   pero se queda a la vista para que se entienda que existe y por qué no. */
.cerrar-tiro:disabled { opacity: .32; cursor: not-allowed; }
.cerrar-tiro:disabled:hover { color: var(--muted); border-color: var(--hairline); }
/* Ya está todo muestreado: el botón se enciende un punto. Es lo que toca
   ahora, y el color entra por el resplandor (AGENTS.md §10). */
.cerrar-tiro.listo { color: var(--text); border-color: rgba(74,99,216,.5);
  box-shadow: 0 0 0 2px rgba(74,99,216,.10), 0 0 16px -6px rgba(74,99,216,.9); }

/* ---------- cuerpo ---------- */
.body { flex: 1; display: grid; grid-template-columns: 1fr 30vw; gap: 1.6vw; padding: 1.8vh 2.4vw; min-height: 0; }
.left { display: flex; flex-direction: column; gap: 1.6vh; min-height: 0; }

/* tarjeta del camión */
.truck-card {
  background: var(--surface); border: 1px solid var(--hairline); border-radius: 18px;
  padding: 1.8vh 2vw; display: flex; align-items: center; gap: 1.6vw; flex: none;
}
.truck-card .tnum { font-size: 7.4vh; font-weight: 250; line-height: 1; font-variant-numeric: tabular-nums; }
.truck-card .tlbl { font-size: 1.4vh; font-weight: 800; letter-spacing: .3em; color: var(--muted); text-transform: uppercase; margin-bottom: .4vh; }
.truck-card .tmeta { font-size: 1.9vh; color: var(--muted); line-height: 1.5; }
.truck-card .tmeta b { color: var(--text); font-weight: 700; }
.truck-card .tplant { display: flex; align-items: center; gap: .5vw; font-size: 1.6vh; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-top: .6vh; }
.truck-card .tplant i { width: 1vh; height: 1vh; border-radius: 50%; background: var(--idle); box-shadow: 0 0 1vh var(--idle); }

/* rejilla de valores */
.vals { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.4vw 1.4vw; flex: 1; min-height: 0; }
.val {
  background: var(--surface); border: 3px solid var(--hairline); border-radius: 18px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; position: relative; transition: border-color .15s, background .15s;
}
.val.active { border-color: var(--idle); background: var(--surface-2); }
.val .k { font-size: 1.7vh; font-weight: 800; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: .5vw; }
.val .k i { width: 1.1vh; height: 1.1vh; border-radius: 50%; background: var(--dc, transparent); box-shadow: 0 0 1.2vh var(--dc, transparent); }
.val .v { font-size: 8.6vh; font-weight: 220; line-height: 1.05; font-variant-numeric: tabular-nums; }
.val .v.empty { color: var(--muted); font-weight: 150; }
.val .u { font-size: 1.6vh; font-weight: 700; letter-spacing: .2em; color: var(--muted); }
.val .lim { position: absolute; bottom: 1.2vh; font-size: 1.3vh; color: var(--muted); letter-spacing: .1em; }
.val.p-amber { --dc: var(--act); border-color: var(--act); }
.val.p-amber .v { color: var(--act); font-weight: 320; }
.val.p-red { --dc: var(--susp); border-color: var(--susp); }
.val.p-red .v { color: var(--susp); font-weight: 320; text-shadow: 0 0 3vh rgba(255,90,82,.5); }

/* ---------- panel derecho: teclado ---------- */
.right { display: flex; flex-direction: column; gap: 1.2vh; min-height: 0; }
.kp-head {
  background: var(--surface-2); border-radius: 14px; padding: 1.2vh 1vw; text-align: center; flex: none;
}
.kp-head .f { font-size: 1.6vh; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.kp-head .n { font-size: 3.4vh; font-weight: 400; font-variant-numeric: tabular-nums; }
.steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 1vh 1vw; flex: none; }
.step {
  background: var(--surface); border: 2px solid var(--hairline); color: var(--text);
  border-radius: 14px; padding: 1.6vh 0; font-size: 2.4vh; font-weight: 800;
  font-family: inherit; cursor: pointer;
}
.step:active { background: var(--idle); border-color: var(--idle); color: #fff; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1vh 1vw; flex: 1; min-height: 0; }
.key {
  background: var(--surface); border: 2px solid var(--hairline); color: var(--text);
  border-radius: 14px; font-size: 3.4vh; font-weight: 600; font-family: inherit;
  cursor: pointer; font-variant-numeric: tabular-nums;
}
.key:active { background: var(--idle); border-color: var(--idle); color: #fff; }
.key.wide { grid-column: span 1; font-size: 2.4vh; font-weight: 800; }
.key.del { color: var(--act); }
.key.clr { color: var(--susp); }

/* ---------- vertical: la pantalla se apila ----------
   Todo el tamaño de esta pantalla sale de la altura (vh), que es lo correcto
   acostada. De pie la altura crece y el ancho se encoge, así que el teclado
   de tres columnas ya no cabe al lado: baja, y el centro se desplaza. */
@media (orientation: portrait) {
  .body {
    grid-template-columns: 1fr;
    grid-auto-rows: min-content;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    gap: 2.2vw; padding: 2vw 3vw 3vw;
  }
  .left, .right { gap: 2vw; }
  .vals { grid-template-columns: repeat(2, 1fr); gap: 2vw; }
  .val { min-height: 22vw; padding: 3vw 2vw; gap: .4vw; }
  .val .k { font-size: 2vw; }
  .val .v { font-size: 11vw; }
  /* el límite deja de ir anclado al fondo: de pie choca con la unidad */
  .val .lim { position: static; }
  .val .u, .val .lim { font-size: 1.9vw; }
  .truck-card .tnum { font-size: 9vw; }
  .truck-card .tlbl, .truck-card .tplant { font-size: 1.9vw; }
  .truck-card .tmeta { font-size: 2.4vw; }
  .kp-head .f { font-size: 2vw; } .kp-head .n { font-size: 4.4vw; }
  .steppers { gap: 2vw; } .step { font-size: 3.2vw; padding: 2.4vw 0; }
  .keypad { gap: 2vw; }
  .key { font-size: 4.6vw; aspect-ratio: 5 / 3; }
  .key.wide { font-size: 3.2vw; }
  .htitle { font-size: 3.4vw; } .hsub { font-size: 1.9vw; }
  .logo { height: 7vw; }
  footer { gap: 2.4vw; padding: 2vw 3vw calc(2.4vw + env(safe-area-inset-bottom)); }
  .verdict-pre .ring { width: 9vw; height: 9vw; font-size: 4.4vw; border-width: .7vw; flex: none; }
  .verdict-pre .txt .w { font-size: 3.6vw; }
  /* la coletilla del veredicto se parte en tres líneas y estorba: fuera */
  .verdict-pre .txt .s { display: none; }
  /* el botón de enviar cede antes que salirse del borde */
  .btn-sub { font-size: 3vw; padding: 3vw 3vw; min-width: 0; }
  footer .spacer { display: none; }
  .verdict-pre { min-width: 0; }
  .verdict-pre .txt .w { white-space: nowrap; }
  .btn-ghost, .icon-btn { flex: none; }
}

/* ---------- pie: veredicto + submit ---------- */
footer {
  display: flex; align-items: center; gap: 1.6vw;
  padding: 1.6vh 2.4vw 2.2vh; border-top: 1px solid var(--hairline); flex: none;
}
.verdict-pre { display: flex; align-items: center; gap: 1vw; }
.verdict-pre .ring {
  width: 7vh; height: 7vh; border-radius: 50%; border: .55vh solid var(--vc, var(--muted));
  color: var(--vc, var(--muted)); display: flex; align-items: center; justify-content: center;
  font-size: 3.4vh; font-weight: 300; box-shadow: 0 0 3vh -1vh var(--vc, transparent);
}
.verdict-pre .txt .w { font-size: 3vh; font-weight: 750; color: var(--vc, var(--muted)); line-height: 1.1; }
.verdict-pre .txt .s { font-size: 1.5vh; color: var(--muted); letter-spacing: .18em; text-transform: uppercase; font-weight: 700; }
.v-ok { --vc: var(--ok); } .v-act { --vc: var(--act); } .v-susp { --vc: var(--susp); } .v-idle { --vc: var(--muted); }
footer .spacer { flex: 1; }
.btn-sub {
  /* El color entra por el resplandor, no por el relleno: la superficie es la
     misma del resto de las tarjetas y el verde llama la atención desde el borde. */
  --bc: var(--ok);
  background: linear-gradient(168deg, var(--surface-2), var(--surface));
  color: var(--bc); border: 1px solid color-mix(in srgb, var(--bc) 55%, transparent);
  border-radius: 16px;
  padding: 2.4vh 4vw; font-size: 2.8vh; font-weight: 850; letter-spacing: .12em;
  text-transform: uppercase; font-family: inherit; cursor: pointer;
  box-shadow: 0 0 0 .35vh color-mix(in srgb, var(--bc) 12%, transparent),
              0 0 4vh -1vh color-mix(in srgb, var(--bc) 75%, transparent),
              inset 0 1px 0 rgba(255,255,255,.06);
  animation: subLatir 2.4s ease-in-out infinite;
  transition: transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .22s, border-color .22s;
}
/* el resplandor respira para pedir el toque sin gritar */
@keyframes subLatir {
  0%, 100% { box-shadow: 0 0 0 .35vh color-mix(in srgb, var(--bc) 12%, transparent),
                         0 0 4vh -1vh color-mix(in srgb, var(--bc) 70%, transparent),
                         inset 0 1px 0 rgba(255,255,255,.06); }
  50%      { box-shadow: 0 0 0 .55vh color-mix(in srgb, var(--bc) 18%, transparent),
                         0 0 6vh -1vh color-mix(in srgb, var(--bc) 95%, transparent),
                         inset 0 1px 0 rgba(255,255,255,.06); }
}
.btn-sub:active { transform: scale(.97); }
.btn-sub.rej { --bc: var(--susp); }
.btn-sub:disabled {
  --bc: var(--muted);
  color: var(--muted); border-color: var(--hairline); cursor: default;
  animation: none; box-shadow: none;
}
@media (prefers-reduced-motion: reduce) { .btn-sub { animation: none; } }
.btn-ghost {
  background: transparent; color: var(--muted); border: 2px solid var(--hairline);
  border-radius: 16px; padding: 2.4vh 2.2vw; font-size: 1.9vh; font-weight: 800;
  letter-spacing: .14em; text-transform: uppercase; font-family: inherit; cursor: pointer;
}

/* ---------- confirmación de rechazo ---------- */
#confirm {
  position: fixed; inset: 0; z-index: 500; display: none;
  align-items: center; justify-content: center;
  background: rgba(6,9,13,.86); backdrop-filter: blur(4px);
}
#confirm.show { display: flex; }
.cbox {
  background: var(--surface); border: 3px solid var(--susp); border-radius: 22px;
  padding: 4vh 4vw; max-width: 60vw; text-align: center;
}
.cbox h2 { font-size: 4vh; color: var(--susp); margin-bottom: 1.4vh; }
.cbox p { font-size: 2.1vh; color: var(--muted); line-height: 1.6; margin-bottom: 3vh; }
.cbox .row { display: flex; gap: 1.4vw; justify-content: center; }

/* ---------- toast ---------- */
#toast {
  position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%);
  background: var(--surface); border: 2px solid var(--ok); color: var(--text);
  padding: 1.6vh 3vw; border-radius: 999px; font-size: 2vh; font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 600;
}
#toast.show { opacity: 1; }

/* Controles dentro del pie — nunca encima de los botones de acción */


.icon-btn {
  width: 7.2vh; height: 7.2vh; border-radius: 50%; flex: none; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--hairline); background: transparent; color: var(--muted);
  font-family: inherit; cursor: pointer; transition: color .15s, border-color .15s;
}
.icon-btn:hover { color: var(--text); border-color: var(--muted); }
.icon-btn:active { border-color: var(--idle); color: var(--idle); }
.icon-btn.muted { opacity: .55; border-style: dashed; }
.empty-state { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 2.4vh; line-height: 1.6; }
</style>

<header>
  <svg class="logo" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" aria-label="QCheck">
      <defs>
        <mask id="qcm-q1"><rect width="1000" height="1000" fill="#fff"/><path fill="#000" d="M 139 531 H 558 V 802 H 139 Z"/></mask>
        <mask id="qcm-c1"><rect width="1000" height="1000" fill="#fff"/><circle cx="346" cy="720" r="103" fill="#000"/></mask>
      </defs>
      <path fill="var(--logo-blue,#0f46b5)" fill-rule="evenodd" mask="url(#qcm-q1)" d="M 509 63 A 337 337 0 1 1 508.9 63 Z M 509 174 A 226 226 0 1 0 509.1 174 Z"/>
      <path fill="var(--logo-blue,#0f46b5)" d="M 656 615 L 822 781 L 724 879 L 558 713 Z"/>
      <g mask="url(#qcm-c1)">
        <path fill="var(--logo-green,#39a935)" d="M 132 514 L 346 608 L 564 506 L 564 571 L 346 682 L 132 589 Z"/>
        <path fill="var(--logo-g1,#68727f)" d="M 132 642 L 346 736 L 564 620 L 564 681 L 346 804 L 132 704 Z"/>
        <path fill="var(--logo-g2,#4f5a66)" d="M 132 755 L 346 852 L 564 730 L 564 795 L 346 918 L 132 816 Z"/>
      </g>
      <path fill="var(--logo-blue,#0f46b5)" d="M 412 665 A 86 86 0 1 0 412 775 L 368 739 A 31 31 0 1 1 368 701 Z"/>
    </svg>
  <div>
    <div class="htitle">Muestras</div>
    <div class="hsub" id="hsub">QCheck · Segarra Engineering</div>
  </div>
  <div class="spacer"></div>
  <!-- La rejilla de camiones (Q-33). Va PEGADA al selector porque son la misma
       decisión —a qué camión voy— y con la mano sucia se busca en un sitio, no
       en dos. El selector sigue estando: para un solo camión es más rápido. -->
  <button class="ver-rejilla" onclick="abrirRejilla()" title="Ver todos los camiones y qué les falta">▦ Camiones</button>
  <select class="truck-pick" id="truck-pick" onchange="pickTruck(this.value)"></select>
  <!-- Pequeño y aparte del teclado a propósito: cerrar el tiro es la última
       acción del día, no una que se busque con la mano sucia entre camión y
       camión. Pide confirmación con los números delante. -->
  <!-- El camino de vuelta a Recepción, que es de donde vienen los camiones.
       Sin esto, desde Muestras solo se podía salir a casa (Q-33). -->
  <a class="a-recepcion" href="conduce.html" onclick="guardarParcial()">⇄ Recepción</a>
  <button class="cerrar-tiro" id="btn-cerrar" onclick="cerrarDesdeMuestras()"></button>
</header>

<div class="body" id="body"></div>

<footer id="foot"></footer>

<div id="confirm">
  <div class="cbox">
    <h2>Confirmar rechazo</h2>
    <p id="confirm-txt"></p>
    <div class="row">
      <button class="btn-ghost" onclick="closeConfirm()">Cancelar</button>
      <button class="btn-sub rej" onclick="doSubmit(true)">Sí, rechazar</button>
    </div>
  </div>
</div>

<!-- ---------------------------------------------------------------- Q-33
     La rejilla de camiones. Lo que Rubén pidió con estas palabras: «ver en un
     view el record del camión y darle click al campo que no tenga info».

     Una casilla vacía es un botón que lleva a ese camión y a ese campo. Entrar,
     poner el dato, salir, entrar al otro — sin perder nada por el camino, que
     era el fallo de fondo. -->
<div id="rejilla" onclick="if(event.target===this) cerrarRejilla()">
  <div class="rbox">
    <div class="rhead">
      <b>Camiones de hoy</b>
      <span class="muted" id="rejilla-sub"></span>
      <div class="spacer"></div>
      <button class="btn-ghost" onclick="cerrarRejilla()">✕ Cerrar</button>
    </div>
    <div class="rbody" id="rejilla-cuerpo"></div>
  </div>
</div>

<div id="toast"></div>
<div id="modal-root"></div>

<script src="shared/conduce-contract.js?v=55633415"></script>
<script src="assets/seed.js?v=acf41aba"></script>
<script src="assets/sync.js?v=426ef405"></script>
<script src="assets/core.js?v=253b2d85"></script>
<script src="assets/demo.js?v=d4e2897f"></script>
<script>
"use strict";

const state = { day: null, n: null, field: "slump", buf: {} };

/* ============================================================
   Sonido — confirma cada número marcado y cada envío.
   Comparte la preferencia con el Field Display (clave qc-sound).
   ============================================================ */
let actx = null;
let soundOn = localStorage.getItem("qc-sound") !== "off";
function audioLocked() { return !actx || actx.state !== "running"; }
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume().catch(() => {});
}
function tone(f, t0, dur, type = "sine", g = 0.16) {
  if (!soundOn || audioLocked()) return;
  const o = actx.createOscillator(), gn = actx.createGain();
  o.type = type; o.frequency.value = f;
  o.connect(gn); gn.connect(actx.destination);
  const t = actx.currentTime + t0;
  gn.gain.setValueAtTime(0, t);
  gn.gain.linearRampToValueAtTime(g, t + 0.008);
  gn.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.start(t); o.stop(t + dur + 0.03);
}
const snd = {
  key:   () => tone(1180, 0, 0.05, "triangle", 0.13),   // número marcado
  step:  () => tone(880, 0, 0.055, "triangle", 0.12),   // ± stepper
  field: () => tone(660, 0, 0.07, "sine", 0.11),        // cambio de campo
  clear: () => tone(420, 0, 0.09, "triangle", 0.12),    // borrar
  ok:    () => { tone(523, 0, 0.12); tone(659, 0.12, 0.12); tone(784, 0.25, 0.34); },
  bad:   () => { tone(210, 0, 0.28, "square", 0.14); tone(165, 0.32, 0.46, "square", 0.14); },
};

const ICON_SPK = `<svg viewBox="0 0 24 24" style="width:52%;height:52%" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 5.2 7 9H3.6v6H7l4.5 3.8z" fill="currentColor" stroke="none"/><path d="M15.4 9a4.4 4.4 0 0 1 0 6M18.1 6.6a8 8 0 0 1 0 10.8"/></svg>`;
const ICON_MUTE = `<svg viewBox="0 0 24 24" style="width:52%;height:52%" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 5.2 7 9H3.6v6H7l4.5 3.8z" fill="currentColor" stroke="none"/><path d="M15.8 9.6l5 4.8M20.8 9.6l-5 4.8"/></svg>`;

function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem("qc-sound", soundOn ? "on" : "off");
  if (soundOn) { ensureAudio(); snd.key(); }
  render();
}
/* Desbloqueo silencioso del audio al primer toque (política del navegador) */
["pointerdown", "touchstart", "keydown"].forEach((ev) =>
  window.addEventListener(ev, ensureAudio, { passive: true }));

const FIELDS = [
  { key: "slump", label: "Slump",      unit: "in",  step: 0.25, dp: 2 },
  { key: "uw",    label: "Unit Weight",  unit: "pcf", step: 0.1,  dp: 2 },
  { key: "air",   label: "Aire",       unit: "%",   step: 0.1,  dp: 1 },
  { key: "temp",  label: "Temp",       unit: "°F",  step: 1,    dp: 0 },
];

/* ---------- proximidad a límites (igual que el Field Display) ---------- */
function proxRange(v, target, suspLo, suspHi) {
  if (v == null) return null;
  if ((suspLo != null && v < suspLo) || (suspHi != null && v > suspHi)) return "red";
  const side = v >= target ? suspHi - target : target - suspLo;
  if (!(side > 0)) return null;
  const d = v >= target ? suspHi - v : v - suspLo;
  const p = d / side;
  if (p <= 0.34) return "red";
  if (p <= 0.67) return "amber";
  return null;
}
function proximity(key, vals, uwTarget) {
  const p = db.plan;
  if (key === "slump") return proxRange(vals.slump, p.slump.target, p.slump.suspLo, p.slump.suspHi);
  if (key === "air")   return proxRange(vals.air, p.air.target, p.air.suspLo, p.air.suspHi);
  if (key === "uw") {
    const t = uwTarget ?? p.uw.target;
    return proxRange(vals.uw, t, t - p.uw.susp, t + p.uw.susp);
  }
  if (key === "temp") {
    const v = vals.temp; if (v == null) return null;
    if (v > p.tempMax) return "red";
    const d = (p.tempMax - v) / 10;
    if (d <= 0.34) return "red";
    if (d <= 0.67) return "amber";
    return null;
  }
  return null;
}
function limitText(key, uwTarget) {
  const p = db.plan;
  if (key === "slump") return `${fmtSlump(p.slump.actLo)}–${fmtSlump(p.slump.actHi)}"  ·  susp ${fmtSlump(p.slump.suspLo)}–${fmtSlump(p.slump.suspHi)}`;
  if (key === "air")   return `${p.air.actLo}–${p.air.actHi}%  ·  susp ${p.air.suspLo}–${p.air.suspHi}`;
  if (key === "uw")    { const t = uwTarget ?? p.uw.target; return `${fmt(t, 1)} ± ${p.uw.act}  ·  susp ± ${p.uw.susp}`; }
  if (key === "temp")  return `máx ${p.tempMax} °F`;
  return "";
}

/* ---------- selección de camión ---------- */
function pendingTrucks(day) {
  // camiones del día sin resultados completos de pruebas frescas
  return testsOfDate(day).filter((t) => num(t.slump) == null || num(t.uw) == null);
}
function currentTest() { return state.n == null ? null : db.tests.find((t) => t.n === state.n) || null; }

/* ------------------------------------------------------------ Q-33
   LO QUE SE MIDE NO SE PIERDE

   Hasta aquí, los cuatro valores vivían solo en `state.buf` y no se guardaban
   hasta pulsar Enviar — que además exige slump Y Unit Weight. Cambiar de camión
   recargaba el buffer desde el registro, así que **lo tecleado y no enviado se
   borraba en silencio.**

   Eso rompía justo el trabajo real: se sale con el termómetro, se toma la
   temperatura de los dos camiones que esperan, y al entrar la del segundo
   desaparecía la del primero. Rubén lo dijo en obra el 6 ago 2026 — «navegar se
   hizo imposible, a veces tenía que cerrar QCheck y volver a entrar». No era la
   navegación: era que la pantalla se comía los datos y cerrar era la única
   salida que quedaba.

   Ahora una lectura se guarda en cuanto se asienta. Una temperatura medida ES
   un dato, aunque la muestra esté a medias.

   LO QUE NO CAMBIA, Y ES LO IMPORTANTE: guardar una lectura suelta **no dispara
   el veredicto**. `resultsAt` y `rejected` los sigue poniendo solo Enviar, así
   que el Field Display no canta nada hasta que alguien lo decide. El camión
   se ve «A MEDIAS» en las demás pantallas, que es lo que es.

   Se guarda al asentarse el tecleo y en cada transición (cambiar de campo, de
   camión, salir). Se espera ese momento y no cada dígito para no llenar el
   registro de cambios con `3`, `3.2`, `3.25`: lo que interesa al expediente es
   la lectura, no las pulsaciones. */
function guardarParcial() {
  clearTimeout(guardarParcial._t);
  const t = currentTest();
  if (!t) return;
  let cambio = false;
  for (const k of ["slump", "uw", "air", "temp"]) {
    const v = state.buf[k] == null ? null : state.buf[k];
    if ((num(t[k]) ?? null) !== v) { t[k] = v; cambio = true; }
  }
  if (!cambio) return;
  /* La hora de la muestra se pone con la PRIMERA lectura, que es cuando de
     verdad se muestreó — no al enviar, que puede ser bastante después. */
  if (!t.testTime && ["slump", "uw", "air", "temp"].some((k) => num(t[k]) != null)) t.testTime = nowHM();
  saveDB();
}
/* Al teclear se espera a que el número se asiente. */
function guardarPronto() {
  clearTimeout(guardarParcial._t);
  guardarParcial._t = setTimeout(guardarParcial, 1200);
}

function pickTruck(n) {
  guardarParcial();                        // lo del camión que se deja, guardado
  state.n = n === "" || n == null ? null : Number(n);
  const t = currentTest();
  state.buf = t ? { slump: num(t.slump), uw: num(t.uw), air: num(t.air), temp: num(t.temp) } : {};
  state.field = "slump";
  state._typing = null; state._str = "";   // el tecleo no se arrastra de un camión a otro
  render();
}

/* Entrar a un camión por un campo concreto — lo que hace la rejilla al tocar
   una casilla vacía. */
function irA(n, campo) {
  pickTruck(n);
  state.field = campo;
  cerrarRejilla();
  render();
}

/* ------------------------------------------------------------ la rejilla (Q-33)

   Los camiones que faltan van ARRIBA y los terminados abajo y apagados: la
   pantalla existe para lo que queda por hacer, no para repasar lo hecho. Los
   terminados siguen ahí porque corregir un dato es parte del trabajo, y
   esconderlos obligaría a salir a otra pantalla para eso.

   El orden dentro de los pendientes es el de llegada, igual que la fila: el que
   lleva más tiempo esperando, primero. */
function abrirRejilla() {
  guardarParcial();                     // lo que esté a medio escribir, guardado antes de salir
  pintarRejilla();
  document.getElementById("rejilla").classList.add("show");
}
function cerrarRejilla() { document.getElementById("rejilla").classList.remove("show"); }

function pintarRejilla() {
  const todos = testsOfDate(state.day);
  const faltan = todos.filter((t) => !t.rejected && !tieneVeredicto(t));
  const hechos = todos.filter((t) => t.rejected || tieneVeredicto(t));
  const filas = faltan.concat(hechos);

  document.getElementById("rejilla-sub").textContent = todos.length
    ? `${faltan.length} sin terminar de ${todos.length}`
    : "";

  const celda = (t, f) => {
    const v = num(t[f.key]);
    const aqui = t.n === state.n && state.field === f.key;
    const clases = "celda" + (v == null ? " vacia" : "") + (aqui ? " aqui" : "");
    /* El valor se enseña con los decimales de su campo, los mismos que usa el
       teclado. Un hueco enseña «—» y no un cero: no es lo mismo no haber
       medido que haber medido cero. */
    return `<td><button class="${clases}" onclick="irA(${t.n},'${f.key}')"
      title="${esc(t.truck || "")} · ${esc(f.label)}">${v == null ? "—" : fmt(v, f.dp)}</button></td>`;
  };

  document.getElementById("rejilla-cuerpo").innerHTML = filas.length ? `
    <table class="rej">
      <tr><th class="izq">Camión</th>${FIELDS.map((f) => `<th>${esc(f.label)}</th>`).join("")}<th>Estado</th></tr>
      ${filas.map((t) => `
        <tr class="${t.rejected || tieneVeredicto(t) ? "hecho" : ""}">
          <td class="izq">
            <div class="r-camion">${esc(t.truck || "—")}</div>
            <div class="r-ticket">ticket ${esc(t.ticket || "—")}</div>
          </td>
          ${FIELDS.map((f) => celda(t, f)).join("")}
          <td style="text-align:center">${estadoBadge(t)}</td>
        </tr>`).join("")}
    </table>`
    : `<div class="empty" style="padding:4vh 2vw; text-align:center; color:var(--muted)">
         Ningún camión registrado hoy. Se reciben en Recepción.</div>`;
}

/* ---------- teclado ---------- */
/* Al cambiar de campo se reinicia el tecleo: el próximo dígito empieza un
   número nuevo, no se pega al valor que ya estaba. */
function setField(k) { guardarParcial(); snd.field(); state.field = k; state._typing = null; state._str = ""; render(); }
function keyPress(ch) {
  const f = state.field;
  const cur = state.buf[f];
  let s = state._typing === f ? (state._str || "") : "";
  if (ch === "del") { snd.clear(); s = s.slice(0, -1); }
  else if (ch === ".") { snd.key(); if (!s.includes(".")) s = (s || "0") + "."; }
  else { snd.key(); s = s + ch; }   // confirma que el número entró
  state._typing = f; state._str = s;
  state.buf[f] = s === "" || s === "." ? null : Number(s);
  guardarPronto();
  render();
}
function bump(delta) {
  snd.step();
  const f = state.field;
  const def = FIELDS.find((x) => x.key === f);
  const base = state.buf[f] == null ? (f === "temp" ? 85 : db.plan[f === "uw" ? "uw" : f]?.target ?? 0) : state.buf[f];
  const v = Math.max(0, Math.round((base + delta * def.step) / def.step) * def.step);
  state.buf[f] = Number(v.toFixed(def.dp));
  state._typing = null; state._str = "";
  guardarPronto();
  render();
}
function clearField() { snd.clear(); state.buf[state.field] = null; state._typing = null; state._str = ""; guardarPronto(); render(); }

/* Limpia los cuatro resultados de este camión */
function clearAll() {
  snd.clear();
  state.buf = {}; state._typing = null; state._str = ""; state.field = "slump";
  guardarParcial();          // borrar también es un cambio que hay que guardar
  render();
  toast("Resultados borrados");
}

/* ---------- veredicto en vivo ---------- */
function liveVerdict() {
  const t = currentTest();
  const uwT = t ? (num(t.uwTarget) ?? db.plan.uw.target) : db.plan.uw.target;
  const pseudo = { slump: state.buf.slump, uw: state.buf.uw, air: state.buf.air, temp: state.buf.temp, uwTarget: uwT };
  const w = worstZone(pseudo);
  const any = ["slump", "uw", "air", "temp"].some((k) => state.buf[k] != null);
  if (!any) return { cls: "idle", mark: "·", word: "En espera", sub: "Entre los resultados", bad: false, ready: false };
  const ready = state.buf.slump != null && state.buf.uw != null;
  if (w === "susp") return { cls: "susp", mark: "✕", word: "Rechazar", sub: "Fuera de límite de suspensión", bad: true, ready };
  if (w === "act")  return { cls: "act", mark: "✓", word: "Aceptar", sub: "Zona de acción · vigilar", bad: false, ready };
  return { cls: "ok", mark: "✓", word: "Aceptar", sub: "Dentro de límites", bad: false, ready };
}

/* ---------- render ---------- */
function render() {
  /* Con el plan del día dentro: un tiro programado sin camiones
     también es el tiro de hoy (Q-46). */
  const days = diasDelProyecto();
  const today = todayISO();
  state.day = days.includes(today) ? today : days[0];
  if (typeof pintarTiro === "function") pintarTiro(state.day);   // el tiro sube en vivo
  const pend = pendingTrucks(state.day);
  const all = testsOfDate(state.day);

  // selector de camión
  /* La pantalla arranca en el camión que está ESPERANDO resultados, y solo en
     ese. Caer por defecto en uno ya muestreado era el fallo que hacía que
     «Aprobar» no pareciera hacer nada: se guardaba encima del mismo camión y
     todo se repintaba idéntico. Sin nadie esperando, la pantalla espera; el
     técnico todavía puede escoger a mano un camión cerrado para corregirlo. */
  if (state.n == null && pend.length) {
    const first = pend[0];   // el que lleva más tiempo esperando — la fila es por orden de llegada
    state.n = first.n;
    state.buf = { slump: num(first.slump), uw: num(first.uw), air: num(first.air), temp: num(first.temp) };
  }
  const pick = document.getElementById("truck-pick");
  const list = all.slice().reverse();
  const opciones = list.map((t) => {
    const done = num(t.slump) != null && num(t.uw) != null;
    return `<option value="${t.n}" ${t.n === state.n ? "selected" : ""}>Camión ${esc(t.truck || "—")} · ticket ${esc(t.ticket || "—")}${done ? "  ✓" : "  ·  pendiente"}</option>`;
  }).join("");
  pick.innerHTML = list.length
    ? (state.n == null ? `<option value="">Escoja un camión</option>` : "") + opciones
    : `<option value="">Sin camiones hoy</option>`;
  pick.value = state.n == null ? "" : state.n;
  document.getElementById("hsub").textContent =
    `${db.project.qcFirm || "QCheck"} · ${fmtDate(state.day)} · ${all.length} camiones`;

  /* El botón de cerrar. Se pinta en cada render porque el cierre puede venir
     de otro aparato.

     **Desde aquí solo se cierra cuando no queda nada por muestrear.** El tiro
     puede acabar por debajo de lo planificado —se acabó el hormigón, llovió,
     se decidió parar— y eso es normal; lo que no puede es cerrarse con un
     camión esperando resultados, porque ese hueco en el expediente ya no se
     rellena. Con camiones pendientes el botón queda apagado y dice cuántos.
     Si de verdad hay que cerrar así, se hace desde el Control Center, que es
     donde se toma esa decisión a sabiendas. */
  const bc = document.getElementById("btn-cerrar");
  const cerrado = tiroCerrado(state.day);
  const pendientes = pend.length;
  bc.textContent = cerrado ? "Tiro cerrado" : "Cerrar tiro";
  bc.disabled = !cerrado && pendientes > 0;
  bc.className = "cerrar-tiro"
    + (cerrado ? " hecho" : "")
    + (!cerrado && !pendientes && all.length ? " listo" : "");
  bc.title = cerrado
    ? `Cerrado a las ${cerrado} · tocar para reabrir`
    : pendientes
      ? `Quedan ${pendientes} camión${pendientes === 1 ? "" : "es"} sin resultados`
      : "Dar por terminado el vaciado de hoy";

  const t = currentTest();
  const body = document.getElementById("body");
  const foot = document.getElementById("foot");

  if (!t) {
    /* Muestras ya no da de alta camiones: se muestrea lo que llegó por
       Recepción. Sin camiones recibidos no hay nada que muestrear, y la
       pantalla lo dice — no es una instrucción, es de dónde sale el dato. */
    body.innerHTML = all.length
      ? `<div class="empty-state">Los ${all.length} camiones de hoy están muestreados.<br>Esperando el próximo.</div>`
      : `<div class="empty-state">No hay camiones recibidos hoy.<br>Los camiones entran por Recepción.</div>`;
    foot.innerHTML = "";
    return;
  }

  const uwT = num(t.uwTarget) ?? db.plan.uw.target;
  const def = FIELDS.find((x) => x.key === state.field);

  body.innerHTML = `
    <div class="left">
      <div class="truck-card">
        <div>
          <div class="tlbl">Camión</div>
          <div class="tnum">${esc(t.truck || "—")}</div>
        </div>
        <div class="tmeta">
          Ticket <b>${esc(t.ticket || "—")}</b><br>
          <b>${fmt(num(t.vol), 1)}</b> CY · llegó <b>${esc(t.arrive || "—")}</b><br>
          ${esc(shortIdent(t.ident))}
          <div class="tplant"><i></i>${esc(t.plant || "—")}</div>
        </div>
      </div>
      <div class="vals">
        ${FIELDS.map((f) => {
          const v = state.buf[f.key];
          const prox = proximity(f.key, state.buf, uwT);
          return `<div class="val ${state.field === f.key ? "active" : ""} ${prox ? "p-" + prox : ""}" onclick="setField('${f.key}')">
            <div class="k"><i></i>${f.label}</div>
            <div class="v ${v == null ? "empty" : ""}">${v == null ? "—" : fmt(v, f.dp)}</div>
            <div class="u">${f.unit}</div>
            <div class="lim">${limitText(f.key, uwT)}</div>
          </div>`;
        }).join("")}
      </div>
    </div>

    <div class="right">
      <div class="kp-head">
        <div class="f">${def.label} (${def.unit})</div>
        <div class="n">${state.buf[state.field] == null ? "—" : fmt(state.buf[state.field], def.dp)}</div>
      </div>
      <div class="steppers">
        <button class="step" onclick="bump(-1)">− ${def.step}</button>
        <button class="step" onclick="bump(1)">+ ${def.step}</button>
      </div>
      <div class="keypad">
        ${[1,2,3,4,5,6,7,8,9].map((d) => `<button class="key" onclick="keyPress('${d}')">${d}</button>`).join("")}
        <button class="key" onclick="keyPress('.')">.</button>
        <button class="key" onclick="keyPress('0')">0</button>
        <button class="key del" onclick="keyPress('del')">⌫</button>
        <!-- Delete, Next y Clear en inglés: es como se dicen en la caseta y así
             lo pidió Víctor el 31 jul 2026. Delete borra el campo en el que se
             está; Clear borra las cuatro lecturas del camión. -->
        <button class="key wide" onclick="clearField()">Delete</button>
        <button class="key wide" onclick="nextField()">Next ▸</button>
        <button class="key wide clr" onclick="clearAll()">Clear</button>
      </div>
    </div>`;

  const v = liveVerdict();
  foot.dataset.pending = "1";
  foot.innerHTML = `
    <div class="verdict-pre v-${v.cls}">
      <div class="ring">${v.mark}</div>
      <div class="txt"><div class="w">${v.word}</div><div class="s">${v.sub}</div></div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn ${soundOn ? "" : "muted"}" id="sound-toggle" onclick="toggleSound()"
      title="${soundOn ? "Silenciar" : "Activar sonido"}" aria-label="Sonido">${soundOn ? ICON_SPK : ICON_MUTE}</button>
    <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" aria-label="Tema"></button>
    ${v.ready ? `<button class="btn-sub ${v.bad ? "rej" : ""}" onclick="askSubmit()">
      ${v.bad ? "Rechazar" : "Aprobar"}
    </button>` : ""}`;
  applyTheme(document.documentElement.dataset.theme || "dark"); // repinta el icono del tema
}

function nextField() {
  const i = FIELDS.findIndex((f) => f.key === state.field);
  state.field = FIELDS[(i + 1) % FIELDS.length].key;
  state._typing = null; state._str = "";
  render();
}

/* ---------- submit ---------- */
function askSubmit() {
  const v = liveVerdict();
  if (!v.ready) return;
  if (v.bad) {
    const t = currentTest();
    document.getElementById("confirm-txt").innerHTML =
      `Camión <b>${esc(t.truck || "—")}</b>, ticket <b>${esc(t.ticket || "—")}</b>.<br>
       El Field Display anunciará RECHAZADO y se notificará a todas las partes.`;
    document.getElementById("confirm").classList.add("show");
  } else doSubmit(false);
}
function closeConfirm() { document.getElementById("confirm").classList.remove("show"); }

function doSubmit(rejected) {
  /* Q-41: un vaciado cerrado no acepta resultados nuevos salvo del ingeniero
     de récord. Se avisa con el motivo, no con un botón que no responde. */
  const _t = currentTest();
  if (_t && typeof frenoDiaCerrado === "function" && frenoDiaCerrado(_t.date)) return;
  closeConfirm();
  const t = currentTest(); if (!t) return;
  t.slump = state.buf.slump; t.uw = state.buf.uw;
  t.air = state.buf.air; t.temp = state.buf.temp;
  if (!t.testTime) t.testTime = nowHM();
  t.rejected = !!rejected;
  t.resultsAt = nowHM();          // dispara el anuncio en el Field Display
  saveDB();
  rejected ? snd.bad() : snd.ok();
  toast(rejected ? `Camión ${t.truck || ""} RECHAZADO` : `Resultados enviados · camión ${t.truck || ""}`);
  /* El camión queda cerrado: se sueltan los cuatro campos y la pantalla vuelve
     a la fila. `render()` engancha solo al próximo camión que esté esperando;
     si no hay ninguno, se queda en espera. Lo que NO puede hacer es seguir
     enseñando el camión recién enviado con sus lecturas puestas, porque
     entonces enviar no se distingue de no haber enviado. */
  state.n = null; state.buf = {}; state._typing = null; state._str = ""; state.field = "slump";
  render();
}

/* Cerrar o reabrir el tiro desde el iPad. La confirmación con los números
   delante la pone `cerrarTiro()` en core.js, que la comparte con el Control
   Center: lo que usan dos pantallas no se duplica. */
function cerrarDesdeMuestras() {
  const estaba = tiroCerrado(state.day);
  /* La misma regla, comprobada también aquí y no solo en el botón: apagar un
     botón esconde la acción, no la impide. */
  const pendientes = pendingTrucks(state.day).length;
  if (!estaba && pendientes) {
    toast(`Quedan ${pendientes} camión${pendientes === 1 ? "" : "es"} sin resultados`);
    return;
  }
  const ok = estaba ? reabrirTiro(state.day) : cerrarTiro(state.day);
  if (!ok) return;
  render();
  toast(estaba ? "Tiro reabierto" : "Tiro cerrado");
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2400);
}

loadDB();
initTheme("dark");
enableLiveSync(() => render());
render();
mountStatusBar(state.day);
pantallaCompletaAlTocar();

/* Lo medido se guarda también al irse (Q-33).

   En un iPad en obra la pantalla se va a segundo plano a cada rato —llega una
   notificación, se bloquea sola, se cambia de aplicación— y iOS congela el
   JavaScript sin avisar. Sin esto, una lectura escrita en el último segundo se
   perdería justo en el caso que esta tarea existe para arreglar.

   `pagehide` y `visibilitychange` porque ninguno de los dos se dispara siempre:
   iOS es irregular con `beforeunload` y con `pagehide` según cómo se salga. */
addEventListener("pagehide", guardarParcial);
addEventListener("visibilitychange", () => { if (document.hidden) guardarParcial(); });

/* Escape cierra la rejilla — en el iPad con teclado, y en la PC de la caseta. */
addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarRejilla(); });
</script>
</body>
</html>
