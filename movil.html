<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Aplicación en la pantalla de inicio (iOS y Android). Sin estas etiquetas
     y sin el manifest, el icono guardado abre como un MARCADOR de Safari, con
     una franja arriba enseñando el dominio en vez de la aplicación limpia. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QCheck">
<link rel="apple-touch-icon" href="assets/icono-180.png">
<meta name="theme-color" content="#0a0d12">
<title>QCheck — Móvil</title>
<link rel="stylesheet" href="assets/qc.css?v=ab4b9718">
<style>
/* ============================================================
   PORTAL DE TELÉFONO — para quien mira el tiro desde afuera.
   El concretero, el contratista y la Autoridad no entran datos:
   consultan. Cuatro puertas grandes y nada más.
   ============================================================ */
body { background:
  radial-gradient(900px 380px at 50% -10%, rgba(74,99,216,.16), transparent 70%),
  var(--bg); }
main.mv { max-width: 520px; margin: 0 auto; padding: 22px 18px calc(40px + env(safe-area-inset-bottom)); }

.mv-cab { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.mv-cab .mark { height: 42px; width: 42px; flex: none; display: block; }
.mv-cab .t { font-size: 20px; font-weight: 750; letter-spacing: -.01em; }
.mv-cab .s { font-size: 11px; font-weight: 800; letter-spacing: .18em;
  text-transform: uppercase; color: var(--ink-soft); margin-top: 2px; }

/* resumen del tiro, para no tener que entrar a ver si hay algo */
.mv-tiro { margin: 18px 0 22px; padding: 16px 18px; border-radius: 16px;
  border: 1px solid var(--line); background: linear-gradient(168deg, var(--panel-2), var(--panel));
  box-shadow: var(--shadow); }
.mv-estado { font-size: 10px; font-weight: 800; letter-spacing: .2em;
  text-transform: uppercase; color: var(--vc, var(--ink-soft)); }
.mv-tiro.t-vaciando { --vc: #56e08e; } .mv-tiro.t-espera { --vc: #f7c65c; }
.mv-tiro.t-detenido { --vc: #ff7a72; } .mv-tiro.t-fin { --vc: #8fa6f2; }
.mv-tiro.t-quieto   { --vc: var(--ink-soft); }
.mv-cifra { display: flex; align-items: baseline; gap: 7px; margin-top: 6px;
  font-variant-numeric: tabular-nums; }
.mv-cifra b { font-size: 34px; font-weight: 250; letter-spacing: -.025em; line-height: 1; }
.mv-cifra .de { font-size: 19px; font-weight: 250; color: var(--ink-soft); }
.mv-cifra .u { font-size: 10.5px; font-weight: 800; letter-spacing: .16em; color: var(--ink-soft); }
.mv-cifra .pc { margin-left: auto; font-size: 15px; font-weight: 700; color: var(--vc, var(--ink-soft)); }
.mv-barra { height: 5px; border-radius: 3px; background: rgba(255,255,255,.12);
  margin: 11px 0 7px; overflow: hidden; }
.mv-barra i { display: block; height: 100%; border-radius: 3px; background: var(--vc, var(--ink-soft));
  box-shadow: 0 0 12px -2px var(--vc, transparent); transition: width .6s cubic-bezier(.25,.6,.25,1); }
.mv-nota { font-size: 11.5px; color: var(--ink-soft); }

/* las cuatro puertas */
.mv-menu { display: grid; gap: 12px; }
.mv-btn {
  display: flex; align-items: center; gap: 15px; text-decoration: none; color: var(--ink);
  padding: 18px 18px; border-radius: 16px; border: 1px solid var(--line);
  background: linear-gradient(168deg, var(--panel-2), var(--panel)); box-shadow: var(--shadow);
  -webkit-tap-highlight-color: transparent;
  transition: border-color .18s, box-shadow .18s, transform .14s;
}
.mv-btn:active { transform: scale(.985); }
.mv-btn .ic { width: 30px; height: 30px; flex: none; fill: none;
  stroke: var(--logo-blue, #4a7ef0);
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
/* el logotipo de Segarra es una marca rellena, no un icono de trazo */
.mv-btn .ic.marca { stroke: none; width: 32px; height: 30px; }
.mv-btn .n { font-size: 17px; font-weight: 700; letter-spacing: -.005em; }
.mv-btn .fl { margin-left: auto; color: var(--ink-soft); font-size: 17px; }
/* el color entra por el resplandor, como en el resto de la interfaz */
.mv-btn.destaca { border-color: rgba(74,99,216,.5);
  box-shadow: 0 0 0 3px rgba(74,99,216,.09), 0 0 22px -7px rgba(74,99,216,.95); }
.mv-btn.destaca .ic { stroke: #8ba4f5; }   /* un punto más claro: es el destacado */

/* la puerta «Dashboards» es un botón, no un enlace: abre la elección */
button.mv-btn { width: 100%; text-align: left; font-family: inherit; cursor: pointer; }
.mv-btn .r { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; line-height: 1.35; }

.mv-pie { margin-top: 26px; text-align: center; }
.mv-pie a { font-size: 12px; color: var(--ink-soft); text-decoration: none;
  border-bottom: 1px solid var(--line); padding-bottom: 2px; }
</style>
</head>
<body>

<main class="mv">
  <div class="mv-cab">
    <svg class="mark" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" aria-label="QCheck">
      <defs>
        <mask id="qcm-q1"><rect width="1000" height="1000" fill="#fff"/><path fill="#000" d="M 139 531 H 558 V 802 H 139 Z"/></mask>
        <mask id="qcm-c1"><rect width="1000" height="1000" fill="#fff"/><circle cx="346" cy="720" r="103" fill="#000"/></mask>
      </defs>
      <path fill="var(--logo-blue,#0f46b5)" fill-rule="evenodd" mask="url(#qcm-q1)" d="M 509 63 A 337 337 0 1 1 508.9 63 Z M 509 174 A 226 226 0 1 0 509.1 174 Z"/>
      <path fill="var(--logo-blue,#0f46b5)" d="M 656 615 L 822 781 L 724 879 L 558 713 Z"/>
      <g mask="url(#qcm-c1)">
        <path fill="var(--logo-green,#39a935)" d="M 132 514 L 346 608 L 564 506 L 564 571 L 346 682 L 132 589 Z"/>
        <path fill="var(--logo-g1,#68727f)" d="M 132 642 L 346 736 L 564 620 L 564 681 L 346 804 L 132 704 Z"/>
        <path fill="var(--logo-g2,#4f5a66)" d="M 132 755 L 346 852 L 564 730 L 564 795 L 346 918 L 132 816 Z"/>
      </g>
      <path fill="var(--logo-blue,#0f46b5)" d="M 412 665 A 86 86 0 1 0 412 775 L 368 739 A 31 31 0 1 1 368 701 Z"/>
    </svg>
    <div>
      <div class="t">QCheck</div>
      <div class="s" id="mv-proyecto">—</div>
    </div>
  </div>

  <a class="mv-tiro" id="mv-tiro" href="contratista.html" style="display:block; text-decoration:none; color:inherit"></a>

  <div class="mv-menu" id="mv-menu"></div>

  <!-- El consejo de «añadir a la pantalla de inicio» vivía aquí. Víctor lo sacó
       el 31 jul 2026: ahora se explica una sola vez, y con dibujos, en la guía
       de usuario (`docs/guia-usuario.html`). En las pantallas estorbaba. -->

  <!-- La puerta al tablero completo solo la ve quien tenga `tablero` en la lista
       de usuarios. Rubén NO: el Control Center no cabe en la mano. -->
  <div class="mv-pie" id="mv-pie" hidden><a href="control-center.html">Ver el Control Center completo</a></div>
</main>


<script src="shared/conduce-contract.js?v=55633415"></script>
<script src="assets/seed.js?v=acf41aba"></script>
<script src="assets/sync.js?v=79ee8f37"></script>
<script src="assets/core.js?v=53b70925"></script>
<script src="assets/demo.js?v=4fdc15f7"></script>
<script src="assets/usuarios.js?v=dfd5ecc0"></script>
<script src="assets/auth.js?v=c77eb346"></script>
<script>
"use strict";

/* Resultados va primero y solo lo ve quien lleva el control de calidad —Rubén
   y el administrador—: es la pantalla de QC, no de quien viene a consultar.
   (Eso sí lo ve Rubén; lo que no ve es el enlace al Control Center del pie.)

   El logotipo son los chevrons apilados de Segarra Engineering — el mismo
   elemento que lleva el logo de QCheck dentro, recortado y sin texto. */
const MARCA_SEGARRA = `<svg viewBox="125 500 447 425" class="ic marca">
  <path fill="var(--logo-blue,#4a7ef0)" d="M 132 514 L 346 608 L 564 506 L 564 571 L 346 682 L 132 589 Z"/>
  <path fill="#8a95a3" d="M 132 642 L 346 736 L 564 620 L 564 681 L 346 804 L 132 704 Z"/>
  <path fill="#6b7683" d="M 132 755 L 346 852 L 564 730 L 564 795 L 346 918 L 132 816 Z"/>
</svg>`;

const PUERTA_RESULTADOS = { href: "results.html", n: "Resultados", ic: MARCA_SEGARRA };

/* Los tres tableros de indicadores no van sueltos: entran por «Dashboards», que
   pregunta cuál. La lista y la elección viven en `core.js` porque las comparte
   con el Control Center. */
const PUERTAS = [
  { tableros: true, n: "Dashboards", ic: ICONO_DASHBOARDS.replace("<svg", `<svg class="ic"`) },
  { href: "display.html?acostar=1", n: "Field Display",
    destaca: true,
    ic: `<svg viewBox="0 0 24 24" class="ic"><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M12 16.5v4M8.5 20.5h7"/></svg>` },
];

function pintar() {
  document.getElementById("mv-proyecto").textContent = db.project.name || "";
  /* El enlace al Control Center no es cosa del papel sino de la cuenta: Rubén
     lleva el control de calidad y aun así no lo ve, porque ese tablero no cabe
     en un teléfono. Ver `qcVeTablero()` en `assets/usuarios.js`. */
  document.getElementById("mv-pie").hidden = !qcVeTablero();

  const day = diaActivo();
  const t = estadoTiro(day), p = dayProgress(day);
  const hayPlan = p.cyPlan != null && p.cyPlan > 0;
  const el = document.getElementById("mv-tiro");
  el.className = "mv-tiro t-" + t.cls;
  el.innerHTML = `
    <div class="mv-estado">${esc(t.txt)}</div>
    <div class="mv-cifra">
      <b>${fmt(p.placed, 1)}</b>${hayPlan ? `<span class="de">/ ${fmt(p.cyPlan, 0)}</span>` : ""}
      <span class="u">CY</span>
      ${hayPlan ? `<span class="pc">${Math.round(p.pct)}%</span>` : ""}
    </div>
    ${hayPlan ? `<div class="mv-barra"><i style="width:${p.pct.toFixed(1)}%"></i></div>` : ""}
    <div class="mv-nota">${p.loads} ${p.loads === 1 ? "camión recibido" : "camiones recibidos"}${
      hayPlan ? ` · faltan ${fmt(p.pending, 1)} CY` : ""}</div>`;

  const puertas = qcEsQC() ? [PUERTA_RESULTADOS, ...PUERTAS] : PUERTAS;
  document.getElementById("mv-menu").innerHTML = puertas.map((x) => x.tableros
    ? `<button class="mv-btn" type="button" onclick="abrirDashboards()">
        ${x.ic}
        <div class="n">${x.n}</div>
        <span class="fl">›</span>
      </button>`
    : `<a class="mv-btn${x.destaca ? " destaca" : ""}" href="${x.href}">
        ${x.ic}
        <div class="n">${x.n}</div>
        <span class="fl">›</span>
      </a>`).join("");

}

loadDB();
initTheme("dark");
mountStatusBar();
enableLiveSync(pintar);
pintar();
</script>
</body>
</html>
