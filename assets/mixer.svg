  <defs>
    <style>
      /* El trazo toma el color de donde esté: inline hereda el de la pantalla
         —incluido el color del estado del tiro—, y como archivo suelto cae en
         el gris claro de `svg { color }`. Los rellenos eran el papel blanco del
         original: sobre el tablero oscuro se apagan. */
      svg { color: #cfd9e4; }
      .cls-1 { fill: currentColor; }
      .cls-2, .cls-3 { fill: none; }
    </style>
  </defs>
