<style>
/* ============================================================
   SETTINGS — la pantalla de Rubén.

   Q-37, 6 ago 2026. Hasta hoy los límites del plan de control vivían
   dentro de «Plan & Datos», que es de admin, junto a la dirección del
   servidor, la llave del proyecto y el panel de la simulación. Rubén
   no entraba ahí a propósito —se decidió el 1 de agosto: quien usa la
   herramienta no ve cómo está montada— y eso dejaba un hueco raro:
   cuando el proyecto cambia un límite, el que lo sabe es él.

   Así que los límites salen de allí y se le dan en su propia pantalla,
   sin nada más al lado que se pueda tocar sin querer. Víctor lo pidió
   así hoy: «una pantalla que se llame Settings y ahí solo un tab de
   límites, pero luego pondremos más settings».

   POR ESO HAY PESTAÑAS CON UNA SOLA PESTAÑA. No es un descuido: la
   siguiente que entre se añade a `TABS` y ya. Si acaba habiendo una
   sola para siempre, quítalas.

   Lo que se cambie aquí queda firmado en el expediente como cualquier
   otro cambio —quién y cuándo—, así que un límite mal puesto se ve en
   el registro y se deshace. Eso es lo que hace que esto no sea el
   riesgo que era en agosto.
   ============================================================ */
main { max-width: 900px; margin: 0 auto; padding: 18px 16px 40px; }
.nota { margin-top: 16px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }

<script>
/* ══════════════════════════════════════════════════════════════════════════
   PORTAL DE DEMOSTRACIÓN — Q-68, 8 de agosto de 2026.

   Para enseñar QCheck 934 a alguien: se abre, se elige una parte y se entra en
   su pantalla con un vaciado corriendo.

   **Aquí no va nada de cómo está hecho.** Ni qué falta por construir, ni por
   qué se decidió una cosa y no otra, ni el estado de los módulos. Eso vive en el portal
   de construcción, que solo ve la cuenta de Víctor.

   La razón no es esconder: es que quien mira una demostración necesita ver el
   producto, no el andamio. Un portal que enseña las dos cosas a la vez no
   consigue ninguna.
   ══════════════════════════════════════════════════════════════════════════ */

const PARTES = [
  { k: "ruben", ico: "✍", n: "Ingeniero de récord",
    q: "Programa el vaciado, dirige el muestreo, cierra los lotes y firma." },
  { k: "autoridad", ico: "⚖", n: "Autoridad de Carreteras",
    q: "Revisa cada lote cerrado y decide si se acepta, con el cálculo delante." },
  { k: "contratista", ico: "🏗", n: "Contratista",
    q: "Ve el avance de su obra y cómo va quedando el pago de cada lote." },
  { k: "concretera", ico: "🏭", n: "Concretera",
    q: "Ve cómo se está comportando su mezcla en la obra, camión a camión." },
];

/* Con el vocabulario de la casa —`panel`, `panel-head`, `panel-body`,
   `grid cols-2`— y no con clases propias. Una pantalla que estrena su propio
   lenguaje visual deja de parecer el mismo producto, y aquí lo que se está
   enseñando es precisamente que es el mismo producto. Q-70. */
document.getElementById("app").innerHTML = `
  <section class="panel">
    <div class="panel-head"><h2>Un vaciado bajo la SP-934, en marcha</h2></div>
    <div class="panel-body">
      <p class="lead">La Special Provision 934 acepta el hormigón por <b>lotes de 250 m³</b>,
      con evaluación estadística, y de ahí sale cuánto se paga. Cada parte de la obra
      necesita ver una cosa distinta.</p>
      <p class="muted">Ampliación PR-22 · Km 8.4 a 12.1 — dos lotes cerrados y el tercero
      a media colocación. Entre por la puerta que quiera.</p>
    </div>
  </section>

  <div class="grid cols-2" style="margin-top:14px">
    ${PARTES.map((p) => `
      <a class="panel demo-puerta" href="sim934.html?rol=${p.k}">
        <div class="panel-body">
          <div class="dp-ico">${p.ico}</div>
          <div class="dp-n">${esc(p.n)}</div>
          <div class="muted dp-q">${esc(p.q)}</div>
          <div class="dp-entrar">Entrar →</div>
        </div>
      </a>`).join("")}
  </div>

  <p class="muted demo-pie">Los datos de esta demostración son inventados y no
  corresponden a ninguna obra.</p>`;

/* El portal también lleva su barra: sin ella, quien entra desde un enlace se
   queda sin manera de volver a QCheck. Aquí «casa» es el Control Center — que
   es la casa de verdad; el portal ya es este. Q-75. */
(function montarBarraPortal() {
  const bar = document.createElement("div");
  bar.className = "sim-bar";
  bar.innerHTML = `
    <div class="sim-nav">
      <button class="sim-b" onclick="history.back()" title="Atrás" aria-label="Atrás">${ICONO_NAV.atras}</button>
      <a class="sim-b" href="control-center.html" title="Volver a QCheck" aria-label="Volver a QCheck">${ICONO_NAV.casa}</a>
    </div>
    <div class="sim-bar-marca"><i></i>Demostración · datos inventados</div>`;
  document.body.appendChild(bar);
  document.body.classList.add("con-sim-bar");
})();

initTheme();
mountThemeToggle();
</script>
