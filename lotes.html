<script>
/* ══════════════════════════════════════════════════════════════════════════
   LOTES — M1 de la SP-934. Q-59, 8 de agosto de 2026.

   QCheck piensa en DÍAS: un tiro es una jornada de obra y así se trabaja. La
   934 piensa en LOTES de 250 m³, y un lote puede abarcar varios tiros o un
   tiro partirse entre dos. Esta pantalla es donde se ve esa correspondencia,
   que es justo lo que hoy no se puede representar.

   Detrás de `es934()` y, mientras se construye, detrás de `qcVeConfig()`
   (Q-57b): ni Rubén ni el técnico ven nada de esto todavía.
   ══════════════════════════════════════════════════════════════════════════ */

const LOTE_ABIERTO = "abierto";

/* Las tres características de aceptación, con su campo en el ensayo y de
   dónde salen sus límites. La permeabilidad solo entra si el proyecto la
   inspecciona — la PR-52 no (Víctor, 8 ago 2026). */
/* La edad a la que se juzga la resistencia sale del PLAN, no del código.

   La PR-52 es «3000 PSI @ 5 días» y por eso su dato vive en `cs5`. La 934
   juzga a 28 días —o a 56 en tablero de puente— y ese es otro campo. Clavar
   `cs28` daba una pantalla que rendía perfectamente y evaluaba el lote con
   los cuatro ensayos que casualmente tenían 28 días: números impecables y
   completamente falsos. Q-59. */
function campoDeResistencia() {
  const edad = Number(((db.plan || {}).cs || {}).age);
  if (edad === 1) return { campo: "cs1", edad: 1 };
  if (edad === 5) return { campo: "cs5", edad: 5 };
  if (edad === 56) return { campo: "cs56", edad: 56 };
  return { campo: "cs28", edad: 28 };
}

function limitesDelProyecto() {
  const clase = (db.project || {}).claseHormigon || "III";
  const ccs = SP934_CCS[clase] || SP934_CCS.III;
  const res = campoDeResistencia();
  const cuw = sp934LimitesCUW((db.plan && db.plan.uw && db.plan.uw.target) || null);
  const nivelCP = (db.project || {}).nivelPermeabilidad;
  const salida = {
    ccs: { campo: res.campo, lsl: ccs.lsl, usl: ccs.usl, n: "Resistencia", u: `psi a ${res.edad} días`, clase },
    cuw: { campo: "uw", lsl: cuw.lsl, usl: cuw.usl, n: "Unit Weight", u: "pcf" },
  };
  if (nivelCP && SP934_CP_USL[String(nivelCP)] != null)
    salida.cp = { campo: "cp", lsl: null, usl: SP934_CP_USL[String(nivelCP)], n: "Permeabilidad", u: "coulombs" };
  return salida;
}

function estadoDeLote(l, ev) {
  if (l.parcial && !l.cerrado) return { k: LOTE_ABIERTO, t: "Abierto", c: "act" };
  if (ev && ev.rechazado) return { k: "rechazado", t: "Rechazado", c: "susp" };
  if (ev && ev.cpaf != null) return { k: "evaluado", t: "Evaluado", c: "ok" };
  return { k: "completo", t: "Completo — sin evaluar", c: "act" };
}

function pintaPWL(r) {
  if (r.pwl == null) return `<span class="muted">${esc(r.motivo || "sin datos")}</span>`;
  const c = r.pwl >= 90 ? "ok" : r.pwl >= 60 ? "act" : "susp";
  return `<b class="z-${c}">${fmt(r.pwl, 1)} %</b>`;
}

function filaAQC(clave, cfg, r) {
  const lim = [cfg.lsl != null ? fmt(cfg.lsl, 1) : "—", cfg.usl != null ? fmt(cfg.usl, 1) : "—"].join(" – ");
  return `<tr>
    <td>${esc(cfg.n)}<div class="muted" style="font-size:11px">${esc(cfg.u)}${cfg.clase ? " · clase " + esc(cfg.clase) : ""}</div></td>
    <td class="n mono">${lim}</td>
    <td class="n mono">${r.n || 0}</td>
    <td class="n mono">${r.media != null ? fmt(r.media, 1) : "—"}</td>
    <td class="n mono">${r.s != null ? fmt(r.s, 2) : "—"}</td>
    <td class="n">${pintaPWL(r)}</td>
    <td class="n mono">${r.paf != null ? fmt(r.paf, 3) : "—"}</td>
    <td>${r.rechazado ? `<span class="badge susp">rechaza</span>` : ""}</td>
  </tr>`;
}

/* Hacia dónde va el lote — M7. Solo se enseña mientras quede algo por venir:
   en un lote cerrado las tres cifras son la misma y repetirla tres veces no
   informa, confunde. */
function panelProyeccion(l, cfgs) {
  const p = proyeccionDeLote(l, cfgs);
  if (p.cerrado || p.cpaf.ahora == null) return "";
  const cifra = (v, cl) => `<div class="proy-c ${cl}"><div class="lbl2">${cl === "ahora" ? "Con lo que hay"
    : cl === "techo" ? "Techo" : "Suelo"}</div><div class="v">${v == null ? "—" : fmt(v, 3)}</div></div>`;
  return `
    <div class="proyeccion">
      <div class="proy-cifras">
        ${cifra(p.cpaf.suelo, "suelo")}
        ${cifra(p.cpaf.ahora, "ahora")}
        ${cifra(p.cpaf.techo, "techo")}
      </div>
      <p class="muted proy-pie">
        ${p.sublotes} de ${p.sublotes + p.faltan} sub-lotes.
        <b>Techo</b> es lo máximo que puede pagar este lote si todo lo que falta sale clavado;
        <b>suelo</b>, si sale justo en el límite. No son predicciones: son los dos extremos.
      </p>
      ${p.aviso ? `<p class="proy-aviso ${p.aviso.grave ? "grave" : ""}">${esc(p.aviso.texto)}</p>` : ""}
    </div>`;
}

function panelLote(l, cfgs) {
  const ev = sp934EvaluarLote(l, cfgs);
  const est = estadoDeLote(l, ev);
  const porSub = Math.ceil(SP934_LOTE_M3 / SP934_SUBLOTE_M3);

  /* La tira de sub-lotes. Es el dato que más se mira: cuánto falta para
     cerrar el lote y por tanto para saber el factor de pago. */
  let tira = "";
  for (let i = 0; i < porSub; i++) {
    const s = l.sublotes[i];
    const lleno = s && s.m3 >= SP934_SUBLOTE_M3 * 0.98;
    tira += `<i class="${s ? (lleno ? "on" : "medio") : ""}" title="Sub-lote ${i + 1}${s ? ` · ${fmtVolumen(s.m3)} · ${s.ensayos.length} camión(es)` : " · vacío"}"></i>`;
  }

  return `<section class="panel lote">
    <div class="panel-head">
      <h2>Lote ${l.n}</h2>
      <span class="badge ${est.c}">${esc(est.t)}</span>
      <div class="spacer"></div>
      <span class="muted">${esc(fmtDate(l.desde))}${l.hasta !== l.desde ? " – " + esc(fmtDate(l.hasta)) : ""}</span>
    </div>
    <div class="panel-body">
      <div class="lote-cifras">
        <div><div class="label">Colocado</div><div class="value">${fmt(l.m3, 1)} <span>m³</span></div>
             <div class="muted">${fmt(l.cy, 1)} CY · ${l.ensayos.length} camiones</div></div>
        <div><div class="label">Sub-lotes</div><div class="value">${l.sublotes.length} <span>/ ${porSub}</span></div>
             <div class="lote-tira">${tira}</div></div>
        <div><div class="label">Factor compuesto</div>
             <div class="value ${ev.cpaf == null ? "muted" : ev.cpaf >= 1 ? "z-ok" : ev.cpaf >= 0.9 ? "z-act" : "z-susp"}">${ev.cpaf != null ? fmt(ev.cpaf, 3) : "—"}</div>
             <div class="muted">${cfgs.cp ? "0.45 / 0.45 / 0.10" : "0.90 / 0.10 · sin permeabilidad"}</div></div>
      </div>

      ${panelProyeccion(l, cfgs)}
      ${l.motivo && l.n > 1 ? `<p class="muted" style="margin:12px 0 0">Lote nuevo por: ${esc(l.motivo)}.</p>` : ""}

      <div class="lote-acciones">
        <button class="btn small" onclick="imprimirLote(${l.n})">Reporte de lote</button>
        <button class="btn small" onclick="verSorteo(${l.n})">Muestreo</button>
      </div>

      <div class="tabla-ancha" style="margin-top:14px">
        <table class="data">
          <thead><tr>
            <th>Característica</th><th class="n">Límites</th><th class="n">n</th>
            <th class="n">Media</th><th class="n">s</th><th class="n">PWL</th>
            <th class="n">Factor</th><th></th>
          </tr></thead>
          <tbody>
            ${Object.entries(cfgs).map(([k, cfg]) => filaAQC(k, cfg, ev.aqc[k] || { n: 0 })).join("")}
          </tbody>
        </table>
      </div>
      <p class="muted" style="margin:10px 0 0; font-size:12px">
        PWL por integración de la distribución beta (SP-934-7.05). Con menos de
        tres sub-lotes la norma no usa PWL sino la Tabla 934-11.
      </p>
    </div>
  </section>`;
}

/* El sorteo de muestreo vive en el expediente, no en la pantalla: tiene que
   sobrevivir a un cierre de sesión y viajar a los demás aparatos. Se hace UNA
   vez por lote y no se rehace — rehacerlo sería volver a tirar los dados hasta
   que salga el camión que conviene, que es exactamente lo que la 934 impide. */
function sorteoDelLote(n) {
  db.sp934 = db.sp934 || {};
  db.sp934.sorteos = db.sp934.sorteos || {};
  if (db.sp934.sorteos[n]) return db.sp934.sorteos[n];
  const quien = qcCuenta();
  const s = sortearMuestreo({
    proyecto: db.project.name, lote: n,
    cuando: new Date().toISOString(),
    quien: (quien && (quien.nombre || quien.usr)) || null,
  });
  db.sp934.sorteos[n] = s;
  saveDB();
  return s;
}

function imprimirLote(n) {
  const lotes = sp934Lotes(sortedTests().filter((t) => !t.rejected));
  const l = lotes.find((x) => x.n === n);
  if (!l) return;
  const caja = document.createElement("div");
  caja.id = "qc-impreso";
  caja.innerHTML = reporteDeLote(l, {
    limites: limitesDelProyecto(),
    sorteo: (db.sp934 && db.sp934.sorteos && db.sp934.sorteos[n]) || null,
    proyecto: db.project.name, contratista: db.project.contractor,
    qcFirm: db.project.qcFirm, esc, fmtDate,
  });
  document.body.appendChild(caja);
  document.body.classList.add("qc-imprimiendo");
  const quitar = () => {
    document.body.classList.remove("qc-imprimiendo");
    if (caja.parentNode) caja.parentNode.removeChild(caja);
  };
  addEventListener("afterprint", quitar, { once: true });
  setTimeout(quitar, 60000);
  print();
}

function verSorteo(n) {
  const lotes = sp934Lotes(sortedTests().filter((t) => !t.rejected));
  const l = lotes.find((x) => x.n === n);
  if (!l) return;
  const s = sorteoDelLote(n);
  const asignadas = muestrasDelSorteo(l, s);
  abrirFicha(`Muestreo del lote ${n}`, `
      <p class="muted">Sorteado el ${esc(s.cuando.slice(0, 16).replace("T", " "))}${s.quien ? " por " + esc(s.quien) : ""}.
      Semilla: <code>${esc(s.semilla)}</code>. Se puede rehacer y da lo mismo.</p>
      <div class="tabla-ancha"><table class="data"><thead><tr>
        <th class="n">Sub-lote</th><th class="n">Fracción</th><th>Camión</th><th>Estado</th>
      </tr></thead><tbody>
      ${asignadas.map((a) => `<tr>
        <td class="n mono">${a.sublote}</td>
        <td class="n mono">${fmt(a.fraccion * 100, 1)} %</td>
        <td>${a.ensayo ? "#" + a.ensayo.n + " · ticket " + esc(a.ensayo.ticket || "—") : "—"}</td>
        <td>${a.estado === "asignado" ? "asignado"
             : a.estado === "sin-hormigon" ? "sin hormigón todavía" : esc(a.estado)}</td>
      </tr>`).join("")}
      </tbody></table></div>`);
}

/* Una ficha de lectura, con las clases del diálogo de la casa para que no
   estrene un lenguaje visual propio. `abrirEleccion` no sirve aquí: aquello es
   para elegir entre opciones y esto es para leer. */
function abrirFicha(titulo, cuerpo) {
  if (document.getElementById("qcd")) return;
  const ov = document.createElement("div");
  ov.id = "qcd";
  ov.className = "qcd";
  ov.innerHTML = `<div class="qcd-caja qcd-ancha" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
      <div class="qcd-cab">
        <div><div class="qcd-k">${esc(titulo)}</div></div>
        <button class="qcd-x" type="button" aria-label="Cerrar">✕</button>
      </div>
      <div class="qcd-cuerpo">${cuerpo}</div>
    </div>`;
  const cerrar = () => ov.remove();
  ov.querySelector(".qcd-x").onclick = cerrar;
  ov.onclick = (e) => { if (e.target === ov) cerrar(); };
  addEventListener("keydown", function esc2(e) {
    if (e.key === "Escape") { cerrar(); removeEventListener("keydown", esc2); }
  });
  document.getElementById("modal-root").appendChild(ov);
}

function render() {
  const app = document.getElementById("app");

  if (!es934()) {
    app.innerHTML = `<section class="panel"><div class="panel-body">
      <p class="muted">Este proyecto no se acepta bajo la SP-934, así que no hay lotes que evaluar.</p>
      <p class="muted">Se enciende en <b>Plan &amp; Datos → Especificación de aceptación</b>.</p>
    </div></section>`;
    return;
  }

  const cfgs = limitesDelProyecto();
  const lotes = sp934Lotes(sortedTests().filter((t) => !t.rejected));

  if (!lotes.length) {
    app.innerHTML = `<section class="panel"><div class="panel-body">
      <p class="muted">Todavía no hay hormigón colocado bajo esta especificación.</p>
    </div></section>`;
    return;
  }

  const evaluados = lotes.map((l) => sp934EvaluarLote(l, cfgs));
  const conFactor = evaluados.filter((e) => e.cpaf != null);
  const medio = conFactor.length
    ? conFactor.reduce((a, e) => a + e.cpaf, 0) / conFactor.length : null;

  app.innerHTML = `
    <div class="grid cols-3" style="margin-bottom:16px">
      <div class="stat"><div class="label">Lotes</div>
        <div class="value">${lotes.length}</div>
        <div class="sub">${lotes.filter((l) => l.parcial).length} sin completar</div></div>
      <div class="stat"><div class="label">Hormigón evaluado</div>
        <div class="value">${fmt(lotes.reduce((a, l) => a + l.m3, 0), 0)} <span style="font-size:14px">m³</span></div>
        <div class="sub">${fmt(lotes.reduce((a, l) => a + l.cy, 0), 0)} CY</div></div>
      <div class="stat"><div class="label">Factor compuesto medio</div>
        <div class="value ${medio == null ? "" : medio >= 1 ? "z-ok" : medio >= 0.9 ? "z-act" : "z-susp"}">${medio != null ? fmt(medio, 3) : "—"}</div>
        <div class="sub">${evaluados.filter((e) => e.rechazado).length} lote(s) rechazado(s)</div></div>
    </div>
    ${lotes.map((l) => panelLote(l, cfgs)).join("")}`;
}

loadDB();
initTheme();
mountThemeToggle();
mountStatusBar();
enableLiveSync(() => render());
render();
</script>
