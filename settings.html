<style>
/* ============================================================
   SETTINGS — la pantalla de Rubén.

   Q-37, 6 ago 2026. Hasta hoy los límites del plan de control vivían
   dentro de «Plan & Datos», que es de admin, junto a la dirección del
   servidor, la llave del proyecto y el panel de la simulación. Rubén
   no entraba ahí a propósito —se decidió el 1 de agosto: quien usa la
   herramienta no ve cómo está montada— y eso dejaba un hueco raro:
   cuando el proyecto cambia un límite, el que lo sabe es él.

   Así que los límites salen de allí y se le dan en su propia pantalla,
   sin nada más al lado que se pueda tocar sin querer. Víctor lo pidió
   así hoy: «una pantalla que se llame Settings y ahí solo un tab de
   límites, pero luego pondremos más settings».

   POR ESO HAY PESTAÑAS CON UNA SOLA PESTAÑA. No es un descuido: la
   siguiente que entre se añade a `TABS` y ya. Si acaba habiendo una
   sola para siempre, quítalas.

   Lo que se cambie aquí queda firmado en el expediente como cualquier
   otro cambio —quién y cuándo—, así que un límite mal puesto se ve en
   el registro y se deshace. Eso es lo que hace que esto no sea el
   riesgo que era en agosto.
   ============================================================ */
main { max-width: 900px; margin: 0 auto; padding: 18px 16px 40px; }
.nota { margin-top: 16px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }

<main><div id="app"></div></main>

<script src="assets/sync.js?v=42223427"></script>

<script>
/* La nota va con el panel que explica, no con la pantalla: colgada del
   <main> se colaba debajo de todas las pestañas y le decía al lector de
   «Descartados» cómo se juzga un camión. Q-48. */
const NOTA_LIMITES = `
  <p class="nota">
    Estos números son con los que QCheck decide si un camión está en zona de acción o de
    suspensión, y son los mismos que salen en los reportes y los que el contrato le publica a
    la concretera. Cambiar uno cambia cómo se juzga <b>desde el próximo camión</b>: lo ya
    juzgado no se vuelve a juzgar. Cada cambio queda firmado con su autor y su hora.
  </p>`;
/* Las pestañas de Settings. Hoy dos; se añaden aquí. */
/* Los vaciados descartados viven aquí y en ningún otro sitio — Q-48.

   Es la pantalla del ingeniero de récord, que es quien los descarta y el
   único que puede devolverlos. Y tiene que existir una puerta de vuelta:
   un descarte sin marcha atrás sería un borrado con otro nombre. */
/* Las obras que hay y cuál está abierta. Rubén no las crea —eso es de quien
   lleva el contrato— pero tiene que poder cambiar de una a otra: el sábado
   vuelve a la PR-52 y mañana está en los puentes. */
function panelObras() {
  const filas = (db.proyectos || []).map((p) => {
    const n = (db.tests || []).filter((t) => (t.proyecto || "pr-52") === p.id && !t.borrado).length;
    const abierta = p.id === db.proyectoActivo;
    return `<tr>
      <td>${abierta ? "<b>" + esc(p.name || p.id) + "</b>" : esc(p.name || p.id)}</td>
      <td class="num mono">${n}</td>
      <td class="num">${abierta ? '<span class="muted">abierta</span>'
        : `<button class="btn sm" onclick="if (abrirProyecto('${esc(p.id)}')) render()">Abrir</button>`}</td>
    </tr>`;
  }).join("");
  /* Q-62, 10 ago 2026 · Víctor: «en el tiro live todo comienza con Rubén
     creando el proyecto».

     Así que abrir una obra deja de ser cosa de Plan & Datos y pasa a ser un
     acto del ingeniero de récord, como declarar los límites con los que se va
     a juzgar. Va por `qcFirma()`: el técnico ve las obras y cambia entre
     ellas, pero no abre ninguna. */
  const puedeAbrir = typeof qcFirma !== "function" || qcFirma();
  return `<section class="panel"><div class="panel-head"><h2>Obras</h2><div class="spacer"></div>${
    puedeAbrir ? `<button class="btn small" onclick="formObras()">Abrir obra nueva</button>` : ""}</div>
    <div class="panel-body flush"><div class="table-wrap"><table class="data">
      <tr><th>Obra</th><th class="num">Ensayos</th><th class="num"></th></tr>
      ${filas}
    </table></div></div>
    <div class="panel-body"><p class="muted" style="font-size:13px;margin:0">
      Cambiar de obra no mueve un solo dato: cada ensayo queda sellado con la suya.
    </p></div></section>`;
}

function panelDescartados() {
  const filas = Object.entries(db.dayMeta || {})
    .filter(([, m]) => m && m.borrado)
    .sort((a, b) => (a[0] < b[0] ? 1 : -1));

  if (!filas.length) {
    return `<section class="panel"><div class="panel-head"><h2>Vaciados descartados</h2></div><div class="panel-body">
      <p class="muted">Ninguno. Todo lo que hay en el expediente cuenta.</p></div></section>`;
  }

  return `<section class="panel"><div class="panel-head"><h2>Vaciados descartados</h2></div><div class="panel-body">
    <p class="muted">Siguen en el archivo y no cuentan en ningún reporte.
    Devolverlos los hace contar otra vez.</p>
    <div class="tabla-ancha"><table class="data descartados"><thead><tr>
      <th>Día</th><th>Motivo</th><th>Descartado por</th><th></th>
    </tr></thead><tbody>
    ${filas.map(([d, m]) => `<tr>
      <td>${esc(fmtDate(d))}</td>
      <td>${esc(m.borradoMotivo || "—")}</td>
      <td>${esc(m.borradoPor || "—")}${m.borradoA ? ` · ${esc(fmtDate(String(m.borradoA).slice(0, 10)))}` : ""}</td>
      <td><button class="btn sm" onclick="if (restaurarTiro('${esc(d)}')) render()">Devolver</button></td>
    </tr>`).join("")}
    </tbody></table></div></div></section>`;
}

/* Q-61, 10 ago 2026: la 934 y las obras entran aquí porque es la pantalla que
   tiene Rubén. `config` —Plan & Datos— es la sala de máquinas y no es suya.

   La pestaña de la 934 solo aparece si la obra se acepta bajo la 934: un
   técnico que trabaja en control de proceso no tiene por qué ver tablas de una
   norma que no le rige. */
/* FUNCIÓN Y NO CONSTANTE, y costó una pantalla en blanco. Se construía al
   cargar el archivo —antes de `loadDB()`—, así que `db` todavía no existía y
   preguntarle por las obras o por la 934 reventaba: Settings salía vacía.

   Y además tiene que recalcularse: al cambiar de obra, las pestañas cambian. */
function tabs() {
  return [
    { id: "limites", n: "Límites", pinta: () => panelLimites(true) + NOTA_LIMITES },
    ...(typeof es934 === "function" && es934()
      ? [{ id: "sp934", n: "SP-934", pinta: () => panelSP934(true) }] : []),
    ...(((db && db.proyectos) || []).length > 1 || (typeof qcFirma === "function" && qcFirma())
      ? [{ id: "obras", n: "Obras", pinta: () => panelObras() }] : []),
    { id: "descartados", n: "Descartados", pinta: () => panelDescartados() },
  ];
}
let cual = "limites";

/* Se llama `render` a propósito y no `pintar`: es el nombre que busca
   `formPlan()` en core.js para repintar después de guardar, el mismo que usa
   Results. Cambiarlo deja el editor guardando sin que se vea el cambio. */
function render() {
  const T = tabs();
  const t = T.find((x) => x.id === cual) || T[0];
  cual = t.id;                       // si la pestaña abierta ya no existe, no deja la pantalla vacía
  document.getElementById("app").innerHTML = t.pinta();
  document.getElementById("tabs-settings").innerHTML =
    T.map((x) => `<button class="${x.id === cual ? "active" : ""}" onclick="cual='${x.id}'; render()">${x.n}</button>`).join("");
}

loadDB();
initTheme();
mountThemeToggle();
enableLiveSync(() => render());
render();
mountStatusBar();
</script>
