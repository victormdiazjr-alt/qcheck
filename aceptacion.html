/* ============================================================
   SETTINGS — la pantalla de Rubén.

   Q-37, 6 ago 2026. Hasta hoy los límites del plan de control vivían
   dentro de «Plan & Datos», que es de admin, junto a la dirección del
   servidor, la llave del proyecto y el panel de la simulación. Rubén
   no entraba ahí a propósito —se decidió el 1 de agosto: quien usa la
   herramienta no ve cómo está montada— y eso dejaba un hueco raro:
   cuando el proyecto cambia un límite, el que lo sabe es él.

   Así que los límites salen de allí y se le dan en su propia pantalla,
   sin nada más al lado que se pueda tocar sin querer. Víctor lo pidió
   así hoy: «una pantalla que se llame Settings y ahí solo un tab de
   límites, pero luego pondremos más settings».

   POR ESO HAY PESTAÑAS CON UNA SOLA PESTAÑA. No es un descuido: la
   siguiente que entre se añade a `TABS` y ya. Si acaba habiendo una
   sola para siempre, quítalas.

   Lo que se cambie aquí queda firmado en el expediente como cualquier
   otro cambio —quién y cuándo—, así que un límite mal puesto se ve en
   el registro y se deshace. Eso es lo que hace que esto no sea el
   riesgo que era en agosto.
   ============================================================ */

<script>
/* ══════════════════════════════════════════════════════════════════════════
   ACEPTACIÓN — la pantalla de la Autoridad. Q-65, 8 de agosto de 2026.

   Es una pantalla de **decidir**, no de operar. Quien entra aquí no muestrea,
   no programa vaciados y no corrige datos: mira un lote, ve de dónde sale cada
   número, y lo acepta o lo rechaza.

   Por eso no se parece a la de lotes aunque enseñe lo mismo. Allí el ingeniero
   vigila cómo va llenándose; aquí se cierra un expediente y se firma. Meter
   botones de operación en esta pantalla sería invitar a la Autoridad a hacer
   trabajo que no es suyo, y a asumir una responsabilidad que tampoco.

   Solo se enseñan lotes **completos**: uno a medias no se acepta ni se
   rechaza, se espera.
   ══════════════════════════════════════════════════════════════════════════ */

function limitesDelProyecto() {
  const clase = (db.project || {}).claseHormigon || "III";
  const ccs = SP934_CCS[clase] || SP934_CCS.III;
  const edad = Number(((db.plan || {}).cs || {}).age);
  const campo = edad === 1 ? "cs1" : edad === 5 ? "cs5" : edad === 56 ? "cs56" : "cs28";
  const cuw = sp934LimitesCUW((db.plan && db.plan.uw && db.plan.uw.target) || null);
  const nivel = (db.project || {}).nivelPermeabilidad;
  const s = {
    ccs: { campo, lsl: ccs.lsl, usl: ccs.usl, n: "Resistencia", u: `psi a ${edad || 28} días`, clase },
    cuw: { campo: "uw", lsl: cuw.lsl, usl: cuw.usl, n: "Unit Weight", u: "pcf" },
  };
  if (nivel && SP934_CP_USL[String(nivel)] != null)
    s.cp = { campo: "cp", lsl: null, usl: SP934_CP_USL[String(nivel)], n: "Permeabilidad", u: "coulombs" };
  return s;
}

/* La decisión vive en el expediente y lleva quién y cuándo, como todo lo que
   se firma en QCheck. No se borra: si se cambia de opinión, se registra la
   nueva decisión encima y las dos quedan en el registro de cambios. */
function decidir(nLote, veredicto) {
  const quien = qcCuenta();
  const motivo = veredicto === "rechazado"
    ? prompt("Motivo del rechazo. Queda en el expediente y se le enseña al contratista.")
    : (prompt("Nota de la aceptación (opcional).") || null);
  if (veredicto === "rechazado" && (motivo == null || !String(motivo).trim())) return;

  db.sp934 = db.sp934 || {};
  db.sp934.decisiones = db.sp934.decisiones || {};
  db.sp934.decisiones[nLote] = {
    veredicto, motivo: motivo ? String(motivo).trim() : null,
    cuando: new Date().toISOString(),
    quien: (quien && (quien.nombre || quien.usr)) || "?",
  };
  saveDB();
  render();
  toast(veredicto === "rechazado" ? `Lote ${nLote} rechazado` : `Lote ${nLote} aceptado`);
}

function panelAceptacion(l, cfgs) {
  const ev = sp934EvaluarLote(l, cfgs);
  const d = ((db.sp934 || {}).decisiones || {})[l.n];
  const s = ((db.sp934 || {}).sorteos || {})[l.n];

  const fila = (k, r) => {
    const cfg = cfgs[k] || {};
    return `<tr>
      <td>${esc(cfg.n || k)}</td>
      <td class="n mono">${r.n || 0}</td>
      <td class="n mono">${r.media != null ? fmt(r.media, 1) : "—"}</td>
      <td class="n">${r.pwl == null ? `<span class="muted">${esc(r.motivo || "—")}</span>`
        : `<b class="z-${r.pwl >= 90 ? "ok" : r.pwl >= 60 ? "act" : "susp"}">${fmt(r.pwl, 1)} %</b>`}</td>
      <td class="n mono">${r.paf != null ? fmt(r.paf, 3) : "—"}</td>
    </tr>`;
  };

  return `<section class="panel acepta">
    <div class="panel-head">
      <h2>Lote ${l.n}</h2>
      ${d ? `<span class="badge ${d.veredicto === "aceptado" ? "ok" : "susp"}">${d.veredicto === "aceptado" ? "Aceptado" : "Rechazado"}</span>` : ""}
      <div class="spacer"></div>
      <span class="muted">${esc(fmtDate(l.desde))}${l.hasta !== l.desde ? " – " + esc(fmtDate(l.hasta)) : ""}</span>
    </div>
    <div class="panel-body">
      <div class="acepta-cifras">
        <div><div class="label">Hormigón</div><div class="value">${fmtVolumen(l.m3)}</div></div>
        <div><div class="label">Sub-lotes</div><div class="value">${l.sublotes.length} / 10</div></div>
        <div><div class="label">Factor compuesto</div>
             <div class="value ${ev.cpaf == null ? "" : ev.cpaf >= 1 ? "z-ok" : ev.cpaf >= 0.9 ? "z-act" : "z-susp"}">${ev.cpaf != null ? fmt(ev.cpaf, 3) : "—"}</div></div>
      </div>

      <div class="tabla-ancha" style="margin-top:12px">
        <table class="data"><thead><tr>
          <th>Característica</th><th class="n">n</th><th class="n">Media</th>
          <th class="n">PWL</th><th class="n">Factor</th>
        </tr></thead><tbody>
          ${Object.keys(cfgs).map((k) => fila(k, ev.aqc[k] || { n: 0 })).join("")}
        </tbody></table>
      </div>

      <p class="muted acepta-pie">
        ${s ? `Muestreo sorteado el ${esc(s.cuando.slice(0, 10))}, semilla <code>${esc(s.semilla)}</code>. Reproducible.`
            : "Sin constancia de sorteo de muestreo."}
      </p>

      ${d ? `<div class="acepta-decision">
          <b>${d.veredicto === "aceptado" ? "Aceptado" : "Rechazado"}</b> por ${esc(d.quien)}
          el ${esc(d.cuando.slice(0, 10))}.
          ${d.motivo ? `<div class="muted">${esc(d.motivo)}</div>` : ""}
        </div>`
        : `<div class="acepta-botones">
             <button class="btn small" onclick="verReporte(${l.n})">Ver el cálculo completo</button>
             <button class="btn small ok" onclick="decidir(${l.n}, 'aceptado')">Aceptar lote</button>
             <button class="btn small danger" onclick="decidir(${l.n}, 'rechazado')">Rechazar</button>
           </div>`}
    </div>
  </section>`;
}

function verReporte(n) {
  const l = sp934Lotes(sortedTests().filter((t) => !t.rejected)).find((x) => x.n === n);
  if (!l) return;
  const caja = document.createElement("div");
  caja.id = "qc-impreso";
  caja.innerHTML = reporteDeLote(l, {
    limites: limitesDelProyecto(),
    sorteo: ((db.sp934 || {}).sorteos || {})[n] || null,
    proyecto: db.project.name, contratista: db.project.contractor,
    qcFirm: db.project.qcFirm, esc, fmtDate,
  });
  document.body.appendChild(caja);
  document.body.classList.add("qc-imprimiendo");
  const quitar = () => {
    document.body.classList.remove("qc-imprimiendo");
    if (caja.parentNode) caja.parentNode.removeChild(caja);
  };
  addEventListener("afterprint", quitar, { once: true });
  setTimeout(quitar, 60000);
  print();
}

function render() {
  const app = document.getElementById("app");
  if (!es934()) {
    app.innerHTML = `<section class="panel"><div class="panel-body">
      <p class="muted">Este proyecto no se acepta bajo la SP-934.</p></div></section>`;
    return;
  }
  const cfgs = limitesDelProyecto();
  /* Solo lotes completos: uno a medias no se acepta ni se rechaza, se espera. */
  const lotes = sp934Lotes(sortedTests().filter((t) => !t.rejected)).filter((l) => !l.parcial);
  const abiertos = sp934Lotes(sortedTests().filter((t) => !t.rejected)).filter((l) => l.parcial).length;

  if (!lotes.length) {
    app.innerHTML = `<section class="panel"><div class="panel-body">
      <p class="muted">No hay ningún lote completo todavía.${abiertos ? ` Hay ${abiertos} en curso.` : ""}</p>
      <p class="muted">Un lote se evalúa cuando se cierra: con menos sub-lotes de los que pide la norma, el resultado cambiaría con cada camión.</p>
    </div></section>`;
    return;
  }

  const dec = (db.sp934 || {}).decisiones || {};
  const pend = lotes.filter((l) => !dec[l.n]).length;
  app.innerHTML = `
    <div class="grid cols-3" style="margin-bottom:16px">
      <div class="stat"><div class="label">Lotes completos</div><div class="value">${lotes.length}</div>
        <div class="sub">${abiertos} en curso</div></div>
      <div class="stat"><div class="label">Sin decidir</div><div class="value">${pend}</div>
        <div class="sub">esperan aceptación</div></div>
      <div class="stat"><div class="label">Rechazados</div>
        <div class="value">${Object.values(dec).filter((d) => d.veredicto === "rechazado").length}</div>
        <div class="sub">de ${Object.keys(dec).length} decididos</div></div>
    </div>
    ${lotes.map((l) => panelAceptacion(l, cfgs)).join("")}`;
}

loadDB();
initTheme();
mountThemeToggle();
mountStatusBar();
enableLiveSync(() => render());
render();
</script>
