<script>
"use strict";
const state = { day: null };

/* ---------- custom SVG: cumulative CY over the day ---------- */
function cumChart(rows) {
  const pts = rows.filter((t) => (t.end || t.start || t.arrive) && num(t.vol) != null)
    .map((t) => ({ time: t.end || t.start || t.arrive, vol: num(t.vol), truck: t.truck, ticket: t.ticket, rejected: t.rejected }));
  if (pts.length < 2) return `<div class="empty">Datos de tiempo insuficientes.</div>`;
  const toMin = (hm) => { const [h, m] = hm.split(":").map(Number); return h * 60 + m; };
  pts.sort((a, b) => toMin(a.time) - toMin(b.time));
  let acc = 0;
  const series = pts.map((p) => ({ ...p, min: toMin(p.time), acc: (acc += p.rejected ? 0 : p.vol) }));
  const W = 860, H = 260, ML = 52, MR = 16, MT = 14, MB = 30;
  const x0 = series[0].min - 10, x1 = series[series.length - 1].min + 10;
  const yMax = Math.max(acc, 10) * 1.08;
  const X = (m) => ML + (m - x0) / (x1 - x0) * (W - ML - MR);
  const Y = (v) => MT + (1 - v / yMax) * (H - MT - MB);
  let g = "";
  for (let v = 0; v <= yMax; v += 50) {
    g += `<line x1="${ML}" x2="${W - MR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--chart-grid, #e3e9ef)"/>`;
    g += `<text x="${ML - 6}" y="${Y(v) + 3}" text-anchor="end" font-size="10" fill="var(--chart-text, #5a6b7c)">${v}</text>`;
  }
  for (let m = Math.ceil(x0 / 60) * 60; m <= x1; m += 60)
    g += `<text x="${X(m)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="var(--chart-text, #5a6b7c)">${String(Math.floor(m / 60)).padStart(2, "0")}:00</text>`;
  // step area
  let path = `M ${X(series[0].min)} ${Y(0)}`;
  let prevAcc = 0;
  for (const p of series) { path += ` L ${X(p.min)} ${Y(prevAcc)} L ${X(p.min)} ${Y(p.acc)}`; prevAcc = p.acc; }
  g += `<path d="${path} L ${X(series[series.length - 1].min)} ${Y(0)} Z" fill="rgba(15,109,180,.15)"/>`;
  g += `<path d="${path}" fill="none" stroke="#0f6db4" stroke-width="2.2"/>`;
  for (const p of series) {
    g += p.rejected
      ? `<g><title>RECHAZADO · camión ${esc(p.truck)} · ${esc(p.time)}</title><path d="M${X(p.min) - 4},${Y(p.acc) - 4} l8,8 M${X(p.min) + 4},${Y(p.acc) - 4} l-8,8" stroke="#c5221f" stroke-width="2.2"/></g>`
      : `<circle cx="${X(p.min)}" cy="${Y(p.acc)}" r="3.6" fill="#0f6db4" stroke="#fff" stroke-width="1.2"><title>${esc(p.time)} · camión ${esc(p.truck || "—")} · ticket ${esc(p.ticket || "—")} · acumulado ${fmt(p.acc, 1)} CY</title></circle>`;
  }
  /* Capa de lectura (Q-35). Los camiones no caen a intervalos regulares, así
     que cada uno se queda con la mitad del hueco hasta su vecino: se apunta
     al camión que se está mirando, no al que cae más cerca del píxel. */
  g += pistaCursor(MT, H - MB);
  series.forEach((q, i) => {
    const xa = i === 0 ? ML : (X(series[i - 1].min) + X(q.min)) / 2;
    const xb = i === series.length - 1 ? W - MR : (X(q.min) + X(series[i + 1].min)) / 2;
    g += pistaPunto({
      x: xa, y: MT, w: Math.max(1, xb - xa), alto: H - MT - MB,
      cx: X(q.min), cy: Y(q.acc),
      valor: fmt(q.acc, 1) + " CY",
      detalle: `${q.time} · camión ${q.truck || "—"} · ticket ${q.ticket || "—"}`,
      estado: q.rejected ? "Rechazado · no suma al acumulado" : "",
    });
  });

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; max-width:${W}px; display:block" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

/* OJO CON LOS <title> DE ESTOS SVG. Van dentro de una plantilla y llevan
   datos que teclea una persona: número de camión y de ticket. Sin `esc()`, un
   camión llamado `A<b>X` parte el SVG y se lleva por delante el punto
   siguiente — probado el 6 ago 2026: doce elementos colados dentro del gráfico
   y dos títulos fusionados en uno. `verificar.js` lo vigila desde entonces.

   ---------- custom SVG: per-truck cycle bars ---------- */
function cycleChart(rows, tope) {
  const items = rows.map((t, i) => ({
    load: i + 1, truck: t.truck, ticket: t.ticket,
    cycle: cicloCamion(t, tope),
    wait: minutesBetween(t.arrive, t.start),
    rejected: t.rejected,
  })).filter((x) => x.cycle != null);
  if (!items.length) return `<div class="empty">Sin tiempos batch→termina.</div>`;
  const W = 860, H = 240, ML = 40, MR = 14, MT = 12, MB = 26;
  const bw = Math.min(44, (W - ML - MR) / items.length - 6);
  const yMax = Math.max(db.plan.maxElapsedMin + 15, ...items.map((x) => x.cycle)) * 1.06;
  const X = (i) => ML + i * ((W - ML - MR) / items.length) + ((W - ML - MR) / items.length - bw) / 2;
  const Y = (v) => MT + (1 - v / yMax) * (H - MT - MB);
  let g = "";
  for (let v = 0; v <= yMax; v += 30) {
    g += `<line x1="${ML}" x2="${W - MR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--chart-grid, #e3e9ef)"/>`;
    g += `<text x="${ML - 5}" y="${Y(v) + 3}" text-anchor="end" font-size="10" fill="var(--chart-text, #5a6b7c)">${v}</text>`;
  }
  g += `<line x1="${ML}" x2="${W - MR}" y1="${Y(db.plan.maxElapsedMin)}" y2="${Y(db.plan.maxElapsedMin)}" stroke="#c5221f" stroke-dasharray="6 4" stroke-width="1.6"/>`;
  g += `<text x="${W - MR}" y="${Y(db.plan.maxElapsedMin) - 5}" text-anchor="end" font-size="10.5" font-weight="700" fill="#c5221f">límite ${db.plan.maxElapsedMin} min</text>`;
  items.forEach((x, i) => {
    const over = x.cycle > db.plan.maxElapsedMin;
    const col = x.rejected ? "#c5221f" : over ? "var(--accent2)" : "#2c7fb8";
    g += `<rect x="${X(i)}" y="${Y(x.cycle)}" width="${bw}" height="${Y(0) - Y(x.cycle)}" rx="3" fill="${col}">
      <title>Carga ${x.load} · camión ${esc(x.truck || "—")} · batch→termina ${x.cycle} min${x.wait != null ? " · espera " + x.wait + " min" : ""}${x.rejected ? " · RECHAZADO" : ""}</title></rect>`;
    if (x.wait != null)
      g += `<rect x="${X(i)}" y="${Y(x.wait)}" width="${bw}" height="${Y(0) - Y(x.wait)}" rx="3" fill="var(--chart-wait, rgba(18,44,66,.35))"/>`;
    g += `<text x="${X(i) + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="9.5" fill="var(--chart-text, #5a6b7c)">${esc(x.truck || x.load)}</text>`;
  });

  /* Capa de lectura (Q-35): responde la columna entera, no solo la barra.
     Una carga rápida deja una barra de dos centímetros y apuntarle con el
     dedo en el iPad es imposible. */
  g += pistaCursor(MT, H - MB);
  const paso = (W - ML - MR) / items.length;
  items.forEach((x, i) => {
    g += pistaPunto({
      x: ML + i * paso, y: MT, w: paso, alto: H - MT - MB,
      cx: X(i) + bw / 2, cy: Y(x.cycle),
      valor: x.cycle + " min",
      detalle: `Carga ${x.load} · camión ${x.truck || "—"} · ticket ${x.ticket || "—"}` +
               (x.wait != null ? ` · espera ${x.wait} min` : ""),
      estado: x.rejected ? "Rechazado"
        : x.cycle > db.plan.maxElapsedMin ? `Pasa del límite de ${db.plan.maxElapsedMin} min` : "",
    });
  });

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; max-width:${W}px; display:block" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

function kpi(label, value, sub, cls = "") {
  return `<div class="stat kpi ${cls}"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`;
}

/* El aire, en la cabecera de su carta — Q-09.

   Era la única de las cuatro propiedades del hormigón fresco que este tablero
   no enseñaba, y justamente es la que la planta controla con el aditivo: al
   concretero le sirve más que a nadie. El contrato ya le publica los límites a
   la concretera (`shared/conduce-contract.js`), así que no enseñárselos aquí
   era un hueco raro.

   Sale de `estadisticasDia()`, el mismo motor que juzga las zonas en el resto
   de las pantallas. **No calcula nada por su cuenta**: si un número de aquí no
   cuadrara con el del reporte, sería un fallo.

   Sin lecturas dice que no las hay. No se rellena con un cero, que se leería
   como «aire cero por ciento» — un hormigón sin aire incorporado, que es un
   dato clínico, no un hueco. */
function resumenAire(day) {
  const a = estadisticasDia(day).find((p) => p.k === "air");
  if (!a || !a.est) return "sin lecturas de aire";
  const p = db.plan.air;
  const fuera = a.accion + a.susp;
  return `${a.est.n} lectura${a.est.n === 1 ? "" : "s"} · media ${fmt(a.est.media, 1)} %`
    + ` · acción ${p.actLo}–${p.actHi} %`
    + (fuera ? ` · ${fuera} fuera` : "");
}

function render() {
  const days = diasDelProyecto();
  if (!state.day || !days.includes(state.day)) state.day = days[0];
  if (typeof pintarTiro === "function") pintarTiro(state.day);   // el tiro sube en vivo
  const sel = document.getElementById("day-sel");
  sel.innerHTML = days.map((d) => `<option value="${d}" ${d === state.day ? "selected" : ""}>${fmtDate(d)}</option>`).join("");
  const s = dayStats(state.day);
  const meta = db.dayMeta[state.day] || {};
  // Privacidad: la concretera no ve informacion del proyecto (Ruben, 30 jul)
  document.getElementById("hero-sub").textContent =
    "Cliente: " + (db.project.contractor || "—") + " · " + fmtDate(state.day);
  /* la concretera que surtió hoy sale con su marca */
  const cia = [...new Set(testsOfDate(state.day).map((t) => t.company).filter(Boolean))];
  const elm = document.getElementById("hero-eyebrow");
  if (elm) elm.innerHTML = marcaHTML("concretera", cia[0] || "Concretera") +
    `<span class="mp-nombre">${esc(cia.join(" · ") || "Concretera")}</span>`;

  const onSite = s.rows.filter((t) => t.arrive && !t.end && !t.rejected);
  /* El mismo tope que usa dayStats: un ciclo más largo que el día entero es un
     registro mal transcrito, no un camión lento. Ver `cicloCamion()`. */
  const tope = s.hours != null ? Math.round(s.hours * 60) : null;
  const over90 = s.rows.filter((t) => { const el = cicloCamion(t, tope); return el != null && el > db.plan.maxElapsedMin; }).length;

  // last 7 pour days summary
  const week = days.slice(0, 7).map((d) => ({ d, s: dayStats(d) }));

  document.getElementById("content").innerHTML = `
    <div class="wgrid">
      ${kpi("Volumen colocado", fmt(s.cy, 1) + " <span style='font-size:14px'>CY</span>", s.loads + (s.loads === 1 ? " camión · " : " camiones · ") + fmtDate(state.day))}
      ${kpi("Ritmo", s.cyPerHr ? fmt(s.cyPerHr, 1) + " <span style='font-size:14px'>CY/hr</span>" : "—",
        s.loadsPerHr ? fmt(s.loadsPerHr, 1) + " camiones/hr · " + (s.firstStart || "") + "–" + (s.lastEnd || "") : "sin tiempos")}
      ${kpi("Ciclo batch→descarga", s.avgCycle ? fmt(s.avgCycle, 0) + " <span style='font-size:14px'>min</span>" : "—",
        "máx " + (s.maxCycle ?? "—") + " min · límite " + db.plan.maxElapsedMin, over90 ? "alert" : "good")}
      ${kpi("Espera en sitio", s.avgWait ? fmt(s.avgWait, 0) + " <span style='font-size:14px'>min</span>" : "—",
        "llegada → comienza vaciado", s.avgWait > 30 ? "alert" : "")}
    </div>
    <div class="wgrid">
      ${kpi("Camiones en sitio", onSite.length, onSite.length ? onSite.map((t) => t.truck || t.ticket).join(", ") : "ninguno descargando", onSite.length ? "good" : "")}
      ${kpi("Rechazados", s.rejected, s.rejected ? "revisar causas" : "0 hoy", s.rejected ? "alert" : "good")}
      ${kpi("Sobre 90 min", over90, "batch → fin de descarga", over90 ? "alert" : "good")}
      ${kpi("Duración del vaciado", s.hours ? fmt(s.hours, 1) + " <span style='font-size:14px'>hr</span>" : "—", (s.firstStart || "—") + " a " + (s.lastEnd || "—"))}
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Yardas acumuladas durante el día</h2></div>
      <div class="panel-body">${cumChart(s.rows)}</div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Ciclo por camión (batch → termina descarga)</h2>
        <span class="muted" style="font-size:12px">barra oscura interior = espera llegada→comienza</span></div>
      <div class="panel-body">${cycleChart(s.rows, tope)}</div>
    </div>

    <!-- Tres cartas y no dos: el Aire entró con Q-09. Va en medio, en el mismo
         orden que CHART_DEFS, y su cabecera lleva los límites porque son los que
         el contrato ya le publica a la concretera. La clase cols-3 baja sola a
         dos columnas en 640 px y a una en 560 px: en el teléfono no aprieta.
         (Sin acentos graves aquí dentro — esto vive en una plantilla. AGENTS §1b.) -->
    <div class="grid cols-3">
      <div class="panel">
        <div class="panel-head"><h2>Control del día — Slump</h2><div class="spacer"></div><span class="muted" style="font-size:12px">${trendLabel(state.day, "slump")}</span></div>
        <div class="panel-body"><div class="chart-scroll">${chartForDay(CHART_DEFS[0], state.day, 24)}</div></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Control del día — Aire</h2><div class="spacer"></div><span class="muted" style="font-size:12px">${resumenAire(state.day)}</span></div>
        <div class="panel-body"><div class="chart-scroll">${chartForDay(CHART_DEFS[1], state.day, 24)}</div></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Control del día — Unit Weight</h2><div class="spacer"></div><span class="muted" style="font-size:12px">${trendLabel(state.day, "uw")}</span></div>
        <div class="panel-body"><div class="chart-scroll">${chartForDay(CHART_DEFS[2], state.day, 24)}</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Últimos ${week.length} días de vaciado</h2></div>
      <div class="panel-body flush"><div class="table-wrap"><table class="data">
        <tr><th>Fecha</th><th class="num">Camiones</th><th class="num">CY</th><th class="num">CY/hr</th>
            <th class="num">Ciclo prom (min)</th><th class="num">Espera prom (min)</th><th class="num">Rechazados</th></tr>
        ${week.map((w) => `<tr class="clickable" onclick="state.day='${w.d}'; render(); window.scrollTo({top:0,behavior:'smooth'})">
          <td><b>${fmtDate(w.d)}</b></td>
          <td class="num mono">${w.s.loads}</td>
          <td class="num mono">${fmt(w.s.cy, 1)}</td>
          <td class="num mono">${w.s.cyPerHr ? fmt(w.s.cyPerHr, 1) : "—"}</td>
          <td class="num mono">${w.s.avgCycle ? fmt(w.s.avgCycle, 0) : "—"}</td>
          <td class="num mono">${w.s.avgWait ? fmt(w.s.avgWait, 0) : "—"}</td>
          <td class="num mono" style="${w.s.rejected ? "color:var(--susp); font-weight:700" : ""}">${w.s.rejected}</td>
        </tr>`).join("")}
      </table></div></div>
    </div>`;
}

loadDB();
initTheme();
mountThemeToggle();
mountStatusBar();
enableLiveSync(render);
render();
</script>
