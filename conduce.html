<style>
/* Conduce entry — field data-entry person. Mobile-first, glove-friendly. */
body { background: var(--bg); }
.entry-hero {
  background: linear-gradient(135deg, #122c42 0%, #0f6db4 100%);
  color: #fff; border-radius: 14px; padding: 18px 20px; margin-bottom: 16px;
  box-shadow: 0 6px 24px rgba(15,40,70,.25);
}
.entry-hero h1 { margin: 0 0 2px; font-size: 21px; }
.entry-hero .sub { color: #bcd4e8; font-size: 13px; }
.capture-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 640px) { .capture-row { grid-template-columns: 1fr; } }
.cap-btn {
  display: flex; align-items: center; justify-content: center; gap: 11px;
  border: 1px solid var(--line); border-radius: 14px;
  background: linear-gradient(168deg, var(--panel-2), var(--panel));
  padding: 16px 14px; cursor: pointer; font-family: inherit; color: var(--ink);
  box-shadow: var(--shadow);
  transition: border-color .18s, box-shadow .18s, transform .16s;
}
/* el color entra por el resplandor, como en el resto de la interfaz */
.cap-btn:hover {
  border-color: rgba(74,99,216,.55); transform: translateY(-1px);
  box-shadow: 0 0 0 3px rgba(74,99,216,.10), 0 0 20px -6px rgba(74,99,216,.9);
}
.cap-btn:active { transform: scale(.985); }
.cap-btn .ico { width: 26px; height: 26px; flex: none; fill: none; stroke: var(--accent2);
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.cap-btn .ico .ic-linea { stroke: var(--accent); }
.cap-btn .t { font-weight: 700; font-size: 15px; letter-spacing: -.005em; }
.big-form .field input { padding: 13px 12px; font-size: 18px; font-weight: 600; }
.big-form .field label { font-size: 11.5px; }
.now-btn {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px;
  font-size: 12px; font-weight: 700; padding: 4px 10px; cursor: pointer; margin-top: 4px;
}
.now-btn:hover { background: var(--hover); }
.truck-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.truck-row .tno { font-size: 22px; font-weight: 900; min-width: 56px; }
.truck-row .tinfo { min-width: 130px; flex: 1 1 130px; }
@media (max-width: 520px) { .truck-row .tinfo { min-width: 0; } .truck-row { padding: 12px 12px; } }
.truck-row .meta { font-size: 12.5px; color: var(--ink-soft); }
.tstep {
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  font-size: 12.5px; font-weight: 700; padding: 8px 12px; cursor: pointer;
}
.tstep:hover { background: var(--hover); }
.tstep.done { background: var(--ok-bg); color: var(--ok); border-color: #bfe3cb; cursor: default; }
#video-wrap { position: relative; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 14px; display: none; }
#video-wrap video { width: 100%; display: block; max-height: 46vh; object-fit: cover; }
#video-wrap .scan-frame {
  position: absolute; inset: 12% 18%; border: 3px solid rgba(255,255,255,.85); border-radius: 14px;
  box-shadow: 0 0 0 2000px rgba(0,0,0,.35);
}
#video-wrap .close-scan { position: absolute; top: 10px; right: 10px; }
.photo-chip { height: 42px; border-radius: 6px; border: 1px solid var(--line); }
/* El campo que falta se señala donde está el dedo, no solo en el aviso de
   abajo: el resplandor, nunca el relleno (AGENTS.md §10). */
.field input.falta {
  border-color: var(--susp);
  box-shadow: 0 0 0 3px rgba(255,90,82,.16), 0 0 20px -6px var(--susp);
}
/* La pista del reparto (Q-11). Gris cuando solo informa, ámbar cuando el
   reparto declarado no cuadra con lo que trae el conduce. */
.pista { font-size: 12px; margin-top: 4px; color: var(--ink-soft); min-height: 15px; }
.pista.descuadra { color: var(--act); font-weight: 700; }
.pista code { background: var(--panel-2); border-radius: 4px; padding: 1px 5px; font-size: 11.5px; }

/* Leído de la foto y todavía sin mirar (Q-01). Ámbar, que es la zona de acción
   del proyecto: ni bien ni mal, pendiente de que alguien lo confirme. Entra por
   el resplandor y no por el relleno, como todo lo demás (AGENTS §10). */
.field input.sugerido {
  border-color: var(--act);
  box-shadow: 0 0 0 3px rgba(245,184,61,.14), 0 0 20px -6px var(--act);
}
#aviso-lectura {
  display: none; margin-top: 12px; font-size: 13px; font-weight: 600;
  color: var(--act); border: 1px solid var(--line); border-left: 3px solid var(--act);
  border-radius: 8px; padding: 9px 13px; background: var(--panel-2);
}

<script>
"use strict";
const state = { day: todayISO() };
let pendingPhoto = null;
let scanStream = null, scanTimer = null;

function setNow(id) { document.getElementById(id).value = nowHM(); }

/* ---------- QR scan (BarcodeDetector + camera) ---------- */
async function startScan() {
  const wrap = document.getElementById("video-wrap");
  if (!("BarcodeDetector" in window)) {
    alert("Este navegador no soporta lectura de QR nativa (use Chrome/Edge en Android, o Safari 17+). Use entrada manual o foto.");
    return;
  }
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  } catch (e) {
    alert("No se pudo abrir la cámara: " + e.message);
    return;
  }
  const video = document.getElementById("scan-video");
  video.srcObject = scanStream;
  await video.play();
  wrap.style.display = "block";
  const detector = new BarcodeDetector({ formats: ["qr_code", "code_128", "code_39"] });
  scanTimer = setInterval(async () => {
    try {
      const codes = await detector.detect(video);
      if (codes.length) { applyScan(codes[0].rawValue); stopScan(); }
    } catch (_) {}
  }, 400);
}
function stopScan() {
  if (scanTimer) clearInterval(scanTimer);
  if (scanStream) scanStream.getTracks().forEach((t) => t.stop());
  scanTimer = scanStream = null;
  document.getElementById("video-wrap").style.display = "none";
}
function applyScan(raw) {
  let d = {};
  try { d = JSON.parse(raw); } catch (_) {
    const parts = raw.split(/[;|,]/).map((s) => s.trim());
    d = { ticket: parts[0], truck: parts[1], vol: parts[2], batch: parts[3] };
  }
  if (d.ticket) document.getElementById("f-ticket").value = d.ticket;
  if (d.truck) document.getElementById("f-truck").value = d.truck;
  if (d.vol) document.getElementById("f-vol").value = d.vol;
  if (d.batch && /^\d{1,2}:\d{2}$/.test(String(d.batch))) document.getElementById("f-batch").value = String(d.batch).padStart(5, "0");
  document.getElementById("f-arrive").value = nowHM();
  toast("Conduce escaneado — verifique y registre");
}

/* ---------- photo evidence ---------- */
/* Una foto, dos usos y dos tamaños (Q-01).

   La que se GUARDA sigue siendo la de 900 px al 60 % — es evidencia, pesa poco
   y viaja bien. La que se MANDA A LEER va en grande, hasta 2576 px, que es el
   máximo que aprovecha el lector: los dígitos de un conduce impreso en matriz
   de puntos no sobreviven a 900 px al 60 %, y de ahí salen números inventados
   en vez de huecos. Esa segunda copia no se guarda en ningún sitio. */
function reducir(img, ancho, calidad) {
  const c = document.createElement("canvas");
  const escala = Math.min(1, ancho / Math.max(img.width, img.height));
  c.width = Math.round(img.width * escala);
  c.height = Math.round(img.height * escala);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", calidad);
}

function photoCapture(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    pendingPhoto = reducir(img, 900, 0.6);          // la que se guarda
    document.getElementById("photo-slot").innerHTML =
      `<img class="photo-chip" src="${pendingPhoto}"> <span class="muted" style="font-size:12px">foto adjunta</span>`;
    document.getElementById("f-arrive").value = document.getElementById("f-arrive").value || nowHM();
    toast("Foto del conduce adjuntada");
    leerDeLaFoto(reducir(img, 2576, 0.92));          // la que se lee, y no se guarda
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
  input.value = "";
}

/* La pista del reparto — Q-11.

   Con una sola losa no dice nada: no hay nada que repartir. Con dos o más se
   ofrece la sintaxis, que es la misma del plan del día, y en cuanto el técnico
   la usa se comprueba en vivo contra las yardas del conduce. Se comprueba
   MIENTRAS escribe y no al guardar a propósito: quien puede aclarar en qué losa
   cayó la diferencia es el chofer, y en el momento de escribirlo todavía está
   ahí. Al cerrar el tiro ya no hay a quién preguntarle. */
function pistaReparto() {
  const el = document.getElementById("pista-reparto");
  const ident = document.getElementById("f-ident").value;
  const codigos = slabCodes(ident);
  el.className = "pista";
  if (codigos.length < 2) { el.textContent = ""; return; }

  const rep = repartoDe(ident);
  const declaradas = Object.keys(rep).length;
  if (!declaradas) {
    el.innerHTML = `${codigos.length} losas — puedes decir cuánto dejó en cada una: `
      + `<code>${esc(codigos[0])}:6, ${esc(codigos[1])}:4</code>`;
    return;
  }
  if (declaradas < codigos.length) {
    el.textContent = `Faltan ${codigos.length - declaradas} de ${codigos.length} losas por repartir.`;
    return;
  }
  const vol = num(document.getElementById("f-vol").value);
  const suma = codigos.reduce((a, c) => a + (rep[c] || 0), 0);
  if (vol == null) { el.textContent = `Reparto completo: ${fmt(suma, 1)} CY.`; return; }
  const dif = suma - vol;
  if (Math.abs(dif) < 0.15) { el.textContent = `Cuadra: ${fmt(suma, 1)} de ${fmt(vol, 1)} CY.`; return; }
  el.className = "pista descuadra";
  el.textContent = `Las losas suman ${fmt(suma, 1)} CY y el conduce trae ${fmt(vol, 1)}`
    + ` — ${dif > 0 ? "sobran" : "faltan"} ${fmt(Math.abs(dif), 1)} CY.`;
}

/* Los campos que el lector puede rellenar. La llegada NO está: es «ahora», la
   pone el propio aparato. La losa tampoco: la decide el técnico en obra y no
   viene impresa en el conduce. */
const CAMPOS_LEIDOS = [
  ["ticket", "f-ticket"], ["truck", "f-truck"], ["vol", "f-vol"], ["batch", "f-batch"],
];

/* Las yardas ORDENADAS que traía impreso el último conduce leído. No tiene
   campo en pantalla —el técnico no las teclea, no son suyas— pero viajan con
   el camión al expediente para poder contrastarlas con el tiro (Q-55). */
let ordenadasLeidas = null;

/* El lector PROPONE. Nunca guarda.

   Lo que entra queda marcado como sugerido —resplandor ámbar, que es la zona de
   acción del proyecto— hasta que el técnico toca el campo. Al registrar, si
   queda alguno sin tocar, se pregunta enseñándolos: un dato leído de una foto
   que nadie miró es exactamente el número inventado que este proyecto no puede
   tener en el expediente. */
async function leerDeLaFoto(dataUrl) {
  const api = (localStorage.getItem("qc-api") || "").replace(/\/+$/, "");
  if (!api) return;                                  // sin servidor no hay lector
  const aviso = document.getElementById("aviso-lectura");
  aviso.textContent = "Leyendo el conduce…";
  aviso.style.display = "block";

  const cab = { "Content-Type": "application/json" };
  const tk = localStorage.getItem("qc-token");
  if (tk) cab["X-QC-Token"] = tk;
  const ses = sessionStorage.getItem("qc-sesion");
  if (ses) cab["X-QC-Sesion"] = ses;

  let r, d;
  try {
    r = await fetch(api + "/api/leer-conduce", {
      method: "POST", headers: cab,
      body: JSON.stringify({ imagen: dataUrl.split(",")[1], tipo: "image/jpeg" }),
    });
    d = await r.json();
  } catch (_) {
    aviso.textContent = "No se pudo leer la foto. Entra los datos a mano.";
    return;
  }
  if (!r.ok) {
    aviso.textContent = d && d.error === "sin-lector"
      ? "Este servidor no tiene lector de conduce. Entra los datos a mano."
      : "No se pudo leer la foto. Entra los datos a mano.";
    return;
  }

  const c = d.campos || {};
  ordenadasLeidas = (c.ordenadas != null && c.ordenadas !== "") ? Number(c.ordenadas) : null;
  let puestos = 0;
  for (const [clave, id] of CAMPOS_LEIDOS) {
    const el = document.getElementById(id);
    if (!el || el.value || c[clave] == null || c[clave] === "") continue;
    el.value = c[clave];
    el.classList.add("sugerido");
    el.addEventListener("input", () => el.classList.remove("sugerido"), { once: true });
    puestos++;
  }
  const faltan = (c.ilegible || []).length;
  aviso.textContent = puestos
    ? `Leídos ${puestos} campo${puestos === 1 ? "" : "s"} — revísalos antes de registrar.`
      + (faltan ? ` ${faltan} no se leyeron y quedan vacíos.` : "")
    : "No se pudo leer ningún campo con seguridad. Entra los datos a mano.";
}

/* ---------- save arrival ---------- */
/* Lo que QCheck NECESITA de un camión para que el resto funcione. No es una
   lista de buenos deseos: sin cada uno de estos, algo concreto deja de andar,
   y en la columna de al lado está qué. Un dato que falta aquí no se nota hasta
   que se cierra el tiro y el reporte no cuadra — y entonces ya no hay a quién
   preguntarle a qué hora salió ese camión de planta. */
const CAMPOS_CAMION = [
  ["f-ticket", "el número de conduce", "es la llave del registro: sin él no hay expediente"],
  ["f-truck", "el número de camión", "es lo que canta el Field Display al chofer"],
  ["f-vol", "las yardas", "sin ellas el avance del tiro no sube"],
  ["f-batch", "la hora de batch", "sin ella no se puede medir el tiempo de viaje"],
  ["f-arrive", "la hora de llegada", "sin ella no hay ritmo ni ciclo"],
  ["f-ident", "la losa", "sin ella no se sabe dónde cayó el hormigón"],
];

function saveArrival() {
  /* Q-41: no se reciben camiones en un día ya firmado. */
  if (typeof frenoDiaCerrado === "function" && frenoDiaCerrado(diaActivo())) return;
  /* Se avisa del PRIMERO que falta y se lleva el cursor ahí. Enseñar los seis
     errores de golpe no ayuda a nadie con la mano sucia. */
  for (const [id, que, porque] of CAMPOS_CAMION) {
    const el = document.getElementById(id);
    if (!String(el.value).trim()) {
      toast(`Falta ${que} — ${porque}`);
      el.focus();
      el.classList.add("falta");
      setTimeout(() => el.classList.remove("falta"), 2000);
      return;
    }
  }
  /* Un campo leído de la foto que nadie ha mirado no entra al expediente sin
     que alguien lo diga (Q-01). Se enseñan cuáles son y qué dicen: un «¿está
     seguro?» a secas se contesta que sí sin leerlo, y aquí lo que se está
     confirmando es justamente el número. Tocar el campo lo saca de la lista. */
  const sinMirar = [...document.querySelectorAll(".field input.sugerido")];
  if (sinMirar.length) {
    const lista = sinMirar.map((el) => {
      const et = el.closest(".field").querySelector("label");
      return `  · ${et ? et.textContent.replace(" *", "") : el.id}: ${el.value}`;
    }).join("\n");
    if (!confirm(`Estos datos los leyó el sistema de la foto y todavía no los ha revisado nadie:\n\n${lista}\n\n`
                 + "Compáralos con el papel. ¿Están bien?")) {
      sinMirar[0].focus();
      return;
    }
    sinMirar.forEach((el) => el.classList.remove("sugerido"));
  }

  const ticket = document.getElementById("f-ticket").value.trim();

  /* Un conduce no se registra dos veces. La llave es compañía + ticket, no el
     ticket solo: dos plantas pueden emitir el mismo número. Esta comprobación
     vivía en la alta de camión de Muestras; al quitarla de allí —los camiones
     entran por aquí y solo por aquí— se trajo a Recepción, que es donde ahora
     hace falta. Sin ella, un conduce entrado dos veces duplica las yardas. */
  const planta = "01-SAN JUAN";
  const repetido = findConduce(plantCompany(planta), ticket);
  if (repetido) {
    toast(`El ticket ${ticket} ya está registrado — camión ${repetido.truck || "—"}`);
    document.getElementById("f-ticket").focus();
    return;
  }

  const t = {
    n: nextTestN(), id: uid(),
    date: todayISO(),
    ticket,
    truck: document.getElementById("f-truck").value.trim() || null,
    vol: num(document.getElementById("f-vol").value),
    plant: planta,
    /* La compañía va en el registro desde el minuto uno: es la mitad de la
       llave del conduce. Si se dejaba para que la rellenara `migrateDB()` en
       la siguiente carga, dos entradas seguidas del mismo ticket en la misma
       sesión no se reconocían como repetidas. */
    company: plantCompany(planta),
    source: pendingPhoto ? "foto" : "manual",
    batch: document.getElementById("f-batch").value || null,
    arrive: document.getElementById("f-arrive").value || nowHM(),
    ident: document.getElementById("f-ident").value.trim() || null,
    uwTarget: db.plan.uw.target,
    ordenadas: ordenadasLeidas,
    rejected: false,
  };
  if (pendingPhoto) t.photo = pendingPhoto;

  /* EL AVISO, EN EL ACTO — Q-55. Se da ANTES de guardar y se puede parar:
     puede que el conduce esté bien y el que esté mal sea el plan, y en ese
     caso lo que hay que hacer es hablar con el ingeniero, no seguir metiendo
     camiones contra una orden que nadie ha confirmado. */
  const planDelDia = num((db.dayMeta[t.date] || {}).cyPlan);
  if (ordenadasLeidas != null && planDelDia != null &&
      Math.abs(ordenadasLeidas - planDelDia) > 0.5) {
    const seguir = confirm(
      `⚠ El conduce no cuadra con el tiro programado.\n\n` +
      `El conduce dice ${fmt(ordenadasLeidas, 0)} CY ordenadas.\n` +
      `El tiro de hoy está programado a ${fmt(planDelDia, 0)} CY.\n\n` +
      `Avísale al ingeniero antes de seguir: o cambió el pedido y no se apuntó,\n` +
      `o este camión viene contra otra orden.\n\n` +
      `¿Registrar el camión igual?`);
    if (!seguir) return;
  }

  db.tests.push(t);
  saveDB();
  pendingPhoto = null;
  ordenadasLeidas = null;
  document.getElementById("photo-slot").innerHTML = "";
  ["f-ticket", "f-truck", "f-ident", "f-batch", "f-arrive"].forEach((id) => document.getElementById(id).value = "");
  pistaReparto();   // el camión siguiente empieza sin la pista del anterior
  document.getElementById("f-vol").value = "10";
  render();
  toast(`Camión ${t.truck || ""} ticket ${t.ticket} registrado`);
}

/* ---------- one-tap timestamps + results ---------- */
function stamp(n, field) {
  /* Q-41: tampoco se corrigen hitos de un vaciado cerrado. */
  const _r = (db.tests || []).find((x) => x.n === n);
  if (_r && typeof frenoDiaCerrado === "function" && frenoDiaCerrado(_r.date)) return;
  const t = db.tests.find((x) => x.n === n);
  if (!t || t[field]) return;
  t[field] = nowHM();
  saveDB(); render();
  toast({ start: "Comienza vaciado", testTime: "Toma de muestra", end: "Termina vaciado" }[field] + " — " + t[field]);
}

/* La pantalla espera al próximo camión, así que dice cuál toca: el conduce que
   sigue al último recibido, y la primera losa del plan que aún no se ha tirado.
   Son sugerencias en gris — nada se guarda hasta que el técnico lo confirme. */
function sugerirProximo(day) {
  const hoy = testsOfDate(day);
  const ult = hoy[hoy.length - 1];
  const tk = document.getElementById("f-ticket");
  if (ult && +ult.ticket) tk.placeholder = String(+ult.ticket + 1);
  if (ult && ult.vol) document.getElementById("f-vol").value = document.getElementById("f-vol").value || ult.vol;

  const L = losasDelDia(day);
  const pend = L.lista.find((l) => l.estado !== "vaciada");
  if (pend) document.getElementById("f-ident").placeholder = pend.codigo;
}

function render() {
  const day = todayISO();
  /* Con el plan del día dentro: un tiro programado sin camiones
     también es el tiro de hoy (Q-46). */
  const days = diasDelProyecto();
  const shown = testsOfDate(day).length ? day : days[0];
  const rows = testsOfDate(shown);
  const cy = rows.reduce((a, t) => a + (num(t.vol) || 0), 0);
  document.getElementById("hero-day").textContent = shown === day ? "Vaciado de hoy — " + fmtDate(shown) : "Último vaciado — " + fmtDate(shown);
  document.getElementById("hero-sub").textContent = db.project.name + " · " + db.project.mixId;
  document.getElementById("next-load").textContent = "Camión #" + (testsOfDate(day).length + 1) + " de hoy";
  document.getElementById("day-tot").textContent = `${rows.length} camiones · ${fmt(cy, 1)} CY`;
  sugerirProximo(day);

  document.getElementById("truck-list").innerHTML = rows.length ? [...rows].reverse().map((t) => {
    const w = worstZone(t);
    const step = (field, label) => t[field]
      ? `<span class="tstep done">✓ ${label} ${t[field]}</span>`
      : `<button class="tstep" onclick="stamp(${t.n},'${field}')">${label} — AHORA</button>`;
    return `<div class="truck-row ${t.rejected ? "rejected" : ""}">
      <div class="tno">${esc(t.truck || "—")}</div>
      <div class="tinfo">
        <div><b>Ticket ${esc(t.ticket || "—")}</b> ${t.photo ? "📎" : ""}</div>
        <div class="meta">${fmt(t.vol, 1)} CY · llegó ${esc(t.arrive || "—")}${t.ident ? " · " + esc(shortIdent(t.ident)) : ""}</div>
      </div>
      ${step("start", "▶ Comienza")}
      ${step("testTime", "🧪 Muestra")}
      ${step("end", "⏹ Termina")}
      <button class="tstep" onclick="formTest(null,${t.n})" style="border-color:#9fc4e8; color:var(--info)">📋 Resultados</button>
      <button class="tstep" onclick="lineaDeTiempo(${t.n})" title="Qué le pasó a este camión y quién entró cada dato">🕘 Historia</button>
      <span style="margin-left:auto">${estadoBadge(t)}</span>
    </div>`;
  }).join("") : `<div class="empty">Ningún camión registrado hoy. Escanee el primer conduce al llegar.</div>`;
}

loadDB();
initTheme();
mountThemeToggle();
mountStatusBar();
enableLiveSync(render);
render();
</script>
