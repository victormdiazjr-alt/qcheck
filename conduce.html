<style>
/* Conduce entry — field data-entry person. Mobile-first, glove-friendly. */
body { background: var(--bg); }
.entry-hero {
  background: linear-gradient(135deg, #122c42 0%, #0f6db4 100%);
  color: #fff; border-radius: 14px; padding: 18px 20px; margin-bottom: 16px;
  box-shadow: 0 6px 24px rgba(15,40,70,.25);
}
.entry-hero h1 { margin: 0 0 2px; font-size: 21px; }
.entry-hero .sub { color: #bcd4e8; font-size: 13px; }
.scan-nota:empty { display: none; }
.scan-nota { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 2;
  background: rgba(10,13,18,.88); border: 1px solid var(--susp); color: var(--susp);
  border-radius: 10px; padding: 10px 12px; font-size: 12.5px; font-weight: 600; line-height: 1.35; }
.capture-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 640px) { .capture-row { grid-template-columns: 1fr; } }
.cap-btn {
  display: flex; align-items: center; justify-content: center; gap: 11px;
  border: 1px solid var(--line); border-radius: 14px;
  background: linear-gradient(168deg, var(--panel-2), var(--panel));
  padding: 16px 14px; cursor: pointer; font-family: inherit; color: var(--ink);
  box-shadow: var(--shadow);
  transition: border-color .18s, box-shadow .18s, transform .16s;
}
/* el color entra por el resplandor, como en el resto de la interfaz */
.cap-btn:hover {
  border-color: rgba(74,99,216,.55); transform: translateY(-1px);
  box-shadow: 0 0 0 3px rgba(74,99,216,.10), 0 0 20px -6px rgba(74,99,216,.9);
}
.cap-btn:active { transform: scale(.985); }
.cap-btn .ico { width: 26px; height: 26px; flex: none; fill: none; stroke: var(--accent2);
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.cap-btn .ico .ic-linea { stroke: var(--accent); }
.cap-btn .t { font-weight: 700; font-size: 15px; letter-spacing: -.005em; }
.big-form .field input { padding: 13px 12px; font-size: 18px; font-weight: 600; }
.big-form .field label { font-size: 11.5px; }
.now-btn {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px;
  font-size: 12px; font-weight: 700; padding: 4px 10px; cursor: pointer; margin-top: 4px;
}
.now-btn:hover { background: var(--hover); }
.truck-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.truck-row .tno { font-size: 22px; font-weight: 900; min-width: 56px; }
.truck-row .tinfo { min-width: 130px; flex: 1 1 130px; }
@media (max-width: 520px) { .truck-row .tinfo { min-width: 0; } .truck-row { padding: 12px 12px; } }
.truck-row .meta { font-size: 12.5px; color: var(--ink-soft); }
.tstep {
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  font-size: 12.5px; font-weight: 700; padding: 8px 12px; cursor: pointer;
}
.tstep:hover { background: var(--hover); }
.tstep.done { background: var(--ok-bg); color: var(--ok); border-color: #bfe3cb; cursor: default; }
#video-wrap { position: relative; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 14px; display: none; }
#video-wrap video { width: 100%; display: block; max-height: 46vh; object-fit: cover; }
#video-wrap .scan-frame {
  position: absolute; inset: 12% 18%; border: 3px solid rgba(255,255,255,.85); border-radius: 14px;
  box-shadow: 0 0 0 2000px rgba(0,0,0,.35);
}
#video-wrap .close-scan { position: absolute; top: 10px; right: 10px; }
.photo-chip { height: 42px; border-radius: 6px; border: 1px solid var(--line); }
/* La miniatura se pulsa — Q-78. Sin esta pista nadie descubre que se puede:
   una imagen pequeña no parece un botón. */
/* El clip de la lista era un adorno: decía que había foto y no dejaba verla.
   Ahora es un botón, y se nota que lo es. */
.clip { background: none; border: 0; padding: 0 2px; font-size: 13px; cursor: zoom-in;
  line-height: 1; opacity: .75; }
.clip:hover { opacity: 1; transform: scale(1.15); }
.photo-chip.abre { cursor: zoom-in; transition: border-color .12s, transform .12s; }
.photo-chip.abre:hover { border-color: var(--info); transform: scale(1.06); }

/* El visor. Tapa la pantalla entera porque es para leer, y leer un conduce con
   la pantalla a medias es no leerlo. */
/* 400, como la ventana de los tableros en qc.css. Con 90 se metía DEBAJO de la
   barra de estado —que va en 330— y la fila de cerrar quedaba tapada: el visor
   se abría y no había manera de salir de él. */
.visor { position: fixed; inset: 0; z-index: 400; background: rgba(10,13,18,.97);
  display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom); }
.visor[hidden] { display: none; }
.visor-barra { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,.10); flex: none; }
.visor-tit { font-weight: 700; font-size: 14px; color: #eef2f6; }
.visor-ayuda { font-size: 12px; color: #8b97a3; margin-left: auto; }
.visor-barra .btn { flex: none; }
/* La caja hace de lupa: con la imagen a tamaño natural, el propio scroll —y el
   pellizco en el iPad— es el zoom. No hace falta inventar controles. */
/* Flex y no grid, y el centrado con `margin: auto` en la imagen. Las dos cosas
   son a propósito:

   · Con `display: grid` y `place-items: center`, el `max-height: 100%` de la
     imagen se mide contra una fila que crece con la imagen — se mide contra sí
     misma— así que no limita nada: un conduce de 900 px se salía de la caja por
     abajo y el final no se veía.
   · Con `justify-content: center` en vez de `margin: auto`, al acercar, la
     parte izquierda de la imagen queda fuera del scroll y NO se puede alcanzar.
     Es el fallo clásico de flex con overflow. */
.visor-caja { flex: 1; min-height: 0; overflow: auto; display: flex; padding: 14px;
  -webkit-overflow-scrolling: touch; }
.visor-caja img { margin: auto; max-width: 100%; max-height: 100%; object-fit: contain;
  cursor: zoom-in; border-radius: 8px; box-shadow: 0 18px 60px rgba(0,0,0,.6); }
.visor-caja.cerca img { max-width: none; max-height: none; width: auto; cursor: zoom-out; }
@media (max-width: 640px) { .visor-ayuda { display: none; } }
/* El campo que falta se señala donde está el dedo, no solo en el aviso de
   abajo: el resplandor, nunca el relleno (AGENTS.md §10). */
.field input.falta {
  border-color: var(--susp);
  box-shadow: 0 0 0 3px rgba(255,90,82,.16), 0 0 20px -6px var(--susp);
}
/* La pista del reparto (Q-11). Gris cuando solo informa, ámbar cuando el
   reparto declarado no cuadra con lo que trae el conduce. */
.pista { font-size: 12px; margin-top: 4px; color: var(--ink-soft); min-height: 15px; }
.pista.descuadra { color: var(--act); font-weight: 700; }
.pista code { background: var(--panel-2); border-radius: 4px; padding: 1px 5px; font-size: 11.5px; }

/* Leído de la foto y todavía sin mirar (Q-01). Ámbar, que es la zona de acción
   del proyecto: ni bien ni mal, pendiente de que alguien lo confirme. Entra por
   el resplandor y no por el relleno, como todo lo demás (AGENTS §10). */
.field input.sugerido {
  border-color: var(--act);
  box-shadow: 0 0 0 3px rgba(245,184,61,.14), 0 0 20px -6px var(--act);
}
#aviso-lectura {
  display: none; margin-top: 12px; font-size: 13px; font-weight: 600;
  color: var(--act); border: 1px solid var(--line); border-left: 3px solid var(--act);
  border-radius: 8px; padding: 9px 13px; background: var(--panel-2);
}
</style>

<script>
"use strict";
const state = { day: todayISO() };
let pendingPhoto = null;
let scanStream = null, scanTimer = null;

function setNow(id) { document.getElementById(id).value = nowHM(); }

/* ---------- QR scan (BarcodeDetector + camera) ---------- */
async function startScan() {
  const wrap = document.getElementById("video-wrap");

  /* La cámara PRIMERO, y el lector de QR después — Q-78.

     Antes se preguntaba por `BarcodeDetector` antes de nada, así que en un
     iPhone o un iPad el botón no encendía la cámara: soltaba un aviso y ahí se
     acababa. Safari no trae ese lector, y ese es justo el aparato que está en
     la obra.

     Ahora la cámara se abre siempre. Si el navegador sabe leer QR, lee; si no,
     se ve por la pantalla y se dice con todas las letras que en este aparato
     hay que apuntar el número a mano o escanear el conduce con la otra puerta.
     Enseñar la cámara y decir la verdad es mejor que un botón que no hace nada:
     el técnico ve que el aparato responde y sabe qué hacer a continuación. */
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  } catch (e) {
    /* En iOS la cámara solo se abre sobre HTTPS. Si se entra por IP a pelo, el
       navegador la niega y el mensaje del error no lo explica. */
    alert("No se pudo abrir la cámara: " + e.message
      + (location.protocol !== "https:" ? "\n\nEste aparato está entrando por " + location.protocol
         + " — la cámara solo funciona por https." : ""));
    return;
  }

  const video0 = document.getElementById("scan-video");
  video0.srcObject = scanStream;
  await video0.play();
  wrap.style.display = "block";
  document.getElementById("scan-nota").textContent = "";

  /* Dos maneras de leer el código, y se prueba la buena primero — Q-80.

     `BarcodeDetector` lo trae Chrome de Android y lo resuelve el propio
     sistema: rápido y sin cargar nada. Safari NO lo trae, y el aparato de la
     obra es un iPad, así que ahí se cae al lector propio (`assets/qr-lector.js`).

     El lector propio se pide AQUÍ y no arriba del todo a propósito: son 130 KB
     que solo paga quien pulsa este botón. Quien nada más saca fotos de
     conduces no los descarga nunca. */
  let mirar;
  if ("BarcodeDetector" in window) {
    const detector = new BarcodeDetector({ formats: ["qr_code", "code_128", "code_39"] });
    mirar = async () => {
      const codes = await detector.detect(video0);
      return codes.length ? codes[0].rawValue : null;
    };
  } else {
    /* El lector de fuera NO corre aquí — Q-81. Corre en un cuarto cerrado
       (`assets/qr-aislado.js`), donde el navegador no le da ni `localStorage` ni
       `sessionStorage` ni `document`. Entran píxeles, sale texto. Si esa pieza
       fuera maliciosa, no tendría desde dónde ver la llave del proyecto.

       Ver DECISIONS §57. */
    let cuarto;
    try {
      cuarto = abrirCuartoDelQR();
    } catch (_) {
      document.getElementById("scan-nota").textContent =
        "No se pudo abrir el lector de códigos. Usa «Escanear conduce» o entra el ticket a mano.";
      return;
    }
    /* El fotograma se mira reducido a 640 px de ancho. A tamaño completo el
       iPad tarda más en cada pasada que lo que dura la pasada, y la cámara se
       ve a tirones justo cuando hace falta apuntar bien. */
    const lienzo = document.createElement("canvas");
    const ctx = lienzo.getContext("2d", { willReadFrequently: true });
    mirar = async () => {
      const w = video0.videoWidth, h = video0.videoHeight;
      if (!w || !h) return null;
      const escala = Math.min(1, 640 / w);
      lienzo.width = Math.round(w * escala);
      lienzo.height = Math.round(h * escala);
      ctx.drawImage(video0, 0, 0, lienzo.width, lienzo.height);
      const d = ctx.getImageData(0, 0, lienzo.width, lienzo.height);
      return await cuarto(d);
    };
  }
  const detector = new BarcodeDetector({ formats: ["qr_code", "code_128", "code_39"] });
  scanTimer = setInterval(async () => {
    try {
      const leido = await mirar();
      if (leido) { applyScan(leido); stopScan(); }
    } catch (_) {}
  }, 400);
}

/* Abre el cuarto cerrado donde corre el lector de fuera — Q-81.

   Devuelve una función: se le da un fotograma, contesta el texto del código o
   `null`. El Worker se abre la PRIMERA vez que alguien pulsa «Escanear QR» y no
   antes: quien solo saca fotos de conduces no descarga esos 130 KB nunca. */
let cuartoQR = null;
function abrirCuartoDelQR() {
  if (cuartoQR) return cuartoQR;
  const w = obreroQR = new Worker("assets/qr-aislado.js");
  const esperando = new Map();
  let siguiente = 0;
  w.onmessage = (e) => {
    const { id, texto } = e.data || {};
    const ok = esperando.get(id);
    if (ok) { esperando.delete(id); ok(texto); }
  };
  /* Si el cuarto se cae, se contesta que no hay código y la cámara sigue: es
     preferible un escáner que no encuentra nada a una pantalla congelada con
     un camión esperando. */
  w.onerror = () => { for (const ok of esperando.values()) ok(null); esperando.clear(); };

  cuartoQR = (imageData) => new Promise((ok) => {
    if (!cuartoQR) return ok(null);
    const id = ++siguiente;
    esperando.set(id, ok);
    /* Los píxeles se MUEVEN, no se copian: 640×480 son 1,2 MB por fotograma y
       tres fotogramas por segundo. Copiarlos calienta el iPad para nada. */
    const datos = imageData.data;
    w.postMessage({ id, datos, ancho: imageData.width, alto: imageData.height },
                  [datos.buffer]);
    setTimeout(() => { if (esperando.delete(id)) ok(null); }, 3000);
  });
  return cuartoQR;
}

/* Se cierra al salir del escáner. `terminate()` y no solo soltar la variable:
   sin eso el Worker sigue vivo con sus 130 KB dentro hasta que se cierre la
   pestaña, y en un iPad de obra eso se nota. */
let obreroQR = null;
function cerrarCuartoDelQR() {
  if (obreroQR) { obreroQR.terminate(); obreroQR = null; }
  cuartoQR = null;
}
function stopScan() {
  cerrarCuartoDelQR();
  if (scanTimer) clearInterval(scanTimer);
  if (scanStream) scanStream.getTracks().forEach((t) => t.stop());
  scanTimer = scanStream = null;
  document.getElementById("video-wrap").style.display = "none";
}
/* ¿Es esto el enlace de un conduce de QTicket? — Q-82.

   El QR que imprime QTicket NO lleva los datos dentro: lleva una dirección,
   `<lo que sea>/c/<id>`. No caben en un código: la ficha entera del contrato
   son ochocientos y pico caracteres y el generador de QTicket llega hasta unos
   doscientos. Así que el código lleva la llave y los datos se piden.

   Se reconoce por la FORMA, no por el dominio: cada concretera tendrá el suyo.
   Y solo por https —o localhost, para probar—, porque un QR lo imprime
   cualquiera y esto es texto que llega de fuera. */
function enlaceDeQTicket(raw) {
  let u;
  try { u = new URL(String(raw).trim()); } catch (_) { return null; }
  const local = u.hostname === "localhost" || u.hostname === "127.0.0.1";
  if (u.protocol !== "https:" && !(u.protocol === "http:" && local)) return null;
  const m = u.pathname.match(/^\/c\/([0-9A-Za-z]{1,64})$/);
  if (!m) return null;

  /* Y el servidor tiene que ser UNO DE LOS DEL PROYECTO — Q-82.

     Sin esto, cualquiera imprime un QR con su propia dirección, lo cuela en el
     montón de conduces, y QCheck le pide los datos a un servidor de fuera y
     rellena el formulario con lo que le manden. Con choferes que ya alteran
     conduces a bolígrafo (banco de reglas 04), eso no es una hipótesis.

     La lista vive en el plan del proyecto, no en el código: cada concretera
     tendrá su dominio, y quien da de alta el proyecto es quien sabe cuál es.
     **Vacía por defecto: hasta que alguien la ponga, no se pide nada a nadie.**
     Puerta cerrada mientras no exista QTicket, que es hoy. */
  const permitidos = ((db.project || {}).qticketHosts || []).map((h) => String(h).toLowerCase());
  if (!permitidos.includes(u.hostname.toLowerCase())) {
    return { id: m[1], url: u.href, host: u.hostname, desconocido: true };
  }
  return { id: m[1], url: u.href, host: u.hostname };
}

/* Pide la ficha del conduce a QTicket y rellena lo que traiga.

   **Lo que llega por aquí es de fuera y no se firma solo.** Un QR lo imprime
   cualquiera; esto rellena el formulario para que el técnico lo mire, igual
   que la foto. Por eso se leen SOLO los campos que se conocen, se convierten a
   número los que son número, y no se manda ninguna llave nuestra en la
   petición: ese servidor es de la concretera, no nuestro. */
async function pedirConduceAQTicket(enlace) {
  const aviso = document.getElementById("aviso-lectura");
  aviso.style.display = "block";
  aviso.textContent = "Pidiendo el conduce a QTicket…";
  try {
    const r = await fetch(enlace.url + ".json", { credentials: "omit", mode: "cors" });
    if (!r.ok) throw new Error("contestó " + r.status);
    const d = await r.json();
    aviso.textContent = "";
    aviso.style.display = "none";
    return d;
  } catch (e) {
    /* Que no se pueda pedir no es el fin: el número de conduce sigue estando
       en el enlace, y con eso el técnico puede seguir a mano. */
    aviso.className = "aviso-lectura pendiente";
    aviso.textContent = "Se leyó el código de QTicket (" + enlace.id +
      ") pero no se pudo pedir la ficha: " + e.message + ". Entra los datos a mano.";
    return null;
  }
}

function applyScan(raw) {
  const enlace = enlaceDeQTicket(raw);
  if (enlace && enlace.desconocido) {
    /* Se dice el servidor con todas las letras: quien mire la pantalla tiene
       que poder ver a dónde apuntaba el código que le acaban de dar. */
    const aviso = document.getElementById("aviso-lectura");
    aviso.className = "aviso-lectura pendiente";
    aviso.style.display = "block";
    aviso.textContent = "Ese código apunta a «" + enlace.host + "», que no es un servidor de este proyecto. " +
      "No se pidió nada. Si es correcto, hay que darlo de alta en Plan & Datos; si no, entra el conduce a mano.";
    return;
  }
  if (enlace) {
    pedirConduceAQTicket(enlace).then((d) => { if (d) rellenarDelConduce(d, enlace.id); });
    return;
  }
  let d = {};
  try { d = JSON.parse(raw); } catch (_) {
    const parts = raw.split(/[;|,]/).map((s) => s.trim());
    d = { ticket: parts[0], truck: parts[1], vol: parts[2], batch: parts[3] };
  }
  if (d.ticket) document.getElementById("f-ticket").value = d.ticket;
  if (d.truck) document.getElementById("f-truck").value = d.truck;
  if (d.vol) document.getElementById("f-vol").value = d.vol;
  if (d.batch && /^\d{1,2}:\d{2}$/.test(String(d.batch))) document.getElementById("f-batch").value = String(d.batch).padStart(5, "0");
  document.getElementById("f-arrive").value = nowHM();
  toast("Conduce escaneado — verifique y registre");
}

/* «06:18», «6:18», «10:54AM», «1:05 p.m.» → «06:18» / «13:05». Lo que no se
   entienda vuelve null y el campo se queda vacío. */
function horaDe24(v) {
  const s = String(v ?? "").trim().toUpperCase().replace(/[\s.]/g, "");
  const m = s.match(/^(\d{1,2}):(\d{2})(AM|PM)?$/);
  if (!m) return null;
  let h = Number(m[1]);
  const min = Number(m[2]);
  if (min > 59) return null;
  if (m[3]) {
    if (h < 1 || h > 12) return null;
    if (m[3] === "PM" && h !== 12) h += 12;
    if (m[3] === "AM" && h === 12) h = 0;
  } else if (h > 23) return null;
  return String(h).padStart(2, "0") + ":" + m[2];
}

/* Vuelca la ficha que mandó QTicket en el formulario — Q-82.

   Solo campos conocidos, y ninguno se da por bueno: esto rellena para que el
   técnico mire, exactamente igual que cuando se lee de la foto. Un campo que
   QTicket manda en `null` se deja vacío y no se inventa (DECISIONS §3). */
function rellenarDelConduce(d, eticketId) {
  const pon = (id, v) => { if (v !== null && v !== undefined && v !== "") document.getElementById(id).value = v; };
  pon("f-ticket", d.ticket);
  pon("f-truck", d.truck);
  pon("f-vol", d.vol);
  /* La hora, en 24 horas — Q-83.

     El contrato §3 dice `HH:MM` y QTicket manda `10:54AM`. Cuando se probó de
     verdad contra su servidor, esa hora se PERDÍA EN SILENCIO: no casaba con el
     formato, se descartaba, y nadie se enteraba. Un dato que desaparece sin
     ruido es peor que uno que no llega.

     Se avisa a QTicket para que lo mande como dice el contrato, y mientras
     tanto se acepta lo que de verdad llega: el papel de la concretera lo
     imprime en 12 horas y esa es la costumbre del oficio. Lo que no se entienda
     se deja vacío, no se adivina. */
  pon("f-batch", horaDe24(d.batch));
  document.getElementById("f-arrive").value = nowHM();
  /* El identificador de QTicket viaja con el camión: es lo único que permite
     mandar una corrección del mismo conduce sin duplicarlo (contrato §2). */
  pendingEticket = eticketId || d.eticketId || null;
  toast("Conduce de QTicket — verifique y registre");
}
let pendingEticket = null;

/* El conduce a pantalla completa — Q-78.

   La miniatura dice que hay foto; el visor deja leerla. Y lo que enseña es
   **la foto que de verdad se guardó**, no una copia bonita hecha aparte: si el
   conduce guardado no se lee, hay que enterarse ahora y volver a tomarlo, no el
   día que alguien reclame una yarda. */
/* El conduce de un camión ya registrado. Se busca por `n` —el número de fila—
   porque es lo que la lista tiene a mano; si ese camión no trae foto no se
   enseña nada y tampoco se inventa un hueco: el clip solo aparece cuando la
   hay. */
function verConduceDe(n) {
  const t = (db.tests || []).find((x) => String(x.n) === String(n));
  if (!t || !t.photo) return;
  verConduce(t.photo, `Conduce · camión ${t.truck || "—"} · ticket ${t.ticket || "—"}`);
}

function verConduce(src, titulo) {
  if (!src) return;
  document.getElementById("visor-img").src = src;
  document.getElementById("visor-tit").textContent = titulo || "Conduce";
  document.getElementById("visor-caja").classList.remove("cerca");
  document.getElementById("visor").hidden = false;
  /* Sin esto la página de detrás sigue moviéndose bajo el dedo, y en el iPad
     eso se siente como que el visor no responde. */
  document.body.style.overflow = "hidden";
}

function cerrarVisor() {
  document.getElementById("visor").hidden = true;
  document.getElementById("visor-img").src = "";      // que no se quede en memoria
  document.body.style.overflow = "";
}

document.getElementById("visor-cerrar").onclick = cerrarVisor;
document.getElementById("visor-caja").onclick = (e) => {
  /* Pulsar la imagen acerca y aleja; pulsar el fondo cierra. Es lo que hace
     cualquier visor de fotos, y aquí lo que menos hace falta es aprender algo
     nuevo con un camión esperando. */
  if (e.target.id === "visor-img") document.getElementById("visor-caja").classList.toggle("cerca");
  else cerrarVisor();
};
addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarVisor(); });

/* ---------- photo evidence ---------- */
/* Una foto, dos usos y dos tamaños (Q-01).

   La que se GUARDA sigue siendo la de 900 px al 60 % — es evidencia, pesa poco
   y viaja bien. La que se MANDA A LEER va en grande, hasta 2576 px, que es el
   máximo que aprovecha el lector: los dígitos de un conduce impreso en matriz
   de puntos no sobreviven a 900 px al 60 %, y de ahí salen números inventados
   en vez de huecos. Esa segunda copia no se guarda en ningún sitio. */
function reducir(img, ancho, calidad) {
  const c = document.createElement("canvas");
  const escala = Math.min(1, ancho / Math.max(img.width, img.height));
  c.width = Math.round(img.width * escala);
  c.height = Math.round(img.height * escala);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", calidad);
}

function photoCapture(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    pendingPhoto = reducir(img, 900, 0.6);          // la que se guarda
    const slot = document.getElementById("photo-slot");
    slot.innerHTML =
      `<img class="photo-chip abre" src="${pendingPhoto}" title="Ver el conduce completo">` +
      ` <span class="muted" style="font-size:12px">foto adjunta · toca para verla</span>`;
    slot.querySelector("img").onclick = () => verConduce(pendingPhoto, "Conduce sin registrar todavía");
    document.getElementById("f-arrive").value = document.getElementById("f-arrive").value || nowHM();
    toast("Foto del conduce adjuntada");
    leerDeLaFoto(reducir(img, 2576, 0.92));          // la que se lee, y no se guarda
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
  input.value = "";
}

/* La pista del reparto — Q-11.

   Con una sola losa no dice nada: no hay nada que repartir. Con dos o más se
   ofrece la sintaxis, que es la misma del plan del día, y en cuanto el técnico
   la usa se comprueba en vivo contra las yardas del conduce. Se comprueba
   MIENTRAS escribe y no al guardar a propósito: quien puede aclarar en qué losa
   cayó la diferencia es el chofer, y en el momento de escribirlo todavía está
   ahí. Al cerrar el tiro ya no hay a quién preguntarle. */
function pistaReparto() {
  const el = document.getElementById("pista-reparto");
  const ident = document.getElementById("f-ident").value;
  const codigos = slabCodes(ident);
  el.className = "pista";
  if (codigos.length < 2) { el.textContent = ""; return; }

  const rep = repartoDe(ident);
  const declaradas = Object.keys(rep).length;
  if (!declaradas) {
    el.innerHTML = `${codigos.length} losas — puedes decir cuánto dejó en cada una: `
      + `<code>${esc(codigos[0])}:6, ${esc(codigos[1])}:4</code>`;
    return;
  }
  if (declaradas < codigos.length) {
    el.textContent = `Faltan ${codigos.length - declaradas} de ${codigos.length} losas por repartir.`;
    return;
  }
  const vol = num(document.getElementById("f-vol").value);
  const suma = codigos.reduce((a, c) => a + (rep[c] || 0), 0);
  if (vol == null) { el.textContent = `Reparto completo: ${fmt(suma, 1)} CY.`; return; }
  const dif = suma - vol;
  if (Math.abs(dif) < 0.15) { el.textContent = `Cuadra: ${fmt(suma, 1)} de ${fmt(vol, 1)} CY.`; return; }
  el.className = "pista descuadra";
  el.textContent = `Las losas suman ${fmt(suma, 1)} CY y el conduce trae ${fmt(vol, 1)}`
    + ` — ${dif > 0 ? "sobran" : "faltan"} ${fmt(Math.abs(dif), 1)} CY.`;
}

/* Los campos que el lector puede rellenar. La llegada NO está: es «ahora», la
   pone el propio aparato. La losa tampoco: la decide el técnico en obra y no
   viene impresa en el conduce. */
const CAMPOS_LEIDOS = [
  ["ticket", "f-ticket"], ["truck", "f-truck"], ["vol", "f-vol"], ["batch", "f-batch"],
];

/* Las yardas ORDENADAS que traía impreso el último conduce leído. No tiene
   campo en pantalla —el técnico no las teclea, no son suyas— pero viajan con
   el camión al expediente para poder contrastarlas con el tiro (Q-55). */
let ordenadasLeidas = null;

/* El lector PROPONE. Nunca guarda.

   Lo que entra queda marcado como sugerido —resplandor ámbar, que es la zona de
   acción del proyecto— hasta que el técnico toca el campo. Al registrar, si
   queda alguno sin tocar, se pregunta enseñándolos: un dato leído de una foto
   que nadie miró es exactamente el número inventado que este proyecto no puede
   tener en el expediente. */
async function leerDeLaFoto(dataUrl) {
  const api = (localStorage.getItem("qc-api") || "").replace(/\/+$/, "");
  if (!api) return;                                  // sin servidor no hay lector
  const aviso = document.getElementById("aviso-lectura");
  aviso.textContent = "Leyendo el conduce…";
  aviso.style.display = "block";

  const cab = { "Content-Type": "application/json" };
  const tk = localStorage.getItem("qc-token");
  if (tk) cab["X-QC-Token"] = tk;
  const ses = localStorage.getItem("qc-sesion");
  if (ses) cab["X-QC-Sesion"] = ses;

  let r, d;
  try {
    r = await fetch(api + "/api/leer-conduce", {
      method: "POST", headers: cab,
      body: JSON.stringify({ imagen: dataUrl.split(",")[1], tipo: "image/jpeg" }),
    });
    d = await r.json();
  } catch (_) {
    aviso.textContent = "No se pudo leer la foto. Entra los datos a mano.";
    return;
  }
  if (!r.ok) {
    aviso.textContent = d && d.error === "sin-lector"
      ? "Este servidor no tiene lector de conduce. Entra los datos a mano."
      : "No se pudo leer la foto. Entra los datos a mano.";
    return;
  }

  const c = d.campos || {};
  ordenadasLeidas = (c.ordenadas != null && c.ordenadas !== "") ? Number(c.ordenadas) : null;
  let puestos = 0;
  for (const [clave, id] of CAMPOS_LEIDOS) {
    const el = document.getElementById(id);
    if (!el || el.value || c[clave] == null || c[clave] === "") continue;
    el.value = c[clave];
    el.classList.add("sugerido");
    el.addEventListener("input", () => el.classList.remove("sugerido"), { once: true });
    puestos++;
  }
  const faltan = (c.ilegible || []).length;
  aviso.textContent = puestos
    ? `Leídos ${puestos} campo${puestos === 1 ? "" : "s"} — revísalos antes de registrar.`
      + (faltan ? ` ${faltan} no se leyeron y quedan vacíos.` : "")
    : "No se pudo leer ningún campo con seguridad. Entra los datos a mano.";

  avisarDeLoEscritoAMano(c);
}

/* UN CAMPO IMPRESO QUE LLEGA A BOLÍGRAFO — Q-84, banco de reglas 04.

   Los choferes alteran conduces a mano, y está prohibido. Pero hay dos cosas
   distintas en el mismo papel y no valen igual:

     · Las horas del ciclo se escriben a mano SIEMPRE. Esas casillas se imprimen
       en blanco justo para eso, y es literalmente lo que QCheck digitaliza.
     · El número de conduce, el camión, las yardas, la mezcla y las ordenadas
       los imprime la planta. **Si uno de esos llega escrito a mano, alguien lo
       cambió después de que la planta lo certificara.**

   Un lector de los que leen por plantilla no puede distinguirlo: para él todo
   son letras. Un modelo sí, y por eso se le pide. Este aviso es el motivo más
   fuerte que tenemos para leer con modelo.

   No bloquea nada: avisa. Quien decide es el técnico, con el papel delante. */
const CAMPOS_QUE_IMPRIME_LA_PLANTA = ["ticket", "truck", "vol", "mix", "company", "ordenadas"];
function avisarDeLoEscritoAMano(c) {
  const caja = document.getElementById("aviso-mano");
  if (!caja) return;
  const aMano = (c.manuscrito || []).filter((k) => CAMPOS_QUE_IMPRIME_LA_PLANTA.includes(k));
  if (!aMano.length) { caja.style.display = "none"; caja.textContent = ""; return; }
  const nombres = aMano.map((k) => QC_NOMBRE_CAMPO[k] || k).join(", ");
  caja.style.display = "block";
  caja.textContent = "Ojo: " + (aMano.length === 1 ? "este campo venía" : "estos campos venían") +
    " escrito" + (aMano.length === 1 ? "" : "s") + " a mano y la planta lo imprime — " + nombres +
    ". Compruébalo contra el papel antes de registrar.";
}

/* ---------- save arrival ---------- */
/* Lo que QCheck NECESITA de un camión para que el resto funcione. No es una
   lista de buenos deseos: sin cada uno de estos, algo concreto deja de andar,
   y en la columna de al lado está qué. Un dato que falta aquí no se nota hasta
   que se cierra el tiro y el reporte no cuadra — y entonces ya no hay a quién
   preguntarle a qué hora salió ese camión de planta. */
const CAMPOS_CAMION = [
  ["f-ticket", "el número de conduce", "es la llave del registro: sin él no hay expediente"],
  ["f-truck", "el número de camión", "es lo que canta el Field Display al chofer"],
  ["f-vol", "las yardas", "sin ellas el avance del tiro no sube"],
  ["f-batch", "la hora de batch", "sin ella no se puede medir el tiempo de viaje"],
  ["f-arrive", "la hora de llegada", "sin ella no hay ritmo ni ciclo"],
  ["f-ident", "la losa", "sin ella no se sabe dónde cayó el hormigón"],
];

function saveArrival() {
  /* Q-41: no se reciben camiones en un día ya firmado. */
  if (typeof frenoDiaCerrado === "function" && frenoDiaCerrado(diaActivo())) return;
  /* Se avisa del PRIMERO que falta y se lleva el cursor ahí. Enseñar los seis
     errores de golpe no ayuda a nadie con la mano sucia. */
  for (const [id, que, porque] of CAMPOS_CAMION) {
    const el = document.getElementById(id);
    if (!String(el.value).trim()) {
      toast(`Falta ${que} — ${porque}`);
      el.focus();
      el.classList.add("falta");
      setTimeout(() => el.classList.remove("falta"), 2000);
      return;
    }
  }
  /* Un campo leído de la foto que nadie ha mirado no entra al expediente sin
     que alguien lo diga (Q-01). Se enseñan cuáles son y qué dicen: un «¿está
     seguro?» a secas se contesta que sí sin leerlo, y aquí lo que se está
     confirmando es justamente el número. Tocar el campo lo saca de la lista. */
  const sinMirar = [...document.querySelectorAll(".field input.sugerido")];
  if (sinMirar.length) {
    const lista = sinMirar.map((el) => {
      const et = el.closest(".field").querySelector("label");
      return `  · ${et ? et.textContent.replace(" *", "") : el.id}: ${el.value}`;
    }).join("\n");
    if (!confirm(`Estos datos los leyó el sistema de la foto y todavía no los ha revisado nadie:\n\n${lista}\n\n`
                 + "Compáralos con el papel. ¿Están bien?")) {
      sinMirar[0].focus();
      return;
    }
    sinMirar.forEach((el) => el.classList.remove("sugerido"));
  }

  const ticket = document.getElementById("f-ticket").value.trim();

  /* Un conduce no se registra dos veces. La llave es compañía + ticket, no el
     ticket solo: dos plantas pueden emitir el mismo número. Esta comprobación
     vivía en la alta de camión de Muestras; al quitarla de allí —los camiones
     entran por aquí y solo por aquí— se trajo a Recepción, que es donde ahora
     hace falta. Sin ella, un conduce entrado dos veces duplica las yardas. */
  const planta = "01-SAN JUAN";
  const repetido = findConduce(plantCompany(planta), ticket);
  if (repetido) {
    toast(`El ticket ${ticket} ya está registrado — camión ${repetido.truck || "—"}`);
    document.getElementById("f-ticket").focus();
    return;
  }

  const t = {
    n: nextTestN(), id: uid(),
    date: todayISO(),
    ticket,
    truck: document.getElementById("f-truck").value.trim() || null,
    vol: num(document.getElementById("f-vol").value),
    plant: planta,
    /* La compañía va en el registro desde el minuto uno: es la mitad de la
       llave del conduce. Si se dejaba para que la rellenara `migrateDB()` en
       la siguiente carga, dos entradas seguidas del mismo ticket en la misma
       sesión no se reconocían como repetidas. */
    company: plantCompany(planta),
    /* De dónde vino este camión, y no es cosmético: un dato que llegó por
       QTicket es un dato certificado por la planta; uno leído de una foto es
       una lectura; uno tecleado es lo que dijo una persona. Dentro de un año
       alguien querrá saber cuál era cuál. */
    source: pendingEticket ? "qticket" : pendingPhoto ? "foto" : "manual",
    batch: document.getElementById("f-batch").value || null,
    arrive: document.getElementById("f-arrive").value || nowHM(),
    ident: document.getElementById("f-ident").value.trim() || null,
    uwTarget: db.plan.uw.target,
    ordenadas: ordenadasLeidas,
    rejected: false,
  };
  if (pendingPhoto) t.photo = pendingPhoto;
  /* El identificador de QTicket es lo único que permite mandar una corrección
     del mismo conduce sin duplicar el camión (contrato §2). Si viene, se
     guarda. */
  if (pendingEticket) t.eticketId = pendingEticket;

  /* EL AVISO, EN EL ACTO — Q-55. Se da ANTES de guardar y se puede parar:
     puede que el conduce esté bien y el que esté mal sea el plan, y en ese
     caso lo que hay que hacer es hablar con el ingeniero, no seguir metiendo
     camiones contra una orden que nadie ha confirmado. */
  const planDelDia = num((db.dayMeta[t.date] || {}).cyPlan);
  if (ordenadasLeidas != null && planDelDia != null &&
      Math.abs(ordenadasLeidas - planDelDia) > 0.5) {
    const seguir = confirm(
      `⚠ El conduce no cuadra con el tiro programado.\n\n` +
      `El conduce dice ${fmt(ordenadasLeidas, 0)} CY ordenadas.\n` +
      `El tiro de hoy está programado a ${fmt(planDelDia, 0)} CY.\n\n` +
      `Avísale al ingeniero antes de seguir: o cambió el pedido y no se apuntó,\n` +
      `o este camión viene contra otra orden.\n\n` +
      `¿Registrar el camión igual?`);
    if (!seguir) return;
  }

  /* Q-67: sin conexión no se somete. Aquí, justo antes de escribir, porque
     entre abrir la pantalla y darle al botón se pasa por el escaneo y por un
     par de avisos, y ahí se puede haber ido la señal. */
  if (typeof puedeSometer === "function" && !puedeSometer()) { avisarSinConexion(); return; }
  db.tests.push(t);
  saveDB();
  pendingPhoto = null;
  pendingEticket = null;
  ordenadasLeidas = null;
  document.getElementById("photo-slot").innerHTML = "";
  ["f-ticket", "f-truck", "f-ident", "f-batch", "f-arrive"].forEach((id) => document.getElementById(id).value = "");
  pistaReparto();   // el camión siguiente empieza sin la pista del anterior
  document.getElementById("f-vol").value = "10";
  render();
  toast(`Camión ${t.truck || ""} ticket ${t.ticket} registrado`);
}

/* ---------- one-tap timestamps + results ---------- */
function stamp(n, field) {
  /* Q-41: tampoco se corrigen hitos de un vaciado cerrado. */
  const _r = (db.tests || []).find((x) => x.n === n);
  if (_r && typeof frenoDiaCerrado === "function" && frenoDiaCerrado(_r.date)) return;
  const t = db.tests.find((x) => x.n === n);
  if (!t || t[field]) return;
  t[field] = nowHM();
  saveDB(); render();
  toast({ start: "Comienza vaciado", testTime: "Toma de muestra", end: "Termina vaciado" }[field] + " — " + t[field]);
}

/* La pantalla espera al próximo camión, así que dice cuál toca: el conduce que
   sigue al último recibido, y la primera losa del plan que aún no se ha tirado.
   Son sugerencias en gris — nada se guarda hasta que el técnico lo confirme. */
function sugerirProximo(day) {
  const hoy = testsOfDate(day);
  const ult = hoy[hoy.length - 1];
  const tk = document.getElementById("f-ticket");
  if (ult && +ult.ticket) tk.placeholder = String(+ult.ticket + 1);
  if (ult && ult.vol) document.getElementById("f-vol").value = document.getElementById("f-vol").value || ult.vol;

  const L = losasDelDia(day);
  const pend = L.lista.find((l) => l.estado !== "vaciada");
  if (pend) document.getElementById("f-ident").placeholder = pend.codigo;
}

function render() {
  const day = todayISO();
  /* Con el plan del día dentro: un tiro programado sin camiones
     también es el tiro de hoy (Q-46). */
  const days = diasDelProyecto();
  const shown = testsOfDate(day).length ? day : days[0];
  const rows = testsOfDate(shown);
  const cy = rows.reduce((a, t) => a + (num(t.vol) || 0), 0);
  document.getElementById("hero-day").textContent = shown === day ? "Vaciado de hoy — " + fmtDate(shown) : "Último vaciado — " + fmtDate(shown);
  /* Q-59: una obra recién abierta todavía no tiene mezcla, y sin esto la
     cabecera de Recepción decía «… · undefined» delante del técnico. */
  document.getElementById("hero-sub").textContent =
    [db.project.name, db.project.mixId].filter(Boolean).join(" · ");
  document.getElementById("next-load").textContent = "Camión #" + (testsOfDate(day).length + 1) + " de hoy";
  document.getElementById("day-tot").textContent = `${rows.length} camiones · ${fmt(cy, 1)} CY`;
  sugerirProximo(day);

  document.getElementById("truck-list").innerHTML = rows.length ? [...rows].reverse().map((t) => {
    const w = worstZone(t);
    const step = (field, label) => t[field]
      ? `<span class="tstep done">✓ ${label} ${t[field]}</span>`
      : `<button class="tstep" onclick="stamp(${t.n},'${field}')">${label} — AHORA</button>`;
    return `<div class="truck-row ${t.rejected ? "rejected" : ""}">
      <div class="tno">${esc(t.truck || "—")}</div>
      <div class="tinfo">
        <div><b>Ticket ${esc(t.ticket || "—")}</b>${t.photo
          ? ` <button class="clip" onclick="verConduceDe(${t.n})" title="Ver el conduce de este camión">📎</button>` : ""}</div>
        <div class="meta">${fmt(t.vol, 1)} CY · llegó ${esc(t.arrive || "—")}${t.ident ? " · " + esc(shortIdent(t.ident)) : ""}</div>
      </div>
      ${step("start", "▶ Comienza")}
      ${step("testTime", "🧪 Muestra")}
      ${step("end", "⏹ Termina")}
      <button class="tstep" onclick="formTest(null,${t.n})" style="border-color:#9fc4e8; color:var(--info)">📋 Resultados</button>
      <button class="tstep" onclick="lineaDeTiempo(${t.n})" title="Qué le pasó a este camión y quién entró cada dato">🕘 Historia</button>
      <span style="margin-left:auto">${estadoBadge(t)}</span>
    </div>`;
  }).join("") : `<div class="empty">Ningún camión registrado hoy. Escanee el primer conduce al llegar.</div>`;
}

loadDB();
initTheme();
mountThemeToggle();
mountStatusBar();
enableLiveSync(render);
render();
</script>
