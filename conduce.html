<style>
/* Conduce entry — field data-entry person. Mobile-first, glove-friendly. */
body { background: var(--bg); }
.entry-hero {
  background: linear-gradient(135deg, #122c42 0%, #0f6db4 100%);
  color: #fff; border-radius: 14px; padding: 18px 20px; margin-bottom: 16px;
  box-shadow: 0 6px 24px rgba(15,40,70,.25);
}
.entry-hero h1 { margin: 0 0 2px; font-size: 21px; }
.entry-hero .sub { color: #bcd4e8; font-size: 13px; }
.capture-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 640px) { .capture-row { grid-template-columns: 1fr; } }
.cap-btn {
  display: flex; align-items: center; justify-content: center; gap: 11px;
  border: 1px solid var(--line); border-radius: 14px;
  background: linear-gradient(168deg, var(--panel-2), var(--panel));
  padding: 16px 14px; cursor: pointer; font-family: inherit; color: var(--ink);
  box-shadow: var(--shadow);
  transition: border-color .18s, box-shadow .18s, transform .16s;
}
/* el color entra por el resplandor, como en el resto de la interfaz */
.cap-btn:hover {
  border-color: rgba(74,99,216,.55); transform: translateY(-1px);
  box-shadow: 0 0 0 3px rgba(74,99,216,.10), 0 0 20px -6px rgba(74,99,216,.9);
}
.cap-btn:active { transform: scale(.985); }
.cap-btn .ico { width: 26px; height: 26px; flex: none; fill: none; stroke: var(--accent2);
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.cap-btn .ico .ic-linea { stroke: var(--accent); }
.cap-btn .t { font-weight: 700; font-size: 15px; letter-spacing: -.005em; }
.big-form .field input { padding: 13px 12px; font-size: 18px; font-weight: 600; }
.big-form .field label { font-size: 11.5px; }
.now-btn {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px;
  font-size: 12px; font-weight: 700; padding: 4px 10px; cursor: pointer; margin-top: 4px;
}
.now-btn:hover { background: var(--hover); }
.truck-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.truck-row .tno { font-size: 22px; font-weight: 900; min-width: 56px; }
.truck-row .tinfo { min-width: 130px; flex: 1 1 130px; }
@media (max-width: 520px) { .truck-row .tinfo { min-width: 0; } .truck-row { padding: 12px 12px; } }
.truck-row .meta { font-size: 12.5px; color: var(--ink-soft); }
.tstep {
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  font-size: 12.5px; font-weight: 700; padding: 8px 12px; cursor: pointer;
}
.tstep:hover { background: var(--hover); }
.tstep.done { background: var(--ok-bg); color: var(--ok); border-color: #bfe3cb; cursor: default; }
#video-wrap { position: relative; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 14px; display: none; }
#video-wrap video { width: 100%; display: block; max-height: 46vh; object-fit: cover; }
#video-wrap .scan-frame {
  position: absolute; inset: 12% 18%; border: 3px solid rgba(255,255,255,.85); border-radius: 14px;
  box-shadow: 0 0 0 2000px rgba(0,0,0,.35);
}
#video-wrap .close-scan { position: absolute; top: 10px; right: 10px; }
.photo-chip { height: 42px; border-radius: 6px; border: 1px solid var(--line); }
</style>
<script src="assets/usuarios.js?v=fb697b5c"></script>
<script src="assets/auth.js?v=c77eb346"></script>
</head>
<body>

<header class="qc-header">
  <div class="brand">
    <a href="control-center.html" style="text-decoration:none"><svg class="mark" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" aria-label="QCheck">
      <defs>
        <mask id="qcm-q1"><rect width="1000" height="1000" fill="#fff"/><path fill="#000" d="M 139 531 H 558 V 802 H 139 Z"/></mask>
        <mask id="qcm-c1"><rect width="1000" height="1000" fill="#fff"/><circle cx="346" cy="720" r="103" fill="#000"/></mask>
      </defs>
      <path fill="var(--logo-blue,#0f46b5)" fill-rule="evenodd" mask="url(#qcm-q1)" d="M 509 63 A 337 337 0 1 1 508.9 63 Z M 509 174 A 226 226 0 1 0 509.1 174 Z"/>
      <path fill="var(--logo-blue,#0f46b5)" d="M 656 615 L 822 781 L 724 879 L 558 713 Z"/>
      <g mask="url(#qcm-c1)">
        <path fill="var(--logo-green,#39a935)" d="M 132 514 L 346 608 L 564 506 L 564 571 L 346 682 L 132 589 Z"/>
        <path fill="var(--logo-g1,#68727f)" d="M 132 642 L 346 736 L 564 620 L 564 681 L 346 804 L 132 704 Z"/>
        <path fill="var(--logo-g2,#4f5a66)" d="M 132 755 L 346 852 L 564 730 L 564 795 L 346 918 L 132 816 Z"/>
      </g>
      <path fill="var(--logo-blue,#0f46b5)" d="M 412 665 A 86 86 0 1 0 412 775 L 368 739 A 31 31 0 1 1 368 701 Z"/>
    </svg></a>
    <div>
      <div class="title">Conduce — Entrada de Campo</div>
      <div class="subtitle">Escanee o registre cada camión al llegar</div>
    </div>
  </div>
  <nav class="tabs">
    <a class="btn small" style="margin:10px 0" href="display.html" target="_blank">🖥 Field Display</a>
  </nav>
</header>

<main style="max-width:900px">
  <div class="entry-hero">
    <h1 id="hero-day">Vaciado de hoy</h1>
    <div class="sub" id="hero-sub">—</div>
  </div>

  <div id="video-wrap">
    <video id="scan-video" playsinline muted></video>
    <div class="scan-frame"></div>
    <button class="btn small close-scan" onclick="stopScan()">✕ Cerrar</button>
  </div>

  <div class="capture-row">
    <button class="cap-btn" onclick="startScan()">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 8.6V5.4A1.4 1.4 0 0 1 5.4 4h3.2M15.4 4h3.2A1.4 1.4 0 0 1 20 5.4v3.2M20 15.4v3.2a1.4 1.4 0 0 1-1.4 1.4h-3.2M8.6 20H5.4A1.4 1.4 0 0 1 4 18.6v-3.2"/><path d="M4 12h16" class="ic-linea"/></svg>
      <span class="t">Escanear QR</span>
    </button>
    <label class="cap-btn">
      <svg class="ico" viewBox="0 0 24 24"><path d="M3.4 8.6h3.2l1.5-2.4h7.8l1.5 2.4h3.2a1 1 0 0 1 1 1v8.4a1 1 0 0 1-1 1H3.4a1 1 0 0 1-1-1V9.6a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.6" r="3.6"/></svg>
      <span class="t">Tomar foto</span>
      <input type="file" accept="image/*" capture="environment" style="display:none" onchange="photoCapture(this)">
    </label>
    <button class="cap-btn" onclick="document.getElementById('manual-card').scrollIntoView({behavior:'smooth'}); document.querySelector('#f-ticket').focus()">
      <svg class="ico" viewBox="0 0 24 24"><rect x="2.6" y="6.2" width="18.8" height="11.6" rx="1.8"/><path d="M6.2 9.8h.01M9.4 9.8h.01M12.6 9.8h.01M15.8 9.8h.01M6.2 13h.01M18.2 9.8h.01M18.2 13h.01M9.4 14.6h5.2"/></svg>
      <span class="t">Entrada manual</span>
    </button>
  </div>

  <div class="panel" id="manual-card">
    <div class="panel-head"><h2>Registrar llegada de camión</h2><div class="spacer"></div>
      <span class="badge info" id="next-load">—</span></div>
    <div class="panel-body big-form">
      <div class="form-grid">
        <div class="field"><label>Ticket / Conduce *</label><input id="f-ticket" inputmode="numeric" placeholder="66861"></div>
        <div class="field"><label>Camión</label><input id="f-truck" inputmode="numeric" placeholder="102"></div>
        <div class="field"><label>Volumen (CY)</label><input id="f-vol" inputmode="decimal" value="10"></div>
        <div class="field"><label>Hora batch (del conduce)</label><input id="f-batch" type="time">
          <button class="now-btn" onclick="setNow('f-batch')">AHORA</button></div>
        <div class="field"><label>Llegada</label><input id="f-arrive" type="time">
          <button class="now-btn" onclick="setNow('f-arrive')">AHORA</button></div>
        <div class="field"><label>Losa / Identificación</label><input id="f-ident" placeholder="L3-0.443"></div>
      </div>
      <div style="display:flex; gap:10px; margin-top:14px; align-items:center">
        <span id="photo-slot"></span>
        <div style="flex:1"></div>
        <button class="btn orange" style="font-size:16px; padding:12px 26px" onclick="saveArrival()">✔ Registrar llegada</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>Camiones de hoy</h2><div class="spacer"></div>
      <span class="muted" id="day-tot" style="font-size:12.5px">—</span></div>
    <div class="panel-body flush" id="truck-list"></div>
  </div>

</main>

<div id="modal-root"></div>
<div id="toast"></div>

<script src="shared/conduce-contract.js?v=55633415"></script>
<script src="assets/seed.js?v=acf41aba"></script>
<script src="assets/core.js?v=427b7868"></script>
<script src="assets/demo.js?v=5b7d9943"></script>
<script>
"use strict";
const state = { day: todayISO() };
let pendingPhoto = null;
let scanStream = null, scanTimer = null;

function setNow(id) { document.getElementById(id).value = nowHM(); }

/* ---------- QR scan (BarcodeDetector + camera) ---------- */
async function startScan() {
  const wrap = document.getElementById("video-wrap");
  if (!("BarcodeDetector" in window)) {
    alert("Este navegador no soporta lectura de QR nativa (use Chrome/Edge en Android, o Safari 17+). Use entrada manual o foto.");
    return;
  }
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  } catch (e) {
    alert("No se pudo abrir la cámara: " + e.message);
    return;
  }
  const video = document.getElementById("scan-video");
  video.srcObject = scanStream;
  await video.play();
  wrap.style.display = "block";
  const detector = new BarcodeDetector({ formats: ["qr_code", "code_128", "code_39"] });
  scanTimer = setInterval(async () => {
    try {
      const codes = await detector.detect(video);
      if (codes.length) { applyScan(codes[0].rawValue); stopScan(); }
    } catch (_) {}
  }, 400);
}
function stopScan() {
  if (scanTimer) clearInterval(scanTimer);
  if (scanStream) scanStream.getTracks().forEach((t) => t.stop());
  scanTimer = scanStream = null;
  document.getElementById("video-wrap").style.display = "none";
}
function applyScan(raw) {
  let d = {};
  try { d = JSON.parse(raw); } catch (_) {
    const parts = raw.split(/[;|,]/).map((s) => s.trim());
    d = { ticket: parts[0], truck: parts[1], vol: parts[2], batch: parts[3] };
  }
  if (d.ticket) document.getElementById("f-ticket").value = d.ticket;
  if (d.truck) document.getElementById("f-truck").value = d.truck;
  if (d.vol) document.getElementById("f-vol").value = d.vol;
  if (d.batch && /^\d{1,2}:\d{2}$/.test(String(d.batch))) document.getElementById("f-batch").value = String(d.batch).padStart(5, "0");
  document.getElementById("f-arrive").value = nowHM();
  toast("Conduce escaneado — verifique y registre");
}

/* ---------- photo evidence ---------- */
function photoCapture(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    const scale = Math.min(1, 900 / img.width);
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    pendingPhoto = c.toDataURL("image/jpeg", 0.6);
    document.getElementById("photo-slot").innerHTML =
      `<img class="photo-chip" src="${pendingPhoto}"> <span class="muted" style="font-size:12px">foto adjunta</span>`;
    document.getElementById("f-arrive").value = document.getElementById("f-arrive").value || nowHM();
    toast("Foto del conduce adjuntada");
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
  input.value = "";
}

/* ---------- save arrival ---------- */
function saveArrival() {
  const ticket = document.getElementById("f-ticket").value.trim();
  if (!ticket) { toast("Falta el número de ticket"); document.getElementById("f-ticket").focus(); return; }
  const t = {
    n: nextTestN(), id: uid(),
    date: todayISO(),
    ticket,
    truck: document.getElementById("f-truck").value.trim() || null,
    vol: num(document.getElementById("f-vol").value),
    plant: "01-SAN JUAN",
    batch: document.getElementById("f-batch").value || null,
    arrive: document.getElementById("f-arrive").value || nowHM(),
    ident: document.getElementById("f-ident").value.trim() || null,
    uwTarget: db.plan.uw.target,
    rejected: false,
  };
  if (pendingPhoto) t.photo = pendingPhoto;
  db.tests.push(t);
  saveDB();
  pendingPhoto = null;
  document.getElementById("photo-slot").innerHTML = "";
  ["f-ticket", "f-truck", "f-ident", "f-batch", "f-arrive"].forEach((id) => document.getElementById(id).value = "");
  document.getElementById("f-vol").value = "10";
  render();
  toast(`Camión ${t.truck || ""} ticket ${t.ticket} registrado`);
}

/* ---------- one-tap timestamps + results ---------- */
function stamp(n, field) {
  const t = db.tests.find((x) => x.n === n);
  if (!t || t[field]) return;
  t[field] = nowHM();
  saveDB(); render();
  toast({ start: "Comienza vaciado", testTime: "Toma de muestra", end: "Termina vaciado" }[field] + " — " + t[field]);
}

/* La pantalla espera al próximo camión, así que dice cuál toca: el conduce que
   sigue al último recibido, y la primera losa del plan que aún no se ha tirado.
   Son sugerencias en gris — nada se guarda hasta que el técnico lo confirme. */
function sugerirProximo(day) {
  const hoy = testsOfDate(day);
  const ult = hoy[hoy.length - 1];
  const tk = document.getElementById("f-ticket");
  if (ult && +ult.ticket) tk.placeholder = String(+ult.ticket + 1);
  if (ult && ult.vol) document.getElementById("f-vol").value = document.getElementById("f-vol").value || ult.vol;

  const L = losasDelDia(day);
  const pend = L.lista.find((l) => l.estado !== "vaciada");
  if (pend) document.getElementById("f-ident").placeholder = pend.codigo;
}

function render() {
  const day = todayISO();
  const days = testDates();
  const shown = testsOfDate(day).length ? day : days[0];
  const rows = testsOfDate(shown);
  const cy = rows.reduce((a, t) => a + (num(t.vol) || 0), 0);
  document.getElementById("hero-day").textContent = shown === day ? "Vaciado de hoy — " + fmtDate(shown) : "Último vaciado — " + fmtDate(shown);
  document.getElementById("hero-sub").textContent = db.project.name + " · " + db.project.mixId;
  document.getElementById("next-load").textContent = "Camión #" + (testsOfDate(day).length + 1) + " de hoy";
  document.getElementById("day-tot").textContent = `${rows.length} camiones · ${fmt(cy, 1)} CY`;
  sugerirProximo(day);

  document.getElementById("truck-list").innerHTML = rows.length ? [...rows].reverse().map((t) => {
    const w = worstZone(t);
    const step = (field, label) => t[field]
      ? `<span class="tstep done">✓ ${label} ${t[field]}</span>`
      : `<button class="tstep" onclick="stamp(${t.n},'${field}')">${label} — AHORA</button>`;
    return `<div class="truck-row ${t.rejected ? "rejected" : ""}">
      <div class="tno">${esc(t.truck || "—")}</div>
      <div class="tinfo">
        <div><b>Ticket ${esc(t.ticket || "—")}</b> ${t.photo ? "📎" : ""}</div>
        <div class="meta">${fmt(t.vol, 1)} CY · llegó ${esc(t.arrive || "—")}${t.ident ? " · " + esc(shortIdent(t.ident)) : ""}</div>
      </div>
      ${step("start", "▶ Comienza")}
      ${step("testTime", "🧪 Muestra")}
      ${step("end", "⏹ Termina")}
      <button class="tstep" onclick="formTest(null,${t.n})" style="border-color:#9fc4e8; color:var(--info)">📋 Resultados</button>
      <span style="margin-left:auto">${estadoBadge(t)}</span>
    </div>`;
  }).join("") : `<div class="empty">Ningún camión registrado hoy. Escanee el primer conduce al llegar.</div>`;
}

loadDB();
initTheme();
mountThemeToggle();
mountStatusBar();
enableLiveSync(render);
render();
</script>
</body>
</html>
