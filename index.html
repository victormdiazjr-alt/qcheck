<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Aplicación en la pantalla de inicio (iOS y Android). Sin estas etiquetas
     y sin el manifest, el icono guardado abre como un MARCADOR de Safari, con
     una franja arriba enseñando el dominio en vez de la aplicación limpia. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QCheck">
<link rel="apple-touch-icon" href="assets/icono-180.png">
<meta name="theme-color" content="#0a0d12">
<title>QCheck — Acceso</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a0d12'/><circle cx='50' cy='50' r='26' fill='none' stroke='%2396c93d' stroke-width='8'/></svg>">
<style>
:root {
  --bg: #0a0d12; --surface: #12171f; --surface-2: #1a2029;
  --logo-blue:#4a7ef0; --logo-green:#57c94f; --logo-g1:#8a95a3; --logo-g2:#6b7683;
  --text: #eef2f6; --muted: #77848f; --hairline: rgba(255,255,255,.11);
  --ok: #34d27b; --susp: #ff5a52; --navy: #4a63d8;
  /* Segarra Engineering — los colores salen del vector oficial
     (assets/logo-segarra.svg): rombo #293992, chevrons #81808a.

     El azul original se hunde sobre este fondo (#0a0d12) hasta desaparecer, así
     que va aclarado manteniendo el tono exacto — mismo criterio que el logo de
     QCheck, que se aclara en pantalla y va original sobre el papel del reporte
     (AGENTS.md §10). Sobre papel se usa #293992 tal cual. El gris no hace falta
     tocarlo: sobre fondo oscuro se lee bien como viene. */
  --segarra-azul: #586ad0; --segarra-gris: #81808a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(900px 520px at 78% -8%, rgba(74,99,216,.20), transparent 62%),
    radial-gradient(700px 420px at 12% 108%, rgba(150,201,61,.12), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  display: flex; align-items: center; justify-content: center;
  padding: 6vh 6vw;
}
.card {
  width: 100%; max-width: 420px;
  background: linear-gradient(168deg, var(--surface-2), var(--surface));
  border: 1px solid var(--hairline); border-radius: 22px;
  padding: 40px 34px 30px;
  box-shadow: 0 22px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
}
.brand { display: flex; align-items: center; gap: 13px; margin-bottom: 6px; }
.brand svg { height: 46px; width: auto; }
.brand .n { font-size: 27px; font-weight: 800; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; margin-bottom: 30px; }

/* ---------- «Online», como exponente del logotipo ----------
   Dice de un vistazo si ESTE aparato está corriendo contra el servidor —o
   sea, si lo que se entre aquí lo van a ver los demás—. Nació de un fallo
   real: el 1 ago 2026 un aparato llevaba horas sin conectar y no había forma
   de saberlo hasta abrir la configuración.

   Va en la pantalla de acceso a propósito: es lo primero que se ve al llegar
   y lo último que se puede mirar antes de empezar a trabajar. Dentro de la
   aplicación el mismo dato vive en la franja de estado.

   El color entra por el resplandor, no por el relleno (AGENTS.md §10). */
.brand .estado {
  display: none; vertical-align: super; margin-left: 4px;
  font-size: 9.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
}
.brand .estado.si {
  display: inline; color: var(--ok);
  animation: respirar 2.4s ease-in-out infinite;
}
/* Configurado pero sin contestar: se dice, no se calla. Un aparato que cree
   estar en la red y no lo está es peor que uno que se sabe solo. */
.brand .estado.no { display: inline; color: var(--susp); text-shadow: 0 0 12px rgba(255,90,82,.5); }
@keyframes respirar {
  0%, 100% { text-shadow: 0 0 6px rgba(52,210,123,.45); opacity: .82; }
  50%      { text-shadow: 0 0 16px rgba(52,210,123,1), 0 0 30px rgba(52,210,123,.55); opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .brand .estado.si { animation: none; text-shadow: 0 0 12px rgba(52,210,123,.8); }
}
label { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
input {
  width: 100%; background: rgba(0,0,0,.28); border: 1.5px solid var(--hairline);
  color: var(--text); border-radius: 12px; padding: 14px 15px;
  font-size: 16px; font-family: inherit; margin-bottom: 18px;
}
input:focus { outline: none; border-color: var(--navy); background: rgba(0,0,0,.4); }
button {
  /* mismo criterio que en el resto: resplandor, no relleno de color */
  width: 100%; background: linear-gradient(168deg, var(--surface-2), var(--surface));
  color: var(--ok); border: 1px solid rgba(52,210,123,.5);
  border-radius: 12px; padding: 16px; font-size: 15px; font-weight: 850;
  letter-spacing: .14em; text-transform: uppercase; font-family: inherit; cursor: pointer;
  box-shadow: 0 0 0 3px rgba(52,210,123,.10), 0 0 26px -6px rgba(52,210,123,.75),
              inset 0 1px 0 rgba(255,255,255,.06);
  transition: transform .14s, box-shadow .2s, border-color .2s;
}
button:hover { border-color: rgba(52,210,123,.8);
  box-shadow: 0 0 0 4px rgba(52,210,123,.16), 0 0 34px -6px rgba(52,210,123,1),
              inset 0 1px 0 rgba(255,255,255,.08); }
button:active { transform: scale(.98); }
.err {
  display: none; background: rgba(255,90,82,.13); border: 1px solid var(--susp);
  color: var(--susp); border-radius: 10px; padding: 11px 13px; font-size: 13px;
  font-weight: 600; margin-bottom: 16px;
}
.err.show { display: block; }
.back { display: block; text-align: center; margin-top: 20px; color: var(--muted); font-size: 12.5px; text-decoration: none; }
.back:hover { color: var(--text); }

/* ---------- Segarra Engineering, al pie ----------
   De quién es la herramienta. Va abajo y en gris a propósito: la marca de esta
   pantalla es QCheck, y dos logotipos peleando arriba no dejan leer ninguno.

   Este es el logotipo REAL, sacado del vector oficial que dio Víctor el 5 ago
   2026 (assets/logo-segarra.svg). NO es el de MARCA_SEGARRA en movil.html:
   aquel eran los chevrons del propio logo de QCheck, recortados, que se usaron
   mientras no había vector bueno. El del portal sigue pendiente de cambiar por
   este. Ver AGENTS.md §8a. */
.firma {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--hairline);
}
/* 26 px y no menos: por debajo, el trazo del rombo baja de 1 px y en una
   pantalla que no sea Retina el rombo se corta a trozos. */
.firma svg { height: 26px; width: auto; flex: none; }
.firma span {
  font-size: 10.5px; font-weight: 700; letter-spacing: .18em;
  text-transform: uppercase; color: var(--muted);
}
</style>
</head>
<body>

<form class="card" onsubmit="entrar(event)">
  <div class="brand">
    <svg class="mark" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" aria-label="QCheck">
      <defs>
        <mask id="qcm-q1"><rect width="1000" height="1000" fill="#fff"/><path fill="#000" d="M 139 531 H 558 V 802 H 139 Z"/></mask>
        <mask id="qcm-c1"><rect width="1000" height="1000" fill="#fff"/><circle cx="346" cy="720" r="103" fill="#000"/></mask>
      </defs>
      <path fill="var(--logo-blue,#0f46b5)" fill-rule="evenodd" mask="url(#qcm-q1)" d="M 509 63 A 337 337 0 1 1 508.9 63 Z M 509 174 A 226 226 0 1 0 509.1 174 Z"/>
      <path fill="var(--logo-blue,#0f46b5)" d="M 656 615 L 822 781 L 724 879 L 558 713 Z"/>
      <g mask="url(#qcm-c1)">
        <path fill="var(--logo-green,#39a935)" d="M 132 514 L 346 608 L 564 506 L 564 571 L 346 682 L 132 589 Z"/>
        <path fill="var(--logo-g1,#68727f)" d="M 132 642 L 346 736 L 564 620 L 564 681 L 346 804 L 132 704 Z"/>
        <path fill="var(--logo-g2,#4f5a66)" d="M 132 755 L 346 852 L 564 730 L 564 795 L 346 918 L 132 816 Z"/>
      </g>
      <path fill="var(--logo-blue,#0f46b5)" d="M 412 665 A 86 86 0 1 0 412 775 L 368 739 A 31 31 0 1 1 368 701 Z"/>
    </svg>
    <span class="n">QCheck<sup class="estado" id="estado-red"></sup></span>
  </div>
  <div class="sub">Control de Hormigón · PR-52</div>

  <div class="err" id="err">Usuario o contraseña incorrectos.</div>

  <label for="u">Usuario</label>
  <input id="u" autocapitalize="none" autocorrect="off" autocomplete="username" required>

  <label for="p">Contraseña</label>
  <input id="p" type="password" autocomplete="current-password" required>

  <button type="submit">Entrar</button>

  <!-- Solo se enseña si este aparato NO tiene servidor puesto. Es la puerta
       para conectarlo, y hace falta que viva aquí: en el iPhone, la aplicación
       guardada en la pantalla de inicio no comparte almacenamiento con Safari
       —conectar desde Safari no conecta el icono— y desde dentro del icono no
       hay barra de direcciones donde pegar el enlace. Se entra por aquí. -->
  <a class="back" id="ir-conectar" href="conectar.html" style="display:none">Conectar este aparato al servidor</a>

  <!-- Aquí vivían las credenciales de demostración y la explicación de qué ve
       cada cuenta. Víctor las sacó el 31 jul 2026: la aplicación no da
       instrucciones — van todas en la guía de usuario. -->

  <!-- De quién es la herramienta. El texto va en el <span>, así que el SVG no
       necesita rótulo propio: repetirlo lo leería dos veces un lector de
       pantalla.

       Trazados copiados TAL CUAL del vector oficial que dio Víctor el 5 ago
       2026, assets/logo-segarra.svg. Va solo el logotipo gráfico —el rombo y
       los tres chevrons—, sin la palabra «Segarra» ni el lema: el nombre ya lo
       pone el <span> de al lado, en la tipografía de la interfaz, y meter dos
       veces el mismo nombre a dos tamaños distintos se ve como un error.

       El viewBox es el recuadro exacto del grupo gráfico dentro del archivo
       original, medido con getBBox(). Si algún día se recorta a ojo, el logo se
       descentra respecto al texto.

       Lo único que cambia respecto al original son los colores, que salen de
       variables para poder aclarar el azul sobre fondo oscuro. Las formas no se
       tocan: es una marca registrada. -->
  <div class="firma">
    <svg viewBox="23.32 50.95 31.11 29.77" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="var(--segarra-gris)" d="M53.07,72.28l-14.43,7.12-13.98-7.04-1.26.66,15.27,7.7,1.28-.66,14.41-7.1-1.28-.68h0Z"/>
      <path fill="var(--segarra-gris)" d="M39.94,70.7l14.41-7.1-1.28-.66-14.43,7.12-13.98-7.06-1.26.66,15.27,7.7,1.28-.66Z"/>
      <path fill="var(--segarra-gris)" d="M38.64,74.71l-13.98-7.04-1.28.66,15.27,7.7,1.28-.66,14.41-7.1-1.28-.66-14.41,7.1h0Z"/>
      <path fill="var(--segarra-azul)" d="M54.43,58.84l-14.49-7.23-1.28-.66-15.34,7.88,15.34,7.88,1.28-.66,14.49-7.2ZM25.82,58.82l12.82-6.55,13.11,6.55-13.11,6.57-12.82-6.57Z"/>
    </svg>
    <span>Segarra Engineering</span>
  </div>
</form>

<script src="assets/usuarios.js?v=03f894c7"></script>
<script>
"use strict";

/* ------------------------------------------------------------ ¿en la red?

   Se pregunta al servidor directamente, sin cargar el motor: esta pantalla
   son dos campos y no va a arrastrar 150 KB para encender una palabra.

   Tres estados, y el silencio también dice algo:
     - contesta          → «Online» en verde, respirando
     - configurado y no contesta → «Offline» en rojo. Callarlo sería peor:
                           el aparato cree estar en la red y no lo está.
     - sin servidor      → nada. Ese aparato trabaja solo a propósito y no
                           hay nada que avisar. */
function pintarRed() {
  const el = document.getElementById("estado-red");
  const api = (localStorage.getItem("qc-api") || "").replace(/\/+$/, "");
  if (!api) { document.getElementById("ir-conectar").style.display = "block"; return; }
  const cab = {};
  const tk = localStorage.getItem("qc-token");
  if (tk) cab["X-QC-Token"] = tk;
  fetch(api + "/api/salud", { headers: cab })
    .then((r) => r.json())
    .then((s) => {
      if (!s.ok) throw new Error("respuesta");
      el.textContent = "Online";
      el.className = "estado si";
      el.title = `${s.cambios} cambios guardados en el servidor`;
    })
    .catch(() => {
      el.textContent = "Offline";
      el.className = "estado no";
      el.title = "Este aparato no está alcanzando el servidor";
    });
}
pintarRed();

/* Entrar contra el SERVIDOR cuando lo hay (Q-07). La ficha que devuelve
   —nombre, papel, capacidades— es la que mandará en todas las pantallas, y el
   pase de sesión es lo que hará que el servidor firme con su nombre cada línea
   que este aparato escriba en el expediente.

   Devuelve la ficha, `null` si las credenciales no valen, o `undefined` si no
   se pudo ni preguntar —servidor caído, sin señal—, que no es lo mismo: eso
   último cae a la lista local, porque en obra la señal se va y dejar al
   técnico fuera de su propia herramienta es peor que lo que evita. Lo que esa
   sesión local NO puede es escribir en el expediente compartido: con
   `exigir_sesion` encendida, el servidor le rechaza los cambios y la franja de
   arriba lo canta. */
async function entrarEnServidor(u, p) {
  const api = (localStorage.getItem("qc-api") || "").replace(/\/+$/, "");
  if (!api) return undefined;
  const cab = { "Content-Type": "application/json" };
  const tk = localStorage.getItem("qc-token");
  if (tk) cab["X-QC-Token"] = tk;
  let r;
  try {
    r = await fetch(api + "/api/sesion", {
      method: "POST", headers: cab,
      body: JSON.stringify({ usr: u, clave: p, dev: localStorage.getItem("qc-dev") || "?" }),
    });
  } catch (_) { return undefined; }          // no se pudo ni preguntar
  if (r.status === 401) return null;         // preguntamos y la respuesta fue que no
  if (!r.ok) return undefined;               // 501 sin cuentas dadas de alta, 500, …
  const s = await r.json();
  sessionStorage.setItem("qc-sesion", s.tk);
  sessionStorage.setItem("qc-ident", JSON.stringify(s.usuario));
  return s.usuario;
}

async function entrar(e) {
  e.preventDefault();
  const u = document.getElementById("u").value.trim().toLowerCase();
  const p = document.getElementById("p").value;
  const boton = document.querySelector("button[type=submit]");
  boton.disabled = true;

  /* Derivar la clave lleva su rato a propósito —100.000 vueltas, el techo
     que admite Cloudflare— así que el
     botón se apaga mientras: si no, dos toques seguidos abren dos sesiones. */
  const delServidor = await entrarEnServidor(u, p);
  boton.disabled = false;

  /* La lista local (assets/usuarios.js) solo entra cuando el servidor no
     contestó. Si contestó que no, es que no. */
  const cuenta = delServidor
    || (delServidor === undefined && QC_CUENTAS[u] && QC_CUENTAS[u].clave === p ? QC_CUENTAS[u] : null);

  if (cuenta) {
    sessionStorage.setItem("qc-auth", "1");
    sessionStorage.setItem("qc-user", u);
    /* Cada acceso arranca un tiro nuevo de la simulación: quien entra se
       encuentra siempre el mismo punto de partida —yarda 90, último camión
       hace 3 minutos— y no lo que dejó a medias la visita anterior.

       El acceso no puede sembrarlo: no carga el motor ni los 397 ensayos, y
       cargarlos aquí sería 150 KB por una pantalla de dos campos. Deja la
       marca y la recoge `sembrarDia()` en la primera pantalla que sí lo carga.

       Solo afecta a HOY y solo si la simulación sigue encendida: si alguien
       programó un tiro de verdad, `db.demo === false` y esto no se ejecuta.
       El histórico del proyecto no se toca nunca. */
    sessionStorage.setItem("qc-nuevo-tiro", "1");
    const next = new URLSearchParams(location.search).get("next");
    /* Desde un teléfono se entra al portal móvil, no al Control Center: en la
       mano solo se consulta. El iPad NO cuenta como teléfono — es el aparato de
       Muestras y necesita el tablero entero. Del portal se puede saltar al
       Control Center con un enlace, por si alguien lo quiere igual. */
    const ua = navigator.userAgent || "";
    const telefono = /iPhone|iPod/.test(ua) || (/Android/.test(ua) && /Mobile/.test(ua));
    /* Quien no lleva el control de calidad va siempre al portal. Quien sí lo
       lleva, al portal desde el teléfono y al Control Center desde la
       computadora. */
    /* Quien tiene casa entra a su casa y punto — Q-37. El contratista, el
       concretero y la Autoridad no pasan por el portal ni por el Control
       Center: aparecen en su tablero. Su casa pisa incluso al `next=`, que
       si no sería la puerta de atrás para colarse en otra pantalla. */
    const suya = cuenta.casa || null;
    const casa = suya || ((telefono || cuenta.rol !== "qc") ? "movil.html" : "control-center.html");
    // solo rutas internas: nunca redirigir a un destino externo
    const destino = suya ? suya
      : (next && /^[\w.-]+\.html([?#].*)?$/.test(next) ? next : casa);
    location.replace(destino);
  } else {
    /* El texto se pone aquí y no se da por bueno el que trae el HTML: desde
       Q-77 ese mismo hueco puede llevar el aviso de «lo desconectaron», y sin
       esta línea una clave mala después de una desconexión seguiría diciendo
       que lo desconectaron. */
    document.getElementById("err").textContent = "Usuario o contraseña incorrectos.";
    document.getElementById("err").classList.add("show");
    document.getElementById("p").value = "";
    document.getElementById("p").focus();
  }
}

/* Llegó aquí porque lo desconectaron desde Estado del sistema — Q-77. Se dice,
   y se dice quién puede volver a abrirle: encontrarse la pantalla de acceso sin
   explicación en mitad de un vaciado es lo que hace que alguien piense que
   QCheck se rompió y deje de anotar. */
if (new URLSearchParams(location.search).get("fuera") === "1") {
  const e = document.getElementById("err");
  e.textContent = "Este aparato se desconectó del servidor desde el Estado del sistema. "
    + "Para volver a conectarlo hace falta el enlace de conexión del proyecto.";
  e.classList.add("show");
}

document.getElementById("u").focus();
</script>
</body>
</html>
