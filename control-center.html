<!DOCTYPE html>

<style>
/* ============================================================
   CONTROL CENTER — la casa de Rubén.
   Widgets con lo que de verdad mira; cada uno entra al detalle.
   ============================================================ */
.cc-hero {
  background:
    radial-gradient(680px 220px at 12% 120%, var(--tinte, rgba(52,210,123,.16)), transparent 70%),
    linear-gradient(125deg, #131a2e 0%, #23305f 60%, #1d3c4c 100%);
  color: #fff; border-radius: 16px; padding: 20px 24px; margin-bottom: 18px;
  display: flex; align-items: flex-start; gap: 18px; flex-wrap: wrap;
  box-shadow: 0 8px 30px rgba(10,30,50,.34);
  border: 1px solid rgba(255,255,255,.08);
}
/* el tinte del fondo y el color del aro salen del estado del tiro */
.cc-hero.t-vaciando { --tinte: rgba(52,210,123,.20); --vc: #56e08e; }
.cc-hero.t-espera   { --tinte: rgba(245,184,61,.18); --vc: #f7c65c; }
.cc-hero.t-detenido { --tinte: rgba(255,90,82,.20); --vc: #ff7a72; }
.cc-hero.t-fin      { --tinte: rgba(74,99,216,.20);  --vc: #8fa6f2; }
.cc-hero.t-quieto   { --tinte: rgba(255,255,255,.06); --vc: #8ea6bd; }
.hp-cab { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.cc-hero .mark2 {
  width: 44px; height: 44px; border-radius: 50%; flex: none;
  border: 2.5px solid var(--vc); color: var(--vc);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 26px -6px var(--vc);
}
.cc-hero .ic-t { width: 22px; height: 22px; fill: none; stroke: currentColor;
  stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
/* El camión hormigonera es el dibujo de Víctor: `assets/mixer.svg`, su vector.
   Entra como MÁSCARA y no como imagen, y por dos razones: así toma el color del
   estado del tiro —ámbar esperando, verde vaciando, rojo detenido—, como el
   resto de los iconos con `currentColor`; y así el archivo se queda fuera del
   HTML en vez de meter 17 KB de trazado en cada pantalla.
   La proporción del dibujo es 709×406 — respétala o sale aplastado. */
.ic-mixer { display: block; width: 28px; height: 16px; background: currentColor;
  -webkit-mask: url(assets/mixer.svg) center/contain no-repeat;
          mask: url(assets/mixer.svg) center/contain no-repeat; }
/* mientras se vacía, el aro respira y el hormigón cae */
.cc-hero.t-vaciando .mark2 { animation: tLatir 2.2s ease-in-out infinite; }
.cc-hero.t-vaciando .ic-cae { animation: tCaer 1.1s linear infinite; }
@keyframes tLatir { 0%,100% { box-shadow: 0 0 24px -7px var(--vc); }
                    50%     { box-shadow: 0 0 34px -5px var(--vc); } }
@keyframes tCaer  { 0% { opacity: .25; transform: translateY(-2px); }
                    45% { opacity: 1; } 100% { opacity: .25; transform: translateY(3px); } }
.cc-hero.t-detenido .mark2 { animation: tLatir 1.5s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .cc-hero .mark2, .cc-hero .ic-cae { animation: none; }
}

/* --- estado y progreso del tiro --- */
.cc-hero .t-estado { font-size: 11px; font-weight: 800; letter-spacing: .2em;
  text-transform: uppercase; color: var(--vc); }
.prog-tiro { margin-top: 0; }
.pt-cifra { display: flex; align-items: baseline; gap: 8px; color: #fff;
  font-variant-numeric: tabular-nums; }
.pt-cifra b { font-size: 44px; font-weight: 250; letter-spacing: -.025em; line-height: 1; }
.pt-de { font-size: 25px; font-weight: 250; color: #9fb6cc; letter-spacing: -.02em; }
.pt-u { font-size: 12px; font-weight: 800; letter-spacing: .16em; color: #8ea6bd; }
.pt-pc { margin-left: 4px; font-size: 17px; font-weight: 700; color: var(--vc); }
.pt-barra { height: 5px; border-radius: 3px; background: rgba(255,255,255,.13);
  margin: 10px 0 6px; overflow: hidden; max-width: 460px; }
.pt-barra i { display: block; height: 100%; border-radius: 3px; background: var(--vc);
  box-shadow: 0 0 12px -2px var(--vc); transition: width .6s cubic-bezier(.25,.6,.25,1); }
.pt-nota { font-size: 11.5px; color: #8ea6bd; }
.pt-nota b { color: var(--vc); font-weight: 700; }
.cc-hero h1 { font-size: 23px; margin: 0; font-weight: 700; letter-spacing: -.01em; color: var(--vc); }
.cc-hero .sub { font-size: 12.5px; color: #9fb6cc; margin-top: 7px; }
/* --- especificaciones del tiro --- */
.cc-hero .ex-fila { display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap;
  color: #dce7f2; margin: 14px 0 0; }
.cc-hero .ex { display: flex; flex-direction: column-reverse; gap: 2px; }
.cc-hero .ex b { font-size: 15px; font-weight: 600; letter-spacing: -.005em;
  font-variant-numeric: tabular-nums; line-height: 1.2; }
.cc-hero .ex i { font-style: normal; font-size: 9px; font-weight: 800; letter-spacing: .18em;
  text-transform: uppercase; color: #8ea6bd; }
.cc-hero .ex-mezcla { font-size: 11px; color: #8ea6bd; margin-top: 7px;
  letter-spacing: .04em; }
.cc-hero .cc-cuerpo { flex: 1 1 auto; min-width: 0; }
/* fila de arriba: progreso · datos · tiempo. Abajo, las losas de lado a lado. */
.hero-fila { display: flex; align-items: flex-start; gap: 26px; flex-wrap: wrap; }
.hero-prog { flex: 1 1 260px; min-width: 240px; }
.hero-datos { flex: 2 1 300px; display: grid; gap: 12px 20px;
  grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); align-content: start; padding-top: 3px; }
.hero-clima { flex: 0 0 auto; }
.hero-clima .clima { color: #eaf1f8; }
.dato { min-width: 0; }
.dato.ancho { grid-column: span 2; }
.dt-k { font-size: 9px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #8ea6bd; }
.dt-v { font-size: 15px; font-weight: 600; color: #dce7f2; margin-top: 3px; line-height: 1.3;
  font-variant-numeric: tabular-nums; }
.dt-v em { font-style: normal; font-weight: 600; font-size: 11.5px; color: #8ea6bd; }
/* el kilometraje a su propia línea: partido queda ilegible */
.dt-v em.linea { display: block; margin-top: 2px; }
.dt-v em.v-ok { color: #7ce7a8; } .dt-v em.v-act { color: #ffd98a; }
.dt-v em.v-bad { color: #ff9d97; } .dt-v em.v-idle { color: #8ea6bd; }
.dt-mix { font-size: 11.5px; font-weight: 500; color: #a9bccf; }
@media (max-width: 900px) {
  .hero-fila { gap: 16px; }
  .hero-clima { width: 100%; }
}
@media (max-width: 720px) {
  /* en el teléfono el tramo se comía dos líneas a tamaño de titular */
  .cc-hero .ex-fila { gap: 8px 18px; }
  .pt-cifra b { font-size: 36px; }
}
/* --- losas del tiro --- */
/* La banda es un enlace al detalle, pero no se disfraza de botón: se ilumina
   al pasar por encima y nada más. El color entra por el resplandor. */
.losas { display: block; text-decoration: none; color: inherit;
  margin-top: 16px; padding: 14px 12px 12px; border-top: 1px solid rgba(255,255,255,.10);
  border-radius: 0 0 12px 12px; transition: background .18s; }
.losas:hover { background: rgba(255,255,255,.04); }
.losas:hover .lz-k b { text-decoration: underline; text-underline-offset: 3px; }
.losas .lz-k { font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase;
  color: #9fb6cc; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.losas .lz-k b { color: #fff; font-size: 12px; letter-spacing: .04em; white-space: nowrap; }
.losas .lz-k .lz-nota { color: #9fb6cc; font-size: 10px; letter-spacing: .12em; }
.losas .lz-vacio { margin-top: 8px; font-size: 12.5px; color: #9fb6cc; }
/* Una losa vaciada fuera del tramo del día: ámbar, que es zona de acción —
   no es un rechazo, es algo que hay que mirar antes de cerrar el lote. */
.losas .lz-fuera { margin-top: 9px; font-size: 12px; color: var(--act);
  border-top: 1px solid rgba(245,184,61,.28); padding-top: 8px; }
.losas .lz-fuera b { color: var(--act); letter-spacing: .04em; }
.losas .lz-tira { display: flex; gap: 7px; margin-top: 8px; overflow-x: auto;
  -webkit-overflow-scrolling: touch; padding-bottom: 5px; scrollbar-width: thin; }
.losas .lz { flex: none; min-width: 104px; padding: 7px 10px 8px; border-radius: 11px;
  border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.045); }
.losas .lz-c { font-size: 11.5px; font-weight: 800; letter-spacing: .02em;
  font-variant-numeric: tabular-nums; white-space: nowrap; color: #c8d8e8; }
.losas .lz-barra { height: 3px; border-radius: 2px; background: rgba(255,255,255,.14);
  margin: 7px 0 5px; overflow: hidden; }
.losas .lz-barra i { display: block; height: 100%; border-radius: 2px;
  background: currentColor; transition: width .5s ease; }
.losas .lz-cy { font-size: 10px; color: #9fb6cc; white-space: nowrap;
  font-variant-numeric: tabular-nums; margin-top: 4px; }
.losas .lz-cy b { font-weight: 700; opacity: .72; }
/* el color entra por el resplandor, no por el relleno */
.losas .lz.ok { color: #7ce7a8; border-color: rgba(52,210,123,.45);
  box-shadow: 0 0 0 2px rgba(52,210,123,.08), 0 0 14px -5px rgba(52,210,123,.8); }
.losas .lz.ok .lz-c { color: #7ce7a8; }
.losas .lz.ok .lz-c::after { content: " ✓"; opacity: .75; }
/* en curso: hay un camión descargando encima ahora mismo */
.losas .lz.curso { color: #ffd98a; border-color: rgba(245,184,61,.5);
  animation: lzLatir 1.8s ease-in-out infinite; }
.losas .lz.curso .lz-c { color: #ffd98a; }
.losas .lz.pendiente { color: #8ea6bd; opacity: .55; }
@keyframes lzLatir { 0%,100% { box-shadow: 0 0 0 2px rgba(245,184,61,.09), 0 0 14px -5px rgba(245,184,61,.7); }
                     50%     { box-shadow: 0 0 0 3px rgba(245,184,61,.17), 0 0 22px -5px rgba(245,184,61,1); } }
@media (prefers-reduced-motion: reduce) { .losas .lz.curso { animation: none; } }

/* --- menú de navegación --- */
.navmenu { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; margin-bottom: 20px; }
.navmenu a, .navmenu button {
  display: flex; flex-direction: column; align-items: center; gap: 9px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 8px 14px; text-decoration: none; color: var(--ink);
  box-shadow: var(--shadow); transition: transform .15s, border-color .15s;
  text-align: center; font-family: inherit; cursor: pointer;
}
.navmenu a:hover, .navmenu button:hover { transform: translateY(-3px); border-color: var(--accent); }
.navmenu a svg, .navmenu button svg { width: 26px; height: 26px; }
.navmenu a .n, .navmenu button .n { font-size: 13px; font-weight: 700; letter-spacing: .01em; }
/* Programar el tiro es la acción con la que empieza el día de verdad, y va la
   primera. El color entra por el resplandor, no por el relleno. */
.navmenu button.accion { border-color: rgba(150,201,61,.45);
  box-shadow: var(--shadow), 0 0 0 3px rgba(150,201,61,.07), 0 0 20px -8px rgba(150,201,61,.9); }
.navmenu button.accion svg { color: var(--accent2); }
.navmenu button.accion:hover { border-color: var(--accent2); }

/* --- widgets --- */
.w {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow); padding: 15px 17px; text-decoration: none; color: var(--ink);
  display: block; position: relative; transition: transform .15s, border-color .15s;
}
a.w:hover { transform: translateY(-3px); border-color: var(--accent); }
a.w::after {
  content: "→"; position: absolute; top: 13px; right: 15px;
  color: var(--ink-soft); font-size: 15px; opacity: .5;
}
a.w:hover::after { opacity: 1; color: var(--accent); }
.w .lbl { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.w .big { font-size: 31px; font-weight: 300; letter-spacing: -.01em; font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 2px; }
.w .sub { font-size: 12.5px; color: var(--ink-soft); }
.w.ok .big { color: var(--ok); } .w.act .big { color: var(--act); } .w.bad .big { color: var(--susp); }
.w .trend { font-size: 12px; font-weight: 700; color: var(--ink-soft); }

/* último camión */
.lastruck { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lastruck .num { font-size: 40px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; }
.lastruck .verd { margin-left: auto; text-align: right; }
.lastruck .verd .w2 { font-size: 21px; font-weight: 700; letter-spacing: .01em; }
.lastruck.ok .verd .w2 { color: var(--ok); } .lastruck.act .verd .w2 { color: var(--act); }
.lastruck.bad .verd .w2 { color: var(--susp); } .lastruck.idle .verd .w2 { color: var(--ink-soft); }

/* avisos */
.alert-row { display: flex; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.alert-row:last-child { border-bottom: none; }
.alert-row .ic { font-size: 19px; line-height: 1.1; }
.alert-row .t { font-weight: 800; font-size: 13.5px; }
.alert-row .d { font-size: 12.5px; margin-top: 1px; }
.alert-row .a { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
</style>
</head>

<script>
"use strict";
const state = { day: null };

/* ---------- menú de navegación: todas las pantallas de QCheck ---------- */
const PANTALLAS = [
  /* En orden del ciclo del camión: llega, se prueba, se anuncia,
     queda registrado, y de ahí lo ve cada parte interesada. */
  { href: "conduce.html", n: "Recepción", r: "Entrada de conduce",
    ic: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3"/><rect x="7.5" y="7.5" width="4" height="4" rx=".6"/><rect x="13" y="7.5" width="3.5" height="4" rx=".6"/><rect x="7.5" y="13" width="4" height="3.5" rx=".6"/><path d="M13.5 13h3M16.5 15.5h-3"/></svg>` },
  { href: "muestras.html", n: "Muestras", r: "Técnico · iPad",
    ic: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5h6M10 2.5v6l-4.4 10a2 2 0 0 0 1.8 2.9h9.2a2 2 0 0 0 1.8-2.9L14 8.5v-6"/><path d="M7.2 15h9.6"/></svg>` },
  { href: "display.html", n: "Field Display", r: "Choferes", nueva: true,
    ic: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M12 16.5v4M8.5 20.5h7"/></svg>` },
  { href: "results.html", n: "Results", r: "Datos y cartas",
    ic: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="14" rx="2"/><polyline points="6,14 10,10 13,12.5 18,7"/></svg>` },
  /* Concretera, contratista y Autoridad ya no van sueltos: entran por la puerta
     «Dashboards», que pregunta cuál. Ver `abrirDashboards()` en core.js. */
  { href: "reporte.html", n: "Reportes", r: "Del vaciado y acumulado",
    ic: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l4 4v15H6z"/><path d="M14 2.5v4h4"/><path d="M9 12h6M9 16h4"/></svg>` },
];

/* Iconos del estado del tiro. Trazo, como el resto de la interfaz. */
const ICONO_TIRO = {
  // hormigón cayendo por la canaleta
  flujo: `<svg viewBox="0 0 24 24" class="ic-t"><path d="M5 5h9l4.2 5.6"/><path d="M8.6 13.4v2.2M12 13.4v3.6M15.4 13.4v2.2" class="ic-cae"/></svg>`,
  camion: `<span class="ic-mixer" role="img" aria-label="Camión hormigonera"></span>`,
  reloj: `<svg viewBox="0 0 24 24" class="ic-t"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.2V12l3.2 2"/></svg>`,
  pausa: `<svg viewBox="0 0 24 24" class="ic-t"><path d="M9.4 6.6v10.8M14.6 6.6v10.8"/></svg>`,
  check: `<svg viewBox="0 0 24 24" class="ic-t"><path d="M5.6 12.4l4.2 4.2 8.6-9"/></svg>`,
  raya: `<svg viewBox="0 0 24 24" class="ic-t"><path d="M6.4 12h11.2"/></svg>`,
};

/* El progreso del tiro, que es la cifra que Rubén mira primero. Sin yardas
   planificadas no hay contra qué medir: se enseña lo colocado y ya, sin barra
   ni porcentaje inventados. */
function progresoHTML(p) {
  const hayPlan = p.cyPlan != null && p.cyPlan > 0;
  return `<div class="prog-tiro">
    <div class="pt-cifra">
      <b>${fmt(p.placed, 1)}</b>${hayPlan ? `<span class="pt-de">/ ${fmt(p.cyPlan, 0)}</span>` : ""}
      <span class="pt-u">CY</span>
      ${hayPlan ? `<span class="pt-pc">${Math.round(p.pct)}%</span>` : ""}
    </div>
    ${hayPlan ? `<div class="pt-barra"><i style="width:${p.pct.toFixed(1)}%"></i></div>` : ""}
    <div class="pt-nota">${p.loads} ${p.loads === 1 ? "camión recibido" : "camiones recibidos"}${
      p.enCurso ? ` · <b>${fmt(p.enCurso, 1)} CY en el camión</b>` : ""}${
      hayPlan ? ` · faltan ${fmt(p.pending, 1)} CY` : ""}${
      p.rejected ? ` · ${p.rejected} rechazado${p.rejected === 1 ? "" : "s"}` : ""}</div>
  </div>`;
}

/* Los datos del tiro en una rejilla compacta: llenan el hueco que quedaba
   entre el progreso y el tiempo, y de paso caben cosas que antes no se veían.
   Cada uno aparece solo si existe — nada se rellena a ojo. */
function datosHTML(day, meta, prog, lt) {
  const d = [];
  const planificada = hora12(meta.horaInicio), real = hora12(inicioReal(day));
  const arrancado = testsOfDate(day).some((t) => t.start || t.arrive);
  if (planificada) d.push(["Comenz" + (arrancado ? "ó" : "ará"), planificada]);
  else if (real)   d.push(["Comenzó", real]);

  const r = ritmoTiro(day);
  if (r) d.push(["Ritmo", `${fmt(r.cyHora, 0)} <em>CY/h</em>`]);
  if (r && r.fin) d.push(["Termina", `≈ ${hora12(r.fin)}`, "aprox"]);

  if (prog.loads) d.push(["Camiones", `${prog.loads}${prog.rejected ? ` <em>· ${prog.rejected} rech.</em>` : ""}`]);
  if (lt && lt.num !== "—") d.push(["Último camión", `${esc(lt.num)} <em class="v-${lt.cls}">· ${esc(lt.w)}</em>`]);

  const sitio = [meta.fase ? "Fase " + esc(meta.fase) : null, meta.lane ? esc(meta.lane) : null].filter(Boolean).join(" · ");
  if (sitio) d.push(["Tramo", sitio + (meta.km ? `<em class="linea">Km ${esc(meta.km)}</em>` : "")]);
  if (db.project.mixId) d.push(["Mezcla", `<span class="dt-mix">${esc(db.project.mixId)}</span>`, "ancho"]);

  if (!d.length) return "";
  return `<div class="hero-datos">${d.map(([k, v, mod]) =>
    `<div class="dato${mod === "ancho" ? " ancho" : ""}"><div class="dt-k">${k}</div><div class="dt-v">${v}</div></div>`).join("")}</div>`;
}

/* Las losas del tiro, cada una con lo que se sepa de su avance.
   Sin lista declarada en el plan del día no se pinta nada — ni un aviso. */
function losasHTML(day) {
  const L = losasDelDia(day);
  if (!L.lista.length && !L.rango) return "";

  const tarjetas = L.lista.map((l) => {
    const cls = l.estado === "vaciada" ? "ok" : l.estado === "curso" ? "curso" : "pendiente";
    const cargas = `${l.cargas} ${l.cargas === 1 ? "carga" : "cargas"}`;
    let avance = "";
    if (l.cy > 0 && l.cyPlan) {
      // hay yardas atribuibles y un plan contra el que medirlas
      avance = `<div class="lz-barra"><i style="width:${l.pct.toFixed(0)}%"></i></div>
        <div class="lz-cy">${l.compartida ? "≥ " : ""}${fmt(l.cy, 1)} <b>de ${fmt(l.cyPlan, 0)} cy</b></div>`;
    } else if (l.cy > 0) {
      avance = `<div class="lz-cy">${l.compartida ? "≥ " : ""}${fmt(l.cy, 1)} <b>cy</b> · ${cargas}</div>`;
    } else if (l.cargas > 0) {
      // solo la sirvieron cargas repartidas entre varias losas: se sabe que se
      // tocó, no cuánto cayó. Nada de pintar una barra al 0%.
      avance = `<div class="lz-cy">${cargas} <b>compartida${l.cargas === 1 ? "" : "s"}</b>${l.cyPlan ? ` · plan ${fmt(l.cyPlan, 0)} cy` : ""}</div>`;
    }
    return `<div class="lz ${cls}">
      <div class="lz-c">${esc(l.codigo)}</div>
      ${avance}
    </div>`;
  }).join("");

  /* Con un TRAMO el encabezado lo dice tal cual, porque las losas de en medio
     no se pueden nombrar sin inventarlas: se van llenando según llegan los
     camiones. El total va con «≈» — es una estimación del paso típico del
     propio proyecto, no un plan declarado. */
  const r = L.rango;
  const enc = r
    ? `Tramo <b>${esc(r.carril)}-${r.desde.toFixed(3)} → ${r.hasta.toFixed(3)}</b>
       <span class="lz-nota">${r.metros} m${r.estimadas ? ` · ≈${r.estimadas} losas` : ""} · ${L.hechas} vaciada${L.hechas === 1 ? "" : "s"}</span>`
    : `Losas del tiro <b>${L.hechas} de ${L.lista.length}</b>`;

  /* Una losa vaciada fuera del tramo del día no se calla: es lo único que el
     tramo permite comprobar, y hoy nadie lo ve hasta que se cierra el lote. */
  const fuera = L.fuera && L.fuera.length
    ? `<div class="lz-fuera">Fuera del tramo declarado: <b>${L.fuera.map(esc).join(", ")}</b></div>`
    : "";

  /* La banda entera es un enlace al detalle, como el resto de los widgets del
     Control Center: cada uno lleva a su pestaña de Results. Aquí, a la lista de
     losas con los camiones que sirvieron cada una. */
  return `<a class="losas" href="results.html#losas" title="Ver el detalle de las losas y qué camión sirvió cada una">
    <div class="lz-k">${enc}</div>
    ${L.lista.length ? `<div class="lz-tira">${tarjetas}</div>`
      : `<div class="lz-vacio">Ningún camión ha vaciado todavía. Las losas aparecen según llegan.</div>`}
    ${fuera}
  </a>`;
}

/* Programar el tiro va primero porque es lo primero del día: la simulación
   sirve para enseñar QCheck, pero para trabajar de verdad hay que declarar el
   plan —hora de comienzo, yardas y losas—, y hasta que no se declara el
   tablero no enseña avance y no se lo inventa. Ver `programarTiro()`. */
const ICONO_PROGRAMAR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 3v4M16 3v4"/><path d="M12 12.5v5M9.5 15h5"/></svg>`;
/* El día del vaciado: el calendario sin el «más», porque esta puerta ya no es
   solo para crear — también se cierra por ella.
   Se llama ICONO_DIA y no ICONO_TIRO porque ese nombre ya es del mapa de
   iconos del estado del héroe, unas líneas más arriba. */
const ICONO_DIA = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 3v4M16 3v4"/><path d="M7.6 14.6h4.2M7.6 17.8h8.8"/></svg>`;

/* La puerta del tiro: programar o cerrar. El dibujo, las teclas y el cierre
   los pone `abrirEleccion()` en core.js, que comparte con Dashboards — lo que
   usan dos sitios no se duplica. Aquí solo van las opciones. */
function abrirTiro() {
  const cerrado = tiroCerrado();
  abrirEleccion({
    titulo: "Tiro",
    pregunta: "¿Qué quiere hacer?",
    /* Sin coletilla: los dos se explican solos. La única que queda es la hora
       en «Reabrir», porque ahí sí hace falta saber cuándo se cerró. */
    opciones: [
      { n: "Programar tiro", ic: ICONO_PROGRAMAR, hacer: () => programarTiro() },
      cerrado
        ? { n: "Reabrir tiro", r: `Cerrado a las ${cerrado}`,
            ic: ICONO_CERRAR, hacer: () => { if (reabrirTiro()) render(); } }
        : { n: "Cerrar tiro", ic: ICONO_CERRAR, hacer: () => { if (cerrarTiro()) render(); } },
      /* Q-48: solo aparece cuando de verdad hace falta — un día planificado
         que nunca recibió un camión. Con obra dentro no se ofrece, porque no
         se puede hacer, y una opción que siempre falla no es una opción. */
      ...(!testsOfDate(diaActivo()).length && (db.dayMeta[diaActivo()] || {}).cyPlan != null
        ? [{ n: "Descartar tiro", r: "Sin camiones registrados",
             ic: ICONO_DESCARTAR,
             hacer: () => { if (descartarTiro(diaActivo())) render(); } }]
        : []),
    ],
  });
}
/* EL AVISO DE TIRO FANTASMA — Q-46, con puerta desde Q-48.

   `diasFantasma()` existía desde Q-46 y en el Control Center se calculaba…
   y no se pintaba en ningún sitio. Es decir: el programa sabía que había un
   vaciado que nunca ocurrió y no se lo decía a nadie, y no había forma de
   llegar a él para quitarlo — las pantallas listan días, y un día fantasma
   justamente no aparece en ninguna lista.

   Aquí se dice y aquí se quita. Es el único sitio desde donde se alcanza. */
function panelFantasmas(lista) {
  if (!lista || !lista.length) return "";
  const puede = typeof qcFirma !== "function" || qcFirma();
  return `
    <section class="panel aviso-fantasma">
      <div class="panel-head"><h2>${lista.length === 1 ? "Un vaciado sin camiones" : lista.length + " vaciados sin camiones"}</h2></div>
      <div class="panel-body">
      <p class="muted" style="margin:0 0 12px">
        ${lista.length === 1 ? "Este día está" : "Estos días están"} en el expediente con yardas
        planificadas y ni un camión registrado. ${puede
          ? "Si no fueron vaciados reales, descártalos: quedan en el archivo, dejan de contar."
          : "Solo el ingeniero de récord puede descartarlos."}
      </p>
      ${lista.map((f) => `
        <div class="fila-fantasma">
          <div>
            <b>${esc(fmtDate(f.dia))}</b>
            <span class="muted"> · ${fmt(f.cyPlan, 0)} CY planificadas${
              f.losasPlan ? " · " + fmt(f.losasPlan, 0) + " losas" : ""}</span>
            ${f.esSimulacion ? `<div class="muted" style="font-size:12px">Cuadra con la simulación del sistema</div>` : ""}
          </div>
          ${puede ? `<button class="btn small" onclick="if (descartarTiro('${esc(f.dia)}')) render()">Descartar</button>` : ""}
        </div>`).join("")}
      </div>
    </section>`;
}

/* ---------- dashboard ---------- */
function render() {
  /* Con el plan del día dentro: un tiro programado sin camiones
     también es el tiro de hoy (Q-46). */
  const days = diasDelProyecto();
  const day = diaPorDefecto();
  state.day = day;
  const rows = testsOfDate(day);
  const prog = dayProgress(day);
  const alerts = trendAlerts(day);
  const fantasmas = typeof diasFantasma === "function" ? diasFantasma() : [];
  const sets = strengthSets();
  const lastMA = [...sets].reverse().find((s) => s._ma5 != null);
  const tests = sortedTests();
  const evaluated = tests.filter((t) => worstZone(t) != null);
  const conf = evaluated.filter((t) => !t.rejected && worstZone(t) !== "susp").length;
  const cumpl = evaluated.length ? conf / evaluated.length * 100 : null;
  const last = rows[rows.length - 1];
  const meta = db.dayMeta[day] || {};
  const h = lastHumidity(day);

  document.getElementById("brand-subtitle").textContent =
    (db.project.name || "") + " · " + (db.project.qcFirm || "");

  // Estado del proyecto: lo primero que debe decir un control center
  const graves = alerts.filter((a) => a.level === "susp").length;
  const fueraSinMarcar = rows.filter((t) => !t.rejected && worstZone(t) === "susp").length;
  let est;
  /* Q-52: el estado del proyecto informa de HECHOS de la obra —camiones
     rechazados, ensayos fuera de límite—, nunca de avisos de tendencia. Un
     aviso es una sospecha del sistema, útil para mirar de reojo, y no puede
     teñir de ámbar la cabecera de un día en el que todo salió bien. Los
     avisos viven abajo, en su panel, y en ningún otro sitio. */
  if (fueraSinMarcar || prog.rejected) {
    est = { cls: "susp", mark: "✕", titulo: "Atención requerida",
      detalle: [prog.rejected ? `${prog.rejected} carga(s) rechazada(s) hoy` : null,
                fueraSinMarcar ? `${fueraSinMarcar} ensayo(s) fuera de límite` : null,
               ].filter(Boolean).join(" · ") };
  } else {
    est = { cls: "ok", mark: "✓", titulo: "Todo en cumplimiento",
      detalle: `${prog.loads} camiones · ${fmt(prog.placed, 1)} CY · sin rechazos` };
  }

  const tiro = estadoTiro(day);

  // veredicto del último camión
  let lt = { cls: "idle", w: "Sin camiones", s: "—", num: "—", meta: "" };
  if (last) {
    const wz = worstZone(last);
    const probando = !last.rejected && num(last.slump) == null && num(last.uw) == null;
    lt = {
      cls: probando ? "idle" : last.rejected || wz === "susp" ? "bad" : wz === "act" ? "act" : "ok",
      w: probando ? "En pruebas" : last.rejected || wz === "susp" ? "Rechazado" : "Aceptado",
      s: probando ? "tomando muestras" : wz === "act" ? "zona de acción" : "",
      num: esc(last.truck || "—"),
      meta: `Ticket ${esc(last.ticket || "—")} · ${esc(shortIdent(last.ident))}`,
    };
  }

  document.getElementById("app").innerHTML = `
    <div class="cc-hero t-${tiro.cls}">
      <div class="cc-cuerpo">
        <div class="hero-fila">
          <div class="hero-prog">
            <div class="hp-cab">
              <div class="mark2">${ICONO_TIRO[tiro.icono]}</div>
              <div class="t-estado">${esc(tiro.txt)}</div>
            </div>
            ${progresoHTML(prog)}
          </div>
          ${datosHTML(day, meta, prog, lt)}
          <div class="hero-clima"><div id="clima"></div></div>
        </div>
        ${losasHTML(day)}
      </div>
    </div>

    ${menu()}

    ${panelFantasmas(fantasmas)}

    <!-- fila 1: lo del día -->
    <div class="grid cols-2" style="margin-bottom:16px">
      <a class="w" href="results.html#daily">
        <div class="lbl">${day === todayISO() ? "Vaciado de hoy" : "Último vaciado · " + esc(fmtDate(day))}</div>
        <div class="big">${fmt(prog.placed, 1)} <span style="font-size:14px">CY</span></div>
        <div class="sub">${prog.loads} camiones${prog.rejected ? " · " + prog.rejected + " rechazado(s)" : ""}</div>
      </a>
      <a class="w ${cumpl != null && cumpl >= 90 ? "ok" : cumpl != null ? "act" : ""}" href="results.html#tests">
        <div class="lbl">Cumplimiento</div>
        <div class="big">${cumpl != null ? fmt(cumpl, 1) + "%" : "—"}</div>
        <div class="sub">${conf} de ${evaluated.length} ensayos del proyecto</div>
      </a>
      <a class="w ${lastMA ? (lastMA._ma5 >= db.plan.cs.target ? "ok" : "bad") : ""}" href="results.html#strength">
        <div class="lbl">Moving Average ${db.plan.cs.age}d</div>
        <div class="big">${lastMA ? fmt(lastMA._ma5, 0) : "—"}</div>
        <div class="sub">objetivo ${fmt(db.plan.cs.target, 0)} psi</div>
      </a>
      <a class="w ${prog.waiting.length > 2 ? "act" : ""}" href="contratista.html">
        <div class="lbl">Camiones esperando</div>
        <div class="big">${prog.waiting.length}</div>
        <div class="sub">${fmt(prog.waitingCY, 1)} CY en sitio</div>
      </a>
    </div>

    <!-- fila 2: lo que Rubén realmente mira.
         Slump y Unit Weight van ENCIMA de los avisos y del último camión
         (Víctor, 31 jul 2026): son las dos lecturas que mira de verdad, así
         que ganan la posición alta. -->
    <div class="grid cols-2" style="margin-bottom:16px">
      <a class="w" href="results.html#charts">
        <div class="lbl">Slump — en vivo <span class="trend">${trendLabel(day, "slump")}</span></div>
        <div class="chart-scroll" style="margin-top:6px">${chartForDay(CHART_DEFS[0], day, 22)}</div>

    <div class="grid cols-2">

    <!-- LOS AVISOS, AL FINAL Y EN NINGÚN OTRO SITIO — Q-52, 7 de agosto de
         2026. Son tendencias que el sistema sospecha, no hechos de la obra:

    <section class="panel avisos-fondo">
      <div class="panel-head"><h2>⚡ Avisos del sistema</h2></div>
      <div class="panel-body">
      ${alerts.length ? alerts.map((a) => `
        <div class="alert-row">
          <span class="ic">${a.icon}</span>
          <div>
            <div class="t" style="color:var(--${a.level === "susp" ? "susp" : "act"})">${esc(a.title)}</div>
            <div class="d">${esc(a.text)}</div>
            <div class="a">▸ ${esc(a.action)}</div>
          </div>
        </div>`).join("")
      : `<div style="color:var(--muted)">Sin avisos — tendencias estables.</div>`}
      </div>
    </section>`;

  // El tiempo en el sitio del tiro. Las coordenadas viven en el proyecto
  // (Plan & Datos) para que Rubén las corrija si el tramo se mueve.
  montarClima(document.getElementById("clima"), {
    lat: num(db.project.lat), lon: num(db.project.lon), lugar: db.project.place,
  });
}

loadDB();
initTheme();
mountThemeToggle();
mountStatusBar();
enableLiveSync(() => render());
render();
</script>
</body>
</html>
