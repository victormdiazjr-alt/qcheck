<style>
/* ============================================================
   ESTADO DEL SISTEMA — la pantalla del administrador.

   Quién está usando QCheck ahora mismo: qué aparatos, en qué
   pantalla y desde cuándo. Se alimenta del latido que manda cada
   aparato cada 20 segundos (`QCSync._latir`).

   NO enseña ningún dato del proyecto. Es la sala de máquinas:
   sirve para saber si el iPad de la obra sigue vivo y si el
   técnico está donde debería, no para mirar hormigón.

   Solo la ve quien lleve `config: true` — la misma llave que
   «Plan & Datos» (AGENTS.md §3).
   ============================================================ */
body { background: var(--bg); }

.res { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 18px; }
.res .caja { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 15px 18px; box-shadow: var(--shadow); }
.res .k { font-size: 9.5px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
.res .v { font-size: 34px; font-weight: 250; line-height: 1.1; font-variant-numeric: tabular-nums; margin-top: 4px; }
.res .caja.vivo .v { color: var(--ok); }
.res .s { font-size: 11.5px; color: var(--ink-soft); }

/* una tarjeta por aparato */
.aps { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.ap {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 15px 17px; box-shadow: var(--shadow); position: relative;
}
/* El color entra por el resplandor, no por el relleno (AGENTS.md §10) */
.ap.vivo { border-color: rgba(52,210,123,.45); box-shadow: 0 0 0 3px rgba(52,210,123,.07), var(--shadow); }
.ap.ido { opacity: .55; }
.ap .cab { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.ap .luz { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-soft); flex: none; }
.ap.vivo .luz { background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: latido 2.2s ease-in-out infinite; }
@keyframes latido { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ap.vivo .luz { animation: none; } }
.ap .nom { font-weight: 750; font-size: 16px; letter-spacing: -.01em; }
.ap .quien { margin-left: auto; font-size: 11px; font-weight: 800; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-soft); }
.ap .pant { font-size: 20px; font-weight: 300; letter-spacing: -.01em; }
.ap .filas { margin-top: 10px; display: grid; gap: 5px; font-size: 12.5px; color: var(--ink-soft); }
/* Lo último que tocó esa persona en el expediente — Q-36. Va pegado a la
   pantalla porque se leen juntos: dónde está y qué hizo. */
.ap .hizo { margin-top: 7px; font-size: 13px; line-height: 1.35; color: var(--ink); }
.ap .hizo b { font-weight: 750; }
.ap .hizo .cuando { color: var(--ink-soft); font-weight: 400; }
.ap .hizo.nada { color: var(--ink-soft); font-style: italic; }
.idos-barra { margin: 18px 0 0; }
.idos-barra:empty { margin: 0; }
#aparatos-idos { margin-top: 14px; }
/* `.aps` lleva `display: grid`, y una regla de hoja propia pisa el
   `[hidden] { display: none }` del navegador. Sin esta línea el botón de
   «ver los desconectados» se pulsa y no pasa nada visible: la lista estaba
   ahí desde el principio. */
.aps[hidden] { display: none; }
.ap .filas b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }

/* Desconectar — Q-77. Va abajo del todo de la tarjeta, separado por una línea:
   es la única acción que hay aquí y la única que le hace algo a otra persona.
   El rojo entra por el borde y el texto, no por el relleno (AGENTS.md §10):
   un botón rojo macizo en cada tarjeta convierte la sala de máquinas en un
   panel de alarmas, y lo que se mira aquí el 99% de las veces es quién está. */
.ap .acciones { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); }
.btn.peligro {
  display: inline-flex; align-items: center; gap: 6px;
  border-color: rgba(255,90,82,.35); color: var(--susp); background: transparent;
}
.btn.peligro svg { width: 14px; height: 14px; flex: none; }
.btn.peligro:hover { border-color: var(--susp); background: rgba(255,90,82,.10); color: var(--susp); }
/* Este mismo aparato, marcado. Desconectarse a uno mismo funciona igual de
   bien, y hay que enterarse antes de pulsar y no después. */
.ap .yo {
  font-size: 9.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-soft); border: 1px solid var(--line); border-radius: 20px;
  padding: 2px 7px; margin-left: 6px; vertical-align: middle;
  /* Entera o a la línea siguiente, pero nunca partida: «ESTE / APARATO» en dos
     renglones estira la tarjeta y descuadra la fila de al lado. */
  white-space: nowrap; display: inline-block;
}
.aviso-ok {
  border: 1px solid rgba(52,210,123,.45); background: rgba(52,210,123,.09); color: var(--ok);
  border-radius: 12px; padding: 13px 16px; font-size: 13.5px; font-weight: 600; margin-bottom: 16px;
}

.vacio { text-align: center; padding: 46px 20px; color: var(--ink-soft); font-size: 14px; }
.aviso-sync {
  border: 1px solid var(--susp); background: var(--susp-bg); color: var(--susp);
  border-radius: 12px; padding: 13px 16px; font-size: 13.5px; font-weight: 600; margin-bottom: 16px;
}
.pie-nota { margin-top: 18px; font-size: 12px; color: var(--ink-soft); }
</style>

<script>
"use strict";

/* Esta pantalla es de la sala de máquinas. Quien no lleve `config: true` no
   pinta nada aquí: se va a su casa. Es la misma llave de «Plan & Datos». */
if (typeof qcVeConfig === "function" && !qcVeConfig()) location.replace("control-center.html");

/* Las pantallas por su nombre de archivo. Lo que no esté en la lista se
   enseña tal cual — es preferible un nombre feo a inventarse uno bonito. */
const PANTALLA = {
  "index.html": "Acceso",
  "conectar.html": "Conectar aparato",
  "control-center.html": "Control Center",
  "movil.html": "Portal",
  "conduce.html": "Recepción",
  "muestras.html": "Muestras",
  "display.html": "Field Display",
  "results.html": "Results",
  "reporte.html": "Reportes",
  "contratista.html": "Dashboard · Contratista",
  "produccion.html": "Dashboard · Concretero",
  "autoridad.html": "Dashboard · Autoridad",
  "estado.html": "Estado del sistema",
};

/* Lo que se está haciendo en cada pantalla — Q-36. La presencia dice DÓNDE
   está cada quien; esto lo dice en voz de obra. Lo que no esté en la lista
   cae en `PANTALLA` y, si tampoco está, sale el nombre del archivo: un nombre
   feo antes que uno inventado. */
const HACIENDO = {
  "muestras.html": "Entrando resultados de muestras",
  "conduce.html": "Recibiendo camiones",
  "display.html": "Pantalla de obra",
  "control-center.html": "En el Control Center",
  "results.html": "Mirando datos y cartas",
  "reporte.html": "Sacando un reporte",
  "movil.html": "En el portal",
  "estado.html": "Mirando el estado del sistema",
  "conectar.html": "Conectando el aparato",
  "index.html": "En el acceso",
  "contratista.html": "Mirando el tablero del contratista",
  "produccion.html": "Mirando el tablero del concretero",
  "autoridad.html": "Mirando el tablero de la autoridad",
};

/* Los que no están conectados se guardan detrás de un botón. En un día de
   vaciado hay tres aparatos trabajando y una lista de aparatos viejos debajo:
   lo que importa es quién está AHORA. Se recuerda entre refrescos —la pantalla
   se repinta sola cada 5 s— porque si no, la lista se cerraría sola en la cara
   de quien acaba de abrirla. */
let verIdos = false;

/* ══════════════════════════════════════════════════════════════════════════
   AVISAR CUANDO ENTRA OTRO — Q-84, 10 de agosto de 2026

   Víctor: «tengo la ventana de estado de sistema abierta y solo estoy yo.
   Quiero que cuando entre otro dispositivo me haga un sonido y me envíe una
   notificación.»

   Esta pantalla ya sabía quién está dentro: se refrescaba y aparecía una
   tarjeta más. Pero **una tarjeta más no se ve si no estás mirando** — y esta
   pantalla se deja abierta en una esquina justo para no tener que mirarla.

   Solo avisa de los que LLEGAN. Nunca del propio aparato, y nunca de los que ya
   estaban cuando se abrió la pantalla: si al abrirla sonara por cada uno, en una
   obra con cuatro teléfonos sonaría cuatro veces y se apagaría el sonido para
   siempre (Q-56).

   El sonido se genera aquí —dos notas cortas— y no es un archivo: no hay que
   descargar nada y suena igual sin conexión. Dos notas y no una porque un pitido
   suelto se confunde con cualquier cosa del teléfono. */
let conocidos = null;              // null = todavía no se ha visto la primera lista

function avisarDeLosQueLlegan(vivos) {
  const ahora = new Set(vivos.map((a) => a.dev).filter(Boolean));
  const yo = (typeof qcAparato === "function" ? qcAparato() : "") || "";

  if (conocidos === null) { conocidos = ahora; return; }   // la primera vuelta no avisa

  const nuevos = [...ahora].filter((d) => !conocidos.has(d) && d !== yo);
  conocidos = ahora;
  if (!nuevos.length) return;

  for (const dev of nuevos) {
    const a = vivos.find((x) => x.dev === dev) || {};
    const quien = a.usr && a.usr !== "?" ? a.usr : dev;
    const donde = a.pagina ? ` · ${a.pagina.replace(/\.html$/, "")}` : "";
    /* SOLO AQUÍ Y SOLO MIENTRAS ESTÁ ABIERTA — Víctor, 12 ago 2026:
       «que solo suene la ventana de estado de sistema cuando entre un
       dispositivo».

       Suena y se ve, y no sale de esta pantalla. Ya NO se pide permiso de
       notificaciones ni se lanza un aviso del sistema: eso aparecía por
       encima de cualquier cosa que estuviera haciendo, y esto es para mirar
       la sala de máquinas cuando se está mirando la sala de máquinas.

       El correo también queda fuera (mismo día, misma razón). */
    sonarLlegada();
    if (typeof toast === "function") toast(`${quien} acaba de entrar${donde}`);
  }
}

/* EL CORREO — Q-85, 10 de agosto de 2026.

   El sonido y la notificación solo llegan si esta pantalla está abierta. Este
   es el aviso que llega con QCheck cerrado y el ordenador apagado: lo manda el
   servidor, no el navegador.

   NO LLEVA DESTINATARIO NI TEXTO. Los dos los pone el servidor (`/api/aviso`).
   Si viajaran desde aquí, cualquiera con una sesión podría mandar lo que
   quisiera desde nuestra dirección.

   SI FALLA, NO MOLESTA. El aviso de verdad — el sonido — ya sonó. Un correo que
   no sale no puede quedarse gritando encima de una pantalla que se usa en obra.
   Se apunta en la consola y se sigue. */
/* APAGADO — 12 de agosto de 2026. Víctor: «olvida lo de que envíe correo por
   ahora». El sonido y la notificación de Q-84 siguen funcionando igual; lo
   único dormido es el correo.

   Se queda el código en vez de borrarlo porque estaba terminado y probado
   contra producción, y porque encenderlo es cambiar este `false`. Lo que NO
   se queda es la llamada: con esto en `false` no sale ni una petición, así
   que no hay avisos rojos en la consola ni intentos contra el servidor. */
const CORREO_ENCENDIDO = false;

/* UNO POR APARATO CADA HORA, y esto no es un detalle de cortesía.

   En obra la señal va y viene. Un aparato que se cae de la lista de presencia
   y vuelve cuenta como llegada nueva — sin freno, una mañana con mala cobertura
   son treinta correos por el mismo iPhone. Y un buzón con treinta avisos
   iguales es un buzón donde ya no se lee ninguno.

   El sonido y la notificación NO llevan freno: esos son inmediatos y el que
   está delante quiere verlos todos. El freno es solo del correo, que es el
   aviso de cuando no hay nadie delante.

   Vive en el aparato (`localStorage`) para que aguante una recarga. Si Víctor
   abre la pantalla en dos sitios podría llegar un correo por sitio; se arregla
   en el servidor el día que estorbe, y hoy no estorba. */
const HORAS_ENTRE_CORREOS = 1;
function correoYaMandado(aparato) {
  const K = "qc-aviso-correo";
  let m = {};
  try { m = JSON.parse(localStorage.getItem(K) || "{}"); } catch (_) {}
  const ahora = Date.now(), tope = HORAS_ENTRE_CORREOS * 3600e3;
  for (const k of Object.keys(m)) if (ahora - m[k] > tope) delete m[k];   // no crece sin fin
  if (m[aparato]) return true;
  m[aparato] = ahora;
  try { localStorage.setItem(K, JSON.stringify(m)); } catch (_) {}
  return false;
}

async function avisarPorCorreo(quien, aparato, pagina) {
  if (!CORREO_ENCENDIDO) return;
  if (typeof QC === "undefined" || !QC._pedir) return;
  if (correoYaMandado(aparato)) return;
  try {
    const r = await QC._pedir("/api/aviso", {
      method: "POST",
      body: JSON.stringify({ tipo: "llegada", quien, aparato, pagina: pagina || "" }),
    });
    if (!r || !r.ok) console.warn("[aviso] el correo no salió:", r && r.error);
  } catch (e) { console.warn("[aviso] el correo no salió:", e.message); }
}

/* Dos notas cortas, generadas al vuelo. Sin archivo y sin descarga. */
function sonarLlegada() {
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    sonarLlegada.ctx = sonarLlegada.ctx || new A();
    const ctx = sonarLlegada.ctx;
    if (ctx.state === "suspended") ctx.resume();
    [[880, 0], [1174.7, 0.13]].forEach(([hz, t]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = hz;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.22);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.25);
    });
  } catch (_) {}
}

/* Un aparato se da por conectado si latió hace menos de un minuto. El latido
   va cada 20 s, así que se puede perder dos seguidos antes de darlo por ido —
   en obra la señal parpadea y no por eso alguien dejó de trabajar. */
const VIVO_MS = 60 * 1000;

function hace(ms) {
  if (ms == null) return "—";
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + " s";
  const m = Math.round(s / 60);
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60);
  return h + " h " + String(m % 60).padStart(2, "0") + " min";
}

/* Lo último que tocó cada persona, sacado del registro de cambios. No se
   inventa nada: si alguien no ha tocado el expediente en lo que abarca la
   ventana que se pidió, la tarjeta lo dice y ya. `ultimoDe` se rellena en
   `refrescar()`; si el servidor todavía no tiene la ruta, queda vacío y las
   tarjetas salen como salían antes. */
let ultimoDe = {};        /* por persona */
let ultimoDeAparato = {}; /* por aparato */

function loQueHizo(dev, usr, ahora) {
  /* Se pregunta primero por el aparato y solo después por la persona. Víctor
     entra como `admin` desde la oficina y desde el portátil: si se fuera solo
     por el nombre, los dos aparatos dirían que acaban de anotar el mismo
     slump y uno de los dos estaría mintiendo. */
  let op = ultimoDeAparato[dev], deOtro = false;
  if (!op && usr) { op = ultimoDe[usr]; deOtro = !!op; }
  if (!op) return `<div class="hizo nada">Sin cambios suyos en el expediente reciente.</div>`;
  const campo = QC_NOMBRE_CAMPO[op.campo] || op.campo;
  const valor = qcValorLegible(op.campo, op.valor);
  /* El cambio se guarda contra el número de fila, no contra el camión. Si este
     aparato ya tiene esa fila sincronizada se dice el camión, que es como se
     habla en obra; si no, se dice la fila y no se adivina. */
  let donde;
  if (op.ent === "dayMeta") {
    donde = `plan del ${esc(op.id)}`;
  } else {
    const fila = (db.tests || []).find((x) => String(x.n) === String(op.id));
    donde = fila && fila.truck ? `camión ${esc(fila.truck)}` : `registro #${esc(op.id)}`;
  }
  const cuando = hace(ahora - Date.parse(op.ts));
  /* Un campo que se vació da «—» en `qcValorLegible`, y «Comentarios —» no
     se lee como una frase. Vaciar un campo es una acción y se dice así. */
  const que = valor === "—" ? `<b>${esc(campo)}</b> sin valor` : `<b>${esc(campo)} ${esc(valor)}</b>`;
  return `<div class="hizo">${que} · ${donde}` +
         ` <span class="cuando">· hace ${cuando}${deOtro ? ", desde otro aparato" : ""}</span></div>`;
}

/* Este mismo aparato, el que está mirando la pantalla. Se marca porque
   desconectarse a uno mismo funciona igual de bien y hay que saberlo antes de
   pulsar, no después. */
function esEsteAparato(dev) {
  return dev && dev === (typeof qcAparato === "function" ? qcAparato() : null);
}

function tarjeta(a, vivo, ahora) {
  const yo = esEsteAparato(a.dev);
  return `<div class="ap ${vivo ? "vivo" : "ido"}">
    <div class="cab">
      <i class="luz"></i>
      <span class="nom">${esc(a.dev)}${yo ? ` <span class="yo">este aparato</span>` : ""}</span>
      <span class="quien">${esc(a.usr || "—")}</span>
    </div>
    <div class="pant">${esc(HACIENDO[a.pagina] || PANTALLA[a.pagina] || a.pagina || "—")}</div>
    ${loQueHizo(a.dev, a.usr, ahora)}
    <div class="filas">
      <div>Usando QCheck desde hace <b>${hace(a.usando)}</b></div>
      <div>${vivo ? `Última señal hace <b>${hace(a.inactivo)}</b>` : `Sin señal desde hace <b>${hace(a.inactivo)}</b>`}</div>
    </div>
    <div class="acciones">
      <button class="btn small peligro" data-dev="${esc(a.dev)}" data-usr="${esc(a.usr || "")}" data-yo="${yo ? "1" : ""}">
        ${ICONO_DESCONECTAR}Desconectar</button>
    </div>
  </div>`;
}

const ICONO_DESCONECTAR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.8v7.4"/><path d="M17.6 6.6a7.6 7.6 0 1 1-11.2 0"/></svg>`;

/* Desconectar un aparato — Q-77.

   Se pregunta antes con el nombre del aparato y de quien lo está usando
   escritos con todas las letras: en la lista hay tarjetas parecidas, y echar
   al iPad de Muestras creyendo que se echaba a un portátil viejo se arregla
   volviendo a entrar, pero en mitad de un vaciado cuesta un rato de obra.

   Lo que hace: al servidor se le caen las sesiones de ese aparato, y el aparato
   se entera en su siguiente latido —hasta 20 segundos—, **suelta la llave del
   proyecto** y se va al acceso. Deja de sincronizar, deja de latir y desaparece
   de esta lista. Para volver hace falta el enlace de conexión, no solo la
   clave: eso es lo que hace que «desconectado» quiera decir desconectado.

   Lo que tuviera sin subir NO se pierde: se queda en su cola y sale en cuanto
   alguien lo vuelva a conectar. */
async function desconectar(dev, usr, yo) {
  const quien = usr && usr !== "?" ? ` (${usr})` : "";
  const aviso = yo
    ? `¿Desconectar ESTE aparato del servidor?\n\nEs el que está usando ahora mismo. Va a salir al acceso, y para volver a conectarlo hará falta el enlace de conexión del proyecto.`
    : `¿Desconectar «${dev}»${quien} del servidor?\n\nEn menos de un minuto saldrá al acceso y dejará de sincronizar.\n\nPara volver a conectarlo hará falta el enlace de conexión del proyecto — no basta con la clave.\n\nLo que tenga sin subir no se pierde: sale cuando se reconecte.`;
  if (!confirm(aviso)) return;

  try {
    const cab = { "Content-Type": "application/json" };
    const tk = qcApiToken();
    if (tk) cab["X-QC-Token"] = tk;
    const ses = localStorage.getItem("qc-sesion");
    if (ses) cab["X-QC-Sesion"] = ses;
    const r = await fetch(qcApiURL() + "/api/desconectar", {
      method: "POST", headers: cab, body: JSON.stringify({ dev }),
    });
    if (r.status === 403) throw new Error("Esta cuenta no puede desconectar aparatos.");
    if (r.status === 404 || r.status === 501) throw new Error("Este servidor todavía no sabe desconectar aparatos. Hay que actualizarlo.");
    if (!r.ok) throw new Error("El servidor contestó " + r.status + ".");
    const d = await r.json();

    /* Se dice lo que pasó de verdad, no «listo». Si el servidor no conocía el
       aparato o no había ninguna sesión abierta suya, eso es justo lo que hay
       que saber: el botón se pulsó y no echó a nadie. */
    if (!d.conocido) {
      fallo(`El servidor no tiene latido de «${dev}», así que no hay a quién avisar.`);
    } else {
      nota = {
        html: `<div class="aviso-ok">«${esc(dev)}» quedó desconectado` +
              (d.sesiones ? ` · ${d.sesiones} ${d.sesiones === 1 ? "sesión cerrada" : "sesiones cerradas"} en el servidor` : "") +
              ` · suelta el servidor en su próximo latido, hasta 20 s.</div>`,
        hasta: Date.now() + 30000,
      };
    }
    refrescar();
  } catch (e) {
    fallo(e.message === "Failed to fetch" ? "No se está llegando al servidor." : e.message);
  }
}

function pintar(datos) {
  const ahora = Date.parse(datos.ahora);
  const aps = (datos.aparatos || []).map((a) => ({
    ...a,
    inactivo: ahora - Date.parse(a.visto),
    usando: ahora - Date.parse(a.desde),
  }));
  const vivos = aps.filter((a) => a.inactivo < VIVO_MS);

  document.getElementById("resumen").innerHTML = `
    <div class="caja vivo"><div class="k">Conectados ahora</div>
      <div class="v">${vivos.length}</div>
      <div class="s">${vivos.length === 1 ? "aparato" : "aparatos"} latiendo</div></div>
    <div class="caja"><div class="k">Aparatos conocidos</div>
      <div class="v">${aps.length}</div>
      <div class="s">han usado QCheck alguna vez</div></div>
    <div class="caja"><div class="k">Sesión más larga</div>
      <div class="v" style="font-size:26px">${vivos.length ? hace(Math.max(...vivos.map((a) => a.usando))) : "—"}</div>
      <div class="s">llevan trabajando</div></div>`;

  const vivosDom = aps.filter((a) => a.inactivo < VIVO_MS);
  const idos = aps.filter((a) => a.inactivo >= VIVO_MS);

  avisarDeLosQueLlegan(vivosDom);

  document.getElementById("aparatos").innerHTML = aps.length
    ? (vivosDom.length
        ? vivosDom.map((a) => tarjeta(a, true, ahora)).join("")
        : `<div class="vacio">Nadie está conectado ahora mismo.</div>`)
    : `<div class="vacio">Ningún aparato ha latido todavía.<br>Aparecen solos en cuanto alguien abre QCheck conectado.</div>`;

  const caja = document.getElementById("aparatos-idos");
  caja.innerHTML = idos.map((a) => tarjeta(a, false, ahora)).join("");
  caja.hidden = !verIdos;
  document.getElementById("idos-barra").innerHTML = idos.length
    ? `<button class="btn small" id="btn-idos">${verIdos
        ? "Ocultar los que no están conectados"
        : `Ver ${idos.length === 1 ? "el aparato" : "los " + idos.length + " aparatos"} que no ${idos.length === 1 ? "está" : "están"} conectado${idos.length === 1 ? "" : "s"}`}</button>`
    : "";
  const btn = document.getElementById("btn-idos");
  if (btn) btn.onclick = () => { verIdos = !verIdos; pintar(datos); };

  /* Los botones se enganchan después de pintar y no con `onclick=` dentro del
     HTML: el nombre del aparato lo pone quien conecta y puede traer comillas.
     Va por `data-dev`, que el navegador ya sabe leer sin que nadie lo escape. */
  for (const b of document.querySelectorAll(".ap .acciones button")) {
    b.onclick = () => desconectar(b.dataset.dev, b.dataset.usr, !!b.dataset.yo);
  }

  document.getElementById("pie").textContent =
    `Se refresca sola cada 10 segundos · un aparato se da por ido si pasa un minuto sin latir · hora del servidor ${new Date(ahora).toLocaleTimeString("es-PR")}`;
}

/* Un aviso que dice «conéctelo primero» y no dice por dónde deja a alguien
   mirando una pantalla roja. El aviso trae su puerta. */
function fallo(msg, puerta) {
  nota = null;
  document.getElementById("aviso").innerHTML =
    `<div class="aviso-sync">${esc(msg)}${puerta
      ? ` <a class="btn small" href="conectar.html" style="margin-left:10px">Conectar este aparato</a>` : ""}</div>`;
}

/* Lo que se acaba de hacer, con fecha de caducidad. La pantalla se repinta sola
   cada 10 segundos y limpia el aviso; sin esto, «quedó desconectado» duraría
   menos que el parpadeo y nadie llegaría a leerlo. */
let nota = null;
function pintarNota() {
  const caja = document.getElementById("aviso");
  if (nota && Date.now() < nota.hasta) { caja.innerHTML = nota.html; return; }
  nota = null;
  caja.innerHTML = "";
}

async function refrescar() {
  if (!qcSyncActivo()) {
    fallo("Este aparato no está conectado al servidor, así que no puede preguntar quién más lo está.", true);
    document.getElementById("aparatos").innerHTML = "";
    document.getElementById("resumen").innerHTML = "";
    return;
  }
  try {
    const cab = {};
    const tk = qcApiToken();
    if (tk) cab["X-QC-Token"] = tk;
    const r = await fetch(qcApiURL() + "/api/presencia", { headers: cab });
    if (r.status === 401) throw new Error("La llave de este aparato no es la del proyecto.");
    if (!r.ok) throw new Error("El servidor contestó " + r.status + ".");

    /* La actividad va aparte y no puede tumbar la pantalla: un servidor que
       todavía no tenga la ruta deja las tarjetas como estaban en vez de
       dejar a quien mira sin saber quién está conectado. */
    ultimoDe = {}; ultimoDeAparato = {};
    try {
      const ra = await fetch(qcApiURL() + "/api/actividad?n=300", { headers: cab });
      if (ra.ok) {
        const d = await ra.json();
        /* Vienen de la más reciente hacia atrás, así que la primera de cada
           persona es la suya más nueva. */
        /* Solo cuenta lo que es trabajo: los camiones del expediente y el
           plan del día. `config` son ajustes internos del propio programa
           —encender la demostración, por ejemplo— y salían los primeros
           porque son de lo más reciente que se escribe. Decir que alguien
           «está haciendo demo = false» no es decir nada. */
        for (const op of d.ops || []) {
          if (op.ent === "config" || !op.id) continue;
          if (op.usr && !ultimoDe[op.usr]) ultimoDe[op.usr] = op;
          if (op.dev && !ultimoDeAparato[op.dev]) ultimoDeAparato[op.dev] = op;
        }
      }
    } catch (_) { /* sin actividad se sigue igual */ }

    pintarNota();
    pintar(await r.json());
  } catch (e) {
    fallo(e.message === "Failed to fetch" ? "No se está llegando al servidor." : e.message);
  }
}

loadDB();
initTheme();
mountThemeToggle();
mountStatusBar();
enableLiveSync(() => {});   // el latido de este aparato también sale de aquí
refrescar();
setInterval(refrescar, 10000);
</script>
