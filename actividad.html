<!DOCTYPE html>

<style>
/* ============================================================
   ACTIVIDAD — qué está pasando ahora mismo.

   Víctor, la mañana del primer tiro de verdad: «¿puedes hacerme una pantalla
   donde yo pueda ver un log de todo lo que está haciendo Rubén en tiempo real?»

   El expediente YA lo guarda todo: cada línea lleva su hora, su aparato y quién
   estaba dentro. Lo que faltaba no era el dato — era leerlo. Esta pantalla no
   añade ni un campo: traduce.

   Y traduce a FRASES. Un renglón que diga `test/msaf…/uw = 152.1` no lo lee
   nadie que no haya escrito el código; «Rubén midió el camión 209: unit weight
   152.1» lo lee cualquiera desde el teléfono. Es la misma regla de siempre en
   este proyecto: el qué y el porqué, no el cómo.
   ============================================================ */
body { background: var(--bg); padding-top: calc(var(--qcs-h, 42px) + 8px); }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 14px 60px; }

.cab { display: flex; align-items: center; gap: 12px; padding: 14px 2px 10px; }
.cab h1 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.cab .sub { font-size: 12px; color: var(--muted); }
.cab .spacer { flex: 1; }

/* El pulso: verde y latiendo mientras llegue algo; gris si el servidor calla. */
.pulso { display: inline-flex; align-items: center; gap: 7px; font-size: 11px;
  font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.pulso i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.pulso.vivo { color: var(--ok); }
.pulso.vivo i { background: var(--ok); animation: late 2s ease-in-out infinite; }
@keyframes late { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.82); } }

.quienes { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.quien { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel-2); font-size: 12.5px; }
.quien b { font-weight: 800; }
.quien .ap { color: var(--muted); font-size: 11.5px; }

/* Cada suceso es una fila. La hora a la izquierda, siempre en la misma
   columna: se lee la lista en vertical sin buscar. */
.linea { display: grid; grid-template-columns: 62px 1fr; gap: 12px;
  padding: 11px 12px; border-radius: 12px; border: 1px solid transparent; }
.linea + .linea { margin-top: 4px; }
.linea:nth-child(odd) { background: rgba(255,255,255,.022); }
.linea.nueva { border-color: rgba(52,210,123,.45); background: rgba(52,210,123,.07); }
.hora { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
.qué { font-size: 14px; line-height: 1.45; }
.qué b { font-weight: 750; }
.quien-tag { color: var(--muted); font-size: 12px; }
.detalle { margin-top: 3px; font-size: 12.5px; color: var(--muted); }
.detalle .v { color: var(--text); font-variant-numeric: tabular-nums; }
/* Los tres que importan de verdad se marcan: entra un camión, se cierra el
   tiro, se descarta algo. El resto es contexto. */
.linea.hito .qué b { color: var(--ok); }
.linea.ojo .qué b { color: var(--act); }

.vacio { text-align: center; color: var(--muted); padding: 50px 16px; font-size: 14px; }
.dia { margin: 18px 0 8px; font-size: 11px; font-weight: 800; letter-spacing: .16em;
  text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
<script src="assets/usuarios.js?v=7523e141"></script>
<script src="assets/auth.js?v=b9cf7fd2"></script>

<div class="wrap">
  <div class="cab">
    <div>
      <h1>Actividad</h1>
      <div class="sub" id="sub">Qué está pasando ahora mismo</div>
    </div>
    <div class="spacer"></div>
    <span class="pulso" id="pulso"><i></i><span id="pulso-txt">conectando</span></span>
  </div>
  <div class="quienes" id="quienes"></div>
  <div id="feed"><div class="vacio">Cargando…</div></div>
</div>

<script src="assets/sync.js?v=91dd60cb"></script>
<script src="assets/seed.js?v=acf41aba"></script>
<script src="assets/core.js?v=6f937768"></script>
<script>
"use strict";
/* Mirar quién hace qué es cosa de quien lleva el contrato, no de quien mide un
   camión — Q-96. Y NO vale la llave de Settings: esa la llevan Rubén y los
   técnicos, así que con ella el registro de lo que hacen se lo encontrarían
   ellos mismos. Va por `qcVeActividad()`, que hoy es una sola cuenta.

   La puerta está aquí Y en el botón que lleva hasta aquí, a propósito:
   esconder el botón no es cerrar la pantalla, y la dirección se puede escribir
   a mano. */
if (typeof qcVeActividad !== "function" || !qcVeActividad()) location.replace("control-center.html");

/* La base primero: la barra de estado lee `db.dayMeta` para saber si hay tiro
   abierto, y sin ella revienta antes de pintar nada. Es lo mismo que hacen las
   demás pantallas — se puso aquí después de verlo fallar. */
loadDB();
mountStatusBar();

const CADA = 4000;          // cada cuánto se pregunta al servidor
let vistos = new Set();     // uid ya pintados, para marcar solo lo nuevo
let primeraVuelta = true;

/* ---------- de campos a frases ----------

   Los apuntes de una misma pulsación de «Guardar» comparten `ts`, aparato y
   registro. Se juntan y se cuenta UNA cosa, no doce. */
function agrupar(ops) {
  const grupos = new Map();
  for (const o of ops) {
    const k = `${o.ts}|${o.dev}|${o.ent}|${o.id}`;
    if (!grupos.has(k)) grupos.set(k, { ts: o.ts, dev: o.dev, usr: o.usr, ent: o.ent, id: o.id, campos: {}, uids: [] });
    grupos.get(k).campos[o.campo] = o.valor;
    grupos.get(k).uids.push(o.uid);
  }
  return [...grupos.values()];
}

const nombreObra = (id) => {
  const p = (db.proyectos || []).find((x) => x && x.id === id);
  return p ? String(p.name || p.id).split("·")[0].trim() : id;
};
const camionDe = (id) => {
  const t = (db.tests || []).find((x) => x && x.id === id);
  return t || null;
};
const num2 = (v) => (v == null || v === "" ? null : v);

/* Devuelve { texto, detalle, clase } o null si no vale la pena contarlo. */
function contar(g) {
  const c = g.campos;
  const tiene = (...k) => k.some((x) => x in c);

  if (g.ent === "test") {
    const t = camionDe(g.id) || {};
    const cam = c.truck || t.truck;
    const tk = c.ticket || t.ticket;
    const quien = cam ? `camión <b>${esc(String(cam))}</b>` : "un camión";
    const conduce = tk ? ` · conduce ${esc(String(tk))}` : "";

    /* Un camión NACE cuando llega su número de orden. Todo lo demás que pase
       después es una corrección o una medida. */
    if ("n" in c) {
      const cy = num2(c.vol);
      const det = [cy != null ? `${fmt(cy, 1)} yd³` : "sin yardas",
                   c.ident ? esc(String(c.ident)) : null,
                   c.company ? esc(String(c.company)) : null,
                   c.source === "foto" ? "leído de la foto" : c.source === "qticket" ? "vino de QTicket" : null]
        .filter(Boolean).join(" · ");
      return { texto: `recibió el ${quien}${conduce}`, detalle: det, clase: "hito" };
    }
    if (c.borrado === true)
      return { texto: `retiró el ${quien} del expediente`, detalle: c.borradoMotivo ? esc(String(c.borradoMotivo)) : "", clase: "ojo" };
    if (c.rejected === true)
      return { texto: `RECHAZÓ el ${quien}`, detalle: "no se coloca", clase: "ojo" };

    if (tiene("slump", "uw", "air", "temp")) {
      const partes = [];
      for (const [k, et] of [["slump", "slump"], ["uw", "unit weight"], ["air", "aire"], ["temp", "temp"]]) {
        if (k in c && c[k] != null) partes.push(`${et} <span class="v">${fmt(c[k], k === "uw" ? 1 : k === "temp" ? 0 : 2)}</span>`);
      }
      if (!partes.length) return { texto: `borró las lecturas del ${quien}`, detalle: "", clase: "ojo" };
      return { texto: `midió el ${quien}`, detalle: partes.join(" · "), clase: "" };
    }
    if (tiene("start", "end", "testTime")) {
      const q = "start" in c ? "empezó a vaciar" : "end" in c ? "terminó de vaciar" : "tomó la muestra";
      const h = c.start || c.end || c.testTime;
      return { texto: `${q} el ${quien}`, detalle: h ? `a las ${esc(String(h))}` : "", clase: "" };
    }
    if (tiene("cs5", "cs28", "cs7"))
      return { texto: `entró la resistencia del ${quien}`, detalle: "", clase: "" };
    /* Un cambio suelto: se dice qué campo, con su nombre de persona. */
    const k = Object.keys(c)[0];
    return { texto: `corrigió el ${quien}`,
             detalle: `${esc(QC_NOMBRE_CAMPO[k] || k)}: <span class="v">${esc(String(c[k] == null ? "—" : c[k]))}</span>`, clase: "" };
  }

  if (g.ent === "dayMeta") {
    const dia = fmtDate(g.id);
    if (c.cerradoA) return { texto: `<b>cerró el tiro</b> del ${dia}`, detalle: `a las ${esc(String(c.cerradoA))}`, clase: "hito" };
    if (c.borrado === true) return { texto: `descartó el tiro del ${dia}`, detalle: c.borradoMotivo ? esc(String(c.borradoMotivo)) : "", clase: "ojo" };
    if ("cyPlan" in c || "proyecto" in c || "horaInicio" in c) {
      const obra = c.proyecto ? nombreObra(c.proyecto) : null;
      const det = [obra ? `<b>${esc(obra)}</b>` : null,
                   c.estructura ? esc(String(c.estructura)) : null,
                   c.cyPlan != null ? `${fmt(c.cyPlan, 1)} yd³` : null,
                   c.losas ? esc(String(c.losas)) : null,
                   c.horaInicio ? `desde las ${esc(String(c.horaInicio))}` : null,
                   c.spec === "934" ? "SP-934" : null].filter(Boolean).join(" · ");
      return { texto: `<b>programó el tiro</b> del ${dia}`, detalle: det, clase: "hito" };
    }
    return { texto: `cambió los datos del tiro del ${dia}`, detalle: "", clase: "" };
  }

  if (g.ent === "plan")
    return { texto: `cambió los límites de <b>${esc(nombreObra(g.id))}</b>`,
             detalle: Object.keys(c).map((k) => esc(QC_NOMBRE_CAMPO[k] || k)).join(", "), clase: "ojo" };

  if (g.ent === "project") {
    /* `planes = []` es la limpieza de Q-93 corriendo sola al cargar. Se dice,
       porque si no parece que alguien tocó la obra. */
    if ("planes" in c && Array.isArray(c.planes) && !c.planes.length)
      return { texto: `abrió QCheck y su aparato limpió la historia inventada del plan de <b>${esc(nombreObra(g.id))}</b>`,
               detalle: "automático · Q-93", clase: "" };
    return { texto: `cambió la ficha de <b>${esc(nombreObra(g.id))}</b>`,
             detalle: Object.keys(c).map((k) => esc(QC_NOMBRE_CAMPO[k] || k)).join(", "), clase: "" };
  }

  if (g.ent === "config") return null;      // ruido de la simulación
  return null;
}

/* ---------- pintar ---------- */
function pintar(ops) {
  const grupos = agrupar(ops).sort((a, b) => (a.ts < b.ts ? 1 : -1));
  const feed = document.getElementById("feed");
  const html = [];
  let diaPuesto = null;

  for (const g of grupos) {
    const linea = contar(g);
    if (!linea) continue;
    const d = g.ts.slice(0, 10);
    if (d !== diaPuesto) { html.push(`<div class="dia">${esc(fmtDate(d))}</div>`); diaPuesto = d; }
    const nueva = !primeraVuelta && g.uids.some((u) => !vistos.has(u));
    const hora = new Date(g.ts).toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    html.push(`<div class="linea ${esc(linea.clase)} ${nueva ? "nueva" : ""}">
      <div class="hora">${esc(hora)}</div>
      <div>
        <div class="qué"><b>${esc(g.usr || "?")}</b> ${linea.texto}</div>
        ${linea.detalle ? `<div class="detalle">${linea.detalle}</div>` : ""}
        <div class="quien-tag">${esc(g.dev || "—")}</div>
      </div>
    </div>`);
    for (const u of g.uids) vistos.add(u);
  }
  feed.innerHTML = html.length ? html.join("") : `<div class="vacio">Todavía no hay actividad.</div>`;
  primeraVuelta = false;
}

/* Quién ha tocado algo en la última media hora, y desde qué aparato. */
function pintarQuienes(ops) {
  const media = Date.now() - 30 * 60000;
  const gente = new Map();
  for (const o of ops) {
    if (new Date(o.ts).getTime() < media) continue;
    const k = (o.usr || "?") + "|" + (o.dev || "—");
    if (!gente.has(k) || gente.get(k) < o.ts) gente.set(k, o.ts);
  }
  const el = document.getElementById("quienes");
  el.innerHTML = [...gente.entries()]
    .sort((a, b) => (a[1] < b[1] ? 1 : -1))
    .map(([k, ts]) => {
      const [usr, dev] = k.split("|");
      const min = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
      return `<span class="quien"><b>${esc(usr)}</b><span class="ap">${esc(dev)} · ${min < 1 ? "ahora" : "hace " + min + " min"}</span></span>`;
    }).join("") || `<span class="quien"><span class="ap">nadie en la última media hora</span></span>`;
}

let ultimoSeq = 0;
async function mirar() {
  const pulso = document.getElementById("pulso");
  const txt = document.getElementById("pulso-txt");
  try {
    const api = (typeof qcApiURL === "function" ? qcApiURL() : (localStorage.getItem("qc-api") || "").replace(/\/+$/, ""));
    if (!api) { txt.textContent = "sin servidor"; pulso.classList.remove("vivo"); return; }
    const cab = {};
    const tk = localStorage.getItem("qc-token"); if (tk) cab["X-QC-Token"] = tk;
    const ses = localStorage.getItem("qc-sesion"); if (ses) cab["X-QC-Sesion"] = ses;
    const r = await fetch(api + "/api/actividad?n=300", { headers: cab });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const ops = d.ops || [];
    const seq = ops.length ? ops[0].seq : 0;
    /* Solo se repinta si de verdad hay algo nuevo: repintar cada cuatro
       segundos hace saltar la lista bajo el dedo de quien está leyendo. */
    if (seq !== ultimoSeq) { ultimoSeq = seq; pintar(ops); }
    pintarQuienes(ops);
    pulso.classList.add("vivo");
    txt.textContent = "en vivo";
    document.getElementById("sub").textContent =
      `${ops.length} apuntes · el expediente va por el ${seq}`;
  } catch (e) {
    pulso.classList.remove("vivo");
    txt.textContent = "sin conexión";
  }
}
mirar();
setInterval(mirar, CADA);
/* Al volver a la pantalla se pregunta ya, sin esperar los cuatro segundos:
   quien vuelve al teléfono quiere ver lo de ahora, no lo de hace un rato. */
document.addEventListener("visibilitychange", () => { if (!document.hidden) mirar(); });

/* LA FRANJA DECÍA «This device only» EN UN APARATO CONECTADO — Q-96, 14 ago 2026.

   Esta era la ÚNICA pantalla que cargaba `sync.js` y no arrancaba el motor.
   Sin arrancarlo, `QCSync.estado` se queda en su valor de nacimiento —
   `"apagado"`— y `pintarConexion()` pinta «This device only» **sin haber
   comprobado nada**. No es que midiera mal: es que no llegaba a medir.

   Y el aparato estaba conectado. Esta misma pantalla lo demostraba dos dedos
   más abajo: sin `qc-api` puesto, `mirar()` sale por «sin servidor» y la lista
   queda vacía — y la lista estaba llena, en vivo, con el expediente por el
   40145.

   Víctor lo cazó el 14 de agosto entrando desde la MacBook nueva, y estuvo un
   rato creyendo que había conectado mal el aparato. El comentario de
   `pintarConexion()` en core.js ya avisaba de que ese estado «ya despistó dos
   veces». Van tres, y esta se la comió el dueño.

   Arrancar el motor aquí es lo que hacen las demás pantallas, y en una de
   lectura no empuja nada: la cola solo se llena en `alGuardar()`, o sea al
   guardar, y aquí no se guarda. Lo que sí hace es MEDIR de verdad, que es lo
   único que puede convertir ese rótulo en cierto. */
if (typeof QCSync !== "undefined") QCSync.arrancar();
</script>
