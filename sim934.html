<script>
/* ══════════════════════════════════════════════════════════════════════════
   QCheck 934 — la simulación, una pantalla por parte. Q-67, 8 ago 2026.

   Cuatro roles, cuatro tableros distintos sobre los MISMOS datos. Que sean
   distintos no es decoración: es la tesis del producto.

     · **Rubén** opera y firma. Ve el trabajo de ahora y la responsabilidad.
     · **Carreteras** decide. Ve el resultado y de dónde sale, y nada de operar.
     · **El contratista** cobra. Ve hacia dónde va el dinero mientras aún se
       puede hacer algo.
     · **La concretera** produce. Ve cómo rinde su mezcla — y NO ve los factores
       de pago, que son entre el contratista y la Autoridad.

   Lo que cada uno **no** ve está decidido con el mismo cuidado que lo que ve.

   No usa `db` en ningún momento: todo sale de `simDatos()`. Ver la nota de
   arriba de `sim934.js` sobre por qué eso no se negocia.
   ══════════════════════════════════════════════════════════════════════════ */

const SIM_ROLES = {
  /* La pantalla es de la FIRMA, no de la persona: quien la usa hoy es Rubén y
     mañana puede ser otro técnico suyo, y el expediente lo firma Segarra
     Engineering. Víctor, 8 ago 2026. */
  ruben:       { n: "Segarra Engineering", q: "Ingeniero de récord", ico: "✍" },
  autoridad:   { n: "Autoridad de Carreteras", q: "Aceptación", ico: "⚖" },
  contratista: { n: "Del Valle Group", q: "Contratista", ico: "🏗" },
  concretera:  { n: "Concre-Tech", q: "Concretera", ico: "🏭" },
};

const simParams = new URLSearchParams(location.search);
const simRol = simParams.get("rol") || "ruben";
const simVista = simParams.get("v") || "";

/* LO INTERNO SE VE POR CUENTA, NO POR PANTALLA — Q-68, 8 ago 2026.

   Las notas de por qué se decidió una cosa y no otra son valiosas para quien
   construye y ruido para quien mira una demostración. Van detrás de
   `qcVeConfig()`, que hoy solo tiene la cuenta de Víctor.

   Lo que NO se esconde nunca, sea quien sea: la cinta de simulación y el aviso
   de que los datos son inventados. Eso no es diseño interno — es no engañar. */
const interno = typeof qcVeConfig === "function" && qcVeConfig();

/* LA MARCA DE LA 934 — Q-69, 8 ago 2026.

   QCheck lleva años juzgando camión a camión. La 934 añade encima otro
   criterio —por lotes, estadístico— y mezclarlos sin avisar es la manera más
   rápida de que alguien lea un número con la vara equivocada: un camión
   «aceptado» en control de proceso puede estar dentro de un lote que la 934
   descuenta, y las dos cosas son ciertas a la vez.

   Todo lo que **solo existe bajo la 934** lo dice. Siempre, y de la misma
   forma. */
const m934 = () => `<span class="m934" title="Solo aplica bajo la SP-934">934</span>`;
const siInterno = (html) => (interno ? html : "");
const S = simDatos();
const HOY = S.hoy;

/* Los límites de la 934 para este proyecto. Sin permeabilidad: la PR-22 no la
   inspecciona, así que el compuesto usa 0.90/0.10. */
function simLimites() {
  const c = SP934_CCS[S.project.clase];
  const u = sp934LimitesCUW(S.project.uwTarget);
  return {
    ccs: { campo: "cs28", lsl: c.lsl, usl: c.usl, n: "Resistencia", u: "psi a 28 días", clase: S.project.clase },
    cuw: { campo: "uw", lsl: u.lsl, usl: u.usl, n: "Unit Weight", u: "pcf" },
  };
}

const simVivos = () => S.tests.filter((t) => !t.rejected);
const simDelDia = (d) => S.tests.filter((t) => t.date === d);
const simLotes = () => sp934Lotes(simVivos());

/* ─────────────────────────────────────────────────────── piezas comunes ── */
/* `label` se escapa —es texto y puede venir de un dato— y la marca de la 934
   va por su propio parámetro, que sí es HTML de la casa. Meter la etiqueta
   dentro del texto la enseñaba en crudo: `esc()` estaba haciendo bien su
   trabajo y era la llamada la que estaba mal. Q-69. */
function simStat(label, valor, sub, clase, marca) {
  return `<div class="stat ${marca ? "es934" : ""}">
    <div class="label">${esc(label)}${marca ? m934() : ""}</div>
    <div class="value ${esc(clase || "")}">${valor}</div>
    <div class="sub">${sub || ""}</div></div>`;
}

function simZonaSlump(v) {
  const p = S.plan.slump;
  if (v == null) return null;
  if (v < p.suspLo || v > p.suspHi) return "susp";
  if (v < p.actLo || v > p.actHi) return "act";
  return "ok";
}
function simZonaUW(v) {
  const p = S.plan.uw;
  if (v == null) return null;
  const d = Math.abs(v - p.target);
  return d > p.susp ? "susp" : d > p.act ? "act" : "ok";
}

function simVeredictoDe(t) {
  if (t.rejected) return { z: "susp", txt: "Rechazado" };
  const zs = [simZonaSlump(t.slump), simZonaUW(t.uw)].filter(Boolean);
  if (!zs.length) return { z: null, txt: "Sin ensayar" };
  if (zs.includes("susp")) return { z: "susp", txt: "Fuera de límite" };
  if (zs.includes("act")) return { z: "act", txt: "Aceptado · zona de acción" };
  return { z: "ok", txt: "Aceptado" };
}

function simTablaCamiones(lista, cols) {
  const c = cols || {};
  return `<div class="tabla-ancha"><table class="data"><thead><tr>
    <th class="n">#</th><th>Ticket</th><th>Camión</th>
    ${c.losa ? "<th>Losa</th>" : ""}
    <th class="n">CY</th><th class="n">Slump</th><th class="n">U.W.</th>
    ${c.aire ? '<th class="n">Aire</th><th class="n">Temp</th>' : ""}
    <th>Estado</th></tr></thead><tbody>
    ${lista.map((t) => {
      const v = simVeredictoDe(t);
      return `<tr class="${t.rejected ? "rechazado" : ""}">
        <td class="n mono">${t.n}</td><td class="mono">${esc(t.ticket)}</td>
        <td class="mono">${esc(t.truck)}</td>
        ${c.losa ? `<td>${esc(t.ident)}</td>` : ""}
        <td class="n mono">${fmt(t.vol, 1)}</td>
        <td class="n mono ${simZonaSlump(t.slump) ? "z-" + simZonaSlump(t.slump) : ""}">${t.slump != null ? fmtSlump(t.slump) : "—"}</td>
        <td class="n mono ${simZonaUW(t.uw) ? "z-" + simZonaUW(t.uw) : ""}">${t.uw != null ? fmt(t.uw, 1) : "—"}</td>
        ${c.aire ? `<td class="n mono">${t.air != null ? fmt(t.air, 1) : "—"}</td>
                    <td class="n mono">${t.temp != null ? fmt(t.temp, 0) : "—"}</td>` : ""}
        <td>${v.z ? `<span class="badge ${v.z}">${esc(v.txt)}</span>` : `<span class="muted">${esc(v.txt)}</span>`}</td>
      </tr>`;
    }).join("")}
  </tbody></table></div>`;
}

/* LO QUE SE SABE ANTES DE LOS 28 DÍAS.

   Un lote que se está vaciando hoy **no tiene** roturas a 28 días: es física,
   no una carencia del programa. Así que el factor de pago no existe todavía y
   enseñarlo en guiones no dice nada.

   Lo que sí hay son las roturas a 7 días, que el laboratorio ya devolvió. **No
   se convierten a 28** —eso sería inventar un dato— pero dicen si la mezcla va
   por donde debe, que es lo que permite llamar a la planta a tiempo.

   Se enseña como lo que es: una señal temprana, no una aceptación. Q-67. */
function indicador7() {
  const ls = simLotes(), enCurso = ls[ls.length - 1];
  const v = enCurso.ensayos.map((t) => t.cs7).filter((x) => x != null);
  if (!v.length) return { n: 0, media: null, sobre: null };
  const media = v.reduce((a, b) => a + b, 0) / v.length;
  /* Contra la resistencia de diseño, no contra un límite de la 934: a 7 días
     la norma no juzga nada. */
  return { n: v.length, media, sobre: media / S.plan.cs.target };
}

/* ───────────────────────────────────────────────────────────── RUBÉN ───── */
/* Opera y firma. Lo primero que necesita saber: qué falta ahora mismo. */
function simPanelRuben() {
  const ls = simLotes(), enCurso = ls[ls.length - 1];
  const cfgs = simLimites();
  const hoyTests = simDelDia(HOY);
  const cy = hoyTests.filter((t) => !t.rejected).reduce((a, t) => a + t.vol, 0);
  const plan = S.dayMeta[HOY].cyPlan;
  const esperando = hoyTests.filter((t) => !t.rejected && !t.end).length;
  const ultimo = hoyTests[hoyTests.length - 1];

  const sorteo = sortearMuestreo({ proyecto: S.project.name, lote: enCurso.n,
    cuando: "2026-08-08T05:40:00Z", quien: "Rubén Segarra" });
  const asign = muestrasDelSorteo(enCurso, sorteo);
  const porMuestrear = asign.filter((a) => a.estado !== "asignado");
  const cils = cilindrosDelLote(enCurso, { plan: { edades: S.project.edades } });

  return `
    ${simCabeceraRol()}

    <!-- LO DE SIEMPRE. Un proyecto 934 sigue siendo una obra: el vaciado del
         día, los camiones y el último veredicto mandan igual que sin la norma.
         Si esto se degrada, no hemos ganado nada. -->
    <div class="grid cols-3" style="margin-bottom:14px">
      ${simStat("Vaciado de hoy", `${fmt(cy, 0)} <span style="font-size:14px">/ ${fmt(plan, 0)} CY</span>`,
             `${hoyTests.length} camiones · ${esperando} en obra`)}
      ${simStat("Último camión", ultimo ? `#${ultimo.n}` : "—",
             ultimo ? `ticket ${ultimo.ticket} · ${simVeredictoDe(ultimo).txt}` : "")}
      ${simStat(`Lote ${enCurso.n}`, `${enCurso.sublotes.length} <span style="font-size:14px">/ 10</span>`,
             `sub-lotes · ${fmtVolumen(enCurso.m3)}`, "", true)}
    </div>

    <!-- EL DINERO, DETRÁS DE UNA SOLA PUERTA. Antes estaba repartido por tres
         paneles y eso obliga a leer factores de pago mientras se dirige un
         vaciado. Son dos cabezas distintas: aquí se decide qué camión muestrear
         y ahí dentro se mira cuánto va a cobrar el lote. -->
    <section class="panel"><div class="panel-head"><h2>Qué falta ahora</h2></div>
      <div class="panel-body">
        <ul class="tareas">
          <li><b>${porMuestrear.length}</b> sub-lote(s) del lote ${enCurso.n} sin muestra asignada. ${m934()}</li>
          <li><b>${cils.filter((c) => c.tipo === "ccs").length}</b> juegos de cilindros — 6 cada uno, a ${S.project.edades.join(" y ")} días. ${m934()}</li>
          <li>Coordinación con el laboratorio de la Autoridad: <b>hecha</b> el 6 de agosto. ${m934()}</li>
          <li><b>${esperando}</b> camión(es) todavía en obra sin terminar de descargar.</li>
        </ul>
      </div>
    </section>

    <section class="panel es934"><div class="panel-head"><h2>Muestreo aleatorio del lote ${enCurso.n}</h2>
      ${m934()}<div class="spacer"></div><span class="muted">ASTM D3665</span></div>
      <div class="panel-body">
        <p class="muted">Sorteado el 8 ago a las 05:40, antes del primer camión. Semilla
        <code>${esc(sorteo.semilla)}</code> — se puede rehacer y da lo mismo.</p>
        <div class="tabla-ancha"><table class="data"><thead><tr>
          <th class="n">Sub-lote</th><th class="n">Punto</th><th>Camión que toca</th><th>Estado</th>
        </tr></thead><tbody>
          ${asign.map((a) => `<tr>
            <td class="n mono">${a.sublote}</td>
            <td class="n mono">${fmt(a.fraccion * 100, 0)} %</td>
            <td>${a.ensayo ? `#${a.ensayo.n} · ticket ${esc(a.ensayo.ticket)}` : "—"}</td>
            <td>${a.estado === "asignado" ? `<span class="badge ok">muestreado</span>`
                 : `<span class="muted">por llegar</span>`}</td></tr>`).join("")}
        </tbody></table></div>
      </div>
    </section>

    <section class="panel"><div class="panel-head"><h2>Camiones de hoy</h2></div>
      <div class="panel-body">${simTablaCamiones(hoyTests.slice().reverse(), { losa: true, aire: true })}</div>
    </section>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   LA PANTALLA DEL PAGO — Q-74, 8 de agosto de 2026.

   Pantalla completa, no una ficha encima. Aquí está **todo** lo que tiene que
   ver con el dinero del contrato: el estado, lote por lote, el histórico y los
   reportes que se firman.

   Es pantalla y no ventana emergente porque una ficha se lee de pie y esto se
   estudia sentado: es la conversación de cuánto se cobra, y se compara,
   se imprime y se lleva a una reunión.

   Sale de los mismos números que la 934 exige y de ningún otro sitio. Aquí no
   hay estimaciones comerciales: si un lote no tiene factor todavía, se dice
   que no lo tiene.
   ══════════════════════════════════════════════════════════════════════════ */
function panelPago() {
  /* Quitar el botón no basta: quien escriba la dirección entraría igual. Los
     factores de pago son entre el contratista y la Autoridad, y una regla que
     solo vive en un botón no es una regla — es una sugerencia. Q-74. */
  if (simRol === "concretera") {
    return `<section class="panel"><div class="panel-body">
      <p>Los factores de pago son entre el contratista y la Autoridad de Carreteras.</p>
      <p class="muted">La concretera ve la calidad de su mezcla, que es lo que puede corregir.</p>
      <div class="lote-acciones"><a class="btn small" href="sim934.html?rol=concretera">← Volver</a></div>
    </div></section>`;
  }
  const cfgs = simLimites();
  const ls = simLotes();
  const enCurso = ls[ls.length - 1];
  const proy = proyeccionDeLote(enCurso, cfgs);
  const cerrados = ls.filter((l) => !l.parcial).map((l) => ({ l, ev: sp934EvaluarLote(l, cfgs) }));
  const i = indicador7();

  /* El factor medio se pesa por VOLUMEN, no por número de lotes: un lote de
     250 m³ que descuenta pesa lo mismo que uno que bonifica solo si los dos
     tienen el mismo tamaño, y los lotes parciales no lo tienen. */
  const m3Cerrado = cerrados.reduce((a, c) => a + c.l.m3, 0);
  const medio = m3Cerrado
    ? cerrados.reduce((a, c) => a + c.ev.cpaf * c.l.m3, 0) / m3Cerrado : null;

  const barra = (f) => {
    /* De 0.85 a 1.05, que es el rango que la 934 puede dar. La línea del 1.000
       está dibujada porque es la frontera entre cobrar y que te descuenten. */
    const min = 0.85, max = 1.05;
    const pct = Math.max(0, Math.min(1, (f - min) / (max - min))) * 100;
    const uno = ((1 - min) / (max - min)) * 100;
    return `<div class="pf-barra">
      <div class="pf-relleno ${f >= 1 ? "ok" : "act"}" style="width:${pct}%"></div>
      <div class="pf-uno" style="left:${uno}%" title="1.000 — se cobra a precio"></div>
    </div>`;
  };

  return `
    <div class="pago-cab">
      <a class="btn small" href="sim934.html?rol=${simRol}">← Volver</a>
      <div><h1>Pago del contrato</h1>
        <div class="muted">${esc(S.project.name)} · ${esc(S.project.contractId)}</div></div>
      <div class="spacer"></div>
      ${m934()}
    </div>

    <div class="grid cols-3" style="margin-bottom:16px">
      ${simStat("Factor medio del contrato", medio != null ? fmt(medio, 3) : "—",
             `ponderado por volumen · ${fmt(m3Cerrado, 0)} m³ evaluados`,
             medio == null ? "" : medio >= 1 ? "z-ok" : "z-act")}
      ${simStat("Lotes evaluados", `${cerrados.length} <span style="font-size:14px">de ${ls.length}</span>`,
             `${ls.length - cerrados.length} en curso`)}
      ${simStat("Efecto sobre el precio",
             medio != null ? (medio >= 1 ? "+" : "") + fmt((medio - 1) * 100, 1) + " %" : "—",
             "sobre el hormigón ya evaluado",
             medio == null ? "" : medio >= 1 ? "z-ok" : "z-act")}
    </div>

    <h2 class="seccion">Lote en curso</h2>
    <section class="panel es934"><div class="panel-body">
      <div class="pago-encurso">
        <div><b>Lote ${enCurso.n}</b>
          <div class="muted">${enCurso.sublotes.length} de 10 sub-lotes · ${fmtVolumen(enCurso.m3)}</div></div>
        <div class="spacer"></div>
        ${proy.cpaf.ahora != null
          ? `<div class="pago-tres">
              <div><span class="k">Suelo</span><b>${fmt(proy.cpaf.suelo, 3)}</b></div>
              <div><span class="k">Ahora</span><b>${fmt(proy.cpaf.ahora, 3)}</b></div>
              <div><span class="k">Techo</span><b>${fmt(proy.cpaf.techo, 3)}</b></div>
             </div>`
          : `<div class="muted">Sin factor hasta las roturas de 28 días</div>`}
      </div>
      ${proy.cpaf.ahora == null ? `
        <p style="margin:12px 0 0">El factor de este lote <b>no existe todavía</b>: la 934 lo
        calcula con las roturas a <b>28 días</b> y este hormigón se está colocando hoy.
        Se sabrá el <b>5 de septiembre de 2026</b>.</p>
        <p class="muted dinero-nota">Señal a 7 días: <b>${i.media != null ? fmt(i.media, 0) : "—"} psi</b>
        en ${i.n} juegos, el ${i.sobre != null ? fmt(i.sobre * 100, 0) : "—"} % del diseño.
        A 7 días la norma no juzga.</p>` : ""}
    </div></section>

    <h2 class="seccion">Histórico de lotes</h2>
    <section class="panel"><div class="panel-body">
      ${cerrados.map(({ l, ev }) => `
        <div class="pf-fila">
          <div class="pf-n">Lote ${l.n}<span class="muted">${esc(fmtDate(l.desde))}</span></div>
          ${barra(ev.cpaf)}
          <div class="pf-f ${ev.cpaf >= 1 ? "z-ok" : "z-act"}">${fmt(ev.cpaf, 3)}</div>
          <div class="pf-e">${ev.cpaf > 1 ? `<span class="badge ok">bonifica</span>`
            : ev.cpaf === 1 ? `<span class="muted">a precio</span>`
            : `<span class="badge act">descuenta</span>`}</div>
        </div>`).join("")}
      <p class="muted dinero-nota">La marca vertical es el <b>1.000</b>: a la derecha se
      bonifica, a la izquierda se descuenta. El factor multiplica el precio unitario por el
      tamaño del lote.</p>
    </div></section>

    <h2 class="seccion">Detalle por característica</h2>
    <section class="panel"><div class="panel-body">
      <div class="tabla-ancha"><table class="data"><thead><tr>
        <th class="n">Lote</th><th>Característica</th><th class="n">n</th>
        <th class="n">Media</th><th class="n">s</th><th class="n">PWL</th><th class="n">Factor</th>
      </tr></thead><tbody>
        ${cerrados.map(({ l, ev }) => Object.entries(ev.aqc).map(([k, r], j) => `<tr>
          <td class="n mono">${j === 0 ? l.n : ""}</td>
          <td>${esc(cfgs[k].n)}<div class="muted" style="font-size:11px">${esc(cfgs[k].u)}</div></td>
          <td class="n mono">${r.n}</td><td class="n mono">${fmt(r.media, 1)}</td>
          <td class="n mono">${fmt(r.s, 2)}</td>
          <td class="n"><b class="z-${r.pwl >= 90 ? "ok" : r.pwl >= 60 ? "act" : "susp"}">${fmt(r.pwl, 1)} %</b></td>
          <td class="n mono">${fmt(r.paf, 3)}</td></tr>`).join("")).join("")}
      </tbody></table></div>
      <p class="muted dinero-nota">El factor compuesto sale de estos: ${cfgs.cp
        ? "0.45 · resistencia + 0.45 · permeabilidad + 0.10 · Unit Weight"
        : "0.90 · resistencia + 0.10 · Unit Weight — este proyecto no inspecciona permeabilidad"}.</p>
    </div></section>

    <h2 class="seccion">Reportes</h2>
    <section class="panel"><div class="panel-body">
      <p class="muted">El reporte de lote lleva el cálculo entero —media, desviación, índices
      de calidad y porcentajes parciales— para que quien firme pueda rehacerlo. Y el sorteo del
      muestreo con su semilla.</p>
      <div class="lote-acciones">
        ${cerrados.map(({ l }) => `<button class="btn small"
          onclick="alert('Reporte del lote ${l.n} — en la aplicación sale a impresora o PDF.')">
          Reporte del lote ${l.n}</button>`).join("")}
        <button class="btn small"
          onclick="alert('Resumen del contrato — un documento con todos los lotes y el factor ponderado.')">
          Resumen del contrato</button>
      </div>
    </div></section>`;
}

function simFicha(titulo, cuerpo) {
  if (document.getElementById("qcd")) return;
  const ov = document.createElement("div");
  ov.id = "qcd"; ov.className = "qcd";
  ov.innerHTML = `<div class="qcd-caja qcd-ancha" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
      <div class="qcd-cab"><div><div class="qcd-k">${esc(titulo)}</div></div>
        <button class="qcd-x" type="button" aria-label="Cerrar">✕</button></div>
      <div class="qcd-cuerpo">${cuerpo}</div></div>`;
  const cerrar = () => ov.remove();
  ov.querySelector(".qcd-x").onclick = cerrar;
  ov.onclick = (e) => { if (e.target === ov) cerrar(); };
  document.getElementById("modal-root").appendChild(ov);
}

/* ────────────────────────────────────────────────────────── CARRETERAS ── */
/* Decide. No opera. Ve el resultado y de dónde sale. */
function simPanelAutoridad() {
  const cfgs = simLimites();
  const ls = simLotes();
  const cerrados = ls.filter((l) => !l.parcial);
  const enCurso = ls.filter((l) => l.parcial);

  const fila = (l) => {
    const ev = sp934EvaluarLote(l, cfgs);
    return `<section class="panel"><div class="panel-head">
        <h2>Lote ${l.n}</h2><span class="badge ${ev.rechazado ? "susp" : "ok"}">${ev.rechazado ? "Rechaza" : "Cumple"}</span>
        <div class="spacer"></div><span class="muted">${esc(fmtDate(l.desde))}</span></div>
      <div class="panel-body">
        <div class="acepta-cifras">
          <div><div class="label">Hormigón</div><div class="value">${fmtVolumen(l.m3)}</div></div>
          <div><div class="label">Sub-lotes</div><div class="value">${l.sublotes.length} / 10</div></div>
          <div><div class="label">Factor compuesto</div>
            <div class="value ${ev.cpaf >= 1 ? "z-ok" : ev.cpaf >= 0.9 ? "z-act" : "z-susp"}">${fmt(ev.cpaf, 3)}</div></div>
        </div>
        <div class="tabla-ancha" style="margin-top:12px"><table class="data"><thead><tr>
          <th>Característica</th><th class="n">n</th><th class="n">Media</th><th class="n">s</th>
          <th class="n">PWL</th><th class="n">Factor</th></tr></thead><tbody>
          ${Object.entries(ev.aqc).map(([k, r]) => `<tr>
            <td>${esc(cfgs[k].n)}</td><td class="n mono">${r.n}</td>
            <td class="n mono">${fmt(r.media, 1)}</td><td class="n mono">${fmt(r.s, 2)}</td>
            <td class="n"><b class="z-${r.pwl >= 90 ? "ok" : r.pwl >= 60 ? "act" : "susp"}">${fmt(r.pwl, 1)} %</b></td>
            <td class="n mono">${fmt(r.paf, 3)}</td></tr>`).join("")}
        </tbody></table></div>
        <div class="acepta-botones">
          <button class="btn small" onclick="alert('El reporte de lote sale con el cálculo entero: media, desviación, índices de calidad y porcentajes parciales, para que quien firme pueda rehacerlo.')">Ver el cálculo completo</button>
          <button class="btn small ok" onclick="decidirSim(${l.n}, 'aceptado')">Aceptar lote</button>
          <button class="btn small danger" onclick="decidirSim(${l.n}, 'rechazado')">Rechazar</button>
        </div>
        <div id="dec-${l.n}"></div>
      </div></section>`;
  };

  return `
    ${simCabeceraRol()}
    <div class="grid cols-3" style="margin-bottom:14px">
      ${simStat("Lotes cerrados", cerrados.length, "esperan decisión")}
      ${simStat("En curso", enCurso.length, "no se deciden hasta cerrar")}
      ${simStat("Hormigón del contrato", fmt(ls.reduce((a, l) => a + l.m3, 0), 0) + ' <span style="font-size:14px">m³</span>',
             fmt(ls.reduce((a, l) => a + l.cy, 0), 0) + " CY")}
    </div>
    <p class="muted" style="margin:0 0 12px">Un lote a medias no se acepta ni se rechaza: se espera.
    Con menos sub-lotes de los que pide la norma, el resultado cambiaría con cada camión.</p>
    ${cerrados.map(fila).join("")}`;
}

function decidirSim(n, v) {
  const caja = document.getElementById("dec-" + n);
  if (!caja) return;
  if (v === "rechazado" && !prompt("Motivo del rechazo. Queda en el expediente.")) return;
  caja.innerHTML = `<div class="acepta-decision"><b>${v === "aceptado" ? "Aceptado" : "Rechazado"}</b>
    por Autoridad de Carreteras · ahora mismo.
    <div class="muted">Queda firmado en el expediente, con autor y hora, y no se borra.</div></div>`;
  toast(`Lote ${n} ${v}`);
}

/* ───────────────────────────────────────────────────────── CONTRATISTA ── */
/* Cobra. Lo que necesita es ver el dinero mientras aún se puede hacer algo. */
function simPanelContratista() {
  const ls = simLotes();
  const hoyT = simDelDia(HOY);
  const cy = hoyT.filter((t) => !t.rejected).reduce((a, t) => a + t.vol, 0);
  const ultimo = hoyT[hoyT.length - 1];

  return `
    ${simCabeceraRol()}

    <!-- Lo de siempre primero: al contratista le importa su obra antes que
         ninguna estadística. El dinero está a un botón, no en la cara. -->
    <div class="grid cols-3" style="margin-bottom:14px">
      ${simStat("Vaciado de hoy", `${fmt(cy, 0)} <span style="font-size:14px">/ ${fmt(S.dayMeta[HOY].cyPlan, 0)} CY</span>`,
             `${hoyT.length} camiones recibidos`)}
      ${simStat("Último camión", ultimo ? `#${ultimo.n}` : "—",
             ultimo ? `ticket ${ultimo.ticket} · ${simVeredictoDe(ultimo).txt}` : "")}
      ${simStat("Camiones rechazados", S.tests.filter((t) => t.rejected).length, "en todo el contrato",
             S.tests.some((t) => t.rejected) ? "z-susp" : "")}
    </div>

    <section class="panel"><div class="panel-head"><h2>Cómo va la obra</h2></div>
      <div class="panel-body">
        <div class="grid cols-3">
          ${simStat("Hormigón colocado", fmt(ls.reduce((a, l) => a + l.m3, 0), 0) + ' <span style="font-size:14px">m³</span>',
                 fmt(ls.reduce((a, l) => a + l.cy, 0), 0) + " CY en el contrato")}
          ${simStat("Lotes cerrados", ls.filter((l) => !l.parcial).length, "evaluados", "", true)}
          ${simStat("Días de vaciado", new Set(S.tests.map((t) => t.date)).size, "hasta hoy")}
        </div>
      </div>
    </section>

    <section class="panel"><div class="panel-head"><h2>Camiones de hoy</h2></div>
      <div class="panel-body">${simTablaCamiones(hoyT.slice().reverse(), { losa: true })}</div>
    </section>`;
}

/* ────────────────────────────────────────────────────────── CONCRETERA ── */
/* Produce. Ve cómo rinde su mezcla — y NO ve los factores de pago. */
function simPanelConcretera() {
  const hoyT = simDelDia(HOY);
  const conEnsayo = hoyT.filter((t) => t.slump != null);
  const media = (c) => { const v = conEnsayo.map((t) => t[c]).filter((x) => x != null);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const rech = S.tests.filter((t) => t.rejected);
  const todos = S.tests.filter((t) => t.slump != null);
  const fuera = todos.filter((t) => ["act", "susp"].includes(simZonaSlump(t.slump))).length;

  return `
    ${simCabeceraRol()}
    <div class="grid cols-3" style="margin-bottom:14px">
      ${simStat("Despachado hoy", fmt(hoyT.reduce((a, t) => a + t.vol, 0), 0) + ' <span style="font-size:14px">CY</span>',
             `${hoyT.length} camiones`)}
      ${simStat("Slump medio de hoy", media("slump") != null ? fmtSlump(media("slump")) + '"' : "—",
             `objetivo ${fmtSlump(S.plan.slump.target)}"`)}
      ${simStat("Unit weight medio", media("uw") != null ? fmt(media("uw"), 1) : "—",
             `objetivo ${fmt(S.project.uwTarget, 1)} pcf`)}
    </div>

    <section class="panel"><div class="panel-head"><h2>Cómo va su mezcla ${esc(S.project.mixId)}</h2></div>
      <div class="panel-body">
        <div class="grid cols-3">
          ${simStat("Camiones fuera de zona", `${fuera} <span style="font-size:14px">de ${todos.length}</span>`,
                 "slump en acción o suspensión", fuera > todos.length * 0.15 ? "z-act" : "z-ok")}
          ${simStat("Rechazados", rech.length, rech.length ? "devueltos a planta" : "ninguno",
                 rech.length ? "z-susp" : "z-ok")}
          ${simStat("Tiempo medio a obra", `${Math.round(conEnsayo.reduce((a, t) =>
              a + minutesBetween(t.batch, t.arrive), 0) / Math.max(1, conEnsayo.length))} <span style="font-size:14px">min</span>`,
              "de batch a llegada")}
        </div>
        ${siInterno(`<p class="muted" style="margin:12px 0 0">Aquí no se ven factores de pago: eso es
        entre el contratista y la Autoridad. Lo que la planta puede corregir es la mezcla, y eso es
        lo que se enseña.</p>`)}
      </div>
    </section>

    ${rech.length ? `<section class="panel"><div class="panel-head"><h2>Lo que hubo que devolver</h2></div>
      <div class="panel-body">${simTablaCamiones(rech, { losa: true })}
      <p class="muted" style="margin:10px 0 0">${esc(rech[0].comments || "")}</p></div></section>` : ""}

    <section class="panel"><div class="panel-head"><h2>Sus camiones de hoy</h2></div>
      <div class="panel-body">${simTablaCamiones(hoyT.slice().reverse(), { aire: true })}</div>
    </section>`;
}

/* ─────────────────────────────────────────────────────────────────────── */
/* EL BOTÓN DEL DINERO — Q-71, 8 ago 2026.

   Grande y con el signo solo. Es la única puerta al pago y se busca de un
   vistazo; ponerle texto lo convierte en un botón más de una fila de botones,
   que es justo de donde venía.

   El nombre va en `title` y en `aria-label`: quien pase por encima lo lee y
   quien use lector de pantalla lo oye. Sin texto no quiere decir sin nombre. */
function botonDinero() {
  /* La concretera NO tiene esta puerta. No es que se le esconda el contenido:
     es que el botón no existe. Los factores de pago son entre el contratista y
     la Autoridad, y un botón que hay que explicar por qué no lleva a ninguna
     parte es peor que no tenerlo. Q-71. */
  if (simRol === "concretera") return "";
  /* Icono de trazo, no un signo de texto: en QCheck todos los iconos son SVG
     con el mismo grosor de línea, y un glifo tipográfico canta al lado. El
     dólar se dibuja como se dibuja — una S con la barra vertical pasada. */
  return `<a class="dinero" href="sim934.html?rol=${simRol}&v=pago"
    title="Pago del contrato — SP-934" aria-label="Pago del contrato">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3.5v17"/>
      <path d="M16 7.6c-.5-1.5-2-2.4-4-2.4-2.3 0-3.9 1.1-3.9 2.9 0 1.7 1.3 2.5 4 3.1
               2.9.6 4.3 1.5 4.3 3.4 0 2-1.8 3.2-4.3 3.2-2.3 0-3.9-1-4.4-2.7"/>
    </svg></a>`;
}

function simCabeceraRol() {
  const r = SIM_ROLES[simRol];
  return `<div class="rol-cab">
    <span class="rol-ico">${r.ico}</span>
    <div><b>${esc(r.n)}</b><div class="muted">${esc(r.q)} · ${esc(S.project.name)}</div></div>
    <div class="spacer"></div>
    ${botonDinero()}
  </div>`;
}

function simRender() {
  document.getElementById("t-titulo").textContent = "QCheck 934";
  document.getElementById("t-sub").textContent = S.project.name;
  document.getElementById("app").innerHTML =
    simVista === "pago" ? panelPago()
    : simRol === "autoridad" ? simPanelAutoridad()
    : simRol === "contratista" ? simPanelContratista()
    : simRol === "concretera" ? simPanelConcretera()
    : simPanelRuben();
}

/* LA BARRA DE ARRIBA — Q-72, 8 ago 2026.

   Antes el aviso de simulación era una franja a rayas cruzando la pantalla.
   Ocupaba sitio y no se parecía a nada de QCheck. Ahora va **donde QCheck pone
   el estado**, que es la barra de arriba: el mismo sitio donde en la aplicación
   de verdad dice si está en línea.

   **El aviso no se quita, se muda.** Que los datos sean inventados tiene que
   verse siempre y desde cualquier pantalla; lo que cambia es que ahora se lee
   como parte del programa y no como una cinta pegada encima.

   Se monta a mano y no con `mountStatusBar()`: aquella lee el expediente real
   para pintar el avance del tiro, y esta simulación no toca `db` ni para
   leer. */
function montarBarraSim() {
  /* Estilo propio en `qc.css` y no el de `.qcs`: aquellas reglas las inyecta
     `mountStatusBar()`, que no se llama aquí porque lee el expediente real
     para pintar el avance del tiro. Sin la inyección, `.qcs` no es más que un
     div suelto — y así se quedaba, al final de la página y sin verse. */
  /* NAVEGACIÓN COMO LA DE QCHECK — Q-75, 8 ago 2026.

     Atrás, adelante y casa, con los mismos iconos que la barra de la
     aplicación de verdad (`ICONO_NAV`, en core.js). No es coherencia por
     coherencia: quien ve la demo tiene que reconocer el programa, y la
     navegación es lo primero que se toca.

     «Adelante» solo se enciende si hay algo delante, con el mismo criterio de
     Q-51: se mira el tipo de navegación de esta carga. Un botón que no hace
     nada es peor que un botón ausente.

     Casa aquí es el **portal de la demostración**, que es de donde se viene y
     donde se elige la siguiente parte. */
  let hayFwd = false;
  try {
    const nav = performance.getEntriesByType("navigation")[0];
    if (nav && nav.type === "back_forward") { sessionStorage.setItem("sim-fwd", "1"); hayFwd = true; }
    else if (nav && nav.type === "navigate") sessionStorage.removeItem("sim-fwd");
    else hayFwd = sessionStorage.getItem("sim-fwd") === "1";
  } catch (_) {}

  const bar = document.createElement("div");
  bar.className = "sim-bar";
  bar.innerHTML = `
    <div class="sim-nav">
      <button class="sim-b" onclick="history.back()" title="Atrás" aria-label="Atrás">${ICONO_NAV.atras}</button>
      <button class="sim-b" onclick="sessionStorage.removeItem('sim-fwd'); history.forward()"
              title="Adelante" aria-label="Adelante"${hayFwd ? "" : " disabled"}>${ICONO_NAV.adelante}</button>
      <a class="sim-b" href="demo934.html" title="Portal de la demostración" aria-label="Inicio">${ICONO_NAV.casa}</a>
    </div>
    <div class="sim-bar-marca"><i></i>Simulación · datos inventados</div>`;
  document.body.appendChild(bar);
  document.body.classList.add("con-sim-bar");
}

initTheme();
mountThemeToggle();
montarBarraSim();
simRender();
</script>
