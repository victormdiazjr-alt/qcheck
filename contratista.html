<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Aplicación en la pantalla de inicio (iOS y Android). Sin estas etiquetas
     y sin el manifest, el icono guardado abre como un MARCADOR de Safari, con
     una franja arriba enseñando el dominio en vez de la aplicación limpia. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QCheck">
<link rel="apple-touch-icon" href="assets/icono-180.png">
<meta name="theme-color" content="#0a0d12">
<title>Contratista — QCheck PR-52</title>
<link rel="stylesheet" href="assets/qc.css?v=6b68a9ae">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230a0d12'/><text x='50' y='70' font-size='52' text-anchor='middle' fill='%2396c93d'>▲</text></svg>">
<style>
/* Contratista — se consulta en el teléfono, durante el tiro.
   Rubén: yardas, losas, camiones esperando, y "todo en cumplimiento". */
body { background: var(--bg); }

/* ---------- rejilla de indicadores: dos widgets por fila ---------- */
.wgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 16px; }
.wgrid > * { min-width: 0; }
.wgrid .full { grid-column: 1 / -1; }
@media (max-width: 720px) { .wgrid { grid-template-columns: 1fr; } }
/* héroe común de los tableros de indicadores */
.ind-hero .mp-nombre { margin-left: 10px; vertical-align: middle; }
.ind-hero {
  background:
    radial-gradient(620px 200px at 12% 130%, var(--tinte, rgba(74,99,216,.16)), transparent 70%),
    linear-gradient(125deg, #131a2e 0%, #23305f 60%, #1d3c4c 100%);
  color: #fff; border-radius: 16px; padding: 20px 24px; margin-bottom: 16px;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 8px 30px rgba(10,30,50,.34);
}
.ind-hero .eyebrow { font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: #9fb6cc; font-weight: 800; }
.ind-hero h1 { font-size: 22px; margin: 5px 0 2px; font-weight: 700; letter-spacing: -.01em; }
.ind-hero .sub { font-size: 13px; color: #bfd2e4; }
.ind-hero select {
  margin-top: 12px; padding: 9px 12px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.3); color: #fff;
  font-size: 14px; font-weight: 700; font-family: inherit;
}

/* barra de progreso grande */
.prog-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 16px; }
.prog-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.prog-row .big { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
.prog-row .of { font-size: 15px; color: var(--ink-soft); font-weight: 600; }
.prog-row .pct { margin-left: auto; font-size: 26px; font-weight: 800; color: var(--accent); }
.bar { height: 16px; border-radius: 999px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #2b7a5b, #4fc287); }
.bar.slabs > i { background: linear-gradient(90deg, #1d4a6e, #4a90c8); }
.prog-note { font-size: 12.5px; color: var(--ink-soft); margin-top: 7px; }
/* cumplimiento */
.comp {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; border: 2px solid;
}
.comp.ok { background: var(--ok-bg); border-color: var(--ok); }
.comp.act { background: var(--act-bg); border-color: var(--act); }
.comp.susp { background: var(--susp-bg); border-color: var(--susp); }
.comp .mark { font-size: 34px; line-height: 1; }
.comp .t { font-size: 19px; font-weight: 800; }
.comp .s { font-size: 13px; color: var(--ink-soft); }
.comp.ok .t { color: var(--ok); } .comp.act .t { color: var(--act); } .comp.susp .t { color: var(--susp); }
.comp .chips { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
/* camiones esperando */
.wait-list { display: flex; gap: 10px; flex-wrap: wrap; }
.wait-truck {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 14px; text-align: center; min-width: 92px;
}
.wait-truck .n { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.wait-truck .m { font-size: 11.5px; color: var(--ink-soft); }
.wait-truck.dis { border-color: var(--ok); background: var(--ok-bg); }
</style>
<script src="assets/usuarios.js?v=86dde610"></script>
<script src="assets/auth.js?v=de2a7e62"></script>
</head>
<body>

<header class="qc-header">
  <div class="brand">
    <a href="control-center.html" style="text-decoration:none">
      <svg class="mark" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" aria-label="QCheck">
      <defs>
        <mask id="qcm-q1"><rect width="1000" height="1000" fill="#fff"/><path fill="#000" d="M 139 531 H 558 V 802 H 139 Z"/></mask>
        <mask id="qcm-c1"><rect width="1000" height="1000" fill="#fff"/><circle cx="346" cy="720" r="103" fill="#000"/></mask>
      </defs>
      <path fill="var(--logo-blue,#0f46b5)" fill-rule="evenodd" mask="url(#qcm-q1)" d="M 509 63 A 337 337 0 1 1 508.9 63 Z M 509 174 A 226 226 0 1 0 509.1 174 Z"/>
      <path fill="var(--logo-blue,#0f46b5)" d="M 656 615 L 822 781 L 724 879 L 558 713 Z"/>
      <g mask="url(#qcm-c1)">
        <path fill="var(--logo-green,#39a935)" d="M 132 514 L 346 608 L 564 506 L 564 571 L 346 682 L 132 589 Z"/>
        <path fill="var(--logo-g1,#68727f)" d="M 132 642 L 346 736 L 564 620 L 564 681 L 346 804 L 132 704 Z"/>
        <path fill="var(--logo-g2,#4f5a66)" d="M 132 755 L 346 852 L 564 730 L 564 795 L 346 918 L 132 816 Z"/>
      </g>
      <path fill="var(--logo-blue,#0f46b5)" d="M 412 665 A 86 86 0 1 0 412 775 L 368 739 A 31 31 0 1 1 368 701 Z"/>
    </svg>
    </a>
    <div>
      <div class="title">Contratista — Estado del Tiro</div>
      <div class="subtitle">Progreso · camiones · cumplimiento</div>
    </div>
  </div>
  <nav class="tabs">
    <a class="btn small" style="margin:10px 0" href="display.html" target="_blank">🖥 Field Display</a>
      <!-- Q-38: el reporte escrito del día. Es un <button> y no un enlace a
         propósito: a las cuentas de fuera se les retiran los enlaces de la
         cabecera al entrar (Q-37), y este botón tiene que quedarse — es justo
         lo que vienen a buscar. -->
    <button class="btn small qc-imprimir" style="margin:10px 0" onclick="imprimirTablero('Contratista')">🖨 Print report</button>
</nav>
</header>

<main style="max-width:1000px">
  <div class="ind-hero">
    <div class="eyebrow" id="hero-eyebrow">—</div>
    <h1 id="hero-title">Estado del tiro</h1>
    <div class="sub" id="hero-sub">—</div>
    <select id="day-sel" onchange="state.day=this.value; render()"></select>
  </div>
  <div id="content"></div>
</main>

<div id="modal-root"></div>
<div id="toast"></div>

<script src="shared/conduce-contract.js?v=55633415"></script>
<script src="assets/seed.js?v=acf41aba"></script>
<script src="assets/sync.js?v=8e0c9b43"></script>
<script src="assets/core.js?v=9fa4ca62"></script>
<script src="assets/demo.js?v=4fdc15f7"></script>
<script>
"use strict";
const state = { day: null };

function render() {
  const days = testDates();
  if (!state.day || !days.includes(state.day)) state.day = days[0];
  if (typeof pintarTiro === "function") pintarTiro(state.day);   // el tiro sube en vivo
  const sel = document.getElementById("day-sel");
  sel.innerHTML = days.map((d) => `<option value="${d}" ${d === state.day ? "selected" : ""}>${fmtDate(d)}</option>`).join("");

  const p = dayProgress(state.day);
  const meta = db.dayMeta[state.day] || {};

  document.getElementById("hero-eyebrow").innerHTML =
    marcaHTML("contratista", db.project.contractor) +
    `<span class="mp-nombre">${esc(db.project.contractor || "Contratista")}</span>`;
  document.getElementById("hero-title").textContent = fmtDate(state.day);
  document.getElementById("hero-sub").textContent =
    [meta.fase ? "Fase " + meta.fase : null, meta.lane ? "Carril " + meta.lane : null,
     meta.km ? "Km " + meta.km : null].filter(Boolean).join(" · ") || db.project.name;

  // --- estado de cumplimiento (lo que el contratista necesita saber: todo bien o no) ---
  const rows = testsOfDate(state.day);
  const bad = rows.filter((t) => t.rejected || worstZone(t) === "susp").length;
  const act = rows.filter((t) => !t.rejected && worstZone(t) === "act").length;
  const compCls = bad ? "susp" : act ? "act" : "ok";
  const compTxt = bad ? `${bad} camión(es) fuera de cumplimiento`
                : act ? "En cumplimiento — con avisos de vigilancia"
                : "Todo en cumplimiento";
  const compMark = bad ? "✕" : act ? "▲" : "✓";
  const last = rows[rows.length - 1];
  const chip = (label, v, z, dp, u) => v == null ? "" :
    `<span class="badge ${z === "susp" ? "susp" : z === "act" ? "act" : "ok"}">${label} ${fmt(v, dp)}${u}</span>`;

  document.getElementById("content").innerHTML = `
    <div class="comp ${compCls}">
      <div class="mark" style="color:var(--${compCls === "susp" ? "susp" : compCls === "act" ? "act" : "ok"})">${compMark}</div>
      <div>
        <div class="t">${compTxt}</div>
        <div class="s">${p.evaluated} pruebas evaluadas hoy${p.compliancePct != null ? " · " + fmt(p.compliancePct, 0) + "% conformes" : ""}</div>
      </div>
      ${last ? `<div class="chips">
        ${chip("Slump", num(last.slump), zoneSlump(last), 2, '"')}
        ${chip("UW", num(last.uw), zoneUW(last), 1, "")}
        ${chip("Temp", num(last.temp), zoneTemp(last), 0, "°")}
      </div>` : ""}
    </div>

    <div class="prog-card">
      <div class="prog-row">
        <span class="big">${fmt(p.placed, 1)}</span><span class="of">CY colocadas</span>
        ${p.cyPlan ? `<span class="of">· faltan <b>${fmt(p.pending, 1)}</b> de ${fmt(p.cyPlan, 0)}</span>` : ""}
        ${p.pct != null ? `<span class="pct">${fmt(p.pct, 0)}%</span>` : ""}
      </div>
      <div class="bar"><i style="width:${p.pct != null ? p.pct : 0}%"></i></div>
      <div class="prog-note">${p.loads} camiones recibidos${p.rejected ? ` · ${p.rejected} rechazado(s)` : ""}${!p.cyPlan ? " · <b>defina las yardas planificadas</b> para ver el progreso" : ""}</div>
    </div>

    <div class="prog-card">
      <div class="prog-row">
        <span class="big">${p.losasDone}</span><span class="of">losas vaciadas</span>
        ${p.losasPlan ? `<span class="of">· faltan <b>${Math.max(0, p.losasPlan - p.losasDone)}</b> de ${p.losasPlan}</span>` : ""}
        ${p.losasPct != null ? `<span class="pct">${fmt(p.losasPct, 0)}%</span>` : ""}
      </div>
      <div class="bar slabs"><i style="width:${p.losasPct != null ? p.losasPct : 0}%"></i></div>
      <div class="prog-note">${p.losasPlan ? "" : "<b>Defina cuántas losas se tiran hoy</b> para ver el progreso · "}Conteo por identificación de losa en los camiones descargados</div>
    </div>

    <div class="wgrid">
      <div class="stat ${p.waiting.length > 2 ? "alert" : ""}">
        <div class="label">Camiones esperando</div>
        <div class="value">${p.waiting.length}</div>
        <div class="sub">${fmt(p.waitingCY, 1)} CY en espera</div></div>
      <div class="stat good"><div class="label">Descargando</div>
        <div class="value">${p.discharging.length}</div>
        <div class="sub">ahora mismo</div></div>
      <div class="stat ${p.rejected ? "alert" : "good"}"><div class="label">Rechazados</div>
        <div class="value">${p.rejected}</div>
        <div class="sub">hoy</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Camiones en sitio</h2><div class="spacer"></div>
        <button class="btn small" onclick="formDayPlan()">Plan del día</button></div>
      <div class="panel-body">
        ${p.waiting.length || p.discharging.length ? `<div class="wait-list">
          ${p.waiting.map((t) => {
            const dis = t.start && !t.end;
            return `<div class="wait-truck ${dis ? "dis" : ""}">
              <div class="n">${esc(t.truck || "—")}</div>
              <div class="m">${fmt(num(t.vol), 1)} CY</div>
              <div class="m">${dis ? "descargando" : "llegó " + esc(t.arrive || "—")}</div>
            </div>`;
          }).join("")}
        </div>` : `<div class="empty">Ningún camión en sitio.</div>`}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Últimos camiones</h2></div>
      <div class="panel-body flush"><div class="table-wrap"><table class="data">
        <tr><th>Camión</th><th>Ticket</th><th>Losa</th><th class="num">CY</th><th>Llegó</th><th>Estado</th></tr>
        ${rows.slice(-10).reverse().map((t) => `<tr class="${t.rejected ? "rejected" : ""}">
          <td class="mono"><b>${esc(t.truck || "—")}</b></td>
          <td class="mono">${esc(t.ticket || "—")}</td>
          <td style="white-space:normal;font-size:12px">${esc(shortIdent(t.ident))}</td>
          <td class="num mono">${fmt(num(t.vol), 1)}</td>
          <td class="mono">${esc(t.arrive || "—")}</td>
          <td>${estadoBadge(t)}</td>
        </tr>`).join("") || `<tr><td colspan="6" class="empty">Sin camiones.</td></tr>`}
      </table></div></div>
    </div>`;
}

function formDayPlan() {
  const meta = db.dayMeta[state.day] || {};
  openForm({
    title: `Plan del día — ${fmtDate(state.day)}`,
    initial: meta,
    fields: [
      { key: "losasPlan", label: "Cuántas losas", type: "number", step: "1",
        hint: "Solo el número — ej. 23. Si QC declaró la lista de losas, manda esa." },
      { key: "cyPlan", label: "Yardas planificadas (CY)", type: "number", step: "5" },
      { key: "fase", label: "Fase" },
      { key: "lane", label: "Carril" },
      { key: "cierre", label: "Cierre" },
      { key: "km", label: "Km", half: true },
    ],
    onSave: (v) => {
      db.dayMeta[state.day] = { ...(db.dayMeta[state.day] || {}), ...v };
      saveDB(); render(); toast("Plan del día guardado");
    },
  });
}

loadDB();
initTheme();
mountThemeToggle();
mountStatusBar();
enableLiveSync(() => render());
render();
</script>
</body>
</html>
