<style>
/* ============================================================
   REPORTE — el paquete que Rubén entrega.
   Reemplaza el armado manual desde Excel: tabla matriz,
   Moving Average y Control Charts, listo para imprimir.
   ============================================================ */
.rep-toolbar { position: sticky; top: 0; z-index: 40; background: var(--bg); padding: 12px 0; }
.rep-toolbar .field { display: inline-block; margin-right: 12px; }
.rep-toolbar label { display: block; font-size: 10.5px; }

/* hoja */
.sheet {
  background: #fff; color: #16222e;
  max-width: 8.5in; margin: 0 auto 22px;
  padding: 0.7in 0.75in 0.6in;
  box-shadow: 0 4px 22px rgba(10,25,40,.16);
  border-radius: 4px;
  font-size: 10.5pt; line-height: 1.45;
}
:root[data-theme="dark"] .sheet { box-shadow: 0 4px 22px rgba(0,0,0,.5); }

/* En un teléfono la hoja es más ancha que la pantalla: las tablas se
   desplazan dentro de la hoja en vez de desbordar la página entera.
   En papel esto no aplica — la hoja vuelve a su ancho de carta. */
@media screen {
  /* La tabla matriz es más ancha que la hoja de carta: en pantalla se desplaza
     dentro de la hoja en vez de desbordar la página. En papel no aplica. */
  .sheet { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* Número de referencia de la fila al pasar por encima, igual que en Results.
     **Solo en pantalla**: en papel, un número que aparece con el ratón no
     significa nada, y las hojas ya van numeradas por su cuenta. */
  table.rep { counter-reset: qcfila; }
  table.rep tr + tr { counter-increment: qcfila; }
  table.rep tr + tr td:first-child { position: relative; padding-left: 20px; }
  table.rep tr + tr td:first-child::before {
    content: counter(qcfila);
    position: absolute; left: 2px; top: 50%; transform: translateY(-50%);
    min-width: 13px; text-align: right;
    font-size: 6.2pt; font-weight: 800; color: #93a3b3;
    font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .12s;
    pointer-events: none;
  }
  table.rep tr + tr:hover td:first-child::before { opacity: 1; }
  table.rep tr + tr:hover td { background: #f4f7fa; }
  @media (hover: none) { table.rep tr + tr td:first-child::before { opacity: .55; } }
}
@media screen and (max-width: 820px) {
  .sheet { padding: 18px 16px; }
  .sheet table { min-width: 420px; }
}

/* encabezado de hoja */
.sh-head { display: flex; align-items: flex-start; gap: 14px; border-bottom: 2px solid #2b3a8c; padding-bottom: 10px; margin-bottom: 16px; }
.sh-head .logo { height: 40px; flex: none;
  --logo-blue:#0f46b5; --logo-green:#39a935; --logo-g1:#68727f; --logo-g2:#4f5a66; }
.sh-head .t1 { font-size: 15pt; font-weight: 800; color: #16222e; line-height: 1.15; }
.sh-head .t2 { font-size: 9pt; color: #5a6b7c; margin-top: 2px; }
.sh-head .right { margin-left: auto; text-align: right; font-size: 8.5pt; color: #5a6b7c; line-height: 1.5; }
.sh-head .right b { color: #16222e; }

h2.sec { font-size: 12pt; margin: 20px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #dbe2e9; color: #2b3a8c; }
h2.sec:first-of-type { margin-top: 4px; }
/* Las secciones se numeran solas, de corrido por todo el informe. Un documento
   técnico se cita por sección —«ver 4»— y numerarlas a mano se desordena en
   cuanto se añade una. */
#report { counter-reset: qcsec; }
h2.sec { counter-increment: qcsec; }
h2.sec::before { content: counter(qcsec) ". "; color: #7d8ba0; font-weight: 700; }

/* ---------- identidad del documento ----------
   La tira de arriba: quién es este papel. Un informe que se archiva necesita
   un número que no cambie entre dos copias del mismo vaciado. */
.doc-id {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
  background: #dbe2e9; border: 1px solid #dbe2e9; border-radius: 5px;
  overflow: hidden; margin-bottom: 6px;
}
.doc-id > div { background: #f7f9fb; padding: 7px 10px; }
.doc-id span { display: block; font-size: 6.8pt; text-transform: uppercase;
  letter-spacing: .5px; color: #5a6b7c; font-weight: 800; }
.doc-id b { font-size: 9.5pt; color: #16222e; font-variant-numeric: tabular-nums; }

/* ---------- prosa ----------
   Un informe se lee de corrido. Medida de línea contenida: a lo ancho de la
   carta entera, el ojo pierde el renglón. */
p.cuerpo { font-size: 9.6pt; line-height: 1.62; margin: 0 0 9px; text-align: justify; }
p.cuerpo b { font-weight: 700; }

/* ---------- disposición ----------
   La conclusión que alguien firma, y se ve de lejos: es lo primero que busca
   quien abre el informe. */
.veredicto {
  border: 1px solid #dbe2e9; border-left: 4px solid #5a6b7c;
  border-radius: 5px; padding: 10px 13px; margin: 12px 0 4px; background: #f7f9fb;
}
.veredicto .vt { font-size: 11.5pt; font-weight: 800; letter-spacing: -.01em; }
.veredicto .vd { font-size: 8.8pt; color: #4a5a6a; margin-top: 2px; line-height: 1.5; }
.veredicto.v-ok    { border-left-color: #1e8e3e; background: #f2faf5; }
.veredicto.v-ok .vt    { color: #16702f; }
.veredicto.v-obs   { border-left-color: #b26a00; background: #fdf8ee; }
.veredicto.v-obs .vt   { color: #8a5200; }
.veredicto.v-curso { border-left-color: #2b3a8c; background: #f4f6fd; }
.veredicto.v-curso .vt { color: #2b3a8c; }

/* ficha del proyecto */
.meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 18px; font-size: 9.5pt; }
.meta .k { color: #5a6b7c; font-size: 8pt; text-transform: uppercase; letter-spacing: .4px; font-weight: 700; }
.meta .v { font-weight: 600; }

/* resumen */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 10px 0 4px; }
.kpi { border: 1px solid #dbe2e9; border-radius: 6px; padding: 9px 11px; }
.kpi .k { font-size: 7.5pt; color: #5a6b7c; text-transform: uppercase; letter-spacing: .5px; font-weight: 800; }
.kpi .v { font-size: 17pt; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .s { font-size: 8pt; color: #5a6b7c; }
.kpi.ok .v { color: #1e8e3e; } .kpi.bad .v { color: #c5221f; }

/* tabla matriz */
table.rep { width: 100%; border-collapse: collapse; font-size: 7.6pt; }
table.rep th {
  background: #eef2f7; color: #2b3a8c; text-align: left; font-size: 6.8pt;
  text-transform: uppercase; letter-spacing: .3px; padding: 4px 3px;
  border: .5px solid #c8d2dd; white-space: nowrap;
}
table.rep td { padding: 3px; border: .5px solid #dbe2e9; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.rep td.n { text-align: right; }
table.rep td.wrap { white-space: normal; min-width: 90px; }
table.rep tr.rej td { background: #fdeceb; color: #8a2725; }
table.rep td.z-act { background: #fdf5e2; font-weight: 700; }
table.rep td.z-susp { background: #fbe4e2; font-weight: 700; color: #a01c19; }
.tbl-note { font-size: 7.5pt; color: #5a6b7c; margin-top: 5px; }

/* cartas */
.chart-box { border: 1px solid #dbe2e9; border-radius: 5px; padding: 8px 10px 2px; margin-bottom: 12px; }
.chart-box h3 { font-size: 9.5pt; margin-bottom: 2px; }
.chart-box .lim { font-size: 7.5pt; color: #5a6b7c; margin-bottom: 4px; }
.chart-box svg { max-width: 100%; height: auto; }
/* las hojas se imprimen en blanco: la gráfica usa tinta oscura */
.sheet { --chart-line: #2b3a8c; --chart-text: #5a6b7c; --chart-target: #16222e;
         --chart-grid: rgba(15,30,45,.10); --bg: #fff;
         --susp: #c5221f; --act: #b26a00; }
.sheet .ch-line, .sheet .ch-area, .sheet .ch-glow { animation: none; stroke-dasharray: none; }

/* Aviso de hoja: el tiro todavía no ha cerrado. No es decoración —
   avisa de que lo que se firma abajo es una foto a media faena. */
.aviso { border: 1px solid #e6c67a; background: #fdf5e2; color: #7a5a12;
         border-radius: 6px; padding: 8px 11px; font-size: 9pt; margin-bottom: 14px; }
.aviso b { color: #5e4409; }

/* ficha de dos columnas: concepto y valor (ritmo, ciclos, plan contra lo real) */
table.rep td.lbl { color: #5a6b7c; width: 42%; }
table.rep td.dif { font-weight: 700; }
.nota-sec { font-size: 8.5pt; color: #5a6b7c; margin: 2px 0 10px; }

/* observaciones del sistema — las mismas que ve Rubén en el tablero */
.obs { border: 1px solid #dbe2e9; border-radius: 6px; padding: 8px 11px; margin-bottom: 7px; display: flex; gap: 10px; }
.obs .ic { font-size: 14pt; line-height: 1.1; }
.obs .t { font-weight: 800; font-size: 9.5pt; }
.obs .d { font-size: 9pt; }
.obs .a { font-size: 8.5pt; color: #5a6b7c; margin-top: 2px; }
.obs.susp { border-color: #f0b9b5; background: #fdf3f2; }
.obs.susp .t { color: #a01c19; }
.obs.act .t { color: #8a6100; }

/* firmas */
.signs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; margin-top: 34px; }
.sign { border-top: 1px solid #16222e; padding-top: 5px; font-size: 8.5pt; }
.sign .r { color: #5a6b7c; }
.sh-foot { margin-top: 18px; border-top: 1px solid #dbe2e9; padding-top: 6px; font-size: 7.5pt; color: #5a6b7c; display: flex; }
.sh-foot .pg { margin-left: auto; }

@media print {
  body { background: #fff; }
  .qc-header, .rep-toolbar, .no-print { display: none !important; }
  main { max-width: none; padding: 0; margin: 0; }
  .sheet { box-shadow: none; margin: 0; border-radius: 0; max-width: none; padding: 0.5in 0.55in;
           break-after: page; page-break-after: always; }
  .sheet:last-child { break-after: auto; page-break-after: auto; }
  .chart-box, table.rep tr { break-inside: avoid; page-break-inside: avoid; }
  @page { size: Letter portrait; margin: 0.35in; }
}
</style>

<script>
"use strict";

/* Dos reportes en la misma hoja de papel:

   · "dia"       — el tiro de UNA fecha, que es lo que Rubén entrega al cerrar
                   el vaciado: cómo cerró, qué losas se tiraron, la bitácora de
                   camiones, las cartas del día y las incidencias.
   · "acumulado" — el expediente del proyecto entero (o de un rango), que es
                   lo que ya existía.

   Comparten encabezado, pie, estilos de hoja y reglas de impresión: son el
   mismo entregable con distinto alcance, no dos productos. */
const state = { modo: "dia", dia: null, fijado: false, from: null, to: null, lot: "all" };

/* La dirección manda: reporte.html?dia=2026-07-31 abre el reporte de ese tiro,
   para que el Control Center y Results puedan enlazar al día que se cierra. */
function leerDireccion() {
  const q = new URLSearchParams(location.search);
  const d = q.get("dia");
  /* `fijado` marca que el día lo pidió el ENLACE, no el selector. Importa
     porque al abrir, la sincronización todavía no ha traído los vaciados: la
     lista de días es solo «hoy», el día pedido no está en ella y se descartaba
     — el enlace directo al informe de un tiro terminaba enseñando el día en
     blanco de hoy. Un día pedido a mano se respeta y se espera a que llegue. */
  if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) { state.modo = "dia"; state.dia = d; state.fijado = true; }
  else if (q.get("modo") === "acumulado") state.modo = "acumulado";
}
function cambiarModo(m) {
  state.modo = m;
  history.replaceState(null, "", m === "dia" ? "?dia=" + state.dia : "?modo=acumulado");
  render();
}
function cambiarDia(d) {
  state.dia = d;
  history.replaceState(null, "", "?dia=" + d);
  render();
}

/* Los días que se pueden reportar: los que tienen camiones y los que tienen
   plan declarado. Hoy sale siempre, aunque esté vacío — si no hay nada que
   reportar, el reporte lo dice; no se esconde la fecha. */
function diasDelReporte() {
  const s = new Set([...testDates(), ...Object.keys(db.dayMeta || {}), todayISO()]);
  /* El día pedido por el enlace entra en la lista aunque sus datos aún no hayan
     llegado, para que el selector lo enseñe escogido y no salte a otro. */
  if (state.dia) s.add(state.dia);
  return [...s].sort().reverse();
}

/* Reparte una lista en hojas de como mucho `max` filas, y las deja parejas
   entre sí: 19 camiones con tope 18 salen 10 y 9, no 18 y 1.

   Esto no es cosmética. Cada `<div class="sheet">` tiene que caber en una carta
   porque el pie dice «Página N de M»: en cuanto una hoja se desborda a dos
   páginas, el número del pie deja de ser verdad y el paquete que se entrega ya
   no cuadra consigo mismo. El presupuesto es de 892 px de contenido — 11 in
   menos los márgenes de `@page` y el relleno de la hoja. Para medir una sección
   nueva: alto de la `.sheet` en pantalla menos 134. */
function repartir(lista, max) {
  if (!lista.length) return [];
  const hojas = Math.max(1, Math.ceil(lista.length / max));
  const porHoja = Math.ceil(lista.length / hojas);
  const out = [];
  for (let i = 0; i < lista.length; i += porHoja) out.push(lista.slice(i, i + porHoja));
  return out;
}

/* ---------- selección ---------- */
function rangeTests() {
  return sortedTests().filter((t) => {
    if (state.from && t.date < state.from) return false;
    if (state.to && t.date > state.to) return false;
    if (state.lot !== "all" && String(t.lot) !== state.lot) return false;
    return true;
  });
}

/* Moving Average recalculada SOLO sobre lo incluido en el reporte */
function maRows(rows) {
  const w = db.plan.maWindow;
  const sets = rows.filter((t) => t.cs5 != null);
  const acc = [];
  return sets.map((s) => {
    acc.push(s.cs5);
    return { ...s, ma: acc.length >= w ? acc.slice(-w).reduce((a, b) => a + b, 0) / w : null };
  });
}

/* Control Chart dibujado solo con los ensayos del reporte */
function repChart(def, rows) {
  const pts = rows.filter((t) => def.get(t) != null).map((t) => ({
    n: t.n, date: t.date, ticket: t.ticket, v: def.get(t), rejected: t.rejected,
    z: def.key === "slump" ? zoneSlump(t) : def.key === "air" ? zoneAir(t)
      : def.key === "uw" ? zoneUW(t) : zoneTemp(t),
  }));
  const pw = pts.length > 90 ? 7 : pts.length > 45 ? 11 : 16;
  /* Los límites son los del día del último ensayo dibujado, no los de hoy
     (Q-40). Un reporte de julio tiene que imprimir los límites de julio. */
  const diaCarta = pts.length ? pts[pts.length - 1].date : null;
  return svgChart({ pts, bands: bandsFor(def.key, diaCarta), dp: def.dp, pw, h: 190 });
}

/* `sub` es la segunda línea: el nombre del proyecto en el acumulado, la fecha
   del tiro en el reporte del día. */
function sheetHead(titulo, sub) {
  const pr = db.project;
  return `<div class="sh-head">
    <svg class="logo" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" aria-label="QCheck">
      <defs>
        <mask id="qcm-q2"><rect width="1000" height="1000" fill="#fff"/><path fill="#000" d="M 139 531 H 558 V 802 H 139 Z"/></mask>
        <mask id="qcm-c2"><rect width="1000" height="1000" fill="#fff"/><circle cx="346" cy="720" r="103" fill="#000"/></mask>
      </defs>
      <path fill="var(--logo-blue,#0f46b5)" fill-rule="evenodd" mask="url(#qcm-q2)" d="M 509 63 A 337 337 0 1 1 508.9 63 Z M 509 174 A 226 226 0 1 0 509.1 174 Z"/>
      <path fill="var(--logo-blue,#0f46b5)" d="M 656 615 L 822 781 L 724 879 L 558 713 Z"/>
      <g mask="url(#qcm-c2)">
        <path fill="var(--logo-green,#39a935)" d="M 132 514 L 346 608 L 564 506 L 564 571 L 346 682 L 132 589 Z"/>
        <path fill="var(--logo-g1,#68727f)" d="M 132 642 L 346 736 L 564 620 L 564 681 L 346 804 L 132 704 Z"/>
        <path fill="var(--logo-g2,#4f5a66)" d="M 132 755 L 346 852 L 564 730 L 564 795 L 346 918 L 132 816 Z"/>
      </g>
      <path fill="var(--logo-blue,#0f46b5)" d="M 412 665 A 86 86 0 1 0 412 775 L 368 739 A 31 31 0 1 1 368 701 Z"/>
    </svg>
    <div>
      <div class="t1">${esc(titulo)}</div>
      <div class="t2">${esc(sub || pr.name || "")}</div>
    </div>
    <div class="right">
      <b>${esc(pr.qcFirm || "")}</b><br>
      ${esc(pr.mixId || "")}<br>
      Emitido ${fmtDate(todayISO())}
    </div>
  </div>`;
}
function sheetFoot(pag, total) {
  return `<div class="sh-foot">
    <span>${esc(db.project.name || "")} · ${esc(db.project.qcFirm || "")}</span>
    <span class="pg">Página ${pag} de ${total}</span>
  </div>`;
}

/* ---------- barra de herramientas ---------- */
function barra(dias) {
  const lots = [...new Set(db.tests.map((t) => t.lot).filter((x) => x != null))].sort((a, b) => Number(a) - Number(b));
  const sel = (m) => (state.modo === m ? "btn small primary" : "btn small");
  return `
    <div class="field" style="margin-right:20px"><label>Reporte</label>
      <button class="${sel("dia")}" onclick="cambiarModo('dia')">Del vaciado</button>
      <button class="${sel("acumulado")}" onclick="cambiarModo('acumulado')">Acumulado del proyecto</button>
    </div>
    ${state.modo === "dia" ? `
      <div class="field"><label>Día del tiro</label>
        <select onchange="cambiarDia(this.value)">
          ${dias.map((d) => `<option value="${d}" ${d === state.dia ? "selected" : ""}>${fmtDate(d)}${d === todayISO() ? " · hoy" : ""}</option>`).join("")}
        </select></div>
      <button class="btn primary" onclick="window.print()">🖨 Imprimir / PDF</button>
    ` : `
      <div class="field"><label>Desde</label><input type="date" value="${state.from || ""}" onchange="state.from=this.value; render()"></div>
      <div class="field"><label>Hasta</label><input type="date" value="${state.to || ""}" onchange="state.to=this.value; render()"></div>
      <div class="field"><label>Lote</label><select onchange="state.lot=this.value; render()">
        <option value="all">Todos</option>
        ${lots.map((l) => `<option value="${l}" ${state.lot === String(l) ? "selected" : ""}>Lote ${l}</option>`).join("")}
      </select></div>
      <button class="btn primary" onclick="window.print()">🖨 Imprimir / PDF</button>
      <button class="btn" onclick="exportCSV()">⬇ CSV</button>
    `}
    <span class="muted" style="font-size:12.5px; margin-left:8px" id="cnt"></span>`;
}

/* ---------- render ---------- */
function render() {
  const dias = diasDelReporte();
  /* Un día pedido por el enlace NO se sustituye aunque todavía no esté en la
     lista: los datos pueden estar de camino. Se queda, y en cuanto la
     sincronización los trae, la hoja se pinta sola. */
  if (!state.dia || (!dias.includes(state.dia) && !state.fijado)) state.dia = dias[0];
  const days = testDates().slice().sort();
  if (!state.from) state.from = days[0];
  if (!state.to) state.to = days[days.length - 1];

  document.getElementById("toolbar").innerHTML = barra(dias);
  if (state.modo === "dia") renderDiario();
  else renderAcumulado();
}

function renderAcumulado() {
  const rows = rangeTests();
  /* Los límites que se imprimen son los del ÚLTIMO ensayo del rango, no los de
     hoy (Q-40). Un acumulado que termina en julio imprime los de julio. */
  const diaDeLosLimites = rows.length ? rows[rows.length - 1].date : null;
  document.getElementById("cnt").textContent = `${rows.length} ensayos en el reporte`;

  if (!rows.length) {
    document.getElementById("report").innerHTML =
      `<div class="sheet"><div class="empty">Sin ensayos en el rango seleccionado.</div></div>`;
    return;
  }

  // --- métricas del reporte ---
  const evaluated = rows.filter((t) => worstZone(t) != null);
  const conf = evaluated.filter((t) => !t.rejected && worstZone(t) !== "susp").length;
  const rej = rows.filter((t) => t.rejected);
  const cy = rows.reduce((a, t) => a + (num(t.vol) || 0), 0);
  const ma = maRows(rows);
  const cs5 = ma.filter((s) => s.cs5 != null);
  const bajo = cs5.filter((s) => s.cs5 < db.plan.cs.target).length;
  const minMA = ma.filter((s) => s.ma != null).map((s) => s.ma);
  const p = db.plan;

  /* Reparto de hojas. Los topes salieron de medir: la matriz tiene una columna
     de identificación que se parte en dos líneas —«STA 3+37 to STA 2+40»— y por
     eso sus filas abultan más que las de la tabla de resistencias.
     La hoja de Moving Average lleva la carta encima, así que le caben menos
     filas que a las siguientes. */
  const chunks = repartir(rows, 20);                 // tabla matriz
  const MA_CON_CARTA = 14;                           // filas bajo la carta
  const maPrimera = cs5.slice(0, MA_CON_CARTA);
  const maResto = repartir(cs5.slice(MA_CON_CARTA), 28);
  /* Los rechazos comparten hoja con la certificación mientras quepan; si son
     muchos, se van a sus propias hojas y la certificación se queda sola. */
  const REJ_CON_FIRMAS = 12;
  const rejAparte = rej.length > REJ_CON_FIRMAS ? repartir(rej, 22) : [];

  const total = 1 + chunks.length + 1 + maResto.length + 2 + rejAparte.length + 1;
  let pg = 0;

  const out = [];

  // ---------- HOJA 1: portada + resumen ----------
  pg++;
  out.push(`<div class="sheet">
    ${sheetHead("Reporte de Control de Calidad")}
    <h2 class="sec">Información del proyecto</h2>
    <div class="meta">
      <div><div class="k">Proyecto</div><div class="v">${esc(db.project.name || "—")}</div></div>
      <div><div class="k">Contratista</div><div class="v">${esc(db.project.contractor || "—")}</div></div>
      <div><div class="k">Control de calidad</div><div class="v">${esc(db.project.qcFirm || "—")}</div></div>
      <div><div class="k">Mezcla</div><div class="v">${esc(db.project.mixId || "—")}</div></div>
      <div><div class="k">Período</div><div class="v">${fmtDate(state.from)} – ${fmtDate(state.to)}</div></div>
      <div><div class="k">Lote</div><div class="v">${state.lot === "all" ? "Todos" : "Lote " + esc(state.lot)}</div></div>
    </div>

    <h2 class="sec">Resumen de cumplimiento</h2>
    <div class="kpis">
      <div class="kpi"><div class="k">Ensayos</div><div class="v">${rows.length}</div><div class="s">${fmt(cy, 1)} yd³ representadas</div></div>
      <div class="kpi ${evaluated.length && conf / evaluated.length >= .9 ? "ok" : ""}"><div class="k">Dentro de límites</div>
        <div class="v">${evaluated.length ? fmt(conf / evaluated.length * 100, 1) : "—"}%</div><div class="s">${conf} de ${evaluated.length} evaluados</div></div>
      <div class="kpi ${rej.length ? "bad" : "ok"}"><div class="k">Rechazados</div><div class="v">${rej.length}</div>
        <div class="s">${fmt(rej.reduce((a, t) => a + (num(t.vol) || 0), 0), 1)} yd³</div></div>
      <div class="kpi ${minMA.length && Math.min(...minMA) >= p.cs.target ? "ok" : "bad"}"><div class="k">Moving Average mínima</div>

    <table class="rep">
      <tr><th>Parámetro</th><th>Objetivo</th><th>Límites de acción</th><th>Límites de suspensión</th></tr>
      <tr><td>Slump (in)</td><td class="n">${fmtSlump(p.slump.target)}</td><td class="n">${fmtSlump(p.slump.actLo)} – ${fmtSlump(p.slump.actHi)}</td><td class="n">${fmtSlump(p.slump.suspLo)} – ${fmtSlump(p.slump.suspHi)}</td></tr>

      <tr><td>Unit Weight (pcf)</td><td class="n">${p.uw.target}</td><td class="n">± ${p.uw.act}</td><td class="n">± ${p.uw.susp}</td></tr>
      <tr><td>Temperatura (°F)</td><td class="n">—</td><td class="n">&gt; ${p.tempMax - 3}</td><td class="n">&gt; ${p.tempMax}</td></tr>
      <tr><td>Resistencia @ ${p.cs.age} días (psi)</td><td class="n">${fmt(p.cs.target, 0)}</td><td class="n">&lt; ${fmt(p.cs.target, 0)}</td><td class="n">&lt; ${fmt(p.cs.action, 0)}</td></tr>
      <tr><td>Apertura al tráfico (psi)</td><td class="n">${fmt(p.cs.openTarget, 0)}</td><td class="n" colspan="2">mínimo ${fmt(p.cs.openLow, 0)}</td></tr>
    </table>
    <div class="tbl-note">Ensayos de hormigón fresco según ASTM C143 (Slump), C231 (aire), C138 (Unit Weight) y C1064 (temperatura).

    ${sheetFoot(pg, total)}

  // ---------- HOJAS 2..N: tabla matriz ----------
  chunks.forEach((chunk, i) => {
    pg++;
    out.push(`<div class="sheet">

        <tr><th>#</th><th>Fecha</th><th>Conduce</th><th>Camión</th><th class="n">yd³</th><th>Lote</th><th>Identificación</th>
            <th>Muestra</th><th class="n">Rev.</th><th class="n">Aire</th><th class="n">P.U.</th><th class="n">Temp</th>
            <th class="n">1 d</th><th class="n">${p.cs.age} d</th><th class="n">28 d</th><th>Estado</th></tr>
        ${chunk.map((t) => {
          const z = (zz) => zz ? ` class="n z-${zz}"` : ' class="n"';
          return `<tr class="${t.rejected ? "rej" : ""}">
            <td class="n">${t.n}</td><td>${esc(t.date)}</td><td>${esc(t.ticket || "—")}</td><td>${esc(t.truck || "—")}</td>
            <td class="n">${fmt(num(t.vol), 1)}</td><td class="n">${esc(t.lot ?? "—")}</td>
            <td class="wrap">${esc(shortIdent(t.ident))}</td><td>${esc(t.testTime || "—")}</td>
            <td${z(zoneSlump(t))}>${fmtSlump(t.slump)}</td>
            <td${z(zoneAir(t))}>${fmt(t.air, 1)}</td>
            <td${z(zoneUW(t))}>${fmt(t.uw, 2)}</td>
            <td${z(zoneTemp(t))}>${fmt(t.temp, 0)}</td>
            <td class="n">${fmt(t.cs1, 0)}</td><td${z(zoneCS5(t.cs5, t.date))}>${fmt(t.cs5, 0)}</td><td class="n">${fmt(t.cs28, 0)}</td>
            <td>${t.rejected ? "RECHAZADO" : (worstZone(t) === "susp" ? "Fuera" : worstZone(t) === "act" ? "Acción" : worstZone(t) ? "Conforme" : "—")}</td>
          </tr>`;
        }).join("")}
      </table>
      <div class="tbl-note">Celdas sombreadas: ámbar = zona de acción · rojo = fuera de límite de suspensión. Filas rojas: cargas rechazadas y no incorporadas.</div>
      ${sheetFoot(pg, total)}
    </div>`);
  });

  // ---------- Moving Average: la carta y la tabla, set por set ----------
  const cabeceraMA = `<tr><th>Set</th><th>Fecha</th><th>Conduce</th><th class="n">1 día</th>
    <th class="n">${p.cs.age} días</th><th class="n">28 días</th><th class="n">Moving Average</th><th>Evaluación</th></tr>`;
  /* `desde` es el número de set con el que arranca la hoja: la numeración
     corre a lo largo del reporte, no se reinicia en cada página. */
  const filasMA = (lista, desde) => lista.map((s, i) => `<tr>
      <td class="n">${desde + i + 1}</td><td>${esc(s.date)}</td><td>${esc(s.ticket || "—")}</td>
      <td class="n">${fmt(s.cs1, 0)}</td>
      <td class="n${s.cs5 < p.cs.action ? " z-susp" : s.cs5 < p.cs.target ? " z-act" : ""}">${fmt(s.cs5, 0)}</td>
      <td class="n">${fmt(s.cs28, 0)}</td>
      <td class="n${s.ma != null && s.ma < p.cs.target ? " z-susp" : ""}">${fmt(s.ma, 0)}</td>
      <td>${s.cs5 >= p.cs.target ? "Cumple" : s.cs5 >= p.cs.action ? "Bajo objetivo" : "No cumple"}</td>
    </tr>`).join("");
  const notaMA = `<div class="tbl-note">${cs5.length} ensayos con resistencia a ${p.cs.age} días · ${bajo} por debajo del objetivo.
    La Moving Average se calcula sobre los ${p.maWindow} ensayos consecutivos incluidos en este reporte.</div>`;

  pg++;
  out.push(`<div class="sheet">
    ${sheetHead("Moving Average de resistencia" + (maResto.length ? ` (1/${maResto.length + 1})` : ""))}
    <h2 class="sec">Resistencia a compresión y Moving Average de ${p.maWindow} ensayos</h2>
    <div class="chart-box">
      <h3>Resistencia @ ${p.cs.age} días (psi)</h3>
      <div class="lim">Objetivo ${fmt(p.cs.target, 0)} psi · límite de acción ${fmt(p.cs.action, 0)} psi · línea punteada oscura = Moving Average</div>
      ${chartCS5(ma.map((s) => ({ ...s, _ma5: s.ma })), "all")}
    </div>
    ${maPrimera.length ? `<table class="rep">${cabeceraMA}${filasMA(maPrimera, 0)}</table>` : ""}

    ${sheetFoot(pg, total)}
  </div>`);

  let setN = maPrimera.length;
  maResto.forEach((trozo, i) => {
    pg++;
    const desde = setN;
    setN += trozo.length;
    out.push(`<div class="sheet">
      ${sheetHead(`Resistencia set por set (${i + 2}/${maResto.length + 1})`)}
      <table class="rep">${cabeceraMA}${filasMA(trozo, desde)}</table>
      ${i === maResto.length - 1 ? notaMA : ""}
      ${sheetFoot(pg, total)}
    </div>`);
  });

  // ---------- Control Charts (2 hojas) ----------
  const defs = CHART_DEFS;
  [[0, 1], [2, 3]].forEach((pair) => {
    pg++;
    out.push(`<div class="sheet">
      ${sheetHead("Control Charts")}
      ${pair.map((idx) => {
        const d = defs[idx];

        return `<div class="chart-box">

      <div class="tbl-note">Banda verde: dentro de límites de acción · ámbar: zona de acción · rosa: fuera de límite de suspensión.

  // ---------- rechazos + firmas ----------
  const cabeceraRej = `<tr><th>#</th><th>Fecha</th><th>Conduce</th><th>Camión</th><th class="n">yd³</th><th>Identificación</th>
      <th class="n">Rev.</th><th class="n">P.U.</th><th class="n">Temp</th><th>Motivo</th></tr>`;
  const filasRej = (lista) => lista.map((t) => {
    const m = [];
    if (zoneSlump(t) === "susp") m.push("Slump fuera de límite");
    if (zoneUW(t) === "susp") m.push("Unit Weight fuera de tolerancia");
    if (zoneAir(t) === "susp") m.push("Aire fuera de límite");
    if (zoneTemp(t) === "susp") m.push("Temperatura sobre el máximo");
    return `<tr class="rej"><td class="n">${t.n}</td><td>${esc(t.date)}</td><td>${esc(t.ticket || "—")}</td>
      <td>${esc(t.truck || "—")}</td><td class="n">${fmt(num(t.vol), 1)}</td>
      <td class="wrap">${esc(shortIdent(t.ident))}</td>
      <td class="n">${fmtSlump(t.slump)}</td><td class="n">${fmt(t.uw, 2)}</td><td class="n">${fmt(t.temp, 0)}</td>
      <td class="wrap">${esc(m.join("; ") || t.comments || "Rechazo en campo")}</td></tr>`;
  }).join("");

  rejAparte.forEach((trozo, i) => {
    pg++;
    out.push(`<div class="sheet">
      ${sheetHead("Registro de rechazos" + (rejAparte.length > 1 ? ` (${i + 1}/${rejAparte.length})` : ""))}
      <h2 class="sec">Cargas rechazadas</h2>
      <table class="rep">${cabeceraRej}${filasRej(trozo)}</table>
      <div class="tbl-note">${rej.length} cargas rechazadas en el período. Estas yardas no entraron en la obra.</div>

  });

  pg++;
  out.push(`<div class="sheet">
    ${sheetHead(rejAparte.length ? "Certificación" : "Registro de rechazos y certificación")}
    ${rejAparte.length ? "" : `<h2 class="sec">Cargas rechazadas</h2>
    ${rej.length ? `<table class="rep">${cabeceraRej}${filasRej(rej)}</table>`
      : `<p style="font-size:9.5pt; color:#5a6b7c">No se registraron cargas rechazadas en el período.</p>`}`}

    <h2 class="sec">Certificación</h2>
    <p style="font-size:9pt; line-height:1.6">
      Los ensayos incluidos en este reporte fueron realizados en obra por personal de

    </p>
    ${(() => {
      /* Q-40: si este vaciado se juzgó con límites distintos de los vigentes
         hoy, el reporte lo dice. Quien compare dos documentos del proyecto y
         vea umbrales distintos tiene que encontrar la explicación aquí, no
         suponer que uno de los dos está mal. */
      const nota = typeof notaDeLimites === "function" ? notaDeLimites(diaDeLosLimites) : "";
      return nota ? `<p style="font-size:8.5pt; line-height:1.6; color:#4a5866">${esc(nota)}</p>` : "";
    })()}
    <div class="signs">

    </div>
    ${sheetFoot(pg, total)}

  document.getElementById("report").innerHTML = out.join("");
}

/* ============================================================
   EL REPORTE DEL VACIADO — lo que se entrega al cerrar el tiro.

   Es la hoja de UN día, no el expediente del proyecto: los camiones
   de esa fecha, las losas que se tiraron contra las planificadas,
   cómo se comportó la mezcla y qué incidencias hubo.

   No calcula nada nuevo. Todo sale del mismo motor que pinta el
   Control Center —dayProgress, dayStats, losasDelDia, trendAlerts—
   para que la hoja firmada y el tablero no puedan discrepar.
   ============================================================ */
function renderDiario() {
  const day = state.dia;
  const rows = testsOfDate(day);
  const meta = db.dayMeta[day] || {};
  const p = db.plan;
  const hoy = day === todayISO();
  const hm = (t) => hora12(t) || "—";

  document.getElementById("cnt").textContent =
    rows.length ? `${rows.length} camiones en el vaciado` : "sin camiones registrados";

  /* Un día sin camiones no se rellena con ceros: se dice que no hubo tiro. */
  if (!rows.length) {
    document.getElementById("report").innerHTML = `<div class="sheet">
      ${sheetHead("Reporte del vaciado", fmtDate(day))}
      <h2 class="sec">Sin camiones registrados</h2>
      <p style="font-size:9.5pt; color:#5a6b7c">
        No hay ninguna entrega registrada para el ${fmtDate(day)}.
        ${meta.cyPlan != null
          ? `El día tiene un plan declarado de <b>${fmt(num(meta.cyPlan), 1)} yd³</b>, pero no llegó ningún camión.`
          : "El día tampoco tiene un plan declarado."}
      </p>
      ${sheetFoot(1, 1)}
    </div>`;
    return;
  }

  const prog = dayProgress(day);
  const st = dayStats(day);
  const { lista: losas, hechas, rango: tramo, fuera: losasFuera } = losasDelDia(day);
  const rej = rows.filter((t) => t.rejected);
  const hums = (db.humidity || []).filter((h) => h.date === day)
    .sort((a, b) => (a.time || "").localeCompare(b.time || ""));
  const res = rows.filter((t) => t.cs1 != null || t.cs5 != null || t.cs28 != null);
  const tiro = estadoTiro(day);
  const proy = hoy ? ritmoTiro(day) : null;
  const plantas = [...new Set(rows.map((t) => t.plant).filter(Boolean))];
  const empresas = [...new Set(rows.map((t) => t.company || plantCompany(t.plant)).filter((x) => x && x !== "—"))];
  const lotes = [...new Set(rows.map((t) => t.lot).filter((x) => x != null))];
  const inicio = inicioReal(day);
  const ritmoReal = st.hours ? prog.placed / st.hours : null;
  /* Un tiro se da por terminado de dos maneras: porque se colocaron las yardas
     planificadas, o porque **alguien lo cerró a mano** — que es lo normal
     cuando se acaba el hormigón, llueve o se decide parar antes del plan. Sin
     esto, la hoja seguía avisando de «tiro en curso» sobre un vaciado que ya
     había terminado, y eso se firma. */
  const cerradoAMano = tiroCerrado(day);
  const cerrado = !!cerradoAMano || (prog.cyPlan != null && prog.cyPlan > 0 && prog.placed >= prog.cyPlan);
  const enCurso = hoy && !cerrado;

  /* Cuántas losas hay que enseñar: la lista declarada manda. Sin lista
     declarada solo se sabe cuántas tocaron los camiones (`losasDone`).
     Con un TRAMO no se puede contar la lista —las losas se descubren según
     llegan, así que contarlas daría siempre el 100 %—: vale lo que declararon
     o la estimación del tramo, y en la hoja va con «≈» para que quien firme
     sepa que ese denominador no es un plan declarado losa por losa. */
  const losasReal = losas.length ? hechas : prog.losasDone;
  const losasPlan = tramo ? prog.losasPlan : (losas.length || prog.losasPlan);
  const losasAprox = prog.losasPlanEstim ? "≈" : "";

  /* Las cartas van de dos en dos por hoja: cuatro no caben en una página de
     carta. Slump y Unit Weight primero, que es lo que Rubén mira. Una lectura
     que nadie tomó ese día no lleva carta — no se dibuja una gráfica vacía. */
  const cartas = [0, 2, 1, 3].map((i) => CHART_DEFS[i])
    .filter((d) => rows.some((t) => d.get(t) != null));
  const paresCartas = [];
  for (let i = 0; i < cartas.length; i += 2) paresCartas.push(cartas.slice(i, i + 2));

  /* 18 camiones es lo máximo que cabe en una carta con el encabezado, el pie y
     alguna losa partida en dos líneas. Ver `repartir()`. */
  const chunks = repartir(rows, 18);
  /* 3 fijas: el informe técnico, cómo cerró el día, y las losas con las
     observaciones. Más la bitácora, las cartas y la de incidencias y firmas. */
  const total = 3 + chunks.length + paresCartas.length + 1;
  let pg = 0;
  const out = [];

  const dif = (real, plan, dp = 1) => {
    if (real == null || plan == null) return `<td class="n">—</td>`;
    const d = real - plan;
    const z = d < 0 ? " z-act" : "";
    return `<td class="n dif${z}">${d > 0 ? "+" : ""}${fmt(d, dp)}</td>`;
  };

  /* ---------- HOJA 1: RESUMEN TÉCNICO ----------

     La que faltaba. El informe abría con mosaicos de indicadores —«unos print
     screens», dijo quien lo recibió, y tenía razón—: un tablero impreso no es
     un documento técnico. Un informe se lee de corrido, dice qué pasó, lo
     respalda con estadística y termina con una conclusión que alguien firma.

     Cada frase de aquí sale de los datos. Nada se redacta «a ojo»: si un dato
     no existe, la frase que lo usaría no se escribe. */
  const est = estadisticasDia(day);
  const estDe = (k) => (est.find((e) => e.k === k) || {}).est || null;
  const eSlump = estDe("slump"), eUW = estDe("uw"), eTemp = estDe("temp");
  const fueraTotal = est.reduce((a, e) => a + e.susp, 0);
  const enAccion = est.reduce((a, e) => a + e.accion, 0);

  /* El identificador del informe se DEDUCE del proyecto y del día, no se
     inventa ni se lleva un contador: el mismo vaciado emite siempre el mismo
     número, y dos copias del mismo día son la misma copia. */
  const idInforme = `QC-${(db.project.mixId || "PR52").split("-")[0].replace(/\s+/g, "")}-${day.replace(/-/g, "")}`;

  const veredicto = enCurso
    ? { cls: "curso", t: "Vaciado en curso", d: "Las cifras son las de este momento. Emítase de nuevo al cerrar el tiro." }
    : rej.length || fueraTotal
      ? { cls: "obs", t: "Conforme con observaciones",
          d: `${rej.length ? `${rej.length} carga${rej.length === 1 ? "" : "s"} rechazada${rej.length === 1 ? "" : "s"}` : ""}${rej.length && fueraTotal ? " · " : ""}${fueraTotal ? `${fueraTotal} lectura${fueraTotal === 1 ? "" : "s"} fuera de límite de suspensión` : ""}. Ver el detalle en las hojas siguientes.` }
      : { cls: "ok", t: "Conforme",
          d: "Todas las lecturas de hormigón fresco quedaron dentro de los límites de especificación del plan de control." };

  /* Las frases se arman por piezas y se descartan las que no tienen dato
     detrás. Así el párrafo nunca dice «— yd³» ni «desde las —». */
  const trozos = [];
  trozos.push(`El vaciado del <b>${fmtDate(day)}</b> se ejecutó en el proyecto <b>${esc(db.project.name || "—")}</b>${
    meta.fase ? `, fase ${esc(meta.fase)}` : ""}${meta.lane ? `, carril ${esc(meta.lane)}` : ""}${
    meta.km ? `, kilometraje ${esc(meta.km)}` : ""}.`);
  if (st.firstStart && st.lastEnd) {
    trozos.push(`La colocación transcurrió entre las <b>${hm(st.firstStart)}</b> y las <b>${hm(st.lastEnd)}</b>${
      st.hours ? `, ${duracionCorta(Math.round(st.hours * 60))} de faena` : ""}${
      cerradoAMano ? `, y el tiro se dio por cerrado a las <b>${hm(cerradoAMano)}</b>` : ""}.`);
  }
  trozos.push(`Se recibieron <b>${prog.loads}</b> camiones y se colocaron <b>${fmt(prog.placed, 1)} yd³</b>${
    prog.cyPlan ? ` frente a las ${fmt(prog.cyPlan, 1)} yd³ planificadas (${fmt(prog.placed / prog.cyPlan * 100, 0)} %)` : ""}${
    empresas.length ? `, suministradas por ${esc(empresas.join(" y "))}` : ""}${
    plantas.length ? ` desde ${plantas.length === 1 ? "la planta" : "las plantas"} ${esc(plantas.join(" y "))}` : ""}.`);
  if (tramo) {
    trozos.push(`El tramo declarado fue <b>${esc(tramo.carril)}-${tramo.desde.toFixed(3)} a ${tramo.hasta.toFixed(3)}</b>
      (${tramo.metros} m), sobre el que recibieron hormigón <b>${losasReal}</b> losas.`);
  } else if (losasPlan) {
    trozos.push(`Se vaciaron <b>${losasReal}</b> de <b>${losasPlan}</b> losas planificadas.`);
  }

  const ritmo = [];
  if (ritmoReal != null) ritmo.push(`El ritmo medio de colocación fue de <b>${fmt(ritmoReal, 1)} yd³/h</b> (${fmt(st.loadsPerHr, 1)} camiones por hora)`);
  if (st.avgCycle != null) ritmo.push(`el ciclo medio de batch a fin de descarga, <b>${Math.round(st.avgCycle)} min</b>${
    st.maxCycle != null ? ` con un máximo de ${Math.round(st.maxCycle)} min` : ""} frente al límite de ${p.maxElapsedMin} min del plan`);
  if (st.avgWait != null) ritmo.push(`y la espera media en obra, de <b>${Math.round(st.avgWait)} min</b>`);

  const cumpl = [];
  cumpl.push(`De los <b>${prog.evaluated}</b> camiones con lecturas evaluables, <b>${prog.conforming}</b> resultaron dentro de límites${
    prog.compliancePct != null ? ` (<b>${fmt(prog.compliancePct, 1)} %</b>)` : ""}.`);
  if (enAccion) cumpl.push(`<b>${enAccion}</b> lectura${enAccion === 1 ? " entró" : "s entraron"} en zona de acción —dentro de especificación, pero lo bastante cerca del límite como para vigilar la mezcla—.`);
  if (fueraTotal) cumpl.push(`<b>${fueraTotal}</b> lectura${fueraTotal === 1 ? "" : "s"} superó${fueraTotal === 1 ? "" : "n"} el límite de suspensión.`);
  if (rej.length) cumpl.push(`Se rechazaron <b>${rej.length}</b> carga${rej.length === 1 ? "" : "s"}: ${rej.map((t) => `camión ${esc(t.truck || "—")} (conduce ${esc(t.ticket || "—")})`).join(", ")}.`);
  else cumpl.push("No se rechazó ninguna carga.");
  if (eSlump && eSlump.sd != null) {
    cumpl.push(`La consistencia de la producción, medida como desviación estándar de la muestra, fue de
      <b>${fmt(eSlump.sd, 2)} in</b> en Slump${eUW && eUW.sd != null ? ` y <b>${fmt(eUW.sd, 2)} pcf</b> en Unit Weight` : ""}.`);
  }
  if (eTemp) cumpl.push(`La temperatura del hormigón fresco osciló entre <b>${fmt(eTemp.min, 0)}</b> y <b>${fmt(eTemp.max, 0)} °F</b> (máximo admisible ${p.tempMax} °F).`);

  pg++;
  out.push(`<div class="sheet">
    ${sheetHead("Informe técnico del vaciado", fmtDate(day))}

    <div class="doc-id">
      <div><span>Informe</span><b>${esc(idInforme)}</b></div>
      <div><span>Vaciado</span><b>${fmtDate(day)}</b></div>
      <div><span>Emitido</span><b>${fmtDate(todayISO())}</b></div>
      <div><span>Estado</span><b>${enCurso ? "En curso" : "Cerrado"}</b></div>
    </div>

    <h2 class="sec">Resumen del vaciado</h2>
    <p class="cuerpo">${trozos.join(" ")}</p>
    ${ritmo.length ? `<p class="cuerpo">${ritmo.join(", ")}.</p>` : ""}

    <h2 class="sec">Cumplimiento</h2>
    <p class="cuerpo">${cumpl.join(" ")}</p>

    <div class="veredicto v-${veredicto.cls}">
      <div class="vt">${esc(veredicto.t)}</div>
      <div class="vd">${veredicto.d}</div>
    </div>

    <h2 class="sec">Estadística de los ensayos de hormigón fresco</h2>
    <table class="rep">
      <tr><th>Propiedad</th><th class="n">n</th><th class="n">Media</th><th class="n">Desv. est.</th>
          <th class="n">CV</th><th class="n">Mínimo</th><th class="n">Máximo</th>
          <th class="n">Acción</th><th class="n">Fuera</th><th>Norma</th></tr>
      ${est.map((e) => e.est ? `<tr>
        <td class="lbl" style="width:auto">${esc(e.n)} <span style="color:#5a6b7c">(${esc(e.u)})</span></td>
        <td class="n">${e.est.n}</td>
        <!-- La media con los decimales con que se MIDE la propiedad; la
             desviación con uno más, que es donde se aprecia. Un Slump con tres
             decimales finge una precisión que la regla no da. -->
        <td class="n"><b>${fmt(e.est.media, e.dp)}</b></td>
        <td class="n">${e.est.sd != null ? fmt(e.est.sd, e.dp + 1) : "—"}</td>
        <td class="n">${e.est.cv != null ? fmt(e.est.cv, 1) + " %" : "—"}</td>
        <td class="n">${fmt(e.est.min, e.dp)}</td>
        <td class="n">${fmt(e.est.max, e.dp)}</td>
        <td class="n${e.accion ? " z-act" : ""}">${e.accion || "—"}</td>
        <td class="n${e.susp ? " z-susp" : ""}">${e.susp || "—"}</td>
        <td style="color:#5a6b7c">${esc(e.norma)}</td>
      </tr>` : `<tr><td class="lbl" style="width:auto">${esc(e.n)}</td>
        <td class="n" colspan="8" style="color:#5a6b7c">sin lecturas registradas este día</td>
        <td style="color:#5a6b7c">${esc(e.norma)}</td></tr>`).join("")}
    </table>
    <div class="tbl-note">
      La desviación estándar es de muestra (n−1), el criterio de ACI 214 para juzgar la uniformidad de
      la producción. <b>Acción</b> son las lecturas dentro de especificación pero cerca del límite;
      <b>Fuera</b>, las que superaron el límite de suspensión. Con una sola lectura no hay desviación
      posible y la casilla queda vacía: un cero diría «ninguna variación», que no es lo mismo que
      «no se puede saber».
    </div>
    ${sheetFoot(pg, total)}
  </div>`);

  // ---------- HOJA 2: cómo cerró el vaciado ----------
  pg++;
  out.push(`<div class="sheet">
    ${sheetHead("Reporte del vaciado", fmtDate(day))}
    ${enCurso ? `<div class="aviso"><b>Tiro en curso.</b> Esta hoja se emitió a la(s) ${hm(nowHM())},
      con el vaciado todavía abierto (${esc(tiro.txt.toLowerCase())}). Las cifras son las de este momento,
      no las del cierre — vuelva a emitirla cuando termine el tiro.</div>` : ""}

    <h2 class="sec">El vaciado</h2>
    <div class="meta">
      <div><div class="k">Fecha</div><div class="v">${fmtDate(day)}</div></div>
      <div><div class="k">Proyecto</div><div class="v">${esc(db.project.name || "—")}</div></div>
      <div><div class="k">Contratista</div><div class="v">${esc(db.project.contractor || "—")}</div></div>
      <div><div class="k">Control de calidad</div><div class="v">${esc(db.project.qcFirm || "—")}</div></div>
      <div><div class="k">Mezcla</div><div class="v">${esc(db.project.mixId || "—")}</div></div>
      <div><div class="k">Concretera</div><div class="v">${esc(empresas.join(" · ") || "—")}</div></div>
      <div><div class="k">Fase</div><div class="v">${esc(meta.fase || "—")}</div></div>
      <div><div class="k">Carril</div><div class="v">${esc(meta.lane || "—")}</div></div>
      <div><div class="k">Cierre</div><div class="v">${esc(meta.cierre || "—")}</div></div>
      <div><div class="k">Km</div><div class="v">${esc(meta.km || "—")}</div></div>
      <div><div class="k">Planta(s)</div><div class="v">${esc(plantas.join(" · ") || "—")}</div></div>
      <div><div class="k">Lote(s)</div><div class="v">${lotes.length ? esc(lotes.join(", ")) : "—"}</div></div>
    </div>

    <h2 class="sec">${enCurso ? "Cómo va el día" : "Cómo cerró el día"}</h2>
    <div class="kpis">
      <div class="kpi"><div class="k">Yardas colocadas</div>
        <div class="v">${fmt(prog.placed, 1)}</div>
        <div class="s">${prog.cyPlan != null ? `de ${fmt(prog.cyPlan, 1)} yd³ planificadas` : "sin plan declarado"}</div></div>
      <div class="kpi ${rej.length ? "bad" : ""}"><div class="k">Camiones</div>
        <div class="v">${prog.loads}</div>
        <div class="s">${rej.length ? (rej.length === 1 ? "1 rechazado" : `${rej.length} rechazados`) : "ninguno rechazado"}</div></div>
      <div class="kpi ${prog.compliancePct != null && prog.compliancePct >= 90 ? "ok" : prog.compliancePct != null ? "bad" : ""}">
        <div class="k">Dentro de límites</div>
        <div class="v">${prog.compliancePct != null ? fmt(prog.compliancePct, 1) + "%" : "—"}</div>
        <div class="s">${prog.conforming} de ${prog.evaluated} evaluados</div></div>
      <div class="kpi"><div class="k">Losas vaciadas</div>
        <div class="v">${losasReal}${losasPlan ? ` <span style="font-size:11pt; color:#5a6b7c">/ ${losasAprox}${losasPlan}</span>` : ""}</div>
        <div class="s">${!losasPlan ? "sin plan de losas" : tramo ? `tramo ${esc(tramo.carril)}-${tramo.desde.toFixed(3)} → ${tramo.hasta.toFixed(3)}` : "de las planificadas"}</div></div>
    </div>

    <h2 class="sec">Plan contra lo real</h2>
    <table class="rep">
      <tr><th>Concepto</th><th class="n">Planificado</th><th class="n">Real</th><th class="n">Diferencia</th></tr>
      <tr><td class="lbl">Yardas (yd³)</td>
        <td class="n">${prog.cyPlan != null ? fmt(prog.cyPlan, 1) : "—"}</td>
        <td class="n">${fmt(prog.placed, 1)}</td>${dif(prog.placed, prog.cyPlan)}</tr>
      <tr><td class="lbl">Losas${tramo ? ` <span style="font-weight:400; color:#5a6b7c">— tramo ${esc(tramo.carril)}-${tramo.desde.toFixed(3)} → ${tramo.hasta.toFixed(3)}, ${tramo.metros} m</span>` : ""}</td>
        <td class="n">${losasPlan ? losasAprox + losasPlan : "—"}</td><td class="n">${losasReal}</td>${dif(losasReal, losasPlan || null, 0)}</tr>
      ${losasFuera && losasFuera.length ? `<tr><td class="lbl">Vaciadas fuera del tramo declarado</td>
        <td class="n">—</td><td class="n">${losasFuera.length}</td><td class="n">${losasFuera.map(esc).join(", ")}</td></tr>` : ""}
      <tr><td class="lbl">Hora de comienzo</td>
        <td class="n">${hm(meta.horaInicio)}</td><td class="n">${hm(inicio)}</td>
        ${meta.horaInicio && inicio ? `<td class="n dif">${minutesBetween(meta.horaInicio, inicio)} min</td>` : `<td class="n">—</td>`}</tr>
    </table>
    ${prog.cyPlan == null ? `<div class="nota-sec">Este día no tiene yardas planificadas declaradas —
      se declaran en Plan &amp; Datos → Datos del vaciado. Sin ellas no hay contra qué comparar y la
      hoja no inventa un total.</div>` : ""}

    <h2 class="sec">Ritmo y ciclos</h2>
    <table class="rep">
      <tr><td class="lbl">Primer camión / última descarga</td>
        <td>${hm(st.firstStart)} — ${hm(st.lastEnd)}${st.hours ? ` · ${duracionCorta(Math.round(st.hours * 60))}` : ""}</td></tr>
      ${cerradoAMano ? `<tr><td class="lbl">Tiro cerrado</td>
        <td>${esc(cerradoAMano)}${meta.cerradoPor ? ` · por ${esc(meta.cerradoPor)}` : ""}</td></tr>` : ""}
      <tr><td class="lbl">Ritmo de colocación</td>
        <td>${ritmoReal != null ? `${fmt(ritmoReal, 1)} yd³/h · ${fmt(st.loadsPerHr, 1)} camiones/h` : "—"}</td></tr>
      <tr><td class="lbl">Ciclo Batch → fin de descarga</td>
        <td>${st.avgCycle != null ? `promedio ${Math.round(st.avgCycle)} min · máximo ${Math.round(st.maxCycle)} min (límite ${p.maxElapsedMin} min)` : "—"}${
          st.cyclesFuera ? ` · ${st.cyclesFuera} registro${st.cyclesFuera === 1 ? "" : "s"} con horas incoherentes, fuera del promedio` : ""}</td></tr>
      <tr><td class="lbl">Espera en sitio (llegada → comienzo)</td>
        <td>${st.avgWait != null ? `promedio ${Math.round(st.avgWait)} min` : "—"}</td></tr>
      ${proy && proy.fin ? `<tr><td class="lbl">A este paso terminaría</td>
        <td>≈ ${hm(proy.fin)} · faltan ${fmt(prog.pending, 1)} yd³</td></tr>` : ""}
    </table>
    ${sheetFoot(pg, total)}
  </div>`);

  // ---------- HOJA 2: losas y observaciones ----------
  pg++;
  const hayCompartida = losas.some((l) => l.compartida);
  out.push(`<div class="sheet">
    ${sheetHead("Losas del vaciado", fmtDate(day))}
    <h2 class="sec">Losas tiradas</h2>
    ${losas.length ? `<table class="rep">
      <tr><th>Losa</th><th class="n">Planificado (yd³)</th><th class="n">Colocado (yd³)</th>
          <th class="n">Cargas</th><th class="n">Avance</th><th>Estado</th></tr>
      ${losas.map((l) => `<tr>
        <td>${esc(l.codigo)}</td>
        <td class="n">${l.cyPlan != null ? fmt(l.cyPlan, 1) : "—"}</td>
        <td class="n">${l.cargas ? (l.compartida ? "≥ " : "") + fmt(l.cy, 1) : "—"}</td>
        <td class="n">${l.cargas || "—"}</td>
        <td class="n">${l.pct != null && l.cargas ? fmt(l.pct, 0) + "%" : "—"}</td>
        <td>${l.estado === "vaciada" ? "Vaciada" : l.estado === "curso" ? "En curso" : "Pendiente"}</td>
      </tr>`).join("")}
    </table>
    <div class="tbl-note">${hechas} de ${losas.length} losas vaciadas.
      ${hayCompartida ? `Las yardas marcadas con «≥» son un mínimo: un camión que repartió su carga entre
      varias losas no registra cuánto dejó en cada una, y ese volumen no se reparte a ojo.` : ""}</div>`
    : `<p style="font-size:9.5pt; color:#5a6b7c">Este día no tiene lista de losas declarada, así que la hoja
        no puede decir cuáles se tiraron ni cuánto llevaba cada una. Deducirlas de lo que sirvieron los
        camiones sería inventar el plan. La lista se declara en Plan &amp; Datos → Datos del vaciado.
        ${prog.losasDone ? `Los camiones registrados tocaron <b>${prog.losasDone}</b> losa${prog.losasDone === 1 ? "" : "s"} distinta${prog.losasDone === 1 ? "" : "s"}.` : ""}</p>`}

    <!-- Los avisos del sistema NO salen en el reporte — Q-43, 7 ago 2026.

         Son ayudas para actuar durante el vaciado: «el Unit Weight baja y el
         slump sube, avisa a la planta». Sirven mientras el camión todavía
         viene por la carretera.

         En un informe que se firma y se archiva son otra cosa: una deducción
         automática, sin firma de nadie, impresa junto a mediciones que sí la
         tienen. Quien lo lea después no puede distinguir lo medido de lo
         inferido, y eso es justo lo que un expediente no debe permitir.

         Viven donde sirven: en el Control Center, delante de quien puede
         llamar a la planta. -->
    ${sheetFoot(pg, total)}
  </div>`);

  // ---------- HOJAS 3..N: bitácora de camiones ----------
  chunks.forEach((chunk, i) => {
    pg++;
    out.push(`<div class="sheet">
      ${sheetHead("Bitácora de camiones" + (chunks.length > 1 ? ` (${i + 1}/${chunks.length})` : ""), fmtDate(day))}
      <table class="rep">
        <tr><th>#</th><th>Conduce</th><th>Camión</th><th>Planta</th><th>Batch</th><th>Llegada</th>
            <th>Comienza</th><th>Muestra</th><th>Termina</th><th class="n">Min</th><th class="n">yd³</th>
            <th>Losa</th><th class="n">Slump</th><th class="n">Aire</th><th class="n">P.U.</th>
            <th class="n">Temp</th><th>Estado</th></tr>
        ${chunk.map((t) => {
          const z = (zz) => (zz ? ` class="n z-${zz}"` : ' class="n"');
          const el = minutesBetween(t.batch, t.end);
          return `<tr class="${t.rejected ? "rej" : ""}">
            <td class="n">${t.n}</td><td>${esc(t.ticket || "—")}</td><td>${esc(t.truck || "—")}</td>
            <td>${esc(t.plant || "—")}</td>
            <td>${esc(t.batch || "—")}</td><td>${esc(t.arrive || "—")}</td><td>${esc(t.start || "—")}</td>
            <td>${esc(t.testTime || "—")}</td><td>${esc(t.end || "—")}</td>
            <td${z(zoneElapsed(t))}>${el != null ? el : "—"}</td>
            <td class="n">${fmt(num(t.vol), 1)}</td>
            <td class="wrap">${esc(shortIdent(t.ident))}</td>
            <td${z(zoneSlump(t))}>${fmtSlump(t.slump)}</td>
            <td${z(zoneAir(t))}>${fmt(t.air, 1)}</td>
            <td${z(zoneUW(t))}>${fmt(t.uw, 2)}</td>
            <td${z(zoneTemp(t))}>${fmt(t.temp, 0)}</td>
            <td>${t.rejected ? "RECHAZADO" : (worstZone(t) === "susp" ? "Fuera" : worstZone(t) === "act" ? "Acción" : worstZone(t) ? "Conforme" : "—")}</td>
          </tr>`;
        }).join("")}
      </table>
      <div class="tbl-note">Horas en formato de 24 h. «Min» es el tiempo de Batch a fin de descarga
        (límite ${p.maxElapsedMin} min). Celdas sombreadas: ámbar = zona de acción · rojo = fuera del
        límite de suspensión. Filas rojas: cargas rechazadas y no incorporadas a la obra.</div>
      ${sheetFoot(pg, total)}
    </div>`);
  });

  // ---------- Control Charts del día ----------
  paresCartas.forEach((par, i) => {
    pg++;
    out.push(`<div class="sheet">
      ${sheetHead("Control Charts del vaciado" + (paresCartas.length > 1 ? ` (${i + 1}/${paresCartas.length})` : ""), fmtDate(day))}
      <h2 class="sec">Las lecturas de hormigón fresco, en orden de llegada</h2>
      ${par.map((d) => {
        const b = bandsFor(d.key, day);
        const lim = d.key === "temp"
          ? `Máximo ${p.tempMax} °F · zona de acción sobre ${p.tempMax - 3} °F`
          : `Objetivo ${fmt(b.target, 2)} · acción ${fmt(b.actLo, 2)} – ${fmt(b.actHi, 2)} · suspensión ${fmt(b.suspLo, 2)} – ${fmt(b.suspHi, 2)}`;
        return `<div class="chart-box">
          <h3>${esc(d.label)}</h3><div class="lim">${lim}</div>
          ${chartForDay(d, day, 26)}
        </div>`;
      }).join("")}
      <div class="tbl-note">Solo los ensayos de este día. Línea punteada: valor objetivo · ámbar: límite
        de acción · rojo: límite de suspensión. ✕ = carga rechazada.</div>
      ${sheetFoot(pg, total)}
    </div>`);
  });

  // ---------- incidencias y certificación ----------
  pg++;
  out.push(`<div class="sheet">
    ${sheetHead("Incidencias y certificación", fmtDate(day))}
    <h2 class="sec">Cargas rechazadas</h2>
    ${rej.length ? `<table class="rep">
      <tr><th>#</th><th>Conduce</th><th>Camión</th><th class="n">yd³</th><th>Losa</th><th>Muestra</th>
          <th class="n">Slump</th><th class="n">P.U.</th><th class="n">Aire</th><th class="n">Temp</th><th>Motivo</th></tr>
      ${rej.map((t) => {
        const m = [];
        if (zoneSlump(t) === "susp") m.push("Slump fuera de límite");
        if (zoneUW(t) === "susp") m.push("Unit Weight fuera de tolerancia");
        if (zoneAir(t) === "susp") m.push("Aire fuera de límite");
        if (zoneTemp(t) === "susp") m.push("Temperatura sobre el máximo");
        return `<tr class="rej"><td class="n">${t.n}</td><td>${esc(t.ticket || "—")}</td>
          <td>${esc(t.truck || "—")}</td><td class="n">${fmt(num(t.vol), 1)}</td>
          <td class="wrap">${esc(shortIdent(t.ident))}</td><td>${esc(t.testTime || "—")}</td>
          <td class="n">${fmtSlump(t.slump)}</td><td class="n">${fmt(t.uw, 2)}</td>
          <td class="n">${fmt(t.air, 1)}</td><td class="n">${fmt(t.temp, 0)}</td>
          <td class="wrap">${esc(m.join("; ") || t.comments || "Rechazo en campo")}</td></tr>`;
      }).join("")}
    </table>
    <div class="tbl-note">Estas yardas no entraron en la obra y no cuentan en lo colocado.</div>`
    : `<p style="font-size:9.5pt; color:#5a6b7c">No se rechazó ninguna carga en este vaciado.</p>`}

    <h2 class="sec">Humedades de agregados</h2>
    ${hums.length ? `<table class="rep">
      <tr><th>Hora</th><th>Planta</th><th>Nota</th></tr>
      ${hums.map((h) => `<tr><td>${esc(h.time || "—")}</td><td>${esc(h.plant || "—")}</td>
        <td class="wrap">${esc(h.note || "—")}</td></tr>`).join("")}
    </table>` : `<p style="font-size:9.5pt; color:#5a6b7c">Sin pruebas de humedad registradas en este día
        (el plan de control pide una cada ${p.humidityMaxHours} h).</p>`}

    <h2 class="sec">Resistencia a compresión</h2>
    ${res.length ? `<table class="rep">
      <tr><th>#</th><th>Conduce</th><th class="n">1 día</th><th class="n">${p.cs.age} días</th>
          <th class="n">28 días</th><th>Evaluación</th></tr>
      ${res.map((t) => `<tr><td class="n">${t.n}</td><td>${esc(t.ticket || "—")}</td>
        <td class="n">${fmt(t.cs1, 0)}</td>
        <td class="n${zoneCS5(t.cs5, t.date) === "susp" ? " z-susp" : zoneCS5(t.cs5, t.date) === "act" ? " z-act" : ""}">${fmt(t.cs5, 0)}</td>
        <td class="n">${fmt(t.cs28, 0)}</td>
        <td>${t.cs5 == null ? "—" : t.cs5 >= p.cs.target ? "Cumple" : t.cs5 >= p.cs.action ? "Bajo objetivo" : "No cumple"}</td>
      </tr>`).join("")}
    </table>` : `<p style="font-size:9.5pt; color:#5a6b7c">Todavía no hay resultados de resistencia
        registrados para este vaciado. El plan de control ensaya a 1, ${p.cs.age} y 28 días según ASTM C39,
        con objetivo de ${fmt(p.cs.target, 0)} psi a los ${p.cs.age} días; los resultados se incorporan
        al expediente del proyecto según se van rompiendo los cilindros.</p>`}

    ${meta.notas ? `<h2 class="sec">Notas del vaciado</h2>
      <p style="font-size:9.5pt; white-space:pre-wrap">${esc(meta.notas)}</p>` : ""}

    <h2 class="sec">Certificación</h2>
    <p style="font-size:9pt; line-height:1.6">
      Los ensayos de hormigón fresco de este vaciado —${fmtDate(day)}${meta.fase ? `, Fase ${esc(meta.fase)}` : ""}${meta.lane ? `, carril ${esc(meta.lane)}` : ""}—
      fueron realizados en obra por personal de <b>${esc(db.project.qcFirm || "—")}</b> conforme a
      ASTM C143 (Slump), C231 (aire), C138 (Unit Weight) y C1064 (temperatura), y al plan de control
      aprobado para la mezcla <b>${esc(db.project.mixId || "—")}</b>. Se recibieron <b>${prog.loads}</b>
      camiones y se colocaron <b>${fmt(prog.placed, 1)} yd³</b>${rej.length ? `, con ${rej.length === 1 ? "una carga rechazada" : rej.length + " cargas rechazadas"}` : ", sin cargas rechazadas"}.
      Los datos provienen del registro digital de campo, entrado una sola vez y sin transcripción manual intermedia.
      ${enCurso ? "<b>Hoja emitida con el tiro todavía en curso.</b>" : ""}
    </p>
      ${(() => {
        /* Q-40: si este vaciado se juzgó con límites distintos de los vigentes
           hoy, el reporte lo dice. Quien compare dos documentos del proyecto y
           vea umbrales distintos tiene que encontrar la explicación aquí, no
           suponer que uno de los dos está mal. */
        const nota = typeof notaDeLimites === "function" ? notaDeLimites(day) : "";
        return nota ? `<p style="font-size:8.5pt; line-height:1.6; color:#4a5866">${esc(nota)}</p>` : "";
      })()}
    <div class="signs">
      <div class="sign"><div class="r">Inspector / Técnico de campo</div></div>
      <div class="sign"><div class="r">Ingeniero de Control de Calidad</div></div>
    </div>
    ${sheetFoot(pg, total)}
  </div>`);

  document.getElementById("report").innerHTML = out.join("");
}

loadDB();
leerDireccion();
initTheme();
mountThemeToggle();
mountStatusBar();
enableLiveSync(() => render());
render();
</script>
</body>
</html>
